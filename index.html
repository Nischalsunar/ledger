function V2Current() {
  const transactions = window.useTransactions();
  const debt = useDebtSnapshot();
  const profile = useProfileSnapshot();
  const accounts = useAccountsSnapshot();

  // ── Derive everything inline; v2 Current no longer borrows v1 CurrentSummary ──
  const today = new Date();
  const yyyyMm = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, "0")}`;
  const MONTHS_LONG = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const monthLabel = `${MONTHS_LONG[today.getMonth()]} ${today.getFullYear()}`;
  const daysInMonth = new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate();
  const dayOfMonth = today.getDate();
  const daysLeft = Math.max(0, daysInMonth - dayOfMonth);

  // This-month transactions
  const thisMonthTxs = (transactions || []).filter((t) => (t.date || "").startsWith(yyyyMm));
  const thisMonthCents = window.Transactions.totalCents(thisMonthTxs);
  const thisMonthDollars = window.toDollars(thisMonthCents);

  // Per-day cumulative for the chart
  const dailyBuckets = (() => {
    const buckets = new Array(daysInMonth).fill(0);
    thisMonthTxs.forEach((t) => {
      const day = parseInt((t.date || "").slice(8, 10), 10);
      if (day >= 1 && day <= daysInMonth) buckets[day - 1] += (Number(t.amount_cents) || 0);
    });
    let cum = 0;
    return buckets.map((cents, i) => {
      cum += cents;
      return { day: i + 1, cumulative: window.toDollars(cum) };
    });
  })();
  // Only chart through today + 1 so the line doesn't trail across empty future days.
  const chartData = dailyBuckets.slice(0, Math.min(dayOfMonth, daysInMonth));

  // Category breakdown rows (dollars + share of month)
  const categoryRows = (() => {
    const byCat = window.Transactions.byCategory(thisMonthTxs);
    return Object.entries(byCat)
      .map(([category, cents]) => ({
        category,
        cents,
        dollars: window.toDollars(cents),
        pct: thisMonthCents > 0 ? (cents / thisMonthCents) * 100 : 0,
      }))
      .sort((a, b) => b.cents - a.cents)
      .slice(0, 6); // executive view — keep it short
  })();

  // Remaining cash flow = monthly take-home - month-to-date spend - debt minimums
  // Only meaningful when profile (salary) is set so window.computeTaxes returns a value.
  const takeHomeKnown = !!profile && profile.monthlyTakeHome > 0;
  const debtMin = debt?.minTotal || 0;
  const remainingCashFlow = takeHomeKnown
    ? profile.monthlyTakeHome - thisMonthDollars - debtMin
    : 0;

  // Rolling daily spend for the recommendation engine. Falls back to month-to-date
  // average if there's not enough history yet. Returns 0 when no transactions exist.
  const dailySpend = dayOfMonth > 0 ? thisMonthDollars / dayOfMonth : 0;

  // Recommendation engine — pure function, returns at most 2 cards. Empty array
  // when the user is in cold start (no accounts, no debts, no profile).
  const recommendations = computeRecommendations({
    accounts, debt, profile, dailySpend,
  });

  const isEmpty = (transactions || []).length === 0;

  return (
    <>
      {/* Minimal page header — kept brief, hero number is the real focal point */}
      <header className="page-head" style={{ marginBottom: 4 }}>
        <div><h1 className="page-title">Current</h1></div>
      </header>

      {/* HERO: 48px Remaining Cash Flow — no box */}
      <V2HeroCashFlow
        remaining={remainingCashFlow}
        monthLabel={monthLabel}
        daysLeft={daysLeft}
        takeHomeKnown={takeHomeKnown}
      />

      {/* Net Position computed property — assets − debt principal */}
      <V2NetPositionStrip accountsSnap={accounts} debtSnap={debt} />

      {/* Inline fixed-load summary (replaces the boxy debt card) */}
      <V2FixedLoadInline debt={debt} />

      {isEmpty ? (
        <div style={{ padding: "32px 8px", textAlign: "center", color: "var(--ink-3)" }}>
          No transactions yet. Open the{" "}
          <a href="#record" style={{ color: "var(--accent)" }}>Record</a>{" "}
          tab to log your first expense — this page will fill in automatically.
        </div>
      ) : (
        <>
          {/* Frameless chart */}
          <V2DailyChart data={chartData} />

          {/* Thin category bars */}
          <V2CategoryBars rows={categoryRows} />
        </>
      )}

      {/* Executive recommendations — capped at 2 cards, hidden in cold start */}
      <V2ExecutiveRecommendations recs={recommendations} />
    </>
  );
}

window.V2Current = V2Current;

</script>

<script type="text/babel" data-presets="react">
// v2 Projection tab — superficial executive net-worth dashboard.
//
// What it shows:
//   • One bold status banner with a milestone-aware trajectory line.
//   • ONE minimalist gradient area chart of projected net worth across 12
//     calendar months (Jun 2026 → May 2027 style). No gridlines, no
//     multi-series clutter, no legends.
//   • Exactly 3 plain-English bullets: cash runway · next milestone date
//     · methodology in plain text.
//
// Math model (all in integer cents internally, rounded only at display):
//   • Starting assets = sum of ledger:accounts balances.
//   • Starting debt   = sum of ledger:debt principals.
//   • Starting net worth = assets - debt.
//   • Each forward month:
//     - Income flow  = monthly take-home from window.computeTaxes(profile).
//     - Spend flow   = recent rolling daily average × days in that month
//                      (uses last 30 days of transactions, scaled).
//     - Debt flow    = monthly debt minimums (already in v1's ledger:debt).
//     - Asset growth = blended account APY / 12 on the prior balance.
//     - Net savings  = income - spend - debt_minimums  (can be negative).
//     - assets += net_savings + asset_growth.
//     - debt   = max(0, debt - debt_minimums).
//
// Cold start: if the user has < 5 days of recorded transactions, hide the
// chart entirely and show a single line of instruction.

const { useMemo: useMemoV2P } = React;

const MONTHS_SHORT_V2 = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONTHS_LONG_V2 = ["January","February","March","April","May","June","July","August","September","October","November","December"];

// Round-number milestones used by the status banner. Picked the next one
// above current net worth that the 12-month projection actually crosses.
const MILESTONES_V2 = [0, 10000, 25000, 50000, 75000, 100000, 150000, 250000, 500000, 1000000, 2000000, 5000000];

function findNextMilestone(projection, startNet) {
  if (!projection || projection.length === 0) return null;
  const endNet = projection[projection.length - 1].netWorth;
  // Decide the direction of search.
  const ascending = endNet > startNet;
  if (!ascending) {
    // Look for a milestone we're sliding DOWN past — for the "trending down"
    // copy. Use the milestone just below the starting value.
    for (let i = MILESTONES_V2.length - 1; i >= 0; i--) {
      const m = MILESTONES_V2[i];
      if (m < startNet && projection.some((p) => p.netWorth <= m)) {
        const crossing = projection.find((p) => p.netWorth <= m);
        return { threshold: m, crossingLabel: crossing.label, direction: "down" };
      }
    }
    return null;
  }
  // Ascending — find the first milestone above the start that the projection actually crosses.
  for (const m of MILESTONES_V2) {
    if (m <= startNet) continue;
    const crossing = projection.find((p) => p.netWorth >= m);
    if (crossing) return { threshold: m, crossingLabel: crossing.label, direction: "up" };
  }
  return null;
}

function V2Projection() {
  const transactions = window.useTransactions();
  const debtSnap     = window.useDebtSnapshot ? window.useDebtSnapshot() : null;
  const profileSnap  = window.useProfileSnapshot ? window.useProfileSnapshot() : null;
  const accountsSnap = window.useAccountsSnapshot ? window.useAccountsSnapshot() : null;

  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const todayISO = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, "0")}-${String(today.getDate()).padStart(2, "0")}`;

  // ── Recent rolling daily spend rate (from last 30 days) ──────────────
  const spendStats = useMemoV2P(() => {
    if (!transactions || transactions.length === 0) {
      return { hasData: false, daysOfData: 0, dailyAvg: 0, windowDays: 0, distinctDays: 0 };
    }
    // Distinct days of data — used for the cold-start gate (5 days minimum).
    const dayCounts = new Set();
    let earliest = todayISO;
    for (const t of transactions) {
      if (t.date) {
        dayCounts.add(t.date);
        if (t.date < earliest) earliest = t.date;
      }
    }
    const earliestD = new Date(earliest + "T00:00:00");
    const totalDaysSpan = Math.max(1, Math.round((today.getTime() - earliestD.getTime()) / 86400000) + 1);
    const windowDays = Math.min(30, Math.max(7, totalDaysSpan));
    const cutoff = new Date(today);
    cutoff.setDate(cutoff.getDate() - windowDays + 1);
    const cutoffISO = `${cutoff.getFullYear()}-${String(cutoff.getMonth() + 1).padStart(2, "0")}-${String(cutoff.getDate()).padStart(2, "0")}`;
    let totalCents = 0;
    for (const t of transactions) {
      if (!t.date || t.date < cutoffISO || t.date > todayISO) continue;
      totalCents += (Number(t.amount_cents) || 0);
    }
    return {
      hasData: true,
      daysOfData: totalDaysSpan,
      distinctDays: dayCounts.size,
      windowDays,
      dailyAvg: totalCents / windowDays / 100, // dollars per day
    };
  }, [transactions, todayISO]);

  // ── Build the calendar-anchored 12-month net-worth projection ─────────
  const projection = useMemoV2P(() => {
    const startAssets = accountsSnap ? accountsSnap.totalBalance : 0;
    const startDebt   = debtSnap ? debtSnap.principalTotal : 0;
    const monthlyTakeHome = profileSnap ? profileSnap.monthlyTakeHome : 0;
    const monthlyDebtMin = debtSnap ? debtSnap.minTotal : 0;
    const weightedApyMonthly = accountsSnap ? accountsSnap.weightedApy / 12 : 0;
    // If we have nothing meaningful, return an empty projection.
    if (startAssets === 0 && startDebt === 0 && monthlyTakeHome === 0 && !spendStats.hasData) {
      return [];
    }
    let assets = startAssets;
    let debt = startDebt;
    const out = [];
    // Anchor to first day of NEXT calendar month so the first plotted point
    // is the projected end-of-next-month state.
    const start = new Date(today.getFullYear(), today.getMonth() + 1, 1);
    for (let i = 0; i < 12; i++) {
      const d = new Date(start.getFullYear(), start.getMonth() + i, 1);
      const year = d.getFullYear();
      const monthIdx = d.getMonth();
      const daysInMonth = new Date(year, monthIdx + 1, 0).getDate();
      const monthlySpend = spendStats.dailyAvg * daysInMonth;
      const netSavings = monthlyTakeHome - monthlySpend - monthlyDebtMin;
      const assetGrowth = assets * weightedApyMonthly;
      assets = assets + netSavings + assetGrowth;
      debt = Math.max(0, debt - monthlyDebtMin);
      const netWorth = assets - debt;
      out.push({
        key: `${year}-${String(monthIdx + 1).padStart(2, "0")}`,
        label: `${MONTHS_SHORT_V2[monthIdx]} ${year}`,
        longLabel: `${MONTHS_LONG_V2[monthIdx]} ${year}`,
        assets, debt, netWorth,
        monthlySpend, netSavings, assetGrowth,
      });
    }
    return out;
  }, [accountsSnap, debtSnap, profileSnap, spendStats, today.getFullYear(), today.getMonth()]);

  const startNetWorth = (accountsSnap?.totalBalance || 0) - (debtSnap?.principalTotal || 0);
  const endProjection = projection.length > 0 ? projection[projection.length - 1] : null;
  const milestone = projection.length > 0 ? findNextMilestone(projection, startNetWorth) : null;

  // ── Cold-start gate — fewer than 5 distinct days of recorded data ─────
  if (spendStats.distinctDays < 5) {
    return (
      <>
        <header className="page-head">
          <div>
            <h1 className="page-title">Projection</h1>
          </div>
          <div className="page-head-right">
            <div className="page-sub">
              Forward forecast of your net worth
            </div>
          </div>
        </header>
        <section className="card">
          <div className="card-body" style={{ padding: "32px 24px", textAlign: "center" }}>
            <div style={{ fontSize: 16, color: "var(--ink-2)", lineHeight: 1.5, maxWidth: 480, margin: "0 auto" }}>
              Log <strong>5 days</strong> of transactions in the{" "}
              <a href="#record" style={{ color: "var(--accent)" }}>Record</a>{" "}
              tab to unlock your future forecast.
            </div>
            {spendStats.distinctDays > 0 && (
              <div style={{ marginTop: 14, fontSize: 13, color: "var(--ink-4)" }}>
                {spendStats.distinctDays} day{spendStats.distinctDays === 1 ? "" : "s"} logged so far · {5 - spendStats.distinctDays} to go
              </div>
            )}
          </div>
        </section>
      </>
    );
  }

  // ── Format helpers ────────────────────────────────────────────────────
  const fmtDollars = (n) => {
    const abs = Math.abs(n);
    if (abs >= 1000000) return (n < 0 ? "-$" : "$") + (abs / 1000000).toFixed(abs >= 10000000 ? 0 : 1) + "M";
    if (abs >= 1000) return (n < 0 ? "-$" : "$") + (abs / 1000).toFixed(abs >= 10000 ? 0 : 1) + "k";
    return (n < 0 ? "-$" : "$") + Math.round(abs).toLocaleString();
  };
  const fmtUSD = (n) => window.fmtUSD0(Math.round(n));

  // ── Status banner copy ────────────────────────────────────────────────
  let bannerCopy;
  let bannerTone = "neutral";
  if (milestone && milestone.direction === "up") {
    bannerCopy = `On pace to cross ${fmtDollars(milestone.threshold)} by ${milestone.crossingLabel}.`;
    bannerTone = "positive";
  } else if (milestone && milestone.direction === "down") {
    bannerCopy = `Spending is outpacing income — net worth set to drop below ${fmtDollars(milestone.threshold)} by ${milestone.crossingLabel}.`;
    bannerTone = "negative";
  } else if (endProjection && endProjection.netWorth > startNetWorth) {
    bannerCopy = `On track to grow to ${fmtDollars(endProjection.netWorth)} by ${endProjection.label}.`;
    bannerTone = "positive";
  } else if (endProjection && endProjection.netWorth < startNetWorth) {
    const delta = startNetWorth - endProjection.netWorth;
    bannerCopy = `Net worth trending down — projected to fall ${fmtDollars(delta)} by ${endProjection.label}.`;
    bannerTone = "negative";
  } else {
    bannerCopy = `Net worth holding steady around ${fmtDollars(startNetWorth)}.`;
    bannerTone = "neutral";
  }

  // ── Three bullet insights ────────────────────────────────────────────
  // Cash runway: at current spend (income removed) how many months until assets hit 0.
  // We use total monthly spend including debt minimums for a conservative number.
  const totalMonthlyOutflow = (spendStats.dailyAvg * 30) + (debtSnap?.minTotal || 0);
  const currentAssets = accountsSnap?.totalBalance || 0;
  const runwayMonths = (totalMonthlyOutflow > 0 && currentAssets > 0)
    ? Math.floor(currentAssets / totalMonthlyOutflow)
    : null;

  const methodologyApy = accountsSnap ? (accountsSnap.weightedApy * 100).toFixed(1) : "0.0";

  const bullets = [
    runwayMonths != null
      ? `Cash runway: ${runwayMonths} month${runwayMonths === 1 ? "" : "s"} of expenses on hand (${fmtUSD(currentAssets)} at ${fmtUSD(totalMonthlyOutflow)}/mo outflow).`
      : (currentAssets > 0
          ? `Cash runway: ${fmtUSD(currentAssets)} on hand — no spend history yet to estimate burn rate.`
          : `Cash runway: no account balances entered on /v1/#overview yet.`),
    milestone
      ? (milestone.direction === "up"
          ? `Next major milestone: ${fmtDollars(milestone.threshold)} by ${milestone.crossingLabel}.`
          : `Next threshold crossed: ${fmtDollars(milestone.threshold)} by ${milestone.crossingLabel} (declining).`)
      : `No major milestones crossed in the next 12 months at this trajectory.`,
    `Forecasted from your rolling daily spend over the last ${spendStats.windowDays} day${spendStats.windowDays === 1 ? "" : "s"}${profileSnap ? `, take-home pay from /v1/#budget` : " (no salary set — income assumed $0)"}${accountsSnap ? `, and account growth at ${methodologyApy}% blended APY` : ""}.`,
  ];

  // ── The chart ─────────────────────────────────────────────────────────
  const Recharts = window.Recharts;
  // Include the starting point (today) so the line starts from current net worth.
  const chartData = [
    { label: "Now", netWorth: Math.round(startNetWorth), netWorthDollars: Math.round(startNetWorth) },
    ...projection.map((p) => ({
      label: p.label,
      netWorth: Math.round(p.netWorth),
      netWorthDollars: Math.round(p.netWorth),
    })),
  ];

  const bannerStyle = {
    padding: "20px 24px",
    borderRadius: 8,
    fontSize: 20,
    lineHeight: 1.35,
    fontWeight: 600,
    marginBottom: 18,
    background: bannerTone === "positive" ? "var(--accent-bg)"
              : bannerTone === "negative" ? "rgba(178, 69, 42, 0.08)"
              : "var(--surface-2)",
    color: bannerTone === "positive" ? "var(--accent)"
         : bannerTone === "negative" ? "var(--negative)"
         : "var(--ink-2)",
    border: "1px solid " + (bannerTone === "positive" ? "var(--accent-dim)"
                          : bannerTone === "negative" ? "rgba(178, 69, 42, 0.25)"
                          : "var(--border)"),
  };

  return (
    <>
      <header className="page-head">
        <div>
          <h1 className="page-title">Projection</h1>
        </div>
        <div className="page-head-right">
          <div className="page-sub">
            12-month outlook · {chartData[1]?.label || "—"} to {chartData[chartData.length - 1]?.label || "—"}
          </div>
        </div>
      </header>

      <div className="v2-enter v2-enter-0" style={bannerStyle}>{bannerCopy}</div>

      <section className="card v2-enter v2-enter-1">
        <div className="card-body" style={{ padding: 16 }}>
          {Recharts ? (
            <div style={{ width: "100%", height: 320 }}>
              <Recharts.ResponsiveContainer width="100%" height="100%">
                <Recharts.AreaChart
                  data={chartData}
                  margin={{ top: 12, right: 24, left: 8, bottom: 8 }}
                >
                  <defs>
                    <linearGradient id="v2NetWorthFill" x1="0" y1="0" x2="0" y2="1">
                      <stop offset="0%"   stopColor="var(--accent)" stopOpacity={0.32} />
                      <stop offset="100%" stopColor="var(--accent)" stopOpacity={0.02} />
                    </linearGradient>
                  </defs>
                  <Recharts.XAxis
                    dataKey="label"
                    tick={{ fontSize: 11, fill: "var(--ink-3)" }}
                    axisLine={{ stroke: "var(--border)" }}
                    tickLine={false}
                    interval={chartData.length > 8 ? 1 : 0}
                  />
                  <Recharts.YAxis
                    tick={{ fontSize: 11, fill: "var(--ink-3)" }}
                    axisLine={false}
                    tickLine={false}
                    tickFormatter={fmtDollars}
                    width={56}
                  />
                  <Recharts.Tooltip
                    formatter={(value) => [window.fmtUSD0(value), "Net worth"]}
                    labelStyle={{ fontWeight: 600 }}
                    contentStyle={{ background: "var(--surface)", border: "1px solid var(--border)", borderRadius: 4 }}
                  />
                  <Recharts.Area
                    type="monotone"
                    dataKey="netWorth"
                    stroke="var(--accent)"
                    strokeWidth={2.5}
                    fill="url(#v2NetWorthFill)"
                    isAnimationActive={true}
                    animationDuration={900}
                    animationEasing="ease-out"
                  />
                </Recharts.AreaChart>
              </Recharts.ResponsiveContainer>
            </div>
          ) : null}
        </div>
      </section>

      <section className="card v2-enter v2-enter-2">
        <div className="card-body">
          <ul style={{ margin: 0, paddingLeft: 0, listStyle: "none" }}>
            {bullets.map((b, i) => (
              <li key={i} className="v2-enter" style={{
                padding: "10px 0",
                borderTop: i === 0 ? "none" : "1px solid var(--border)",
                fontSize: 14,
                lineHeight: 1.5,
                color: "var(--ink-2)",
                display: "flex",
                gap: 12,
                animationDelay: `${280 + i * 80}ms`,
              }}>
                <span style={{
                  flexShrink: 0, width: 24, height: 24, borderRadius: "50%",
                  background: "var(--accent-bg)", color: "var(--accent)",
                  display: "inline-flex", alignItems: "center", justifyContent: "center",
                  fontSize: 12, fontWeight: 600,
                }}>{i + 1}</span>
                <span>{b}</span>
              </li>
            ))}
          </ul>
        </div>
      </section>
    </>
  );
}

window.V2Projection = V2Projection;

</script>

<script type="text/babel" data-presets="react">
// v2 app shell — lean 3-tab ledger.
//
// Tabs: Current · Projection · Record. Hash-routed (#current / #projection /
// #record). Wraps the existing window.AuthGate so sign-in + per-user
// localStorage namespacing + Firestore sync are identical to v1. That's
// why both URLs share data automatically — same Google login = same keys.
//
// A small banner at the top of the sidebar links to /v1/ for users who want
// the full calculator (budget, debt, investing, taxes, etc.). v1 stays at
// /v1/index.html and is unchanged.

const { useState: useStateV2, useEffect: useEffectV2, useRef: useRefV2, useLayoutEffect: useLayoutEffectV2 } = React;

const V2_TABS = [
  { id: "current",    label: "Current",    glyph: "C" },
  { id: "projection", label: "Projection", glyph: "P" },
  { id: "record",     label: "Record",     glyph: "R" },
];

// ── Export-all bundles every per-user localStorage key into one JSON file ──
// Scans the raw localStorage for ledger:u:{email}:* keys (the user-namespaced
// shape produced by auth.jsx's shim). Skips ledger:colorMode and
// ledger:sidebarHidden because those are UI-state preferences, not user data.
function exportAllLedgerData() {
  const user = window.__currentUser;
  const email = user?.email || "_guest";
  // Look up the user-specific prefix. The auth.jsx shim namespaces ledger:foo
  // to ledger:u:{email}:foo. Anonymous/guest users land at ledger:u:_guest:foo.
  const prefix = `ledger:u:${email}:`;
  const UI_SUFFIXES = new Set(["sidebarHidden", "colorMode"]);
  const data = {};
  for (let i = 0; i < localStorage.length; i++) {
    const fullKey = localStorage.key(i);
    if (!fullKey || !fullKey.startsWith(prefix)) continue;
    const suffix = fullKey.slice(prefix.length);
    if (UI_SUFFIXES.has(suffix)) continue;
    try {
      const raw = localStorage.getItem(fullKey);
      // Try to parse JSON; fall back to raw string if it's plain text.
      try { data[suffix] = JSON.parse(raw); }
      catch { data[suffix] = raw; }
    } catch (e) { /* skip unreadable keys */ }
  }
  const today = new Date();
  const stamp = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, "0")}-${String(today.getDate()).padStart(2, "0")}`;
  const payload = {
    schemaVersion: 1,
    exportedAt: today.toISOString(),
    user: email,
    source: "ledger v2 export-all",
    keyCount: Object.keys(data).length,
    data,
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `ledger-export-${email.replace(/[^a-z0-9._-]/gi, "_")}-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 0);
  return { keyCount: payload.keyCount, keys: Object.keys(data) };
}
window.exportAllLedgerData = exportAllLedgerData;

// Signed-in user info + sign-out at the bottom of the sidebar. v1 has a
// ProfileCorner widget in the top-right of every page; v2 keeps things
// minimal by tucking the same affordances into the sidebar footer.
// Format "12s ago", "3m ago", "2h ago" — short relative time for the sync badge.
function fmtAgo_(ms) {
  const sec = Math.floor((Date.now() - ms) / 1000);
  if (sec < 5) return "just now";
  if (sec < 60) return `${sec}s ago`;
  const min = Math.floor(sec / 60);
  if (min < 60) return `${min}m ago`;
  const hr = Math.floor(min / 60);
  if (hr < 24) return `${hr}h ago`;
  const d = Math.floor(hr / 24);
  return `${d}d ago`;
}

function V2SyncStatus({ isSignedIn, isGuest }) {
  // Re-render every 10s so "12s ago" → "22s ago" stays fresh without burning cycles.
  const [, force] = useStateV2(0);
  useEffectV2(() => {
    const id = setInterval(() => force((n) => n + 1), 10000);
    const onSync = () => force((n) => n + 1);
    window.addEventListener("ledger:cloud-sync", onSync);
    return () => { clearInterval(id); window.removeEventListener("ledger:cloud-sync", onSync); };
  }, []);

  if (isGuest) {
    return (
      <div style={{
        padding: "8px 10px", marginBottom: 10, fontSize: 11, lineHeight: 1.4,
        background: "rgba(168, 137, 90, 0.12)",
        border: "1px solid rgba(168, 137, 90, 0.35)",
        borderRadius: 4, color: "var(--ink-2)",
      }}>
        <strong style={{ color: "var(--gold)" }}>⚠ Local only.</strong>{" "}
        Data saved to this browser only. Sign in with Google to back up to the cloud.
      </div>
    );
  }
  if (!isSignedIn) return null;

  const lastSync = window.__firebaseSync?.getLastSyncAt?.() || null;
  return (
    <div style={{
      padding: "8px 10px", marginBottom: 10, fontSize: 11, lineHeight: 1.4,
      background: "var(--accent-bg)",
      border: "1px solid var(--accent-dim)",
      borderRadius: 4, color: "var(--accent)",
    }}>
      <div style={{ fontWeight: 600 }}>☁ Cloud backup active</div>
      <div style={{ marginTop: 2, color: "var(--ink-3)", fontSize: 10 }}>
        {lastSync
          ? `Last save ${fmtAgo_(lastSync)}`
          : "Waiting for next change to sync…"}
      </div>
    </div>
  );
}

function V2ProfileBlock() {
  const [user, setUser] = useStateV2(() => window.__currentUser || null);
  useEffectV2(() => {
    // Poll for auth changes — there's no fine-grained event on __currentUser
    // and the cost of a 1.5s interval is negligible.
    const id = setInterval(() => {
      const next = window.__currentUser || null;
      setUser((prev) => {
        if (prev === next) return prev;
        if (prev && next && prev.email === next.email && prev.uid === next.uid) return prev;
        return next;
      });
    }, 1500);
    return () => clearInterval(id);
  }, []);

  if (!user) return null;
  const isGuest = user?.uid === "_guest" || user?.email === "_guest" || !user?.uid;

  const email = user.email || "Signed in";
  const initial = (email[0] || "?").toUpperCase();
  const handleSignOut = async () => {
    const ok = window.confirm("Sign out of Ledger? Your local data stays on this device.");
    if (!ok) return;
    try { await window.__signOut?.(); } catch (e) { console.warn(e); }
  };

  return (
    <div style={{ marginTop: "auto", padding: "16px 12px 12px", borderTop: "1px solid var(--border)" }}>
      <V2SyncStatus isSignedIn={!isGuest} isGuest={isGuest} />
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 8 }}>
        <span
          style={{
            width: 32, height: 32, borderRadius: "50%",
            background: "var(--accent)", color: "var(--ai-fab-fg, #fff)",
            display: "inline-flex", alignItems: "center", justifyContent: "center",
            fontWeight: 600, fontSize: 14, flexShrink: 0,
          }}
          title={email}
          aria-hidden="true"
        >
          {initial}
        </span>
        <span style={{
          fontSize: 12, color: "var(--ink-2)",
          overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap",
        }} title={email}>
          {email}
        </span>
      </div>
      <button
        type="button"
        onClick={() => {
          const result = exportAllLedgerData();
          console.log("[ledger export]", result);
        }}
        style={{
          width: "100%", padding: "6px 10px", fontSize: 12, marginBottom: 6,
          border: "1px solid var(--border)", background: "var(--surface)",
          color: "var(--ink-2)", borderRadius: 4, cursor: "pointer",
        }}
        title="Download every Ledger key you own as one JSON file (transactions, debts, accounts, profile, etc.)"
      >
        Export all data
      </button>
      <button
        type="button"
        onClick={handleSignOut}
        style={{
          width: "100%", padding: "6px 10px", fontSize: 12,
          border: "1px solid var(--border)", background: "transparent",
          color: "var(--ink-3)", borderRadius: 4, cursor: "pointer",
        }}
        title="Sign out of Ledger"
      >
        Sign out
      </button>
    </div>
  );
}

function V2Shell() {
  const [active, setActive] = useStateV2(() => {
    const hash = window.location.hash.slice(1);
    return V2_TABS.find((t) => t.id === hash)?.id || "current";
  });

  useEffectV2(() => { window.location.hash = active; }, [active]);

  useEffectV2(() => {
    const onHash = () => {
      const id = window.location.hash.slice(1);
      if (V2_TABS.find((t) => t.id === id)) setActive(id);
    };
    window.addEventListener("hashchange", onHash);
    return () => window.removeEventListener("hashchange", onHash);
  }, []);

  const [sidebarHidden, setSidebarHidden] = useStateV2(() => {
    const saved = localStorage.getItem("ledger:sidebarHidden");
    if (saved === "1") return true;
    if (saved === "0") return false;
    return typeof window !== "undefined" && window.innerWidth < 1024;
  });
  useEffectV2(() => {
    localStorage.setItem("ledger:sidebarHidden", sidebarHidden ? "1" : "0");
  }, [sidebarHidden]);

  const renderTab = () => {
    switch (active) {
      case "current":    return window.V2Current ? <window.V2Current /> : null;
      case "projection": return window.V2Projection ? <window.V2Projection /> : null;
      case "record":
        // hideSummary because the v2 Current tab already shows the summary.
        // executiveStyle strips card chrome + uses eyebrow section labels to
        // match the v2 Current/Projection aesthetic instead of v1's traditional layout.
        return window.RecordTab ? <window.RecordTab hideSummary={true} executiveStyle={true} /> : null;
      default:           return null;
    }
  };

  // ── Sliding nav pill — measure the active button's offsetLeft/Width
  // every time `active` changes so the pill animates between positions.
  // useLayoutEffect runs synchronously after DOM mutation but before paint,
  // so the user never sees a flash of mis-positioned pill on first render. ──
  const navRef = useRefV2(null);
  const [pillRect, setPillRect] = useStateV2({ x: 0, w: 0, visible: false });
  useLayoutEffectV2(() => {
    if (!navRef.current) return;
    const btn = navRef.current.querySelector(".nav-item.is-active");
    if (!btn) { setPillRect((r) => ({ ...r, visible: false })); return; }
    setPillRect({ x: btn.offsetLeft, w: btn.offsetWidth, visible: true });
  }, [active]);

  return (
    <div className={"app" + (sidebarHidden ? " app-sidebar-hidden" : "")}>
      <aside className="sidebar">
        <div className="brand">
          <span className="brand-logo-btn" style={{ cursor: "default" }}>
            <span className="brand-mark">$</span>
            <span className="brand-name">Ledger</span>
          </span>
          <button
            type="button"
            className="brand-logo-btn"
            onClick={() => {
              const cur = document.documentElement.dataset.colorMode === "dark" ? "dark" : "light";
              const next = cur === "dark" ? "light" : "dark";
              try { localStorage.setItem("ledger:colorMode", next); } catch {}
              // Reload to re-run the color bootstrap script — simpler than re-applying every CSS variable here.
              window.location.reload();
            }}
            title="Toggle light / dark mode"
            aria-label="Toggle color mode"
            style={{ marginLeft: 8, padding: "4px 10px", fontSize: 14, border: "1px solid var(--border)", background: "transparent", color: "var(--ink-2)", borderRadius: 4, cursor: "pointer" }}
          >
            ☼
          </button>
          <button
            className="sidebar-toggle"
            onClick={() => setSidebarHidden(true)}
            title="Hide sidebar"
            aria-label="Hide sidebar"
          >
            ‹
          </button>
        </div>

        <div className="nav-section">Ledger</div>
        <nav className="nav nav-pill-track" ref={navRef}>
          <div
            className="nav-active-pill"
            style={{
              transform: `translateX(${pillRect.x}px)`,
              width: pillRect.w,
              opacity: pillRect.visible ? 1 : 0,
            }}
            aria-hidden="true"
          />
          {V2_TABS.map((t) => (
            <button
              key={t.id}
              className={"nav-item" + (active === t.id ? " is-active" : "")}
              onClick={() => setActive(t.id)}
            >
              <span className="nav-glyph">{t.glyph}</span>
              <span>{t.label}</span>
            </button>
          ))}
        </nav>

        <div className="nav-section" style={{ marginTop: 24 }}>More</div>
        <nav className="nav">
          <a
            className="nav-item"
            href="v1/"
            title="Open the full calculator (budget, debt, investing, taxes, household)"
            style={{ textDecoration: "none" }}
          >
            <span className="nav-glyph">→</span>
            <span>Full calculator</span>
          </a>
        </nav>

        <V2ProfileBlock />
      </aside>

      {sidebarHidden && (
        <button
          className="sidebar-show"
          onClick={() => setSidebarHidden(false)}
          title="Show sidebar"
          aria-label="Show sidebar"
        >
          ›
        </button>
      )}

      <main className="main">
        {renderTab()}
        <footer className="page-foot">
          <span style={{ color: "var(--ink-3)", fontSize: 12 }}>
            Ledger v2 · data syncs across devices when signed in ·{" "}
            <a href="v1/" style={{ color: "var(--accent)" }}>v1 calculator →</a>
          </span>
        </footer>
      </main>
    </div>
  );
}

function startV2App() {
  const root = ReactDOM.createRoot(document.getElementById("root"));
  const AuthGateC = window.AuthGate;
  root.render(AuthGateC ? <AuthGateC><V2Shell /></AuthGateC> : <V2Shell />);
}

if (window.FramerMotion) startV2App();
else window.addEventListener("framer-motion-ready", startV2App, { once: true });

</script>
</body></html>
