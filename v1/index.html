<script type="text/babel" data-presets="react">
// Savings & Investing — portfolio editor with arbitrary investment types + cash buckets.
const { useMemo: useMemoInvest, useEffect: useEffectInvest, useState: useStateInvest } = React;

const INVEST_COLORS = ["#4DA77A", "#C9A96E", "#7B6E55", "#5A8FA3", "#9C7C4B", "#B85450", "#4FB5B0", "#A07ABE"];

// Common brokerages / platforms — used as suggestions in the platform dropdown
const INVEST_PLATFORMS = [
  "Fidelity", "Vanguard", "Schwab", "Robinhood", "Webull", "E*TRADE", "Wealthfront", "Betterment",
  "Coinbase", "Binance", "Kraken", "Public", "M1 Finance", "Acorns", "SoFi", "Other"
];

// Common goals you might compound towards. Used as quick-pick chips when an
// investment is in Compound=Yes mode.
const INVEST_GOALS = [
  "College fund", "House fund", "Retirement", "Emergency fund", "Wedding",
  "Travel fund", "New car", "Business fund", "Kids' future", "Early retirement",
];

// Return-period options. Each maps to a per-period rate the user enters; we convert to annual.
const RETURN_PERIODS = {
  monthly: { label: "Monthly",  per: 12, defaultHorizon: "short" },
  "3mo":   { label: "Quarterly (3 mo)", per: 4,  defaultHorizon: "short" },
  "6mo":   { label: "Semi-annual (6 mo)", per: 2,  defaultHorizon: "long"  },
  yearly:  { label: "Yearly",   per: 1,  defaultHorizon: "long"  },
};

// Cap any single balance value at $999,999,999,999 so absurd inputs (e.g. 50% monthly
// return × 60 years) don't render as Infinity or NaN. The cap is high enough not to
// affect any realistic projection but low enough to stay a finite, formattable number.
const MAX_BAL = 1e12;
function safeBal(v) {
  if (!isFinite(v) || isNaN(v)) return 0;
  if (v > MAX_BAL) return MAX_BAL;
  if (v < -MAX_BAL) return -MAX_BAL;
  return v;
}

// Convert a per-period rate (e.g. 0.8% monthly) into an annual rate for the projection math.
// returnInput is the user-entered decimal for one period (0.008 = 0.8%).
function periodToAnnual(returnInput, period) {
  const per = RETURN_PERIODS[period]?.per || 1;
  // Clamp the input rate to [-99%, 1000% per period] so Math.pow doesn't overflow.
  const r = Math.max(-0.99, Math.min(10, Number(returnInput) || 0));
  return Math.pow(1 + r, per) - 1;
}
function annualToPeriod(annualRate, period) {
  const per = RETURN_PERIODS[period]?.per || 1;
  return Math.pow(1 + (annualRate || 0), 1 / per) - 1;
}

const DEFAULT_PORTFOLIO = {
  emergency: 0.30,
  reserve:   0.10,
  investments: [
    { id: 1, name: "Stocks",       pct: 0.30, returnRate: 0.10, horizon: "long",  returnPeriod: "yearly",  returnInput: 0.10,  platform: "Fidelity"   },
    { id: 2, name: "Real Estate",  pct: 0.15, returnRate: 0.07, horizon: "long",  returnPeriod: "yearly",  returnInput: 0.07,  platform: "Other"      },
    { id: 3, name: "Fixed Income", pct: 0.15, returnRate: 0.05, horizon: "long",  returnPeriod: "yearly",  returnInput: 0.05,  platform: "Vanguard"   },
  ],
};

const PRESET_INVESTMENTS = [
  { name: "Stocks",       returnRate: 0.10, horizon: "long",  returnPeriod: "yearly",  platform: "Fidelity"   },
  { name: "Real Estate",  returnRate: 0.07, horizon: "long",  returnPeriod: "yearly",  platform: "Other"      },
  { name: "Fixed Income", returnRate: 0.05, horizon: "long",  returnPeriod: "yearly",  platform: "Vanguard"   },
  { name: "Bonds",        returnRate: 0.04, horizon: "long",  returnPeriod: "yearly",  platform: "Vanguard"   },
  { name: "Crypto",       returnRate: 0.15, horizon: "short", returnPeriod: "monthly", platform: "Coinbase"   },
  { name: "Index Fund",   returnRate: 0.09, horizon: "long",  returnPeriod: "yearly",  platform: "Vanguard"   },
  { name: "401k",         returnRate: 0.08, horizon: "long",  returnPeriod: "yearly",  platform: "Fidelity"   },
  { name: "Roth IRA",     returnRate: 0.08, horizon: "long",  returnPeriod: "yearly",  platform: "Schwab"     },
  { name: "Gold",         returnRate: 0.05, horizon: "long",  returnPeriod: "yearly",  platform: "Other"      },
  { name: "REITs",        returnRate: 0.08, horizon: "long",  returnPeriod: "yearly",  platform: "Schwab"     },
  { name: "Money market", returnRate: 0.045, horizon: "short", returnPeriod: "monthly", platform: "Fidelity"  },
  { name: "T-bills",      returnRate: 0.05, horizon: "short", returnPeriod: "3mo",     platform: "Schwab"     },
];

// Migrate an old investment shape (just {id,name,pct,returnRate}) into the new one with defaults.
// New fields (added later): principle (dollar amount) + compound (boolean — monthly contribution mode).
function migrateInvestment(inv) {
  return {
    ...inv,
    horizon:      inv.horizon || "long",
    returnPeriod: inv.returnPeriod || "yearly",
    returnInput:  inv.returnInput != null ? inv.returnInput : (inv.returnRate || 0),
    platform:     inv.platform || "Other",
    principle:    inv.principle != null ? Number(inv.principle) : 0,
    compound:     inv.compound != null ? !!inv.compound : false,
    goal:         inv.goal || "",
    trackInOverview: inv.trackInOverview !== false, // default ON
    targetYears:  inv.targetYears != null ? Number(inv.targetYears) : null, // null = use global horizon
  };
}

function portfolioTotal(p) {
  return p.emergency + p.reserve + p.investments.reduce((a, b) => a + b.pct, 0);
}

// Project a single investment forward `years` years. Used by the Overview
// tab to display each "tracked" investment's future value standalone.
// Pure function — no side effects. Returns { final, contributed, interest }.
function projectSingleInvestment(inv, years, monthlyFromBudget = 0) {
  const m = migrateInvestment(inv);
  const months = Math.max(1, Math.round((years || 0) * 12));
  const mRate = Math.pow(1 + (m.returnRate || 0), 1/12) - 1;
  let bal = m.compound ? 0 : (Number(m.principle) || 0);
  let contributed = m.compound ? 0 : (Number(m.principle) || 0);
  const monthlyContrib = m.compound
    ? (Number(m.principle) || 0)
    : monthlyFromBudget;
  for (let i = 0; i < months; i++) {
    bal += monthlyContrib;
    contributed += monthlyContrib;
    bal = safeBal(bal * (1 + mRate));
  }
  return { final: safeBal(bal), contributed, interest: safeBal(bal - contributed) };
}
window.projectSingleInvestment = projectSingleInvestment;

// Compute year-by-year projection. Auto-normalizes allocations if total ≠ 100%.
// `overrideAnnualSavings` — if provided, use this each year instead of y.leftover
// (lets the user invest a fixed custom amount instead of their Budget surplus).
function computeInvestmentProjection(years, portfolio, overrideAnnualSavings) {
  const total = portfolioTotal(portfolio);
  const factor = total > 0 ? 1 / total : 0;
  let emergencyBal = 0, reserveBal = 0;
  // Seed each investment with its lump-sum Principle when compound=false.
  // When compound=true, Principle is the monthly contribution and starting balance is 0.
  const migrated = portfolio.investments.map(migrateInvestment);
  const invBals = migrated.map((inv) => inv.compound ? 0 : (Number(inv.principle) || 0));
  const monthlyRates = migrated.map((inv) => Math.pow(1 + (inv.returnRate || 0), 1/12) - 1);
  // Per-month contribution from every compound-mode investment, summed once.
  const compoundContribPerMonth = migrated.reduce(
    (a, inv) => a + (inv.compound ? (Number(inv.principle) || 0) : 0),
    0
  );
  const rows = [];
  // Account for one-time lump-sum principles (compound=false) as "contributed" in year 1
  let lumpContributed = migrated.reduce(
    (a, inv) => a + (!inv.compound ? (Number(inv.principle) || 0) : 0),
    0
  );
  for (const y of years) {
    const baseSavings = overrideAnnualSavings != null
      ? overrideAnnualSavings * (y.months / 12)
      : Math.max(0, y.leftover);
    const compoundContrib = compoundContribPerMonth * (y.months || 12);
    // Total $ that flowed into investments+cash this year (used by hero "contributed" totals)
    const savings = baseSavings + compoundContrib + lumpContributed;
    emergencyBal += baseSavings * portfolio.emergency * factor;
    reserveBal   += baseSavings * portfolio.reserve   * factor;
    migrated.forEach((inv, i) => {
      // For compound=true, simulate 12 monthly compound steps each adding the principle.
      if (inv.compound) {
        const months = y.months || 12;
        let bal = invBals[i];
        const mRate = monthlyRates[i];
        const monthly = Number(inv.principle) || 0;
        for (let m = 0; m < months; m++) {
          bal += monthly;
          bal = safeBal(bal * (1 + mRate));
        }
        invBals[i] = safeBal(bal);
      } else {
        // Lump-sum principle already in invBals[i] on first iteration. Now grow annually
        // and add this year's share of budget surplus.
        invBals[i] = safeBal(invBals[i] * (1 + (inv.returnRate || 0)) + baseSavings * inv.pct * factor);
      }
    });
    rows.push({
      year: y.year,
      savings,
      cash: { emergency: emergencyBal, reserve: reserveBal },
      investments: migrated.map((inv, i) => ({
        name: inv.name,
        balance: invBals[i],
      })),
      netWorth: emergencyBal + reserveBal + invBals.reduce((a, b) => a + b, 0),
    });
    lumpContributed = 0; // only count lump sums in year 1
  }
  return rows;
}

function computeMonthlyInvestmentProjection(years, portfolio, overrideMonthlySavings) {
  const total = portfolioTotal(portfolio);
  const factor = total > 0 ? 1 / total : 0;
  const migrated = portfolio.investments.map(migrateInvestment);
  const monthlyRates = migrated.map((inv) => Math.pow(1 + (inv.returnRate || 0), 1/12) - 1);
  let emergencyBal = 0, reserveBal = 0;
  // Seed lump-sum principle for non-compound investments
  const invBals = migrated.map((inv) => inv.compound ? 0 : (Number(inv.principle) || 0));
  const compoundContribPerMonth = migrated.reduce(
    (a, inv) => a + (inv.compound ? (Number(inv.principle) || 0) : 0),
    0
  );
  // Total lump-sum principles count as contributed in the very first month
  let lumpContributedFirstMonth = migrated.reduce(
    (a, inv) => a + (!inv.compound ? (Number(inv.principle) || 0) : 0),
    0
  );
  const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const rows = [];
  for (const y of years) {
    const startMo = y.startMonthIdx;
    const monthlySavings = overrideMonthlySavings != null
      ? overrideMonthlySavings
      : Math.max(0, y.leftover) / y.months;
    const mEm = monthlySavings * portfolio.emergency * factor;
    const mRe = monthlySavings * portfolio.reserve * factor;
    // For non-compound: contribution from shared budget surplus. For compound: fixed principle/mo.
    const mInv = migrated.map((inv) => inv.compound
      ? (Number(inv.principle) || 0)
      : monthlySavings * inv.pct * factor);
    for (let m = startMo; m < 12; m++) {
      emergencyBal += mEm;
      reserveBal   += mRe;
      migrated.forEach((inv, i) => {
        invBals[i] = safeBal(invBals[i] * (1 + monthlyRates[i]) + mInv[i]);
      });
      // True contribution this month = budget portion + compound principles + any lump for first month
      const monthSavings = monthlySavings + compoundContribPerMonth + lumpContributedFirstMonth;
      lumpContributedFirstMonth = 0;
      rows.push({
        key: `${y.year}-${m}`,
        label: `${MONTHS[m]} ${y.year}`,
        savings: monthSavings,
        cash: { emergency: emergencyBal, reserve: reserveBal },
        investments: migrated.map((inv, i) => ({
          name: inv.name,
          balance: invBals[i],
        })),
        netWorth: emergencyBal + reserveBal + invBals.reduce((a, b) => a + b, 0),
        isYearStart: m === startMo,
      });
    }
  }
  return rows;
}

function PortfolioEditor({ portfolio, setPortfolio, rateMode = "annual", totalMonthly = 0 }) {
  // Convert internal annual rate <-> displayed value depending on user's preferred entry mode
  const annualToDisplay = (annual) => rateMode === "monthly"
    ? ((Math.pow(1 + annual, 1/12) - 1) * 100).toFixed(2)
    : (annual * 100).toFixed(1);
  const displayToAnnual = (v) => rateMode === "monthly"
    ? Math.pow(1 + v / 100, 12) - 1
    : v / 100;
  const rateLabel = rateMode === "monthly" ? "Return / mo" : "Return / yr";
  // Sum of all investment dollar amounts (helpful for the user to see vs total)
  const investSum = totalMonthly * portfolio.investments.reduce((a, b) => a + b.pct, 0);
  const total = portfolioTotal(portfolio);
  const totalPct = total * 100;
  const totalOk = Math.abs(totalPct - 100) < 0.5;

  const updateCash = (key, value) => setPortfolio((p) => ({ ...p, [key]: value / 100 }));
  const updateInvestment = (id, patch) => setPortfolio((p) => ({
    ...p,
    investments: p.investments.map((inv) => inv.id === id ? { ...inv, ...patch } : inv),
  }));
  const removeInvestment = (id) => setPortfolio((p) => ({
    ...p,
    investments: p.investments.filter((inv) => inv.id !== id),
  }));
  const addInvestment = (preset) => {
    const id = Math.max(0, ...portfolio.investments.map((i) => i.id)) + 1;
    const horizon      = preset?.horizon      || "long";
    const returnPeriod = preset?.returnPeriod || (horizon === "short" ? "monthly" : "yearly");
    const annualRate   = preset?.returnRate   || 0.06;
    setPortfolio((p) => ({
      ...p,
      investments: [...p.investments, {
        id,
        name: preset?.name || "New investment",
        pct: 0.05,
        returnRate: annualRate,                        // canonical annual rate (for math)
        returnPeriod,
        returnInput: annualToPeriod(annualRate, returnPeriod), // displayed value for that period
        horizon,
        platform: preset?.platform || "Other",
        principle: 0,
        compound: false,
        goal: "",
        trackInOverview: true,
        targetYears: null,
      }],
    }));
  };

  // Auto-balance allocation %s from each investment's Principle amount.
  // Useful when the user enters dollar principles and wants the % column to
  // reflect their relative weights without typing.
  const balanceFromPrinciples = () => {
    setPortfolio((p) => {
      const investSum = p.investments.reduce((a, b) => a + (Number(b.principle) || 0), 0);
      if (investSum <= 0) return p;
      const nonInvest = (p.emergency || 0) + (p.reserve || 0);
      const investBudget = Math.max(0, 1 - nonInvest);
      return {
        ...p,
        investments: p.investments.map((inv) => ({
          ...inv,
          pct: investBudget * ((Number(inv.principle) || 0) / investSum),
        })),
      };
    });
  };
  // Per-investment expand/collapse state (UI-only, not persisted)
  const [expandedInv, setExpandedInv] = useStateInvest({});
  const isInvExpanded = (id) => expandedInv[id] === true; // default: collapsed (compact view)
  const toggleInv = (id) => setExpandedInv((m) => ({ ...m, [id]: !isInvExpanded(id) }));
  const normalize = () => {
    if (total === 0) return;
    const factor = 1 / total;
    setPortfolio((p) => ({
      ...p,
      emergency: p.emergency * factor,
      reserve:   p.reserve * factor,
      investments: p.investments.map((inv) => ({ ...inv, pct: inv.pct * factor })),
    }));
  };

  // Smart-optimize: apply a textbook split (Bogleheads-style).
  // 20% emergency fund, 10% short-term reserve, 70% across investments.
  // Investment split weights long-horizon types higher than short-horizon ones.
  const optimize = () => {
    setPortfolio((p) => {
      // If there are no investments, seed a default diversified index fund
      if (p.investments.length === 0) {
        return {
          ...p,
          emergency: 0.20,
          reserve:   0.10,
          investments: [{
            id: 1, name: "Index Fund", pct: 0.70, returnRate: 0.09,
            horizon: "long", returnPeriod: "yearly", returnInput: 0.09, platform: "Vanguard",
          }],
        };
      }
      // Weight long-term twice as heavy as short-term to encourage diversification
      const weights = p.investments.map((inv) => {
        const m = migrateInvestment(inv);
        return m.horizon === "long" ? 2 : 1;
      });
      const totalW = weights.reduce((a, b) => a + b, 0) || 1;
      return {
        ...p,
        emergency: 0.20,
        reserve:   0.10,
        investments: p.investments.map((inv, i) => ({ ...inv, pct: 0.70 * weights[i] / totalW })),
      };
    });
  };

  const cashColor1 = "#C9A96E";
  const cashColor2 = "#5A8FA3";

  return (
    <section className="card">
      <header className="card-head">
        <h2>Portfolio allocation</h2>
        <span className={"card-tag " + (totalOk ? "" : "card-tag-warn")}>
          total: {totalPct.toFixed(1)}%
          {!totalOk && <button className="btn-link" style={{ marginLeft: 8 }} onClick={normalize}>normalize →</button>}
        </span>
      </header>
      <div className="card-body">

        <div className="port-bar">
          <div style={{ width: `${portfolio.emergency * 100}%`, background: cashColor1 }} title={`Emergency ${(portfolio.emergency*100).toFixed(0)}%`} />
          <div style={{ width: `${portfolio.reserve * 100}%`,   background: cashColor2 }} title={`Reserve ${(portfolio.reserve*100).toFixed(0)}%`} />
          {portfolio.investments.map((inv, i) => (
            <div key={inv.id}
                 style={{ width: `${inv.pct * 100}%`, background: INVEST_COLORS[i % INVEST_COLORS.length] }}
                 title={`${inv.name} ${(inv.pct*100).toFixed(0)}%`} />
          ))}
        </div>

        <h3 className="sub-head">Cash reserves</h3>
        <div className="port-row port-row-head">
          <span></span>
          <span>Name</span>
          <span className="num">Allocation</span>
          <span className="num">Return</span>
          <span></span>
        </div>
        <div className="port-row">
          <span className="port-dot" style={{ background: cashColor1 }} />
          <span className="port-name port-name-fixed">Emergency fund</span>
          <NumberInput value={(portfolio.emergency * 100).toFixed(1)} onChange={(v) => updateCash("emergency", v)} suffix="%" min={0} />
          <span className="port-fixed">cash</span>
          <span></span>
        </div>
        <div className="port-row">
          <span className="port-dot" style={{ background: cashColor2 }} />
          <span className="port-name port-name-fixed">Reserve</span>
          <NumberInput value={(portfolio.reserve * 100).toFixed(1)} onChange={(v) => updateCash("reserve", v)} suffix="%" min={0} />
          <span className="port-fixed">cash</span>
          <span></span>
        </div>

        <h3 className="sub-head" style={{ marginTop: 18, display: "flex", alignItems: "center", gap: 10 }}>
          <span>Investments</span>
          {totalMonthly > 0 && (
            <span style={{
              fontSize: 12,
              fontWeight: 400,
              color: investSum > totalMonthly * 1.001 ? "var(--negative)" : "var(--ink-3)",
              fontFamily: "var(--display)",
              fontStyle: "italic",
            }}>
              {fmtUSD0(investSum)} / {fmtUSD0(totalMonthly)} committed
              {investSum > totalMonthly * 1.001 && " (over)"}
            </span>
          )}
          {portfolio.investments.some((i) => Number(i.principle) > 0) && (
            <button className="btn-link" style={{ marginLeft: "auto" }} onClick={balanceFromPrinciples} title="Re-derive % from each investment's Principle">
              ⚖ balance % from principles
            </button>
          )}
        </h3>
        {portfolio.investments.length === 0 && (
          <div className="port-empty">No investment types yet. Add one below ↓</div>
        )}
        {portfolio.investments.map((inv, i) => {
          const m = migrateInvestment(inv);
          const open = isInvExpanded(m.id);
          const periodInfo = RETURN_PERIODS[m.returnPeriod] || RETURN_PERIODS.yearly;
          // Display the per-period return value as a %
          const periodPct = ((m.returnInput || 0) * 100).toFixed(2);
          // Always show annual equivalent for context
          const annualPct = (m.returnRate * 100).toFixed(1);
          return (
            <div key={m.id} className={"inv-card" + (open ? "" : " is-collapsed")}>
              <div className="inv-card-head">
                <button
                  type="button"
                  className={"debt-card-chevron" + (open ? " is-open" : "")}
                  onClick={() => toggleInv(m.id)}
                  title={open ? "Collapse" : "Expand"}
                >▾</button>
                <span className="port-dot" style={{ background: INVEST_COLORS[i % INVEST_COLORS.length] }} />
                <input
                  type="text"
                  className="text-input inv-card-name"
                  value={m.name}
                  onChange={(e) => updateInvestment(m.id, { name: e.target.value })}
                  placeholder="Investment name"
                />
                <span className={"inv-horizon-pill " + (m.horizon === "short" ? "is-short" : "is-long")}>
                  {m.horizon === "short" ? "Short term" : "Long term"}
                </span>
                <button className="icon-btn" onClick={() => removeInvestment(m.id)} title="Remove">×</button>
              </div>
              {!open && (
                <button type="button" className="debt-card-summary" onClick={() => toggleInv(m.id)}>
                  {m.compound ? (
                    <span>
                      <strong>{fmtUSD0(m.principle)}/mo</strong>{" "}
                      <span style={{color:"var(--accent-2)"}}>compounding</span>
                      {m.goal && <span style={{color:"var(--gold)"}}> → {m.goal}</span>}
                    </span>
                  ) : (
                    <span>
                      <strong>{(m.pct * 100).toFixed(1)}%</strong>
                      {totalMonthly > 0 && <span style={{ color: "var(--accent-2)" }}> · {fmtUSD0(m.pct * totalMonthly)}/mo</span>}
                      {Number(m.principle) > 0 && <span style={{ color: "var(--gold)" }}> · {fmtUSD0(m.principle)} principle</span>}
                    </span>
                  )}
                  <span className="debt-card-summary-sep">·</span>
                  <span>{periodPct}% {periodInfo.label.toLowerCase()}</span>
                  <span className="debt-card-summary-sep">·</span>
                  <span>{annualPct}%/yr equiv</span>
                  <span className="debt-card-summary-sep">·</span>
                  <span>{m.platform}</span>
                </button>
              )}
              {open && (
                <div className="inv-card-grid">
                  <Field
                    label="Allocation"
                    hint={
                      m.compound
                        ? "ignored when compounding"
                        : (totalMonthly > 0 ? `${fmtUSD0(m.pct * totalMonthly)}/mo` : "% of savings")
                    }
                  >
                    <div style={{ display: "flex", gap: 6, opacity: m.compound ? 0.5 : 1, pointerEvents: m.compound ? "none" : "auto" }}>
                      <NumberInput
                        value={(m.pct * 100).toFixed(1)}
                        onChange={(v) => updateInvestment(m.id, { pct: v / 100 })}
                        suffix="%"
                        min={0}
                      />
                      {totalMonthly > 0 && !m.compound && (
                        <Money
                          value={Math.round(m.pct * totalMonthly)}
                          onChange={(v) => updateInvestment(m.id, { pct: totalMonthly > 0 ? (v / totalMonthly) : 0 })}
                          placeholder="0"
                        />
                      )}
                    </div>
                  </Field>
                  <Field
                    label={m.compound ? "Monthly contribution" : "Principle (starting $)"}
                    hint={m.compound ? "compounds at the return rate" : "one-time lump sum"}
                  >
                    <Money
                      value={Number(m.principle) || 0}
                      onChange={(v) => updateInvestment(m.id, { principle: Math.max(0, Number(v) || 0) })}
                      placeholder="0"
                    />
                  </Field>
                  <Field label="Time horizon" hint="how long you'll hold">
                    <Segment
                      value={m.horizon}
                      onChange={(v) => {
                        // Auto-pick a sensible default return period when toggling horizon
                        const nextPeriod = v === "short" ? "monthly" : "yearly";
                        const annual = m.returnRate;
                        updateInvestment(m.id, {
                          horizon: v,
                          returnPeriod: nextPeriod,
                          returnInput: annualToPeriod(annual, nextPeriod),
                        });
                      }}
                      options={[
                        { value: "short", label: "Short" },
                        { value: "long",  label: "Long"  },
                      ]}
                    />
                  </Field>
                  <Field label="Return period" hint="how you enter %">
                    <select
                      className="select"
                      value={m.returnPeriod}
                      onChange={(e) => {
                        const nextPeriod = e.target.value;
                        // Preserve the annual rate, recompute the per-period display value
                        updateInvestment(m.id, {
                          returnPeriod: nextPeriod,
                          returnInput: annualToPeriod(m.returnRate, nextPeriod),
                        });
                      }}
                    >
                      {Object.entries(RETURN_PERIODS).map(([k, v]) => (
                        <option key={k} value={k}>{v.label}</option>
                      ))}
                    </select>
                  </Field>
                  <Field
                    label={`Expected return (${periodInfo.label.toLowerCase()})`}
                    hint={`≈ ${annualPct}%/yr`}
                  >
                    <NumberInput
                      value={periodPct}
                      onChange={(v) => {
                        const perInput = (v || 0) / 100;
                        updateInvestment(m.id, {
                          returnInput: perInput,
                          returnRate: periodToAnnual(perInput, m.returnPeriod),
                        });
                      }}
                      suffix="%"
                      min={0}
                    />
                  </Field>
                  <Field label="Platform" hint="brokerage / exchange">
                    <select
                      className="select"
                      value={m.platform || "Other"}
                      onChange={(e) => updateInvestment(m.id, { platform: e.target.value })}
                    >
                      {INVEST_PLATFORMS.map((p) => <option key={p} value={p}>{p}</option>)}
                    </select>
                  </Field>
                  <Field
                    label="Compound"
                    hint={m.compound ? "fixed $ in monthly · compounds" : "share of budget · annual growth"}
                  >
                    <Segment
                      value={m.compound ? "yes" : "no"}
                      onChange={(v) => updateInvestment(m.id, { compound: v === "yes" })}
                      options={[
                        { value: "no",  label: "No"  },
                        { value: "yes", label: "Yes" },
                      ]}
                    />
                  </Field>
                  {m.compound && (
                    <Field
                      label="Goal / purpose"
                      hint="what this money is for"
                    >
                      <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                        <input
                          type="text"
                          className="text-input"
                          value={m.goal}
                          onChange={(e) => updateInvestment(m.id, { goal: e.target.value })}
                          placeholder="e.g. College fund"
                        />
                        <div className="port-presets" style={{ gap: 4 }}>
                          {INVEST_GOALS.filter((g) => g.toLowerCase() !== (m.goal || "").toLowerCase()).slice(0, 6).map((g) => (
                            <button
                              key={g}
                              type="button"
                              className="port-preset-btn"
                              onClick={() => updateInvestment(m.id, { goal: g })}
                            >
                              {g}
                            </button>
                          ))}
                        </div>
                      </div>
                    </Field>
                  )}

                  {/* Track in Overview & Totals — pushes this investment's projected
                      end-of-horizon balance into the Overview tab so the user sees
                      it counted toward their future net worth. */}
                  <Field
                    label="Track in Overview & Totals"
                    hint={m.trackInOverview
                      ? "✓ this investment's projected balance shows in Overview"
                      : "off — Overview ignores this investment"}
                  >
                    <div style={{ display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap" }}>
                      <label className="track-toggle">
                        <input
                          type="checkbox"
                          checked={m.trackInOverview}
                          onChange={(e) => updateInvestment(m.id, { trackInOverview: e.target.checked })}
                        />
                        <span className="track-toggle-pill">
                          <span className="track-toggle-knob" />
                        </span>
                        <span className="track-toggle-label">{m.trackInOverview ? "Tracked" : "Hidden from Overview"}</span>
                      </label>
                      {m.trackInOverview && (
                        <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                          <span className="footnote" style={{ fontStyle: "normal" }}>Project for:</span>
                          <NumberInput
                            value={m.targetYears != null ? m.targetYears : ""}
                            onChange={(v) => updateInvestment(m.id, {
                              targetYears: v === "" || v == null ? null : Math.max(1, Math.min(60, Math.round(Number(v))))
                            })}
                            suffix="yr"
                          />
                          <span className="footnote" style={{ fontStyle: "normal" }}>
                            {m.targetYears == null ? "(use page horizon)" : ""}
                          </span>
                        </div>
                      )}
                    </div>
                  </Field>
                </div>
              )}
            </div>
          );
        })}

        <div className="port-add">
          <button className="btn-ghost" onClick={() => addInvestment()}>+ Add investment</button>
          <span className="port-add-or">or quick-add:</span>
          <div className="port-presets">
            {PRESET_INVESTMENTS
              .filter((preset) => !portfolio.investments.some((inv) => inv.name.toLowerCase() === preset.name.toLowerCase()))
              .slice(0, 6)
              .map((preset) => (
                <button key={preset.name} className="port-preset-btn" onClick={() => addInvestment(preset)}>
                  + {preset.name}
                </button>
              ))}
          </div>
        </div>

      </div>
    </section>
  );
}

function InvestingCalculator({ profile, getBudgetData }) {
  const [portfolio, setPortfolio] = useStateInvest(DEFAULT_PORTFOLIO);
  const [years, setYears] = useStateInvest(10);
  const [horizonUnit, setHorizonUnit] = useStateInvest("years");
  const [view, setView] = useStateInvest("yearly");
  // For short horizons (≤24 months) yearly view collapses everything to 1-2 data
  // points making the chart look broken. Auto-switch to monthly so the user sees
  // meaningful detail. User can still manually override to yearly afterwards.
  const [userPickedView, setUserPickedView] = useStateInvest(false);
  useEffectInvest(() => {
    if (!userPickedView && years <= 2) setView("monthly");
    if (!userPickedView && years > 2)  setView("yearly");
  }, [years, userPickedView]);
  const handleViewChange = (v) => { setView(v); setUserPickedView(true); };
  const [tick, setTick] = useStateInvest(0);
  // Funding source: "budget" = use leftover from Budget tab, "custom" = use a fixed monthly amount
  const [fundingMode, setFundingMode] = useStateInvest("budget");
  const [customMonthly, setCustomMonthly] = useStateInvest(0);
  // Return rate input: "annual" or "monthly" — how the user wants to enter return percentages
  const [rateMode, setRateMode] = useStateInvest("annual");

  useEffectInvest(() => {
    try {
      const saved = JSON.parse(localStorage.getItem("ledger:invest-v2") || "null");
      if (saved) {
        saved.portfolio && setPortfolio(saved.portfolio);
        saved.years     && setYears(saved.years);
        saved.unit      && setHorizonUnit(saved.unit);
        saved.fundingMode    && setFundingMode(saved.fundingMode);
        saved.customMonthly != null && setCustomMonthly(saved.customMonthly);
        saved.rateMode       && setRateMode(saved.rateMode);
      }
    } catch {}
  }, []);
  useEffectInvest(() => {
    localStorage.setItem("ledger:invest-v2", JSON.stringify({
      portfolio, years, unit: horizonUnit, fundingMode, customMonthly, rateMode
    }));
  }, [portfolio, years, horizonUnit, fundingMode, customMonthly, rateMode]);

  useEffectInvest(() => {
    const id = setInterval(() => setTick((t) => t + 1), 1000);
    return () => clearInterval(id);
  }, []);

  const budget = getBudgetData();
  const yearCountForProj = Math.max(1, Math.ceil(years));
  const projYears = useMemoInvest(() => {
    // Custom funding doesn't need a Budget — synthesize plain year buckets
    if (fundingMode === "custom") {
      const startYear = new Date().getFullYear();
      const synth = [];
      for (let i = 0; i < yearCountForProj; i++) {
        synth.push({ year: startYear + i, leftover: 0, months: 12, startMonthIdx: 0 });
      }
      return synth;
    }
    if (!budget?.expenses || !budget?.growth) return [];
    return buildProjectionYears(profile, budget.expenses, budget.growth, yearCountForProj);
  }, [fundingMode, profile, budget?.expenses, budget?.growth, yearCountForProj, tick]);

  // If user picked "Custom amount", override projection savings with their fixed monthly contribution
  const overrideAnnual  = fundingMode === "custom" ? (customMonthly * 12) : undefined;
  const overrideMonthly = fundingMode === "custom" ? customMonthly        : undefined;

  // Sum of all compound-mode investments' principles. This is the auto-derived
  // monthly contribution that flows into those investments regardless of fundingMode.
  const compoundMonthlyTotal = useMemoInvest(() => {
    return portfolio.investments.reduce((sum, inv) => {
      const m = migrateInvestment(inv);
      return sum + (m.compound ? (Number(m.principle) || 0) : 0);
    }, 0);
  }, [portfolio.investments]);

  // The TRUE total monthly investing amount = compound principles (always flowing)
  // + non-compound budget (custom or budget-derived).
  const nonCompoundBudget = fundingMode === "custom"
    ? customMonthly
    : (budget?.totals?.monthlyLeftover || 0);
  const totalMonthlyInvested = compoundMonthlyTotal + nonCompoundBudget;

  const rows = useMemoInvest(
    () => computeInvestmentProjection(projYears, portfolio, overrideAnnual),
    [projYears, portfolio, overrideAnnual]
  );
  const monthRows = useMemoInvest(
    () => view === "monthly" ? computeMonthlyInvestmentProjection(projYears, portfolio, overrideMonthly) : [],
    [projYears, portfolio, view, overrideMonthly]
  );

  const targetMonths = Math.max(1, Math.round(years * 12));
  const targetYears  = Math.max(1, Math.ceil(years));
  const displayedMonthRows = monthRows.slice(0, targetMonths);
  const displayedRows = rows.slice(0, targetYears);

  const displayedFinal = view === "monthly"
    ? displayedMonthRows[displayedMonthRows.length - 1]
    : displayedRows[displayedRows.length - 1];
  const totalContributed = (view === "monthly" ? displayedMonthRows : displayedRows)
    .reduce((a, r) => a + r.savings, 0);
  const growthAmount = (displayedFinal?.netWorth || 0) - totalContributed;

  const needsBudget = fundingMode === "budget" && (!budget?.expenses || projYears.length === 0);

  // Summary by category
  const cashTotal = (displayedFinal?.cash?.emergency || 0) + (displayedFinal?.cash?.reserve || 0);
  const investmentsTotal = (displayedFinal?.investments || []).reduce((a, b) => a + b.balance, 0);

  return (
    <>
      <header className="page-head">
        <div>
          <h1 className="page-title">Savings <em>&amp;</em> investing</h1>
        </div>
        <div className="page-head-right">
          <div className="page-head-actions">
            {window.AutoSaveIndicator && <window.AutoSaveIndicator value={{ portfolio, years, horizonUnit, fundingMode, customMonthly, rateMode }} />}
            <div className="view-toggle">
              <Segment
                value={view}
                onChange={handleViewChange}
                options={[
                  { value: "yearly",  label: "Yearly" },
                  { value: "monthly", label: "Monthly" },
                ]}
              />
            </div>
            <ExportButton calculatorName="Savings & investing" />
          </div>
          <div className="page-sub">Build a multi-asset portfolio · live-linked to Budget</div>
        </div>
      </header>

      {/* Top hero: investment source + monthly amount + return rate at a glance.
          Pulled to the very top so the two most important inputs are right there. */}
      <section className="invest-top-hero">
        <div className="invest-top-row">
          <div className="invest-top-block">
            <div className="invest-top-eyebrow">Investment source</div>
            <Segment
              value={fundingMode}
              onChange={setFundingMode}
              options={[
                { value: "budget", label: "From Budget surplus" },
                { value: "custom", label: "Custom amount" },
              ]}
            />
          </div>
          <div className="invest-top-block">
            <div className="invest-top-eyebrow">
              {fundingMode === "custom" ? "Monthly amount you invest" : "Monthly amount (from Budget)"}
            </div>
            {fundingMode === "custom" ? (
              <>
                <Money
                  value={totalMonthlyInvested}
                  onChange={(v) => {
                    // The top input represents the TOTAL. The compound portion is fixed
                    // by individual investment principles — anything above that is the
                    // non-compound budget the user controls here.
                    const nextNonCompound = Math.max(0, (Number(v) || 0) - compoundMonthlyTotal);
                    setCustomMonthly(nextNonCompound);
                  }}
                  placeholder="500"
                />
                {compoundMonthlyTotal > 0 && (
                  <div className="invest-top-readout-hint" style={{ marginTop: 6 }}>
                    {fmtUSD0(compoundMonthlyTotal)} from compound investments
                    {customMonthly > 0 && <> · {fmtUSD0(customMonthly)} extra to allocate</>}
                  </div>
                )}
              </>
            ) : (
              <>
                <div className="invest-top-readout">
                  {fmtUSD0(totalMonthlyInvested)}<span className="invest-top-readout-sub">/mo</span>
                </div>
                {compoundMonthlyTotal > 0 && (
                  <div className="invest-top-readout-hint" style={{ marginTop: 6 }}>
                    {fmtUSD0(budget?.totals?.monthlyLeftover || 0)} budget surplus + {fmtUSD0(compoundMonthlyTotal)} compound
                  </div>
                )}
              </>
            )}
          </div>
          <div className="invest-top-block">
            <div className="invest-top-eyebrow">Return rate entry</div>
            <Segment
              value={rateMode}
              onChange={setRateMode}
              options={[
                { value: "annual",  label: "Annual %" },
                { value: "monthly", label: "Monthly %" },
              ]}
            />
            <div className="invest-top-readout-hint">
              Used for every investment below — you can also override per investment.
            </div>
          </div>
        </div>
      </section>

      <div className="layout">
        <aside className="col-inputs">
          <PortfolioEditor
            portfolio={portfolio}
            setPortfolio={setPortfolio}
            rateMode={rateMode}
            totalMonthly={fundingMode === "custom" ? customMonthly : (budget?.totals?.monthlyLeftover || 0)}
          />

          <section className="card">
            <header className="card-head">
              <h2>Time horizon</h2>
              <div className="years-segment" style={{ marginLeft: "auto" }}>
                <button
                  className={"years-btn" + (horizonUnit === "years" ? " is-active" : "")}
                  onClick={() => setHorizonUnit("years")}
                >Years</button>
                <button
                  className={"years-btn" + (horizonUnit === "months" ? " is-active" : "")}
                  onClick={() => setHorizonUnit("months")}
                >Months</button>
              </div>
            </header>

          <div className="kpi-grid">

// ─── Compound interest calculator ────────────────────────────────────────
// Self-contained widget: monthly contribution + monthly compounding.
// Lives at the bottom of the Savings & Investing page so it's discoverable
// without cluttering the main portfolio editor.
function CompoundCalculator() {
  const [open,           setOpen]           = useStateInvest(true);
  const [starting,       setStarting]       = useStateInvest(0);
  const [monthly,        setMonthly]        = useStateInvest(500);
  const [rateMode,       setRateMode]       = useStateInvest("annual"); // "annual" | "monthly"
  const [annualRate,     setAnnualRate]     = useStateInvest(8);        // percent
  const [monthlyRate,    setMonthlyRate]    = useStateInvest(0.6434);   // percent ≈ 8% annual
  const [years,          setYears]          = useStateInvest(20);
  const [contribTiming,  setContribTiming]  = useStateInvest("start");  // "start" | "end" of month
  const [view,           setView]           = useStateInvest("yearly"); // "yearly" | "monthly"

  // Hydrate / persist
  useEffectInvest(() => {
    try {
      const s = JSON.parse(localStorage.getItem("ledger:compound") || "null");
      if (s) {
        s.starting       != null && setStarting(s.starting);
        s.monthly        != null && setMonthly(s.monthly);
        s.rateMode       && setRateMode(s.rateMode);
        s.annualRate     != null && setAnnualRate(s.annualRate);
        s.monthlyRate    != null && setMonthlyRate(s.monthlyRate);
        s.years          != null && setYears(s.years);
        s.contribTiming  && setContribTiming(s.contribTiming);
      }
    } catch {}
  }, []);
  useEffectInvest(() => {
    localStorage.setItem("ledger:compound", JSON.stringify({
      starting, monthly, rateMode, annualRate, monthlyRate, years, contribTiming,
    }));
  }, [starting, monthly, rateMode, annualRate, monthlyRate, years, contribTiming]);

  // Effective monthly rate (decimal). When entering an annual rate we convert
  // assuming monthly compounding: (1 + r_annual)^(1/12) − 1.
  const effMonthlyRate = rateMode === "annual"
    ? Math.pow(1 + (annualRate || 0) / 100, 1 / 12) - 1
    : (monthlyRate || 0) / 100;
  // Display equivalents — keep both rate modes in sync visually
  const equivAnnualPct  = rateMode === "monthly" ? (Math.pow(1 + (monthlyRate || 0) / 100, 12) - 1) * 100 : annualRate;
  const equivMonthlyPct = rateMode === "annual"  ? effMonthlyRate * 100 : monthlyRate;

  // Month-by-month projection. Loop body runs in INTEGER CENTS to eliminate
  // float drift over hundreds of iterations. Only converts back to dollars
  // when assembling row objects for the UI.
  const monthRows = useMemoInvest(() => {
    const totalMonths = Math.max(1, Math.round((years || 0) * 12));
    const rows = [];
    let balCents = toCents(Number(starting) || 0);
    let contributedCents = toCents(Number(starting) || 0);
    const monthlyCents = toCents(Number(monthly) || 0);
    const r = effMonthlyRate; // float — multiplied into integer balance
    for (let m = 1; m <= totalMonths; m++) {
      if (contribTiming === "start") {
        balCents += monthlyCents;
        contributedCents += monthlyCents;
        // Multiply by (1+r) then re-snap to integer cents (Math.round)
        balCents = Math.round(balCents * (1 + r));
      } else {
        balCents = Math.round(balCents * (1 + r));
        balCents += monthlyCents;
        contributedCents += monthlyCents;
      }
      // Clamp to prevent overflow on absurd inputs
      const balDollars = toDollars(balCents);
      const safeDollars = safeBal(balDollars);
      const contribDollars = toDollars(contributedCents);
      rows.push({
        m,
        year: Math.ceil(m / 12),
        balance: safeDollars,
        contributed: contribDollars,
        interest: safeDollars - contribDollars,
      });
    }
    return rows;
  }, [starting, monthly, effMonthlyRate, years, contribTiming]);

  // Year-end snapshots (12, 24, 36, ...). Always include the final month if it isn't a year-end.
  const yearRows = useMemoInvest(() => {
    const out = [];
    monthRows.forEach((r) => {
      if (r.m % 12 === 0) out.push(r);
    });
    const last = monthRows[monthRows.length - 1];
    if (last && (last.m % 12 !== 0)) out.push(last);
    return out;
  }, [monthRows]);

  const final = monthRows[monthRows.length - 1] || { balance: 0, contributed: 0, interest: 0 };
  const startVal = Number(starting) || 0;
  const totalDeposits = final.contributed - startVal; // contributions only (excl. starting balance)
  const growthPct = final.contributed > 0 ? (final.interest / final.contributed) * 100 : 0;

  // Simple-interest comparison: no compounding, same contributions
  const simpleFinal = useMemoInvest(() => {
    const totalMonths = Math.max(1, Math.round((years || 0) * 12));
    // simple interest on average balance — rough but useful as a reference line
    const totalContrib = startVal + (Number(monthly) || 0) * totalMonths;
    const avgBal = (startVal + totalContrib) / 2;
    const annualR = Math.pow(1 + effMonthlyRate, 12) - 1;
    const simpleInterest = avgBal * annualR * (years || 0);
    return totalContrib + simpleInterest;
  }, [starting, monthly, effMonthlyRate, years]);
  const compoundingBonus = final.balance - simpleFinal;

  return (
    <section className={"card" + (open ? "" : " is-collapsed")} style={{ marginTop: 24 }}>
      <header
        className="card-head"
        style={{ cursor: "pointer" }}
        onClick={() => setOpen((v) => !v)}
      >
        <h2 style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <span className={"debt-card-chevron" + (open ? " is-open" : "")} style={{ pointerEvents: "none" }} aria-hidden="true">▾</span>
          Compound interest calculator
        </h2>
        {open ? (
          <span className="card-tag">Monthly contribution · monthly compounding</span>
        ) : (
          <span className="card-tag">
            {fmtUSD0(monthly)}/mo · {(rateMode === "annual" ? annualRate : equivAnnualPct).toFixed(1)}%/yr · {years}y → {fmtUSD0(final.balance)}
          </span>
        )}
      </header>
      {open && <div className="card-body">
        <div className="compound-grid">
          {/* ─── Inputs column ───────────────────────────────────────── */}
          <div className="compound-inputs">
            <Field label="Starting balance" hint="lump sum on day 1 (optional)">
              <Money value={starting} onChange={(v) => setStarting(Math.max(0, Number(v) || 0))} placeholder="0" />
            </Field>

            <Field label="Monthly contribution" hint="added every month">
              <Money value={monthly} onChange={(v) => setMonthly(Math.max(0, Number(v) || 0))} placeholder="500" />
            </Field>

            <Field
              label="Return rate"
              hint={`≈ ${equivAnnualPct.toFixed(2)}% annual · ${equivMonthlyPct.toFixed(4)}% monthly`}
            >
              <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                <Segment value={rateMode} onChange={setRateMode}
                  options={[
                    { value: "annual",  label: "Annual %" },
                    { value: "monthly", label: "Monthly %" },
                  ]} />
                {rateMode === "annual" ? (
                  <NumberInput
                    value={annualRate}
                    onChange={(v) => setAnnualRate(Math.max(0, Number(v) || 0))}
                    suffix="% / yr"
                  />
                ) : (
                  <NumberInput
                    value={monthlyRate}
                    onChange={(v) => setMonthlyRate(Math.max(0, Number(v) || 0))}
                    suffix="% / mo"
                  />
                )}
              </div>
            </Field>

            <Field label="Time horizon" hint={`${years} year${years === 1 ? "" : "s"} · ${years * 12} months`}>
              <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                <NumberInput
                  value={years}
                  onChange={(v) => setYears(Math.max(1, Math.min(60, Math.round(Number(v) || 1))))}
                  suffix="yr"
                />
                <input type="range" min={1} max={50} step={1} value={Math.min(50, years)}
                  onChange={(e) => setYears(parseInt(e.target.value))}
                  style={{ width: "100%" }} />
              </div>
            </Field>

            <Field
              label="Contribute at"
              hint="Start = annuity due (deposit earns that month's interest)"
            >
              <Segment value={contribTiming} onChange={setContribTiming}
                options={[
                  { value: "start", label: "Start of month" },
                  { value: "end",   label: "End of month" },
                ]} />
            </Field>
          </div>

          {/* ─── Output summary ──────────────────────────────────────── */}
          <div className="compound-output">
            <div className="compound-final">
              <div className="compound-final-label">After {years} years</div>
              <div className="compound-final-value">{fmtUSD0(final.balance)}</div>
              <div className="compound-final-sub">
                = {fmtUSD0(final.contributed)} contributed + <span className="pos">{fmtUSD0(final.interest)} interest</span>
              </div>
            </div>

            <div className="compound-stats">
              <div className="compound-stat">
                <div className="compound-stat-label">Total deposits</div>
                <div className="compound-stat-value">{fmtUSD0(totalDeposits)}</div>
                <div className="compound-stat-sub">{fmtUSD0(monthly)}/mo × {Math.round(years * 12)} mo</div>
              </div>
              <div className="compound-stat">
                <div className="compound-stat-label">Interest earned</div>
                <div className="compound-stat-value pos">{fmtUSD0(final.interest)}</div>
                <div className="compound-stat-sub">{growthPct.toFixed(1)}% of contributions</div>
              </div>
              <div className="compound-stat">
                <div className="compound-stat-label">Compounding bonus</div>
                <div className="compound-stat-value pos">{fmtUSD0(Math.max(0, compoundingBonus))}</div>
                <div className="compound-stat-sub">vs. simple interest</div>
              </div>
              <div className="compound-stat">
                <div className="compound-stat-label">Effective annual</div>
                <div className="compound-stat-value">{equivAnnualPct.toFixed(2)}%</div>
                <div className="compound-stat-sub">{equivMonthlyPct.toFixed(4)}%/mo</div>
              </div>
            </div>

            {/* Stacked area: contributions (cool) vs interest (warm) */}
            <CompoundChart rows={yearRows} />
          </div>
        </div>

        {/* Year-by-year (or month-by-month) breakdown */}
        <div className="compound-table-wrap">
          <div className="page-head-actions" style={{ marginBottom: 8 }}>
            <h3 className="sub-head" style={{ margin: 0 }}>Breakdown</h3>
            <div className="view-toggle" style={{ marginLeft: "auto" }}>
              <Segment value={view} onChange={setView}
                options={[
                  { value: "yearly",  label: "Yearly" },
                  { value: "monthly", label: "Monthly" },
                ]} />
            </div>
          </div>
          <div className="table-scroll">
            <table className="ptable">
              <thead>
                <tr>
                  <th>{view === "monthly" ? "Month" : "Year"}</th>
                  <th className="num">Contributed</th>
                  <th className="num">Interest</th>
                  <th className="num">Balance</th>
                </tr>
              </thead>
              <tbody>
                {(view === "monthly" ? monthRows : yearRows).map((r) => (
                  <tr key={r.m}>
                    <td>{view === "monthly" ? `Month ${r.m}` : `Year ${r.year}`}</td>
                    <td className="num">{fmtUSD0(r.contributed)}</td>
                    <td className="num pos">{fmtUSD0(r.interest)}</td>
                    <td className="num"><strong>{fmtUSD0(r.balance)}</strong></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <p className="footnote">
            Formula: each month the balance grows by the effective monthly rate, then ({contribTiming === "start" ? "before" : "after"}) we add this month's contribution.
            Reinvested interest compounds — that's what "compounding bonus" measures vs. flat simple interest.
          </p>
        </div>
      </div>}
    </section>
  );
}

// Stacked bar chart for the compound calculator — contributions (gold) vs.
// interest (green). Includes a Y-axis scale (max / mid / 0) so users
// can read absolute values, plus value labels above the final bar.
function CompoundChart({ rows }) {
  if (!rows || rows.length === 0) return null;
  const max = Math.max(...rows.map((r) => r.balance)) || 1;
  // Friendly Y-axis number formatter so $1,000,000 doesn't crowd the gutter
  const fmtAxis = (v) => {
    if (v >= 1_000_000) return "$" + (v / 1_000_000).toFixed(v >= 10_000_000 ? 0 : 1) + "M";
    if (v >= 1_000)     return "$" + Math.round(v / 1000) + "k";
    return "$" + Math.round(v);
  };
  return (
    <div style={{ marginTop: 16 }}>
      <div style={{ display: "flex", gap: 8 }}>
        {/* Y-axis scale gutter — gives the user a reference for how big the bars are */}
        <div style={{
          display: "flex", flexDirection: "column", justifyContent: "space-between",
          height: 180, paddingTop: 4, paddingBottom: 24,
          fontSize: 10, color: "var(--ink-3)", fontFamily: "var(--mono)",
          textAlign: "right", minWidth: 42,
        }}>
          <span>{fmtAxis(max)}</span>
          <span>{fmtAxis(max * 0.5)}</span>
          <span>$0</span>
        </div>
        {/* Bars */}
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{
            height: 180,
            display: "grid",
            gridTemplateColumns: `repeat(${rows.length}, minmax(0, 1fr))`,
            gap: rows.length > 20 ? 1 : 3,
            alignItems: "end",
            paddingBottom: 24, // room for x-axis labels
            borderBottom: "1px solid var(--border)",
            position: "relative",
          }}>
            {/* Horizontal gridlines at 50% */}
            <div style={{ position: "absolute", left: 0, right: 0, top: "50%", borderTop: "1px dashed var(--border)", pointerEvents: "none" }} />
            {rows.map((r, i) => {
              const contribH  = (r.contributed / max) * 100;
              const interestH = (r.interest    / max) * 100;
              const isLast    = i === rows.length - 1;
              return (
                <div key={i} style={{ display: "flex", flexDirection: "column", justifyContent: "flex-end", height: "100%", position: "relative" }}
                     title={`Year ${r.year}: ${fmtUSD0(r.balance)} (= ${fmtUSD0(r.contributed)} + ${fmtUSD0(r.interest)})`}>
                  {/* Value label on the final bar */}
                  {isLast && (
                    <div style={{
                      position: "absolute", bottom: `calc(${contribH + interestH}% + 4px)`,
                      left: "50%", transform: "translateX(-50%)",
                      fontSize: 10, fontFamily: "var(--display)",
                      color: "var(--accent-2)", whiteSpace: "nowrap",
                    }}>
                      {fmtAxis(r.balance)}
                    </div>
                  )}
                  <div style={{ height: `${interestH}%`, background: "var(--accent)", borderTopLeftRadius: 2, borderTopRightRadius: 2, minHeight: r.interest > 0 ? 1 : 0 }} />
                  <div style={{ height: `${contribH}%`,  background: "var(--gold)",  minHeight: r.contributed > 0 ? 1 : 0 }} />
                </div>
              );
            })}
          </div>
          {/* X-axis labels: show year for every bar if ≤10, otherwise every Nth */}
          <div style={{
            display: "grid",
            gridTemplateColumns: `repeat(${rows.length}, minmax(0, 1fr))`,
            gap: rows.length > 20 ? 1 : 3,
            fontSize: 10, color: "var(--ink-3)",
            textAlign: "center", marginTop: 4,
          }}>
            {rows.map((r, i) => {
              const stride = rows.length <= 10 ? 1 : Math.ceil(rows.length / 8);
              const show = i % stride === 0 || i === rows.length - 1;
              return <span key={i}>{show ? `Y${r.year}` : ""}</span>;
            })}
          </div>
        </div>
      </div>
      <div style={{ display: "flex", gap: 16, marginTop: 8, fontSize: 11, color: "var(--ink-3)" }}>
        <span><span style={{ display: "inline-block", width: 10, height: 10, background: "var(--gold)", marginRight: 4, verticalAlign: "middle" }} />Contributions</span>
        <span><span style={{ display: "inline-block", width: 10, height: 10, background: "var(--accent)", marginRight: 4, verticalAlign: "middle" }} />Interest (compounded)</span>
      </div>
    </div>
  );
}

function GrowthChart({ rows, portfolio }) {
  if (!rows || rows.length === 0) return null;
  const max = Math.max(...rows.map((r) => r.netWorth)) || 1;
  return (
    <div style={{ height: 220, display: "grid", gridTemplateColumns: `repeat(${rows.length}, 1fr)`, gap: rows.length > 15 ? 2 : 6, alignItems: "end", paddingBottom: 8, borderBottom: "1px solid var(--border)" }}>
      {rows.map((r, idx) => {
        const total = r.netWorth || 0.0001;
        const totH = (total / max) * 100;
        // Stack: emergency, reserve, then each investment
        const segs = [
          { val: r.cash.emergency, color: "#C9A96E" },
          { val: r.cash.reserve,   color: "#5A8FA3" },
          ...r.investments.map((inv, i) => ({
            val: inv.balance,
            color: INVEST_COLORS[i % INVEST_COLORS.length],
          })),
        ];
        return (
          <div key={idx} style={{ display: "flex", flexDirection: "column", justifyContent: "flex-end", height: "100%" }} title={`${r.year || r.label}: ${fmtUSD0(r.netWorth)}`}>
            {segs.map((s, i) => (
              <div key={i} style={{
                background: s.color,
                height: ((s.val / total) * totH) + "%",
                borderRadius: i === segs.length - 1 ? "3px 3px 0 0" : 0,
              }} />
            ))}
          </div>
        );
      })}
    </div>
  );
}

// Recharts-powered animated stacked area chart of each investment + cash bucket
// over time. Draws in on mount/data change, with a hover tooltip showing every
// series value at the hovered period.
function InvestmentGrowthAreaChart({ rows, portfolio, view }) {
  const R = window.Recharts;
  if (!R || !rows || rows.length === 0) return null;
  const { ResponsiveContainer, AreaChart, Area, XAxis, YAxis, CartesianGrid, Tooltip } = R;

  // Flatten rows into Recharts-friendly format. Each datum has one key per series.
  const data = rows.map((r) => {
    const obj = {
      label: r.label || String(r.year),
      Emergency: r.cash.emergency,
      Reserve: r.cash.reserve,
    };
    r.investments.forEach((inv) => { obj[inv.name] = inv.balance; });
    return obj;
  });

  const series = [
    { name: "Emergency", color: "#C9A96E" },
    { name: "Reserve",   color: "#5A8FA3" },
    ...portfolio.investments.map((inv, i) => ({
      name: inv.name,
      color: INVEST_COLORS[i % INVEST_COLORS.length],
    })),
  ].filter((s) => data.some((d) => (d[s.name] || 0) > 0));

  // Tighter X-axis label density for long monthly views
  const tickInterval = data.length > 24 ? Math.ceil(data.length / 12) : 0;
  const yTickFmt = (v) => {
    if (v >= 1_000_000) return "$" + (v / 1_000_000).toFixed(1) + "M";
    if (v >= 1_000)     return "$" + Math.round(v / 1000) + "k";
    return "$" + Math.round(v);
  };

  // Custom tooltip — dark themed, ordered by descending value at that point.
  function ChartTooltip({ active, payload, label }) {
    if (!active || !payload || payload.length === 0) return null;
    const total = payload.reduce((a, b) => a + (b.value || 0), 0);
    const sorted = [...payload].sort((a, b) => (b.value || 0) - (a.value || 0));
    return (
      <div style={{
        background: "rgba(19, 26, 23, 0.95)",
        border: "1px solid #2A3530",
        borderRadius: 8,
        padding: "10px 12px",
        fontSize: 12,
        minWidth: 200,
        boxShadow: "0 6px 20px rgba(0,0,0,0.4)",
        fontFamily: "var(--display)",
      }}>
        <div style={{ color: "#B8C4BC", marginBottom: 6, fontWeight: 500 }}>{label}</div>
        {sorted.map((p) => (
          <div key={p.dataKey} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, padding: "2px 0" }}>
            <span style={{ display: "inline-flex", alignItems: "center", gap: 6, color: "#E8EFE9" }}>
              <span style={{ width: 8, height: 8, borderRadius: 2, background: p.color, display: "inline-block" }} />
              {p.dataKey}
            </span>
            <span style={{ color: "#E8EFE9", fontFeatureSettings: '"tnum"' }}>{fmtUSD0(p.value || 0)}</span>
          </div>
        ))}
        <div style={{ marginTop: 6, paddingTop: 6, borderTop: "1px solid #2A3530", display: "flex", justifyContent: "space-between", color: "#4DA77A", fontWeight: 500 }}>
          <span>Total</span><span>{fmtUSD0(total)}</span>
        </div>
      </div>
    );
  }

  return (
    <div className="invest-chart-wrap">
      <ResponsiveContainer width="100%" height={320}>
        <AreaChart data={data} margin={{ top: 16, right: 20, left: 4, bottom: 4 }}>
          <defs>
            {series.map((s, i) => (
              <linearGradient key={s.name} id={`igrad-${i}`} x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%"   stopColor={s.color} stopOpacity={0.75} />
                <stop offset="100%" stopColor={s.color} stopOpacity={0.15} />
              </linearGradient>
            ))}
          </defs>
          <CartesianGrid strokeDasharray="2 4" stroke="#2A3530" vertical={false} />
          <XAxis
            dataKey="label"
            stroke="#7A8881"
            tick={{ fontSize: 10.5, fill: "#7A8881" }}
            tickLine={false}
            axisLine={{ stroke: "#2A3530" }}
            interval={tickInterval}
          />
          <YAxis
            stroke="#7A8881"
            tick={{ fontSize: 10.5, fill: "#7A8881" }}
            tickLine={false}
            axisLine={{ stroke: "#2A3530" }}
            tickFormatter={yTickFmt}
            width={56}
          />
          <Tooltip
            content={<ChartTooltip />}
            cursor={{ stroke: "#4DA77A", strokeWidth: 1, strokeDasharray: "3 3" }}
          />
          {series.map((s, i) => (
            <Area
              key={s.name}
              type="monotone"
              dataKey={s.name}
              stackId="1"
              stroke={s.color}
              strokeWidth={1.5}
              fill={`url(#igrad-${i})`}
              fillOpacity={1}
              isAnimationActive={true}
              animationDuration={1200}
              animationEasing="ease-out"
            />
          ))}
        </AreaChart>
      </ResponsiveContainer>
    </div>
  );
}

window.InvestingCalculator = InvestingCalculator;
window.InvestmentGrowthAreaChart = InvestmentGrowthAreaChart;

</script>

<script type="text/babel" data-presets="react">
// Quick tax estimator — salary + state + filing -> federal/state/FICA breakdown.
const { useState: useStateTax, useMemo: useMemoTax, useEffect: useEffectTax } = React;

function TaxEstimator({ profile, setProfile }) {
  const inputs = profile;
  const setInputs = (updater) => setProfile((p) => typeof updater === "function" ? updater(p) : { ...p, ...updater });
  const upd = (k, v) => setInputs((s) => ({ ...s, [k]: v }));
  const updMulti = (patch) => setInputs((s) => ({ ...s, ...patch }));
  const tax = useMemoTax(() => computeTaxes(inputs), [inputs]);
  React.useEffect(() => {
    window.__ledgerData = { ...(window.__ledgerData || {}), profile: inputs, tax };
  });
  const monthlyTakeHome = tax.takeHome / 12;
  const biweekly = tax.takeHome / 26;
  const [incomeOpen, setIncomeOpen] = useStateTax(true);

  // Marginal bracket
  const brackets = FEDERAL_BRACKETS_2025[inputs.filing];
  const marginal = useMemoTax(() => {
    let prev = 0;
    for (const [cap, rate] of brackets) {
      if (tax.taxable <= cap) return { rate, cap, prev };
      prev = cap;
    }
    return { rate: brackets[brackets.length - 1][1], cap: Infinity, prev: brackets[brackets.length - 2][0] };
  }, [tax.taxable, inputs.filing]);

  return (
    <>
      <header className="page-head">
        <div>
          <h1 className="page-title">Tax <em>estimator</em></h1>
        </div>
        <div className="page-head-right">
          <div className="page-head-actions">
            <ExportButton calculatorName="Tax estimator" />
          </div>
          <div className="page-sub">2025 federal brackets + state + FICA</div>
        </div>
      </header>

      <div className="layout">
        <aside className="col-inputs">
          <section className={"card" + (incomeOpen ? "" : " is-collapsed")}>
            <header
              className="card-head"
              style={{ cursor: "pointer" }}
              onClick={() => setIncomeOpen((v) => !v)}
            >
              <h2 style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <span className={"debt-card-chevron" + (incomeOpen ? " is-open" : "")} style={{ pointerEvents: "none" }} aria-hidden="true">▾</span>
                Income & location
              </h2>
              {!incomeOpen && (
                <span className="card-tag">
                  ${(inputs.salary || 0).toLocaleString()}/yr · {inputs.city || inputs.state}
                </span>
              )}
            </header>
            {incomeOpen && <div className="card-body stack">
              <Field label="Annual salary" hint="gross, pre-tax">
                <Money value={inputs.salary} onChange={(v) => upd("salary", v)} placeholder="85,000" />
              </Field>
              <Field label="Annual bonus" hint="optional, gross">
                <Money value={inputs.bonus || 0} onChange={(v) => upd("bonus", v)} placeholder="0" />
              </Field>
              <Field label="Additional income" hint={inputs.additionalIncomeLabel ? inputs.additionalIncomeLabel : "freelance, side gig, rental, etc."}>
                <Money value={inputs.additionalIncome || 0} onChange={(v) => upd("additionalIncome", v)} placeholder="0" />
              </Field>
              <Field label="Filing status">
                <Segment
                  value={inputs.filing}
                  onChange={(v) => upd("filing", v)}
                  options={[
                    { value: "single",  label: "Single" },
                    { value: "married", label: "Married, joint" },
                  ]}
                />
              </Field>
              <Field label="City" hint="type to search">
                <CityAutocomplete
                  city={inputs.city}
                  state={inputs.state}
                  onChange={updMulti}
                />
              </Field>
              <Field label="State">
                <select className="select" value={inputs.state} onChange={(e) => upd("state", e.target.value)}>
                  {Object.entries(STATE_NAMES)
                    .sort((a, b) => a[1].localeCompare(b[1]))
                    .map(([code, name]) => <option key={code} value={code}>{name}</option>)}
                </select>
              </Field>
              <Toggle
                value={!!inputs.ficaExempt}
                onChange={(v) => upd("ficaExempt", v)}
                label="FICA exempt"
                hint="F-1 / J-1 non-resident students & scholars"
              />
            </div>}
          </section>
        </aside>

        <section className="col-results">
          <section className="hero-card">
            <div className="hero-grid">
              <div className="hero-block">
                <div className="hero-eyebrow">Annual take-home</div>
                <div className="hero-num">{fmtUSD0(tax.takeHome)}</div>
                <div className="hero-sub">{fmtPct(tax.effectiveRate)} effective rate</div>
              </div>
              <div className="hero-divider" />
              <div className="hero-block">
                <div className="hero-eyebrow">Per paycheck (bi-weekly)</div>
                <div className="hero-num">{fmtUSD0(biweekly)}</div>
                <div className="hero-sub">{fmtUSD0(monthlyTakeHome)} monthly · {fmtPct(marginal.rate, 0)} top marginal</div>
              </div>
            </div>
          </section>

          <div className="kpi-grid">
            <div className="kpi">
              <div className="kpi-eyebrow">Federal</div>
              <div className="kpi-num">{fmtUSD0(tax.federal)}</div>
              <div className="kpi-sub">{fmtPct(tax.federal / tax.gross)} of gross</div>
            </div>
            <div className="kpi">
              <div className="kpi-eyebrow">State{tax.stateRate ? ` · ${fmtPct(tax.stateRate)}` : ""}</div>
              <div className="kpi-num">{fmtUSD0(tax.stateTax + tax.cityTax)}</div>
              <div className="kpi-sub">
                {tax.cityTax > 0 ? `incl. ${fmtUSD0(tax.cityTax)} local` : (tax.stateRate ? "state only" : "no state income tax")}
              </div>
            </div>
            <div className="kpi">
              <div className="kpi-eyebrow">FICA</div>
              <div className="kpi-num">{fmtUSD0(tax.fica)}</div>
              <div className="kpi-sub">{fmtUSD0(tax.ss)} SS · {fmtUSD0(tax.medicare + tax.addlMedicare)} Medicare</div>
            </div>
          </div>

          <section className="card">
            <header className="card-head">
              <h2>Federal bracket walk</h2>
              <span className="card-tag">
                Taxable: {fmtUSD0(tax.taxable)}
              </span>
            </header>
            <div className="card-body">
              <BracketWalk taxable={tax.taxable} brackets={brackets} />
              <p className="footnote">
                Standard deduction of {fmtUSD0(tax.standardDeduction)} is subtracted from your gross before brackets are applied.
                Each row shows how much income falls in that bracket and what it owes.
              </p>
            </div>
          </section>

          <section className="card">
            <header className="card-head"><h2>Where every dollar goes</h2></header>
            <div className="card-body">
              <DollarBar tax={tax} />
            </div>
          </section>
        </section>
      </div>
    </>
  );
}

function BracketWalk({ taxable, brackets }) {
  let prev = 0;
  const rows = [];
  for (const [cap, rate] of brackets) {
    const inThisBracket = Math.max(0, Math.min(taxable, cap) - prev);
    rows.push({
      from: prev, to: cap, rate,
      inBracket: inThisBracket,
      owed: inThisBracket * rate,
      active: taxable > prev,
    });
    prev = cap;
    if (taxable <= cap) break;
  }
  return (
    <table className="ptable">
      <thead>
        <tr>
          <th>Bracket</th>
          <th className="num">Rate</th>
          <th className="num">Your income here</th>
          <th className="num">Tax owed</th>
        </tr>
      </thead>
      <tbody>
        {rows.map((r, i) => (
          <tr key={i} style={{ opacity: r.active ? 1 : 0.4 }}>
            <td>
              {fmtUSD0(r.from)} – {r.to === Infinity ? "∞" : fmtUSD0(r.to)}
            </td>
            <td className="num">{fmtPct(r.rate, 0)}</td>
            <td className="num">{fmtUSD0(r.inBracket)}</td>
            <td className="num">{fmtUSD0(r.owed)}</td>
          </tr>
        ))}
      </tbody>
    </table>
  );
}

function DollarBar({ tax }) {
  const total = tax.gross || 1;
  const parts = [
    { label: "Take-home", value: tax.takeHome, color: "var(--accent-2)" },
    { label: "Federal",   value: tax.federal,  color: "#C9A96E" },
    { label: "State + local", value: tax.stateTax + tax.cityTax, color: "#7B6E55" },
    { label: "FICA",      value: tax.fica,     color: "#5A8FA3" },
  ];
  return (
    <>
      <div className="stack-bar" style={{ height: 18 }}>
        {parts.map((p, i) => (
          <div key={i} style={{ width: (p.value / total * 100) + "%", background: p.color }} title={`${p.label}: ${fmtUSD0(p.value)}`} />
        ))}
      </div>
      <ul className="legend" style={{ marginTop: 14 }}>
        {parts.map((p, i) => (
          <li key={i}>
            <span className="legend-dot" style={{ background: p.color }} />
            <span className="legend-label">{p.label}</span>
            <span className="legend-val">
              {fmtUSD0(p.value)}
              <span className="legend-pct"> · {fmtPct(p.value / total, 1)}</span>
            </span>
          </li>
        ))}
      </ul>
    </>
  );
}

window.TaxEstimator = TaxEstimator;

</script>
