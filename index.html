};

const FONT_OPTIONS = {
  serif:   { name: "Source Serif", display: '"Source Serif 4", Georgia, serif' },
  modern:  { name: "Newsreader",   display: '"Newsreader", Georgia, serif' },
  display: { name: "Instrument",   display: '"Instrument Serif", Georgia, serif' },
};

const THEME_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "forest",
  "displayFont": "serif",
  "accentOverride": ""
}/*EDITMODE-END*/;

function applyTheme(themeKey, accentOverride, fontKey) {
  const t = THEMES[themeKey] || THEMES.forest;
  const root = document.documentElement;
  for (const [k, v] of Object.entries(t.vars)) {
    root.style.setProperty(k, v);
  }
  if (accentOverride && /^#[0-9A-Fa-f]{6}$/.test(accentOverride)) {
    root.style.setProperty("--accent", accentOverride);
    // derive lighter/darker variants
    root.style.setProperty("--accent-2", lighten(accentOverride, 18));
    root.style.setProperty("--accent-dim", darken(accentOverride, 30));
    root.style.setProperty("--accent-bg", darken(accentOverride, 60) + "33");
  }
  const font = FONT_OPTIONS[fontKey] || FONT_OPTIONS.serif;
  root.style.setProperty("--display", font.display);
}

function lighten(hex, pct) { return shiftHex(hex, pct); }
function darken(hex, pct)  { return shiftHex(hex, -pct); }
function shiftHex(hex, pct) {
  const num = parseInt(hex.slice(1), 16);
  let r = (num >> 16) & 0xff;
  let g = (num >> 8)  & 0xff;
  let b = num & 0xff;
  const amt = (pct / 100) * 255;
  r = Math.max(0, Math.min(255, Math.round(r + amt)));
  g = Math.max(0, Math.min(255, Math.round(g + amt)));
  b = Math.max(0, Math.min(255, Math.round(b + amt)));
  return "#" + ((r << 16) | (g << 8) | b).toString(16).padStart(6, "0");
}

function ThemeTweaks() {
  const [t, setTweak] = useTweaks(THEME_DEFAULTS);

  useEffectTheme(() => {
    applyTheme(t.theme, t.accentOverride, t.displayFont);
  }, [t.theme, t.accentOverride, t.displayFont]);

  const themeOptions = Object.entries(THEMES).map(([key, val]) => ({
    value: key,
    label: val.name,
    swatch: val.swatch,
  }));

  return (
    <TweaksPanel title="Theme">
      <TweakSection label="Palette" />
      <div className="theme-grid">
        {themeOptions.map((o) => (
          <button
            key={o.value}
            className={"theme-tile" + (t.theme === o.value ? " is-active" : "")}
            onClick={() => setTweak("theme", o.value)}
            title={o.label}
          >
            <div className="theme-tile-swatches">
              {o.swatch.map((c, i) => (
                <span key={i} className="theme-tile-swatch" style={{ background: c }} />
              ))}
            </div>
            <div className="theme-tile-name">{o.label}</div>
          </button>
        ))}
      </div>

      <TweakSection label="Accent override" />
      <TweakColor
        label="Accent"
        value={t.accentOverride || "#000000"}
        options={["", "#4DA77A", "#D9C38C", "#B85450", "#4FB5B0", "#E8E6E1", "#7A5AE0"]}
        onChange={(v) => setTweak("accentOverride", v === "#000000" ? "" : v)}
      />

      <TweakSection label="Display font" />
      <TweakRadio
        value={t.displayFont}
        options={["serif", "modern", "display"]}
        onChange={(v) => setTweak("displayFont", v)}
      />
    </TweaksPanel>
  );
}

window.ThemeTweaks = ThemeTweaks;
window.applyTheme = applyTheme;
window.THEMES = THEMES;

</script>

<script type="text/babel" data-presets="react">
// Commute & vehicle card: addresses -> driving distance -> monthly gas cost.
// Uses Nominatim + Photon (free, no key) with smart fallbacks. Manual override available.
const { useState: useStateCommute, useMemo: useMemoCommute } = React;

const M_PER_MILE = 1609.344;

// Expand common US street abbreviations so the geocoder finds more matches.
function expandAbbrev(s) {
  return s
    .replace(/\bvlg\b\.?/gi,  "village")
    .replace(/\bblvd\b\.?/gi, "boulevard")
    .replace(/\bst\b\.?/gi,   "street")
    .replace(/\bave\b\.?/gi,  "avenue")
    .replace(/\bdr\b\.?/gi,   "drive")
    .replace(/\bln\b\.?/gi,   "lane")
    .replace(/\brd\b\.?/gi,   "road")
    .replace(/\bct\b\.?/gi,   "court")
    .replace(/\bpl\b\.?/gi,   "place")
    .replace(/\bpkwy\b\.?/gi, "parkway")
    .replace(/\bhwy\b\.?/gi,  "highway")
    .replace(/\bapt\b\.?\s*[\w-]*/gi, "")
    .replace(/\bste\b\.?\s*[\w-]*/gi, "")
    .replace(/\bunit\b\.?\s*[\w-]*/gi, "")
    .replace(/#\s*[\w-]+/g, "")
    .replace(/\s+/g, " ")
    .trim();
}

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

async function nominatimSearch(q) {
  const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=1&countrycodes=us&addressdetails=0`;
  const r = await fetch(url, { headers: { "Accept-Language": "en" } });
  if (!r.ok) return null;
  const data = await r.json();
  if (!data || data.length === 0) return null;
  return { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon), display: data[0].display_name, source: "OSM" };
}

async function photonSearch(q) {
  const url = `https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&limit=1&lang=en`;
  const r = await fetch(url);
  if (!r.ok) return null;
  const data = await r.json();
  const f = data?.features?.[0];
  if (!f) return null;
  const [lon, lat] = f.geometry.coordinates;
  const p = f.properties || {};
  const parts = [p.name, p.street, p.city, p.state, p.postcode].filter(Boolean);
  return { lat, lon, display: parts.join(", ") || (p.name || q), source: "Photon" };
}

// Try a query through multiple geocoders + simplification fallbacks.
async function geocodeWithFallbacks(query) {
  const tried = new Set();
  const candidates = [];

  const add = (q) => {
    const k = q.trim().toLowerCase();
    if (k && !tried.has(k)) { tried.add(k); candidates.push(q.trim()); }
  };

  add(query);
  add(expandAbbrev(query));
  // strip leading unit/door number ("210 Southlake..." -> "Southlake...")
  const noLeadingNum = query.replace(/^\s*\d+[a-z]?\s+/i, "");
  add(noLeadingNum);
  add(expandAbbrev(noLeadingNum));

  for (const q of candidates) {
    const hit = await nominatimSearch(q);
    if (hit) return hit;
    await sleep(1100); // Nominatim usage policy
  }
  // Photon fallback for the strongest candidate
  for (const q of [query, expandAbbrev(query), noLeadingNum].filter(Boolean)) {
    const hit = await photonSearch(q);
    if (hit) return hit;
  }
  throw new Error(`Could not find: "${query}". Try a simpler form, or use "Enter distance manually" below.`);
}

async function osrmRoute(a, b) {
  const url = `https://router.project-osrm.org/route/v1/driving/${a.lon},${a.lat};${b.lon},${b.lat}?overview=false`;
  const r = await fetch(url);
  if (!r.ok) throw new Error(`Routing error (${r.status})`);
  const data = await r.json();
  const route = data?.routes?.[0];
  if (!route) throw new Error("No driving route between those addresses.");
  return { meters: route.distance, seconds: route.duration };
}

async function lookupCommute(home, work, homeCoords, workCoords) {
  const a = homeCoords && Number.isFinite(homeCoords.lat) ? homeCoords : await geocodeWithFallbacks(home);
  if (!homeCoords) await sleep(300);
  const b = workCoords && Number.isFinite(workCoords.lat) ? workCoords : await geocodeWithFallbacks(work);
  const route = await osrmRoute(a, b);
  return {
    oneWayMiles: route.meters / M_PER_MILE,
    driveMinutes: route.seconds / 60,
    homeResolved: a.display || home,
    workResolved: b.display || work,
  };
}

// State avg regular-grade gas prices ($/gal) — used as fallback when online lookup fails.
const GAS_PRICES_BY_STATE = {
  AL: 2.80, AK: 3.65, AZ: 3.55, AR: 2.85, CA: 4.50,
  CO: 3.10, CT: 3.20, DE: 3.15, DC: 3.45, FL: 3.10,
  GA: 3.00, HI: 4.70, ID: 3.45, IL: 3.45, IN: 3.10,
  IA: 3.00, KS: 2.90, KY: 2.95, LA: 2.85, ME: 3.15,
  MD: 3.20, MA: 3.15, MI: 3.15, MN: 3.05, MS: 2.70,
  MO: 2.85, MT: 3.25, NE: 2.95, NV: 3.80, NH: 3.05,
  NJ: 3.15, NM: 3.00, NY: 3.35, NC: 3.00, ND: 3.10,
  OH: 3.05, OK: 2.75, OR: 3.90, PA: 3.35, RI: 3.15,
  SC: 2.90, SD: 3.05, TN: 2.90, TX: 2.80, UT: 3.25,
  VT: 3.25, VA: 3.00, WA: 4.00, WV: 2.95, WI: 3.00, WY: 3.10,
};
const GRADE_OFFSETS = { regular: 0, midgrade: 0.45, premium: 0.70 };
const GRADE_LABELS = { regular: "Regular", midgrade: "Mid-grade", premium: "Premium" };

async function fetchLiveGasPrice(state, grade) {
  if (!window.claude || typeof window.claude.complete !== "function") {
    return { price: (GAS_PRICES_BY_STATE[state] || 3.10) + GRADE_OFFSETS[grade], source: "estimate" };
  }
  try {
    const stateName = (window.STATE_NAMES || {})[state] || state;
    const gradeLabel = grade === "regular" ? "regular unleaded (87 octane)"
                     : grade === "midgrade" ? "mid-grade unleaded (89 octane)"
                     : "premium unleaded (91-93 octane)";
    const reply = await window.claude.complete(
      `What's the current average retail price per gallon for ${gradeLabel} gasoline in the US state of ${stateName}? Respond with ONLY the number in US dollars, like "3.45". No dollar sign, no words, no explanation.`
    );
    const m = String(reply).match(/(\d+\.\d+|\d+)/);
    if (m) {
      const n = parseFloat(m[1]);
      if (n > 1.5 && n < 8) return { price: n, source: "AI lookup" };
    }
  } catch (e) { /* ignore, use fallback */ }
  return { price: (GAS_PRICES_BY_STATE[state] || 3.10) + GRADE_OFFSETS[grade], source: "estimate" };
}

function computeMonthlyGas(commute) {
  // Daily round-trip distance — user can override the auto-computed value from route.
  const dailyRoundTrip = commute.dailyRoundTrip != null && commute.dailyRoundTrip > 0
    ? commute.dailyRoundTrip
    : (commute.oneWayMiles || 0) * 2;
  const dailyTotal = dailyRoundTrip + (commute.extraMilesPerDay || 0);
  const workdays = commute.workdaysPerMonth || 22;
  const mpg = commute.mpg || 1;
  const gasPrice = commute.gasPrice || 0;

  // Core formula:  cost = workdays × (distance / mpg) × gasPrice
  const monthlyMiles = dailyTotal * workdays;
  const gallons = monthlyMiles / mpg;
  const cost = gallons * gasPrice;

  const dailyGallons = dailyTotal / mpg;
  const dailyCost = dailyGallons * gasPrice;
  const dailyMinutes = (commute.driveMinutes || 0) * 2;
  const weekdaysPerWeek = workdays / 4.33;
  const weekly = {
    miles:   dailyTotal * weekdaysPerWeek,
    minutes: dailyMinutes * weekdaysPerWeek,
    cost:    dailyCost * weekdaysPerWeek,
    gallons: (dailyTotal * weekdaysPerWeek) / mpg,
  };
  const monthly = {
    miles:   monthlyMiles,
    minutes: dailyMinutes * workdays,
    cost,
    gallons,
  };
  const yearly = {
    miles:   monthlyMiles * 12,
    minutes: dailyMinutes * workdays * 12,
    cost:    cost * 12,
    gallons: gallons * 12,
  };
  const daily = {
    miles:   dailyTotal,
    minutes: dailyMinutes,
    cost:    dailyCost,
    gallons: dailyGallons,
  };
  return {
    dailyRoundTrip, dailyTotal, dailyGallons, dailyCost, dailyMinutes,
    monthlyMiles, gallons, cost,
    daily, weekly, monthly, yearly,
  };
}

const fmtMins = (m) => {
  if (!m || m <= 0) return "0 min";
  if (m < 60) return Math.round(m) + " min";
  const h = Math.floor(m / 60);
  const rem = Math.round(m % 60);
  return rem === 0 ? `${h}h` : `${h}h ${rem}m`;
};

function CommuteCard({ commute, setCommute, onApplyToGas, userState }) {
  const upd = (patch) => setCommute((c) => ({ ...c, ...patch }));
  const calc = useMemoCommute(() => computeMonthlyGas(commute), [commute]);
  const manualMode = !!commute.manual;

  // Auto-sync computed monthly gas into the budget's Gas expense,
  // AND persist the computed monthly cost back into the commute object
  // so other tabs (Auto) can read budgetData.commute.cost directly.
  React.useEffect(() => {
    if (calc.cost > 0) {
      onApplyToGas(Math.round(calc.cost));
      // Avoid render loop — only write if the stored cost differs
      if (Math.round(calc.cost) !== Math.round(commute.cost || 0)) {
        upd({ cost: Math.round(calc.cost) });
      }
    }
  }, [calc.cost]);

  // Pre-fill the editable daily round-trip when a route is calculated.
  React.useEffect(() => {
    if (commute.status === "ok" && commute.oneWayMiles > 0) {
      const computed = parseFloat((commute.oneWayMiles * 2).toFixed(1));
      if (!commute.dailyRoundTrip || Math.abs(commute.dailyRoundTrip - computed) > 0.2) {
        upd({ dailyRoundTrip: computed });
      }
    }
  }, [commute.oneWayMiles, commute.status]);

  // Auto-fetch today's gas price on mount and when state/grade change
  // (unless the user has manually overridden the price).
  React.useEffect(() => {
    if (commute.gasSource === "manual") return;
    let cancelled = false;
    (async () => {
      upd({ gasLoading: true });
      const res = await fetchLiveGasPrice(userState || "NY", commute.gasGrade || "regular");
      if (cancelled) return;
      upd({
        gasPrice: parseFloat(res.price.toFixed(2)),
        gasSource: res.source,
        gasFetchedAt: new Date().toLocaleDateString("en-US", { month: "short", day: "numeric" }),
        gasLoading: false,
      });
    })();
    return () => { cancelled = true; };
  }, [userState, commute.gasGrade]);

  const doLookup = async () => {
    if (!commute.homeAddr.trim() || !commute.workAddr.trim()) {
      upd({ status: "error", error: "Enter both addresses." });
      return;
    }
    upd({ status: "loading", error: "" });
    try {
      const res = await lookupCommute(
        commute.homeAddr, commute.workAddr,
        commute.homeCoords, commute.workCoords,
      );
      upd({
        status: "ok",
        oneWayMiles: res.oneWayMiles,
        driveMinutes: res.driveMinutes,
        homeResolved: res.homeResolved,
        workResolved: res.workResolved,
        error: "",
      });
    } catch (e) {
      upd({ status: "error", error: e.message || "Lookup failed." });
    }
  };

  const [open, setOpen] = useStateCommute(true);
  return (
    <section className={"card" + (open ? "" : " is-collapsed")}>
      <header
        className="card-head"
        style={{ cursor: "pointer" }}
        onClick={() => setOpen((v) => !v)}
      >
        <h2 style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <span className={"debt-card-chevron" + (open ? " is-open" : "")} style={{ pointerEvents: "none" }} aria-hidden="true">▾</span>
          Commute & vehicle
        </h2>
        {calc.cost > 0 && <span className="card-tag">{fmtUSD0(calc.cost)}/mo gas</span>}
      </header>
      {open && <div className="card-body stack">
        {!manualMode && (
          <>
            <Field label="Home address">
              <AddressAutocomplete
                value={commute.homeAddr}
                onChange={(v, coords) => upd({ homeAddr: v, homeCoords: coords, status: "idle" })}
                placeholder="123 Main St, Buffalo, NY"
              />
            </Field>
            <Field label="Work address">
              <AddressAutocomplete
                value={commute.workAddr}
                onChange={(v, coords) => upd({ workAddr: v, workCoords: coords, status: "idle" })}
                placeholder="Company HQ, Buffalo, NY"
                biasCoords={commute.homeCoords}
              />
            </Field>

            <button
              className="btn-primary"
              onClick={doLookup}
              disabled={commute.status === "loading"}
            >
              {commute.status === "loading" ? "Looking up route…" : "Calculate commute distance"}
            </button>

            {commute.status === "error" && (
              <div className="alert alert-error">{commute.error}</div>
            )}

            {commute.status === "ok" && commute.oneWayMiles > 0 && (
              <>
                <div className="period-toggle">
                  {[["daily","Daily"], ["weekly","Weekly"], ["monthly","Monthly"], ["yearly","Yearly"]].map(([k, label]) => (
                    <button
                      key={k}
                      className={"period-btn" + ((commute.period || "monthly") === k ? " is-active" : "")}
                      onClick={() => upd({ period: k })}
                    >
                      {label}
                    </button>
                  ))}
                </div>

                {(() => {
                  const period = commute.period || "monthly";
                  const p = calc[period] || calc.monthly;
                  const unit = period === "daily" ? "day" : period === "weekly" ? "week" : period === "yearly" ? "year" : "month";
                  return (
                    <>
                      <div className="route-result">
                        <div className="route-stat">
                          <div className="route-stat-num">{p.miles < 100 ? p.miles.toFixed(1) : Math.round(p.miles).toLocaleString()}</div>
                          <div className="route-stat-label">miles / {unit}</div>
                        </div>
                        <div className="route-stat">
                          <div className="route-stat-num">{fmtMins(p.minutes)}</div>
                          <div className="route-stat-label">drive time / {unit}</div>
                        </div>
                        <div className="route-stat">
                          <div className="route-stat-num">{fmtUSD0(p.cost)}</div>
                          <div className="route-stat-label">gas cost / {unit}</div>
                        </div>
                      </div>
                      <div className="route-meta">
                        <span><strong>{p.gallons.toFixed(1)}</strong> gallons / {unit}</span>
                        <span>One way: <strong>{commute.oneWayMiles.toFixed(1)} mi</strong> · {Math.round(commute.driveMinutes)} min</span>
                      </div>
                    </>
                  );
                })()}

                {commute.oneWayMiles > 100 && (
                  <div className="alert alert-warn">
                    <strong>This looks unusually far.</strong> The geocoder may have picked a same-named
                    location far away (check the resolved addresses below). Try one of these:
                    <div style={{ display: "flex", gap: 8, marginTop: 10, flexWrap: "wrap" }}>
                      <button
                        className="btn-link"
                        style={{ color: "var(--accent-2)" }}
                        onClick={() => upd({
                          workAddr: "", workCoords: null,
                          oneWayMiles: 0, driveMinutes: 0,
                          homeResolved: "", workResolved: "",
                          status: "idle", error: "",
                        })}
                      >↻ Clear & re-pick work address</button>
                      <button
                        className="btn-link"
                        style={{ color: "var(--accent-2)" }}
                        onClick={() => upd({ manual: true })}
                      >→ Enter distance manually</button>
                    </div>
                  </div>
                )}

                <div className="route-resolved">
                  <div className="route-resolved-row">
                    <span className="route-resolved-label">FROM</span>
                    <span className="route-resolved-val">{commute.homeResolved || commute.homeAddr}</span>
                  </div>
                  <div className="route-resolved-row">
                    <span className="route-resolved-label">TO</span>
                    <span className="route-resolved-val">{commute.workResolved || commute.workAddr}</span>
                  </div>
                </div>
              </>
            )}

            <button
              className="btn-link"
              onClick={() => upd({ manual: true, status: "idle", error: "" })}
            >
              Can't find your address? → Enter distance manually
            </button>
          </>
        )}

        {manualMode && (
          <>
            <div className="alert alert-info">
              Look up the distance on <a href={`https://www.google.com/maps/dir/${encodeURIComponent(commute.homeAddr || "")}/${encodeURIComponent(commute.workAddr || "")}`} target="_blank" rel="noopener">Google Maps</a> and paste the numbers below.
            </div>
            <div className="row-2">
              <Field label="One-way miles">
                <NumberInput
                  value={commute.oneWayMiles}
                  onChange={(v) => upd({ oneWayMiles: v, status: "ok" })}
                  suffix="mi"
                />
              </Field>
              <Field label="Drive time">
                <NumberInput
                  value={commute.driveMinutes}
                  onChange={(v) => upd({ driveMinutes: v, status: "ok" })}
                  suffix="min"
                />
              </Field>
            </div>
            <button
              className="btn-link"
              onClick={() => upd({ manual: false, status: "idle" })}
            >
              ← Back to address lookup
            </button>
          </>
        )}

        <div className="divider" />

        <Field label="Daily round-trip distance" hint={commute.status === "ok" && commute.oneWayMiles > 0 ? "auto-filled · editable" : "miles you drive to work each day, round trip"}>
          <NumberInput
            value={commute.dailyRoundTrip || 0}
            onChange={(v) => upd({ dailyRoundTrip: v })}
            suffix="mi"
          />
        </Field>

        <Field label="Gas grade">
          <Segment
            value={commute.gasGrade || "regular"}
            onChange={(g) => upd({ gasGrade: g, gasSource: null })}
            options={[
              { value: "regular", label: "Regular" },
              { value: "premium", label: "Premium" },
            ]}
          />
        </Field>

        <div className="row-2">
          <Field
            label="Gas price"
            hint={
              commute.gasLoading ? "looking up…"
              : commute.gasSource === "manual" ? "manual"
              : commute.gasSource === "AI lookup" ? `today · ${commute.gasFetchedAt || ""}`
              : commute.gasSource === "estimate" ? `est. · ${commute.gasFetchedAt || ""}`
              : "$/gal"
            }
          >

        {calc.cost > 0 && (

              </div>

              </div>
              <div className="formula-line formula-eq">
                <span>Total distance / day</span>
                <span className="num">{calc.dailyTotal.toFixed(1)} mi</span>
              </div>
            </div>

            <div className="formula-step">
              <div className="formula-line">
                <span>Gallons / day</span>
                <span className="num">{calc.dailyGallons.toFixed(2)} gal</span>
              </div>
              <div className="formula-hint">
                = {calc.dailyTotal.toFixed(1)} mi ÷ {commute.mpg} mpg
              </div>
            </div>

            <div className="formula-step">
              <div className="formula-line">
                <span>Gas cost / day</span>
                <span className="num">{fmtUSD2(calc.dailyCost)}</span>
              </div>
              <div className="formula-hint">
                = {calc.dailyGallons.toFixed(2)} gal × ${commute.gasPrice}/gal
              </div>
            </div>

            <div className="formula-step formula-total-step">
              <div className="formula-line">
                <span>Monthly gas cost</span>
                <span className="num formula-total">{fmtUSD0(calc.cost)}</span>
              </div>
              <div className="formula-hint">
                = {fmtUSD2(calc.dailyCost)}/day × {commute.workdaysPerMonth} workdays
              </div>
            </div>
          </div>
        )}

        {calc.cost > 0 && (
          <div className="sync-status">
            <span className="sync-check">✓</span>
            <span>Gas expense auto-synced to <strong>{fmtUSD0(calc.cost)}/mo</strong></span>
          </div>
        )}
      </div>}
    </section>
  );
}

<script type="text/babel" data-presets="react">
// Floating AI assistant.
// Calls the Anthropic Messages API directly from the browser using a user-supplied API key
// (no backend required). Falls back to a host-provided `window.claude.complete` bridge if
// one exists (e.g. in the Anthropic design tool that originally hosted this prototype).
const { useState: useStateAI, useEffect: useEffectAI, useRef: useRefAI } = React;

const ANTHROPIC_URL = "https://api.anthropic.com/v1/messages";
const KEY_STORAGE   = "ledger:anthropicKey";
const MODEL_STORAGE = "ledger:anthropicModel";
const DEFAULT_MODEL = "claude-3-5-sonnet-latest";
const MODEL_OPTIONS = [
  { value: "claude-3-5-sonnet-latest", label: "Sonnet (smartest, $)" },
  { value: "claude-3-5-haiku-latest",  label: "Haiku (fast, cheap)"  },
  { value: "claude-3-opus-latest",     label: "Opus (deepest, $$$)"  },
];

const SYSTEM_PROMPT = (ctx) => `You are Ledger's built-in finance assistant. The user is exploring a personal finance calculator. Be warm, concise (2–4 sentences max unless they ask for detail), and use plain language — no jargon. Give specific, actionable answers grounded in the data below. Do NOT recite the data back unless asked. If asked something outside personal finance, briefly redirect.

USER'S CURRENT DATA:
${ctx}`;

function buildContext({ profile, expenses, growth, commute, tax }) {
  const lines = [];
  lines.push(`• Salary: $${profile.salary.toLocaleString()}/yr, ${profile.filing === "married" ? "married filing jointly" : "single"}, in ${profile.city ? profile.city + ", " : ""}${profile.state}`);
  if (tax) {
    lines.push(`• Estimated take-home: $${Math.round(tax.takeHome).toLocaleString()}/yr ($${Math.round(tax.takeHome/12).toLocaleString()}/mo) at ${(tax.effectiveRate*100).toFixed(1)}% effective tax rate`);
    lines.push(`  - Federal $${Math.round(tax.federal).toLocaleString()}, State $${Math.round(tax.stateTax+tax.cityTax).toLocaleString()}, FICA $${Math.round(tax.fica).toLocaleString()}`);
  }
  const totalMo = (window.sumExpenses ? window.sumExpenses(expenses) : Object.values(expenses).filter(v => typeof v === "number").reduce((a,b)=>a+b,0));
  lines.push(`• Monthly expenses ($${Math.round(totalMo).toLocaleString()}/mo total):`);
  lines.push(`  - Rent $${expenses.rent}, Groceries/utilities $${expenses.expenses}, Insurance $${expenses.carIns}, Transportation $${expenses.gas}, Loans $${expenses.otherLoan}`);
  const sec = expenses.secondary || [];
  const subs = expenses.subscriptions || [];
  if (sec.length)  lines.push(`  - Secondary (wants): ${sec.map(i => `${i.name} $${i.amount}`).join(", ")}`);
  if (subs.length) lines.push(`  - Subscriptions: ${subs.map(i => `${i.name} $${i.amount}`).join(", ")}`);
  if (commute && commute.oneWayMiles > 0) {
    lines.push(`• Commute: ${commute.oneWayMiles.toFixed(1)} mi one-way (${Math.round(commute.driveMinutes)} min), ${commute.mpg} mpg, $${commute.gasPrice}/gal, ${commute.workdaysPerMonth} workdays/mo`);
  }
  if (growth) {
    lines.push(`• Growth assumptions: salary +${(growth.salary*100).toFixed(1)}%/yr, rent +${(growth.rent*100).toFixed(1)}%, expenses +${(growth.expenses*100).toFixed(1)}%`);
  }
  if (tax) {
    const leftover = tax.takeHome - totalMo*12;
    lines.push(`• Annual leftover after expenses: $${Math.round(leftover).toLocaleString()} (${leftover>=0?"surplus":"deficit"})`);
  }
  return lines.join("\n");
}

const SUGGESTED = [
  "Am I spending too much on rent?",
  "How much should I save each month?",
  "Can I afford a $30k car?",
  "What's a good emergency fund for me?",
];

// Direct browser call to Anthropic Messages API.
// Requires `anthropic-dangerous-direct-browser-access: true` header — that's the Anthropic-sanctioned
// way to call the API from a browser when you can't run a backend proxy.
async function callAnthropic({ apiKey, model, system, messages }) {
  const r = await fetch(ANTHROPIC_URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({
      model: model || DEFAULT_MODEL,
      max_tokens: 1024,
      system,
      messages,
    }),
  });
  if (!r.ok) {
    let detail = "";
    try { const j = await r.json(); detail = j.error?.message || JSON.stringify(j); } catch {}
    throw new Error(`API ${r.status}: ${detail || r.statusText}`);
  }
  const data = await r.json();
  // content is an array of blocks; pull the first text block
  const textBlock = (data.content || []).find((c) => c.type === "text");
  return textBlock?.text || "(no response)";
}

function AISettings({ open, apiKey, model, onSave, onClose }) {
  const [draftKey, setDraftKey] = useStateAI(apiKey || "");
  const [draftModel, setDraftModel] = useStateAI(model || DEFAULT_MODEL);
  useEffectAI(() => { setDraftKey(apiKey || ""); setDraftModel(model || DEFAULT_MODEL); }, [apiKey, model, open]);
  if (!open) return null;
  return (
    <div className="ai-settings-overlay" onClick={onClose}>
      <div className="ai-settings" onClick={(e) => e.stopPropagation()}>
        <div className="ai-settings-head">
          <h3>Connect to Claude</h3>
          <button className="ai-close" onClick={onClose}>×</button>
        </div>
        <div className="ai-settings-body">
          <p className="ai-settings-explain">
            Paste your Anthropic API key below. The key is stored only in your browser (localStorage)
            and used to call the Claude API directly. Nothing is sent to any other server.
          </p>
          <ol className="ai-settings-steps">
            <li>Go to <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noreferrer">console.anthropic.com → API Keys</a></li>
            <li>Create a key (starts with <code>sk-ant-</code>)</li>
            <li>Paste it below and click Save</li>
          </ol>

          <label className="ai-settings-label">API key</label>
          <input
            type="password"
            className="text-input"
            placeholder="sk-ant-..."
            value={draftKey}
            onChange={(e) => setDraftKey(e.target.value.trim())}
            autoComplete="off"
            spellCheck={false}
          />

          <label className="ai-settings-label" style={{ marginTop: 14 }}>Model</label>
          <select
            className="select"
            value={draftModel}
            onChange={(e) => setDraftModel(e.target.value)}
          >
            {MODEL_OPTIONS.map((m) => (
              <option key={m.value} value={m.value}>{m.label}</option>
            ))}
          </select>

          <div className="ai-settings-warn">
            ⚠ Browser-side keys are visible to anyone who has access to this page. For a personal
            tool on your own machine this is fine; for anything public, use a backend proxy instead.
          </div>

          <div className="ai-settings-actions">
            {apiKey && (
              <button className="btn-ghost" onClick={() => { onSave({ apiKey: "", model: draftModel }); onClose(); }}>
                Forget key
              </button>
            )}
            <button className="btn-primary" onClick={() => { onSave({ apiKey: draftKey, model: draftModel }); onClose(); }}>
              Save
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

function AIAssistant({ getData }) {
  const [open, setOpen] = useStateAI(false);
  const [messages, setMessages] = useStateAI([]);
  const [input, setInput] = useStateAI("");
  const [loading, setLoading] = useStateAI(false);
  const [settingsOpen, setSettingsOpen] = useStateAI(false);
  const [apiKey, setApiKey] = useStateAI(() => { try { return localStorage.getItem(KEY_STORAGE) || ""; } catch { return ""; } });
  const [model, setModel] = useStateAI(() => { try { return localStorage.getItem(MODEL_STORAGE) || DEFAULT_MODEL; } catch { return DEFAULT_MODEL; } });
  const scrollRef = useRefAI(null);
  const inputRef = useRefAI(null);

  useEffectAI(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [messages, loading]);

  useEffectAI(() => {
    if (open && inputRef.current) inputRef.current.focus();
  }, [open]);

  const saveSettings = ({ apiKey: k, model: m }) => {
    setApiKey(k); setModel(m);
    try {
      if (k) localStorage.setItem(KEY_STORAGE, k); else localStorage.removeItem(KEY_STORAGE);
      localStorage.setItem(MODEL_STORAGE, m);
    } catch {}
  };

  // Prefer the host-provided bridge if available (legacy/design-tool mode), otherwise direct API
  const haveHostBridge = typeof window !== "undefined" && window.claude && typeof window.claude.complete === "function";
  const haveKey = !!apiKey;
  const canChat = haveHostBridge || haveKey;

  const send = async (text) => {
    const userText = (text ?? input).trim();
    if (!userText || loading) return;

    if (!canChat) {
      setSettingsOpen(true);
      return;
    }

    const newHistory = [...messages, { role: "user", content: userText }];
    setMessages(newHistory);
    setInput("");
    setLoading(true);

    const ctx = buildContext(getData());

    try {
      let reply;
      if (haveHostBridge) {
        // Legacy bridge format
        const conv = [
          { role: "user",      content: SYSTEM_PROMPT(ctx) },
          { role: "assistant", content: "Got it — what would you like to know?" },
          ...newHistory.map((m) => ({ role: m.role, content: m.content })),
        ];
        reply = await window.claude.complete({ messages: conv });
      } else {
        // Direct Anthropic API call from the browser
        reply = await callAnthropic({
          apiKey,
          model,
          system: SYSTEM_PROMPT(ctx),
          messages: newHistory.map((m) => ({ role: m.role, content: m.content })),
        });
      }
      setMessages([...newHistory, { role: "assistant", content: reply }]);
    } catch (e) {
      const msg = e.message || "unknown error";
      let helpful = msg;
      if (msg.includes("401")) helpful = "API key was rejected (401). Check that you copied the whole key from console.anthropic.com.";
      else if (msg.includes("429")) helpful = "Rate-limited (429). Wait a minute, or you may have hit your monthly spending limit on the console.";
      else if (msg.includes("Failed to fetch")) helpful = "Couldn't reach api.anthropic.com — check your network connection and any blockers (uBlock, corporate proxy, etc.).";
      setMessages([
        ...newHistory,
        { role: "assistant", content: "⚠ " + helpful },
      ]);
    }
    setLoading(false);
  };

  const onKeyDown = (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  };

  return (
    <>
      <button
        className={"ai-fab" + (open ? " is-open" : "")}
        onClick={() => setOpen((o) => !o)}
        title={open ? "Close assistant" : "Ask the assistant"}
      >
        {open ? (
          <span style={{ fontSize: 22, fontWeight: 300, lineHeight: 1 }}>×</span>
        ) : (
          <>
            <span className="ai-fab-glyph">✦</span>
            <span className="ai-fab-label">Ask AI</span>
          </>
        )}
      </button>

      <aside className={"ai-panel" + (open ? " is-open" : "")} aria-hidden={!open}>
        <header className="ai-head">
          <div>
            <div className="ai-title">Finance assistant</div>
            <div className="ai-sub">
              {haveHostBridge ? "Knows your current numbers · powered by Claude" :
                haveKey ? `Knows your numbers · ${MODEL_OPTIONS.find((m) => m.value === model)?.label.split(" ")[0] || "Claude"} · your key` :
                "Knows your numbers · API key needed"}
            </div>
          </div>
          <div style={{ display: "flex", gap: 4 }}>
            <button className="ai-close" onClick={() => setSettingsOpen(true)} title="Settings / API key">⚙</button>
            <button className="ai-close" onClick={() => setOpen(false)} title="Close">×</button>
          </div>
        </header>

        <div className="ai-scroll" ref={scrollRef}>
          {!canChat && (
            <div className="ai-empty">
              <div className="ai-empty-glyph">🔑</div>
              <p className="ai-empty-text">
                <strong>Connect your Anthropic API key</strong> to chat with Claude about your finances.
                The key stays in your browser — calls go directly to api.anthropic.com.
              </p>
              <button className="btn-primary" onClick={() => setSettingsOpen(true)}>
                Add API key
              </button>
              <p className="ai-empty-text" style={{ marginTop: 16, fontSize: 12, color: "var(--ink-3)" }}>
                Don't have one? <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noreferrer">Get one from console.anthropic.com</a> — usually under $1 for many conversations.
              </p>
            </div>
          )}

          {canChat && messages.length === 0 && (
            <div className="ai-empty">
              <div className="ai-empty-glyph">✦</div>
              <p className="ai-empty-text">
                Ask me anything about your budget, taxes, or 5-year plan.
                I can see your current Ledger numbers.
              </p>
              <div className="ai-suggested">
                {SUGGESTED.map((s) => (
                  <button key={s} className="ai-chip" onClick={() => send(s)}>{s}</button>
                ))}
              </div>
            </div>
          )}

          {messages.map((m, i) => (
            <div key={i} className={"ai-msg " + m.role}>
              <div className="ai-msg-bubble">{m.content}</div>
            </div>
          ))}

          {loading && (
            <div className="ai-msg assistant">
              <div className="ai-msg-bubble ai-typing">
                <span /><span /><span />
              </div>
            </div>
          )}
        </div>

        <div className="ai-input-wrap">
          <textarea
            ref={inputRef}
            className="ai-input"
            placeholder={canChat ? "Ask about your finances…" : "Add an API key to start chatting"}
            value={input}
            onChange={(e) => setInput(e.target.value)}
            onKeyDown={onKeyDown}
            rows={1}
            disabled={!canChat}
          />
          <button
            className="ai-send"
            onClick={() => send()}
            disabled={!input.trim() || loading || !canChat}
            title="Send"
          >
            →
          </button>
        </div>
      </aside>

      <AISettings
        open={settingsOpen}
        apiKey={apiKey}
        model={model}
        onSave={saveSettings}
        onClose={() => setSettingsOpen(false)}
      />
    </>
  );
}

window.AIAssistant = AIAssistant;

</script>

<script type="text/babel" data-presets="react">
// PDF export — uses browser's native print-to-PDF. Cleanest, most reliable approach.
// Hides input panels, AI button, tweaks panel; expands tables; applies print stylesheet.

function exportToPDF(calculatorName) {
  // Add a class to the body that print.css targets
  document.body.classList.add("printing");

  // Set the document title so the saved PDF gets a sensible filename
  const originalTitle = document.title;
  const date = new Date().toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" });
  document.title = `Ledger · ${calculatorName} · ${date}`;

  // Give the browser a tick to apply styles, then trigger print dialog
  setTimeout(() => {
    window.print();
    // Restore after dialog closes
    setTimeout(() => {
      document.body.classList.remove("printing");
      document.title = originalTitle;
    }, 500);
  }, 100);
}

function ExportButton({ calculatorName }) {
  return (
    <button
      className="export-btn"
      onClick={() => exportToPDF(calculatorName)}
      title="Download as PDF"
    >
      <span className="export-btn-icon">↓</span>
      <span className="export-btn-label">Download PDF</span>
    </button>
  );
}

window.exportToPDF = exportToPDF;
window.ExportButton = ExportButton;

</script>

<script type="text/babel" data-presets="react">
// Export / import all calculator data as a JSON file.
// Acts as "save my data" without needing a backend.
const { useState: useStateExp, useRef: useRefExp } = React;

const STORAGE_KEYS = [
  "ledger:profile",
  "ledger:budget",
  "ledger:tax",
  "ledger:auto",
  "ledger:debt",
  "ledger:invest-v2",
  "ledger:household",
];

function collectAllData() {
  const data = { exportedAt: new Date().toISOString(), version: 1, data: {} };
  for (const k of STORAGE_KEYS) {
    const v = localStorage.getItem(k);
    if (v) data.data[k] = JSON.parse(v);
  }
  return data;
}

function downloadData() {
  const data = collectAllData();
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const date = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `ledger-backup-${date}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importData(file, onComplete) {
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const parsed = JSON.parse(e.target.result);
      if (!parsed.data) throw new Error("Not a valid Ledger backup file.");
      for (const [k, v] of Object.entries(parsed.data)) {
        if (STORAGE_KEYS.includes(k)) {
          localStorage.setItem(k, JSON.stringify(v));
        }
      }
      onComplete({ ok: true, when: parsed.exportedAt });
    } catch (err) {
      onComplete({ ok: false, error: err.message });
    }
  };
  reader.readAsText(file);
}

function DataButton() {
  const [open, setOpen] = useStateExp(false);
  const [status, setStatus] = useStateExp(null);
  const fileRef = useRefExp(null);

  const handleImport = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    importData(file, (res) => {
      if (res.ok) {
        setStatus({ kind: "ok", message: `Loaded backup from ${new Date(res.when).toLocaleDateString()}. Reloading…` });
        setTimeout(() => window.location.reload(), 1000);
      } else {
        setStatus({ kind: "err", message: res.error });
      }
    });
    e.target.value = ""; // allow re-importing same file
  };

  return (
    <>
      <button
        className="data-btn"
        onClick={() => setOpen((o) => !o)}
        title="Save or load your data"
      >
        <span className="data-btn-icon">⛁</span>
        <span className="data-btn-label">My data</span>
      </button>

      {open && (
        <div className="data-menu" onClick={(e) => e.stopPropagation()}>
          <div className="data-menu-head">
            <div className="data-menu-title">Your data</div>
            <div className="data-menu-sub">All numbers are saved in this browser. Use these to back up or move between devices.</div>
          </div>

          <button className="data-menu-item" onClick={() => { downloadData(); setStatus({ kind: "ok", message: "Backup downloaded." }); }}>
            <span className="data-menu-glyph">↓</span>
            <span>
              <div className="data-menu-item-title">Download backup</div>
              <div className="data-menu-item-sub">Save all your numbers to a .json file</div>
            </span>
          </button>

          <button className="data-menu-item" onClick={() => fileRef.current.click()}>
            <span className="data-menu-glyph">↑</span>
            <span>
              <div className="data-menu-item-title">Load backup</div>
              <div className="data-menu-item-sub">Restore from a previously downloaded file</div>
            </span>
          </button>

          <button
            className="data-menu-item data-menu-item-danger"
            onClick={() => {
              if (confirm("Clear all saved data? This can't be undone.")) {
                STORAGE_KEYS.forEach((k) => localStorage.removeItem(k));
                setStatus({ kind: "ok", message: "All data cleared. Reloading…" });
                setTimeout(() => window.location.reload(), 800);
              }
            }}
          >
            <span className="data-menu-glyph">×</span>
            <span>
              <div className="data-menu-item-title">Clear all data</div>
              <div className="data-menu-item-sub">Reset everything to defaults</div>
            </span>
          </button>

          {status && (
            <div className={"data-status data-status-" + status.kind}>
              {status.message}
            </div>
          )}

          <div className="data-menu-foot">
            Looking for cloud sync / login? That needs a server we don't have. Download + Load gets you the same result across devices.
          </div>

          <input
            ref={fileRef}
            type="file"
            accept="application/json,.json"
            onChange={handleImport}
            style={{ display: "none" }}
          />
        </div>
      )}
    </>
  );
}

window.DataButton = DataButton;
window.downloadData = downloadData;

</script>

<script type="text/babel" data-presets="react">
// Budget calculator: salary -> tax -> monthly expenses -> 5-year projection.
const { useState: useStateBudget, useMemo: useMemoBudget, useEffect: useEffectBudget } = React;

// PRIMARY NEEDS — essentials you can't skip without consequences
const PRIMARY_FIELDS = [
  { key: "rent",      label: "Rent / mortgage",  placeholder: "1,500" },
  { key: "expenses",  label: "Groceries & utilities", placeholder: "600", hint: "food at home, water, power" },
  { key: "carIns",    label: "Insurance",        placeholder: "150",   hint: "car, health, renters" },
  { key: "gas",       label: "Transportation",   placeholder: "200",   hint: "gas, transit, parking" },
  { key: "otherLoan", label: "Loan payments",    placeholder: "0",     hint: "student, credit, family" },
];
// Keep the old name for back-compat references
const EXPENSE_FIELDS = PRIMARY_FIELDS;

// Presets for the user to one-click into Secondary / Subscriptions sections
const SECONDARY_PRESETS = [
  { name: "Dining out",     amount: 200 },
  { name: "Clothes",        amount: 100 },
  { name: "Entertainment",  amount: 80 },
  { name: "Personal care",  amount: 60 },
  { name: "Hobbies",        amount: 80 },
  { name: "Gifts",          amount: 50 },
  { name: "Travel fund",    amount: 200 },
  { name: "Coffee / treats", amount: 60 },
];
// Subscription presets — just names. User enters their own price after clicking.
const SUBSCRIPTION_PRESETS = [
  { name: "Netflix",         amount: 0 },
  { name: "Spotify",         amount: 0 },
  { name: "Gym",             amount: 0 },
  { name: "iCloud / Drive",  amount: 0 },
  { name: "YouTube Premium", amount: 0 },
  { name: "Amazon Prime",    amount: 0 },
  { name: "ChatGPT / AI",    amount: 0 },
  { name: "News / magazine", amount: 0 },
  { name: "Disney+",         amount: 0 },
  { name: "Hulu",            amount: 0 },
];

// Compute the full monthly total: primary fields + secondary list + subscriptions list.
// Used everywhere the expenses object is summed (so back-compat with old data is preserved).
function sumExpenses(expenses) {
  if (!expenses) return 0;
  const primary = (Number(expenses.rent)      || 0)
                + (Number(expenses.expenses)  || 0)
                + (Number(expenses.carIns)    || 0)
                + (Number(expenses.gas)       || 0)
                + (Number(expenses.otherLoan) || 0);
  const secondary = (expenses.secondary || []).reduce((a, it) => a + (Number(it.amount) || 0), 0);
  const subs      = (expenses.subscriptions || []).reduce((a, it) => a + (Number(it.amount) || 0), 0);
  return primary + secondary + subs;
}
// Expose so other tabs (ai-chat, debt) can read it
window.sumExpenses = sumExpenses;

function BudgetInputs({ inputs, setInputs }) {
  const upd = (k, v) => setInputs((s) => ({ ...s, [k]: v }));
  const updMulti = (patch) => setInputs((s) => ({ ...s, ...patch }));
  const [open, setOpen] = useStateBudget(true);
  return (
    <section className={"card" + (open ? "" : " is-collapsed")}>
      <header
        className="card-head"
        style={{ cursor: "pointer" }}
        onClick={() => setOpen((v) => !v)}
      >
        <h2 style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <span className={"debt-card-chevron" + (open ? " is-open" : "")} style={{ pointerEvents: "none" }} aria-hidden="true">▾</span>
          Income & location
        </h2>
        {!open && (
          <span className="card-tag">
            ${(inputs.salary || 0).toLocaleString()}/yr · {inputs.city || inputs.state}
          </span>
        )}
      </header>
      {open && <div className="card-body stack">
        <Field label="Annual salary" hint="gross, pre-tax">
          <Money value={inputs.salary} onChange={(v) => upd("salary", v)} placeholder="65,000" />
        </Field>
        <Field label="Annual bonus" hint="optional, gross">
          <Money value={inputs.bonus || 0} onChange={(v) => upd("bonus", v)} placeholder="0" />
        </Field>
        <Field
          label={inputs.additionalIncomeLabel ? `Additional income · ${inputs.additionalIncomeLabel}` : "Additional income"}
          hint="freelance, side gig, rental, etc."
        >
          <Money
            value={inputs.additionalIncome || 0}
            onChange={(v) => upd("additionalIncome", v)}
            placeholder="0"
          />
          <input
            type="text"
            className="text-input"
            style={{ marginTop: 6, fontSize: 12, padding: "6px 10px" }}
            placeholder="Label this income (e.g. freelance, dividends)"
            value={inputs.additionalIncomeLabel || ""}
            onChange={(e) => upd("additionalIncomeLabel", e.target.value)}
          />
        </Field>
        <Field label="Job start date" hint="prorates year 1">
          <div
            className="date-picker"
            onClick={(e) => {
              // Whole-row click opens the picker — modern browsers support showPicker()
              const inp = e.currentTarget.querySelector("input[type=date]");
              if (inp && typeof inp.showPicker === "function") {
                try { inp.showPicker(); } catch {}
              } else {
                inp?.focus();
              }
            }}
          >
            <span className="date-picker-icon" aria-hidden="true">📅</span>
            <input
              type="date"
              className="date-input"
              value={inputs.jobStartDate || ""}
              onChange={(e) => upd("jobStartDate", e.target.value)}
            />
            <span className="date-picker-caret" aria-hidden="true">▾</span>
          </div>
        </Field>
        <Field label="Filing status">
          <Segment
            value={inputs.filing}
            onChange={(v) => upd("filing", v)}
            options={[
              { value: "single",  label: "Single" },
              { value: "married", label: "Married, joint" },
            ]}
          />
        </Field>
        <div className="row-2">
          <Field label="City" hint="type to search">
            <CityAutocomplete
              city={inputs.city}
              state={inputs.state}
              onChange={updMulti}
            />
          </Field>
          <Field label="State">
            <select className="select" value={inputs.state} onChange={(e) => upd("state", e.target.value)}>
              {Object.entries(STATE_NAMES)
                .sort((a, b) => a[1].localeCompare(b[1]))
                .map(([code, name]) => <option key={code} value={code}>{name}</option>)}
            </select>
          </Field>
        </div>
        <Toggle
          value={!!inputs.ficaExempt}
          onChange={(v) => upd("ficaExempt", v)}
          label="FICA exempt"
          hint="F-1 / J-1 non-resident students & scholars"
        />
      </div>}
    </section>
  );
}

// One row in the Secondary / Subscriptions item list.
function ExpenseItemRow({ item, onChange, onRemove }) {
  return (
    <div className="expense-item">
      <input
        type="text"
        className="text-input"
        value={item.name}
        onChange={(e) => onChange({ ...item, name: e.target.value })}
        placeholder="Name"
      />
      <Money value={item.amount} onChange={(v) => onChange({ ...item, amount: v })} placeholder="0" />
      <button className="icon-btn" onClick={onRemove} title="Remove">×</button>
    </div>
  );
}

// A sub-section card (Secondary or Subscriptions) — list of items + presets + custom add.
function ExpenseSection({ title, hint, items, onChange, presets, accentColor }) {
  const subtotal = items.reduce((a, it) => a + (Number(it.amount) || 0), 0);
  const updateItem = (id, next) => onChange(items.map((it) => it.id === id ? next : it));
  const removeItem = (id) => onChange(items.filter((it) => it.id !== id));
  const addItem = (preset) => {
    const id = Math.max(0, ...items.map((i) => i.id || 0)) + 1;
    onChange([...items, preset
      ? { id, name: preset.name, amount: preset.amount }
      : { id, name: "New expense", amount: 0 }
    ]);
  };
  return (
    <section className="card expense-section" style={accentColor ? { borderLeftColor: accentColor } : {}}>
      <header className="card-head">
        <h2>{title}</h2>
        <span className="card-tag">{fmtUSD0(subtotal)}/mo</span>
      </header>
      <div className="card-body">
        {hint && <p className="expense-section-hint">{hint}</p>}
        {items.length === 0 && (
          <div className="port-empty">No items yet — pick a preset below or add your own.</div>
        )}
        {items.length > 0 && (
          <div className="expense-item-list">
            {items.map((it) => (
              <ExpenseItemRow
                key={it.id}
                item={it}
                onChange={(next) => updateItem(it.id, next)}
                onRemove={() => removeItem(it.id)}
              />
            ))}
          </div>
        )}
        <div className="expense-add-row">
          <button className="btn-ghost" onClick={() => addItem()}>+ Add custom</button>
          <span className="port-add-or">or quick-add:</span>
          <div className="port-presets">
            {presets
              .filter((p) => !items.some((it) => it.name.toLowerCase() === p.name.toLowerCase()))
              .map((p) => (
                <button key={p.name} className="port-preset-btn" onClick={() => addItem(p)}>
                  + {p.name}
                </button>
              ))}
          </div>
        </div>
      </div>
    </section>
  );
}

function BudgetExpenses({ expenses, setExpenses }) {
  const upd = (k, v) => setExpenses((s) => ({ ...s, [k]: v }));

  // Auto-sync "Other loan" from the Debt tab. Re-reads localStorage on a tick
  // so when you edit debts on the Debt tab, this updates live.
  const [tick, setTick] = useStateBudget(0);
  useEffectBudget(() => {
    const id = setInterval(() => setTick((t) => t + 1), 1500);
    return () => clearInterval(id);
  }, []);
  const debtMinTotal = React.useMemo(() => {
    try {
      const debtState = JSON.parse(localStorage.getItem("ledger:debt") || "null");
      const debts = debtState?.debts || [];
      return Math.round(debts.reduce((a, d) => a + (Number(d.minPayment) || 0), 0));
    } catch { return 0; }
  }, [tick]);

  // When sync is on, force the otherLoan value to match the debt sum
  React.useEffect(() => {
    if (expenses.otherLoanAutoSync && debtMinTotal !== expenses.otherLoan) {
      upd("otherLoan", debtMinTotal);
    }
  }, [expenses.otherLoanAutoSync, debtMinTotal]);

  // Auto-sync car Insurance from the Auto tab
  const autoInsurance = React.useMemo(() => {
    try {
      const autoState = JSON.parse(localStorage.getItem("ledger:auto") || "null");
      return Math.round(Number(autoState?.insurance) || 0);
    } catch { return 0; }
  }, [tick]);
  React.useEffect(() => {
    if (expenses.carInsAutoSync && autoInsurance > 0 && autoInsurance !== expenses.carIns) {
      upd("carIns", autoInsurance);
    }
  }, [expenses.carInsAutoSync, autoInsurance]);

  // Auto-sync car Gas from the Auto/Commute calculation (lives in window.__ledgerData.commute.cost
  // OR expenses.gas which the commute card writes into automatically).
  const autoGasFromCommute = React.useMemo(() => {
    try {
      const budget = JSON.parse(localStorage.getItem("ledger:budget") || "null");
      const c = budget?.commute?.cost;
      if (c != null && c > 0) return Math.round(c);
    } catch {}
    try {
      const autoState = JSON.parse(localStorage.getItem("ledger:auto") || "null");
      return Math.round(Number(autoState?.gas) || 0);
    } catch { return 0; }
  }, [tick]);
  React.useEffect(() => {
    if (expenses.gasAutoSync && autoGasFromCommute > 0 && autoGasFromCommute !== expenses.gas) {
      upd("gas", autoGasFromCommute);
    }
  }, [expenses.gasAutoSync, autoGasFromCommute]);

  const primarySubtotal = PRIMARY_FIELDS.reduce((a, f) => a + (Number(expenses[f.key]) || 0), 0);

  return (
    <>
    <section className="card expense-section" style={{ borderLeftColor: "#4DA77A" }}>
      <header className="card-head">
        <h2>Primary needs <span className="card-tag-inline" style={{ marginLeft: 8 }}>essentials</span></h2>
        <span className="card-tag">{fmtUSD0(primarySubtotal)}/mo</span>
      </header>
      <div className="card-body stack">
        <p className="expense-section-hint">Things you must pay every month — rent, food, utilities, insurance, loans.</p>
        {PRIMARY_FIELDS.map((f) => {
          // Each syncable field — Insurance (from Auto), Transportation (gas, from Auto/Commute),
          // Loan payments (from Debt) — shares a ↻ button pattern.
          const syncConfig = {
            carIns:    { syncKey: "carInsAutoSync",    source: autoInsurance,       sourceLabel: "Auto" },
            gas:       { syncKey: "gasAutoSync",       source: autoGasFromCommute,  sourceLabel: "Auto / Commute" },
            otherLoan: { syncKey: "otherLoanAutoSync", source: debtMinTotal,        sourceLabel: "Debt" },
          }[f.key];
          if (syncConfig) {
            const synced = !!expenses[syncConfig.syncKey];
            const hint = synced && syncConfig.source > 0
              ? `synced from ${syncConfig.sourceLabel} · ${fmtUSD0(syncConfig.source)}/mo`
              : f.hint
                ? `${f.hint} · sync from ${syncConfig.sourceLabel}`
                : `sync from ${syncConfig.sourceLabel} tab`;
            return (
              <Field key={f.key} label={f.label} hint={hint}>
                <div style={{ display: "flex", gap: 6 }}>
                  <Money
                    value={expenses[f.key]}
                    onChange={(v) => { upd(f.key, v); upd(syncConfig.syncKey, false); }}
                    placeholder={f.placeholder}
                  />
                  {syncConfig.source > 0 && (
                    <button
                      type="button"
                      className="icon-btn-square"
                      title={synced ? `Unlink from ${syncConfig.sourceLabel}` : `Sync from ${syncConfig.sourceLabel} tab`}
                      onClick={() => {
                        if (synced) {
                          upd(syncConfig.syncKey, false);
                        } else {
                          upd(syncConfig.syncKey, true);
                          upd(f.key, syncConfig.source);
                        }
                      }}
                      style={synced ? { borderColor: "var(--accent)", color: "var(--accent-2)", background: "var(--accent-bg)" } : {}}
                    >
                      {synced ? "✓" : "↻"}
                    </button>
                  )}
                </div>
              </Field>
            );
          }
          return (
            <Field key={f.key} label={f.label} hint={f.hint}>
              <Money value={expenses[f.key]} onChange={(v) => upd(f.key, v)} placeholder={f.placeholder} />
            </Field>
          );
        })}
      </div>
    </section>

    <ExpenseSection
      title={<>Secondary <span className="card-tag-inline" style={{ marginLeft: 8 }}>wants</span></>}
      hint="Nice-to-have spending — dining out, clothes, entertainment, hobbies."
      items={expenses.secondary || []}
      onChange={(arr) => upd("secondary", arr)}
      presets={SECONDARY_PRESETS}
      accentColor="#C9A96E"
    />

    <ExpenseSection
      title={<>Subscriptions <span className="card-tag-inline" style={{ marginLeft: 8 }}>recurring</span></>}
      hint="Anything that auto-charges every month — streaming, gym, software, cloud."
      items={expenses.subscriptions || []}
      onChange={(arr) => upd("subscriptions", arr)}
      presets={SUBSCRIPTION_PRESETS}
      accentColor="#7B6E55"
    />
    </>
  );
}

function ResultsHero({ tax, monthlyExpenses, view }) {
  const monthlyTakeHome = tax.takeHome / 12;
  const monthlyLeftover = monthlyTakeHome - monthlyExpenses;
  const annualLeftover  = monthlyLeftover * 12;
  const status = monthlyLeftover >= 0 ? "surplus" : "deficit";
  const isMonthly = view === "monthly";
  const leftover = isMonthly ? monthlyLeftover : annualLeftover;
  const takeHome = isMonthly ? monthlyTakeHome : tax.takeHome;
  const leftSub  = isMonthly ? `${fmtUSD0(annualLeftover)} per year`   : `${fmtUSD0(monthlyLeftover)} per month`;
  const takeSub  = isMonthly ? `${fmtUSD0(tax.takeHome)} annually`     : `${fmtUSD0(monthlyTakeHome)} per month`;
  return (
    <section className="hero-card">
      <div className="hero-grid">
        <div className="hero-block">
          <div className="hero-eyebrow">{isMonthly ? "Monthly" : "Annual"} after expenses</div>
          <div className={"hero-num " + status}>{fmtUSD0(leftover)}</div>
          <div className="hero-sub">{leftSub}</div>
        </div>
        <div className="hero-divider" />
        <div className="hero-block">
          <div className="hero-eyebrow">After tax</div>
          <div className="hero-num">
            {fmtUSD0(takeHome)}
            <span className="hero-num-sm">{isMonthly ? "/mo" : "/yr"}</span>
          </div>
          <div className="hero-sub">{takeSub}</div>
        </div>
      </div>
    </section>
  );
}

function TaxBreakdown({ tax, view }) {
  const isMonthly = view === "monthly";
  const div = isMonthly ? 12 : 1;
  const period = isMonthly ? "/mo" : "/yr";
  const rows = [
    { label: "Federal income tax", value: tax.federal,
      hint: `on ${fmtUSD0(tax.taxable)} taxable income` },
    { label: `State tax${tax.stateRate ? ` (${fmtPct(tax.stateRate)})` : ""}`, value: tax.stateTax },
    ...(tax.cityTax > 0 ? [{ label: tax.cityLabel || "City tax", value: tax.cityTax }] : []),
    ...(!tax.ficaExempt ? [
      { label: "Social Security", value: tax.ss },
      { label: "Medicare" + (tax.addlMedicare > 0 ? " + additional" : ""), value: tax.medicare + tax.addlMedicare },
    ] : [
      { label: "FICA", value: 0, hint: "exempt (F-1/J-1 non-resident)" },
    ]),
  ];
  return (
    <section className="card">
      <header className="card-head">
        <h2>Tax breakdown <span className="card-tag-inline">({isMonthly ? "monthly" : "annual"})</span></h2>
        <span className="card-tag">{fmtPct(tax.effectiveRate)} effective</span>
      </header>
      <div className="card-body">
        <table className="ltable">
          <tbody>
            {rows.map((r, i) => (
              <tr key={i}>
                <td>
                  <div>{r.label}</div>
                  {r.hint && <div className="row-hint">{r.hint}</div>}
                </td>
                <td className="num">{fmtUSD0(r.value / div)}{period}</td>
              </tr>
            ))}
            <tr className="ltable-total">
              <td>Total taxes</td>
              <td className="num">{fmtUSD0(tax.totalTax / div)}{period}</td>
            </tr>
            <tr className="ltable-take">
              <td>Take-home</td>
              <td className="num">{fmtUSD0(tax.takeHome / div)}{period}</td>
            </tr>
          </tbody>
        </table>
        <p className="footnote">
          2025 federal brackets, standard deduction ({fmtUSD0(tax.standardDeduction)}), FICA. State rates use
          flat effective averages — your actual liability depends on deductions and credits.
        </p>
      </div>
    </section>
  );
}

function ExpenseBreakdown({ takeHome, expenses, view }) {
  const isMonthly = view === "monthly";
  const mult = isMonthly ? 1 : 12;
  const period = isMonthly ? "/mo" : "/yr";
  const totalMonthly = sumExpenses(expenses);
  const totalShown = totalMonthly * mult;
  const takeHomeShown = isMonthly ? takeHome / 12 : takeHome;
  const leftover = takeHomeShown - totalShown;

  const segs = PRIMARY_FIELDS
    .map((f) => ({ label: f.label, value: (expenses[f.key] || 0) * mult }))
    .filter((s) => s.value > 0);
  const secondaryTotal = (expenses.secondary || []).reduce((a, it) => a + (Number(it.amount) || 0), 0);
  const subsTotal      = (expenses.subscriptions || []).reduce((a, it) => a + (Number(it.amount) || 0), 0);
  if (secondaryTotal > 0) segs.push({ label: "Secondary (wants)", value: secondaryTotal * mult });
  if (subsTotal      > 0) segs.push({ label: "Subscriptions",     value: subsTotal      * mult });
  segs.push({
    label: leftover >= 0 ? "Savings / surplus" : "Shortfall",
    value: Math.abs(leftover),
    isLeftover: true,
    deficit: leftover < 0,
  });
  const total = segs.reduce((a, b) => a + b.value, 0) || 1;

  return (
    <section className="card">
      <header className="card-head">
        <h2>Where your take-home goes <span className="card-tag-inline">({isMonthly ? "monthly" : "annual"})</span></h2>
        <span className="card-tag">{fmtUSD0(totalShown)}{period}</span>
      </header>
      <div className="card-body">
        <div className="stack-bar">
          {segs.map((s, i) => (
            <div
              key={i}
              className={"stack-seg c" + (i % 5) + (s.isLeftover ? (s.deficit ? " is-deficit" : " is-leftover") : "")}
              style={{ width: ((s.value / total) * 100) + "%" }}
              title={`${s.label}: ${fmtUSD0(s.value)}`}
            />
          ))}
        </div>
        <ul className="legend">
          {segs.map((s, i) => (
            <li key={i}>
              <span className={"legend-dot c" + (i % 5) + (s.isLeftover ? (s.deficit ? " is-deficit" : " is-leftover") : "")} />
              <span className="legend-label">{s.label}</span>
              <span className="legend-val">{fmtUSD0(s.value)}<span className="legend-pct"> · {fmtPct(s.value / total, 0)}</span></span>
            </li>
          ))}
        </ul>
      </div>
    </section>
  );
}

// Reusable projection logic so SavingsInvestingCard can consume the same years.
function buildProjectionYears(inputs, expenses, growth, yearCount) {
  const out = [];
  let salary = inputs.salary;
  let rent = expenses.rent;
  // Sum primary "other" fields PLUS secondary items PLUS subscription items
  const secondaryTotal = (expenses.secondary || []).reduce((a, it) => a + (Number(it.amount) || 0), 0);
  const subsTotal      = (expenses.subscriptions || []).reduce((a, it) => a + (Number(it.amount) || 0), 0);
  let other = expenses.expenses + expenses.carIns + expenses.gas + expenses.otherLoan + secondaryTotal + subsTotal;
  let cumulative = 0;

  const today = new Date();
  const startStr = inputs.jobStartDate || `${today.getFullYear()}-01-01`;
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(startStr);
  const startYear  = m ? parseInt(m[1], 10) : today.getFullYear();
  const startMonth = m ? parseInt(m[2], 10) - 1 : 0;
  const year1MonthsWorked = 12 - startMonth;
  const year1Fraction = year1MonthsWorked / 12;

  for (let i = 0; i < yearCount; i++) {
    const isYear1 = i === 0;
    const fraction = isYear1 ? year1Fraction : 1;
    const monthsWorked = isYear1 ? year1MonthsWorked : 12;
    const t = computeTaxes({ ...inputs, salary });
    const takeHome = t.takeHome * fraction;
    const taxPaid  = t.totalTax * fraction;
    const annualExp = (rent + other) * monthsWorked;
    const leftover = takeHome - annualExp;
    cumulative += leftover;
    out.push({
      year: startYear + i,
      startMonthIdx: isYear1 ? startMonth : 0,
      salary: salary * fraction,
      fullSalary: salary,
      takeHome, taxPaid, expenses: annualExp,
      leftover, cumulative,
      partial: isYear1 && year1Fraction < 1,
      months: monthsWorked,
    });
    salary *= 1 + growth.salary;
    rent   *= 1 + growth.rent;
    other  *= 1 + growth.expenses;
  }
  return out;
}

function Projection({ years, yearCount, isMonthly, monthRows, max, growth, onYearsChange, onViewChange }) {

  return (

        style={{ cursor: "pointer" }}
        onClick={(e) => { if (e.target.closest("button, .card-tag-link")) return; setOpen((v) => !v); }}
      >
        <h2 style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <span
            className={"debt-card-chevron" + (open ? " is-open" : "")}
            style={{ pointerEvents: "none" }}
            aria-hidden="true"
          >▾</span>
          Next {yearCount} year{yearCount !== 1 ? "s" : ""}
          <span className="card-tag-inline">({isMonthly ? "monthly" : "annual"})</span>
          {isMonthly && monthRows.length > 0 && (
            <span className="card-tag-inline" style={{ color: "var(--accent-2)" }}>
              · starts {monthRows[0].label}
            </span>
          )}

function BudgetCalculator({ profile, setProfile }) {
  // Shared inputs come from profile; everything else is local.
  const inputs = profile;
  const setInputs = (updater) => setProfile((p) => typeof updater === "function" ? updater(p) : { ...p, ...updater });

  const [view, setView] = useStateBudget("monthly"); // monthly | annually (page-level)
  const [projView, setProjView] = useStateBudget("monthly"); // monthly | annually (projection-only)
  const [projectionYears, setProjectionYears] = useStateBudget(5);
  const [expenses, setExpenses] = useStateBudget({
    rent: 1500, expenses: 600, carIns: 150, gas: 200, otherLoan: 0,
  });
  const [growth, setGrowth] = useStateBudget({
    salary: 0.03, rent: 0.05, expenses: 0.03,
  });
  const [commute, setCommute] = useStateBudget({
    homeAddr: "", workAddr: "",
    oneWayMiles: 0, driveMinutes: 0,
    homeResolved: "", workResolved: "",
    mpg: 30, gasPrice: 3.50,
    workdaysPerMonth: 22, extraMilesPerDay: 0,
    status: "idle", error: "",
  });

  useEffectBudget(() => {
    try {
      const saved = JSON.parse(localStorage.getItem("ledger:budget") || "null");
      if (saved) {
        saved.expenses && setExpenses(saved.expenses);
        saved.growth   && setGrowth(saved.growth);
        saved.commute  && setCommute((c) => ({ ...c, ...saved.commute, status: "idle", error: "" }));
      }
    } catch {}
  }, []);
  useEffectBudget(() => {
    localStorage.setItem("ledger:budget", JSON.stringify({ expenses, growth, commute }));
  }, [expenses, growth, commute]);

  const tax = useMemoBudget(() => computeTaxes(inputs), [inputs]);

  // Shared projection data — fed to both Projection and SavingsInvestingCard.
  const projYears = useMemoBudget(
    () => buildProjectionYears(inputs, expenses, growth, projectionYears),
    [inputs, expenses, growth, projectionYears]
  );
  const projMonthRows = useMemoBudget(() => {
    if (projView !== "monthly") return [];
    const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    const rows = [];
    let cumulative = 0;
    for (const y of projYears) {
      const startMo = y.startMonthIdx;
      const monthlySalary    = y.fullSalary / 12;
      const monthlyTakeHome  = y.takeHome / y.months;
      const monthlyTax       = y.taxPaid / y.months;
      const monthlyExpenses  = y.expenses / y.months;
      const monthlyLeftover  = monthlyTakeHome - monthlyExpenses;
      for (let m = startMo; m < 12; m++) {
        cumulative += monthlyLeftover;
        rows.push({
          key: `${y.year}-${m}`,
          label: `${MONTHS[m]} ${y.year}`,
          salary: monthlySalary,
          takeHome: monthlyTakeHome,
          tax: monthlyTax,
          expenses: monthlyExpenses,
          leftover: monthlyLeftover,
          cumulative,
          isYearStart: m === startMo,
        });
      }
    }
    return rows;
  }, [projYears, projView]);
  const projMax = Math.max(...projYears.map((y) => Math.max(y.takeHome, y.expenses)), 1);
  useEffectBudget(() => {
    // Expose latest data so the Investing tab + AI assistant can read context.
    window.__ledgerData = { profile: inputs, expenses, growth, commute, tax };
  });

  const monthlyExp = useMemoBudget(
    () => sumExpenses(expenses),
    [expenses]
  );

  return (
    <>
      <header className="page-head">
        <div>
          <h1 className="page-title">Budget <em>&amp;</em> cashflow</h1>
        </div>
        <div className="page-head-right">
          <div className="page-head-actions">
            <div className="view-toggle">
              <Segment
                value={view}
                onChange={setView}
                options={[
                  { value: "monthly",  label: "Monthly" },
                  { value: "annually", label: "Annually" },
                ]}
              />
            </div>
            <ExportButton calculatorName="Budget & cashflow" />
          </div>
          <div className="page-sub">Salary → take-home → what's left after expenses</div>
        </div>
      </header>

      <div className="layout">
        <aside className="col-inputs">
          <BudgetInputs inputs={inputs} setInputs={setInputs} />
          <CommuteCard
            commute={commute}
            setCommute={setCommute}
            userState={inputs.state}
            onApplyToGas={(amt) => setExpenses((s) => ({ ...s, gas: amt }))}
          />
          <section className="card">
            <header className="card-head">
              <h2>Monthly expenses</h2>
              <span className="card-tag">{fmtUSD0(sumExpenses(expenses))}/mo</span>
            </header>
            <div className="card-body">
              <p className="expense-section-hint" style={{ marginBottom: 12 }}>
                Edit the full Primary / Secondary / Subscriptions breakdown in the dedicated
                <strong> Expenses </strong> tab.
              </p>
              <button
                className="btn-primary"
                onClick={() => { window.location.hash = "expenses"; }}
                style={{ width: "100%" }}
              >
                Open Expenses tab →
              </button>
            </div>
          </section>
          <GrowthCard growth={growth} setGrowth={setGrowth} />
        </aside>
        <section className="col-results">
          <ResultsHero tax={tax} monthlyExpenses={monthlyExp} view={view} />
          <div className="grid-2">
            <TaxBreakdown tax={tax} view={view} />
            <ExpenseBreakdown takeHome={tax.takeHome} expenses={expenses} view={view} />
          </div>
          <Projection
            years={projYears}
            yearCount={projectionYears}
            isMonthly={projView === "monthly"}
            monthRows={projMonthRows}
            max={projMax}
            growth={growth}
            onYearsChange={setProjectionYears}
            onViewChange={setProjView}
          />
        </section>
      </div>
    </>
  );
}
