// ─── Net Worth integration card ──────────────────────────────────────────
// Pulls in:
//   • User-entered cash accounts (this card's own state, persisted)
//   • Investments projected forward via window.projectSingleInvestment
//   • Debt remaining balance per month via simulatePayoffWithSavings
// Then computes net worth month-by-month for 60 months and plots it.
function NetWorthCard({ data, profile }) {
  const [open, setOpen]         = useStateOv(true);
  const [accounts, setAccounts] = useStateOv([]);
  const [horizon, setHorizon]   = useStateOv(60); // months

  // Parse the user's job-start date (YYYY-MM-DD from profile). If they haven't
  // set one, fall back to today. This is the anchor for ALL X-axis labels.
  const usingJobDate = !!profile?.jobStartDate;
  const anchorDate = useMemoOv(() => {
    const s = profile?.jobStartDate;
    if (s) {
      const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
      if (m) return new Date(parseInt(m[1]), parseInt(m[2]) - 1, parseInt(m[3]));
    }
    return new Date();
  }, [profile?.jobStartDate]);

  // Load + persist accounts list (Overview-owned, separate localStorage key)
  useEffectOv(() => {
    try {
      const saved = JSON.parse(localStorage.getItem("ledger:accounts") || "null");
      if (Array.isArray(saved)) setAccounts(saved);
    } catch {}
  }, []);
  useEffectOv(() => {
    localStorage.setItem("ledger:accounts", JSON.stringify(accounts));
  }, [accounts]);

  const addAccount = () => setAccounts((a) => [...a, {
    id: Date.now(), name: "New account", balance: 0, apy: 0.04
  }]);
  const updAccount = (id, patch) =>
    setAccounts((a) => a.map((x) => x.id === id ? { ...x, ...patch } : x));
  const delAccount = (id) => setAccounts((a) => a.filter((x) => x.id !== id));

  // ── Build monthly debt-balance trajectory ──
  const debtMonthly = useMemoOv(() => {
    const debts = data?.debt?.debts || [];
    if (!debts.length || !window.simulatePayoffWithSavings) return [];
    const extra = Math.max(0, (Number(data?.extraToDebt) || 0));
    const savings = Math.max(0, (Number(data?.savingsTarget) || 0));
    const apy = Number(data?.debt?.savingsAPY) || 0;
    const strategy = data?.debt?.strategy || "avalanche";
    const sim = window.simulatePayoffWithSavings(debts, extra, strategy, savings, apy, 1);
    return sim.monthlyDebtTotal || [];
  }, [data?.debt?.debts, data?.extraToDebt, data?.savingsTarget, data?.debt?.savingsAPY, data?.debt?.strategy]);

  // ── Build monthly investment-balance trajectory ──
  // Sum each tracked investment's projection at each month.
  const investMonthly = useMemoOv(() => {
    const portfolio = data?.invest?.portfolio;
    if (!portfolio?.investments?.length || !window.projectSingleInvestment) return [];
    const monthlySurplus = Math.max(0, (Number(data?.savingsTarget) || 0));
    const series = new Array(horizon + 1).fill(0);
    portfolio.investments.forEach((rawInv) => {
      // The user's tracking choice matters: untracked ones don't count here.
      const inv = {
        ...rawInv,
        compound: rawInv.compound != null ? !!rawInv.compound : false,
        principle: rawInv.principle != null ? Number(rawInv.principle) : 0,
        trackInOverview: rawInv.trackInOverview !== false,
      };
      if (!inv.trackInOverview) return;
      // Project at each month from 0..horizon (months/12 = years)
      for (let m = 0; m <= horizon; m++) {
        const yrs = m / 12;
        // Distribute non-compound monthly contribution = budget surplus × pct
        const monthlyFromBudget = inv.compound ? 0 : (monthlySurplus * (Number(inv.pct) || 0));
        const proj = window.projectSingleInvestment(inv, yrs, monthlyFromBudget);
        series[m] += proj.final || 0;
      }
    });
    return series;
  }, [data?.invest, data?.savingsTarget, horizon]);

  // ── Build monthly cash-accounts trajectory (compound at APY) ──
  // Includes the "Going to savings" portion of spareCash that doesn't fund a
  // non-compound investment — that money accumulates as cash compounding at
  // the Debt tab's savings APY. Without this, savingsTarget would silently
  // vanish from net worth.
  const cashMonthly = useMemoOv(() => {
    const series = new Array(horizon + 1).fill(0);
    accounts.forEach((acct) => {
      const bal0 = Number(acct.balance) || 0;
      const mRate = Math.pow(1 + (Number(acct.apy) || 0), 1/12) - 1;
      let bal = bal0;
      series[0] += bal;
      for (let m = 1; m <= horizon; m++) {
        bal = bal * (1 + mRate);
        series[m] += bal;
      }
    });
    // Unallocated savingsTarget bucket
    const savingsTarget = Number(data?.savingsTarget) || 0;
    if (savingsTarget > 0) {
      const portfolio = data?.invest?.portfolio;
      const investments = portfolio?.investments || [];
      const nonCompoundPctSum = investments.reduce((a, inv) => {
        const compound = inv.compound != null ? !!inv.compound : false;
        return compound ? a : a + (Number(inv.pct) || 0);
      }, 0);
      const cashFraction = Math.max(0, Math.min(1, 1 - nonCompoundPctSum));
      const monthlyToCash = savingsTarget * cashFraction;
      const apy = Number(data?.debt?.savingsAPY) || 0;
      const mRate = Math.pow(1 + apy, 1/12) - 1;
      let cash = 0;
      for (let m = 1; m <= horizon; m++) {
        cash = cash * (1 + mRate) + monthlyToCash;
        series[m] += cash;
      }
    }
    return series;
  }, [accounts, horizon, data?.savingsTarget, data?.debt?.savingsAPY, data?.invest]);

  // Anchor for absolute calendar labels: user's job-start date if provided,
  // else today. Re-derived when profile.jobStartDate changes.
  const startDate = anchorDate;
  const MONTHS_SHORT = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  // Helper: month offset (0 = today) → Date object
  const offsetToDate = (m) => {
    const d = new Date(startDate);
    d.setMonth(d.getMonth() + m);
    return d;
  };
  // Helper for chart labels — short for axis ticks, long for tooltip header
  const fmtMonthYear = (m) => {
    const d = offsetToDate(m);
    return `${MONTHS_SHORT[d.getMonth()]} ${d.getFullYear()}`;
  };

  // ── Combine into a single net-worth array ──
  const netWorth = useMemoOv(() => {
    const rows = [];
    for (let m = 0; m <= horizon; m++) {
      const cash   = cashMonthly[m] || 0;
      const invest = investMonthly[m] || 0;
      const debt   = debtMonthly[m] != null ? debtMonthly[m] : (debtMonthly[debtMonthly.length - 1] || 0);
      const nw = cash + invest - debt;
      rows.push({
        m,
        date: fmtMonthYear(m),
        Cash: Math.round(cash),
        Investments: Math.round(invest),
        Debt: -Math.round(debt), // negative so it stacks below the axis
        "Net worth": Math.round(nw),
      });
    }
    return rows;
  }, [cashMonthly, investMonthly, debtMonthly, horizon, startDate]);

  const today    = netWorth[0];
  const final    = netWorth[netWorth.length - 1];
  const cashTotal   = accounts.reduce((a, x) => a + (Number(x.balance) || 0), 0);
  const debtTotal   = data?.debtTotal || 0;
  const investToday = investMonthly[0] || 0;
  const change   = (final?.["Net worth"] || 0) - (today?.["Net worth"] || 0);

  const Recharts = window.Recharts;

  return (
    <section className={"card" + (open ? "" : " is-collapsed")}>
      <header
        className="card-head"
        style={{ cursor: "pointer" }}
        onClick={() => setOpen((v) => !v)}
      >
        <h2 style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <span className={"debt-card-chevron" + (open ? " is-open" : "")} style={{ pointerEvents: "none" }} aria-hidden="true">▾</span>
          Net worth
        </h2>
        <span className="card-tag">
          {fmtMonthYear(0)} {fmtUSD0(today?.["Net worth"] || 0)} → {fmtMonthYear(horizon)} {fmtUSD0(final?.["Net worth"] || 0)}
          {change !== 0 && (
            <span style={{ marginLeft: 8, color: change >= 0 ? "var(--positive)" : "var(--negative)" }}>
              {change >= 0 ? "+" : ""}{fmtUSD0(change)}
            </span>
          )}
          {usingJobDate && (
            <span style={{ marginLeft: 8, fontSize: 10, color: "var(--ink-3)" }}>
              anchored on job start
            </span>
          )}
        </span>
      </header>
      {open && <div className="card-body">
        {/* Four-cell summary strip — today's snapshot */}
        <div className="invest-breakdown-grid" style={{ marginBottom: 16 }}>
          <div className="invest-breakdown-cell">
            <div className="invest-breakdown-label">Cash & accounts</div>
            <div className="invest-breakdown-value">{fmtUSD0(cashTotal)}</div>
            <div className="invest-breakdown-sub">{accounts.length} account{accounts.length !== 1 ? "s" : ""}</div>
          </div>
          <div className="invest-breakdown-cell">
            <div className="invest-breakdown-label">Investments (now)</div>
            <div className="invest-breakdown-value pos">{fmtUSD0(investToday)}</div>
            <div className="invest-breakdown-sub">starting principle</div>
          </div>
          <div className="invest-breakdown-cell" style={{ background: "var(--negative)10" }}>
            <div className="invest-breakdown-label">Debt</div>
            <div className="invest-breakdown-value neg">{fmtUSD0(debtTotal)}</div>
            <div className="invest-breakdown-sub">{(data?.debt?.debts || []).length} debt{(data?.debt?.debts || []).length !== 1 ? "s" : ""}</div>
          </div>
          <div className="invest-breakdown-cell invest-breakdown-cell-final">
            <div className="invest-breakdown-label">Net worth today</div>
            <div className={"invest-breakdown-value " + ((today?.["Net worth"] || 0) >= 0 ? "surplus" : "deficit")}>
              <window.CountUp value={today?.["Net worth"] || 0} duration={0.3} format={fmtUSD0} />
            </div>
            <div className="invest-breakdown-sub">= cash + invest − debt</div>
          </div>
        </div>

        {/* Chart */}
        {Recharts && (
          <div style={{ width: "100%", height: 280, marginBottom: 12 }}>
            <Recharts.ResponsiveContainer width="100%" height="100%">
              <Recharts.ComposedChart data={netWorth} margin={{ top: 12, right: 16, bottom: 8, left: 0 }}>
                <Recharts.CartesianGrid stroke="var(--border)" strokeDasharray="3 3" />
                <Recharts.XAxis
                  dataKey="m"
                  tick={{ fill: "var(--ink-3)", fontSize: 11 }}
                  tickFormatter={(m) => {
                    const d = offsetToDate(m);
                    // Short horizon (≤12 months): show month name. Otherwise show year.
                    if (horizon <= 12) {
                      // Every other month to avoid crowding
                      if (m === 0) return MONTHS_SHORT[d.getMonth()];
                      if (m % 2 === 0) return MONTHS_SHORT[d.getMonth()];
                      return "";
                    }
                    // ≥24 months: show year at start of each calendar year
                    if (m === 0) return d.getFullYear().toString();
                    if (d.getMonth() === startDate.getMonth() && d.getFullYear() !== startDate.getFullYear()) {
                      return d.getFullYear().toString();
                    }
                    return "";
                  }}
                />
                <Recharts.YAxis tick={{ fill: "var(--ink-3)", fontSize: 11 }} tickFormatter={(v) => fmtUSD0(v)} width={70} />
                <Recharts.Tooltip
                  formatter={(value, name) => [fmtUSD0(value), name]}
                  labelFormatter={(m) => {
                    if (m === 0) return `${fmtMonthYear(m)} (today)`;
                    const yrsFromNow = (m / 12).toFixed(1);
                    return `${fmtMonthYear(m)} (${yrsFromNow}y from now)`;
                  }}
                  contentStyle={{ background: "var(--surface)", border: "1px solid var(--border)", borderRadius: 6 }}
                />
                <Recharts.Area type="monotone" dataKey="Cash"        stackId="1" stroke="#5A8FA3" fill="#5A8FA3" fillOpacity={0.6} isAnimationActive={true} animationDuration={900} animationEasing="ease-out" />
                <Recharts.Area type="monotone" dataKey="Investments" stackId="1" stroke="#4DA77A" fill="#4DA77A" fillOpacity={0.6} isAnimationActive={true} animationDuration={1000} animationEasing="ease-out" />
                <Recharts.Area type="monotone" dataKey="Debt"        stackId="2" stroke="#D77662" fill="#D77662" fillOpacity={0.6} isAnimationActive={true} animationDuration={1100} animationEasing="ease-out" />
                <Recharts.Line type="monotone" dataKey="Net worth"   stroke="#C9A96E" strokeWidth={2.5} dot={false} isAnimationActive={true} animationDuration={1200} animationEasing="ease-out" />
              </Recharts.ComposedChart>
            </Recharts.ResponsiveContainer>
          </div>
        )}

        {/* Horizon selector */}
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 18 }}>
          <span className="footnote" style={{ marginRight: "auto" }}>
            Net worth = cash accounts (compounded at their APY) + tracked investments (projected) − remaining debt balance.
          </span>
          <span className="footnote" style={{ fontStyle: "normal" }}>Horizon:</span>
          {[12, 24, 36, 60, 120].map((m) => (
            <button
              key={m}
              type="button"
              className={"btn-ghost" + (horizon === m ? " is-active" : "")}
              style={horizon === m ? { background: "var(--accent-bg)", borderColor: "var(--accent)" } : {}}
              onClick={() => setHorizon(m)}
            >
              {m / 12}y
            </button>
          ))}
        </div>

        {/* Accounts list */}
        <h3 className="sub-head" style={{ marginTop: 0 }}>Cash & accounts</h3>
        {accounts.length === 0 && (
          <div className="port-empty">No accounts yet — add your checking, savings, brokerage cash balances below.</div>
        )}
        {accounts.map((a) => (
          <div key={a.id} style={{ display: "grid", gridTemplateColumns: "1.6fr 1.3fr 1fr auto", gap: 8, alignItems: "center", marginBottom: 8 }}>
            <input
              type="text"
              className="text-input"
              value={a.name}
              onChange={(e) => updAccount(a.id, { name: e.target.value })}
              placeholder="Account name"
            />
            <Money value={a.balance} onChange={(v) => updAccount(a.id, { balance: Math.max(0, Number(v) || 0) })} placeholder="0" />
            <NumberInput
              value={((a.apy || 0) * 100).toFixed(2)}
              onChange={(v) => updAccount(a.id, { apy: Math.max(0, (Number(v) || 0) / 100) })}
              suffix="% APY"
              min={0}
            />
            <button className="icon-btn" onClick={() => delAccount(a.id)} title="Remove account">×</button>
          </div>
        ))}
        <button className="btn-ghost" onClick={addAccount} style={{ marginTop: 6 }}>+ Add account</button>
      </div>}
    </section>
  );
}

// ─── 1-5 year projection ─────────────────────────────────────────────────
// Year-by-year projection using the SAME growth assumptions the Budget tab uses.
// Reads ledger:budget.growth for salary/rent/expense annual growth %.
// Then layers debt simulation + investment projection + cash compounding on top.
function FiveYearProjection({ data, profile }) {
  const [open, setOpen] = useStateOv(true);
  const [yearCount, setYearCount] = useStateOv(5); // 1..10

  // Pull growth assumptions from Budget tab. Fall back to sensible defaults.
  const growth = useMemoOv(() => {
    try {
      const budget = JSON.parse(localStorage.getItem("ledger:budget") || "null");
      return budget?.growth || { salary: 0.03, rent: 0.03, expenses: 0.025 };
    } catch { return { salary: 0.03, rent: 0.03, expenses: 0.025 }; }
  }, [data?.expenses]);

  // Years 1..N using Budget's own buildProjectionYears so income/expenses match
  const budgetYears = useMemoOv(() => {
    if (!window.buildProjectionYears || !data?.expenses) return [];
    return window.buildProjectionYears(profile || {}, data.expenses, growth, yearCount);
  }, [profile, data?.expenses, growth, yearCount]);

  // Debt remaining at end of each year (month index = yearIndex × 12)
  const debtAtYear = useMemoOv(() => {
    const debts = data?.debt?.debts || [];
    if (!debts.length || !window.simulatePayoffWithSavings) return new Array(yearCount + 1).fill(0);
    const extra = Math.max(0, Number(data?.extraToDebt) || 0);
    const sav = Math.max(0, Number(data?.savingsTarget) || 0);
    const apy = Number(data?.debt?.savingsAPY) || 0;
    const strategy = data?.debt?.strategy || "avalanche";
    const sim = window.simulatePayoffWithSavings(debts, extra, strategy, sav, apy, 1);
    const series = sim.monthlyDebtTotal || [];
    const out = [];
    for (let y = 0; y <= yearCount; y++) {
      const idx = Math.min(series.length - 1, y * 12);
      out.push(series[idx] != null ? series[idx] : 0);
    }
    return out;
  }, [data?.debt, data?.extraToDebt, data?.savingsTarget, yearCount]);

  // Investments at end of each year — sum tracked investments' projected balance
  const investAtYear = useMemoOv(() => {
    const portfolio = data?.invest?.portfolio;
    if (!portfolio?.investments?.length || !window.projectSingleInvestment) return new Array(yearCount + 1).fill(0);
    const monthlySurplus = Math.max(0, Number(data?.savingsTarget) || 0);
    const series = new Array(yearCount + 1).fill(0);
    portfolio.investments.forEach((raw) => {
      const inv = {
        ...raw,
        compound: raw.compound != null ? !!raw.compound : false,
        principle: raw.principle != null ? Number(raw.principle) : 0,
        trackInOverview: raw.trackInOverview !== false,
      };
      if (!inv.trackInOverview) return;
      for (let y = 0; y <= yearCount; y++) {
        const monthlyFromBudget = inv.compound ? 0 : (monthlySurplus * (Number(inv.pct) || 0));
        const proj = window.projectSingleInvestment(inv, y, monthlyFromBudget);
        series[y] += proj.final || 0;
      }
    });
    return series;
  }, [data?.invest, data?.savingsTarget, yearCount]);

  // Cash projection = (1) entered accounts + (2) "Going to savings" portion that
  // doesn't land in a non-compound investment. Compound investments self-fund
  // from their own principle, so anything not allocated to a non-compound %
  // accumulates as cash, compounding at the Debt tab's savings APY.
  const cashAtYear = useMemoOv(() => {
    const series = new Array(yearCount + 1).fill(0);

    // (1) Entered accounts — each compounds at its own APY
    try {
      const accounts = JSON.parse(localStorage.getItem("ledger:accounts") || "[]");
      accounts.forEach((acct) => {
        const apy = Number(acct.apy) || 0;
        const bal0 = Number(acct.balance) || 0;
        for (let y = 0; y <= yearCount; y++) {
          series[y] += bal0 * Math.pow(1 + apy, y);
        }
      });
    } catch {}

    // (2) Unallocated savingsTarget → cash savings bucket
    const savingsTarget = Number(data?.savingsTarget) || 0;
    if (savingsTarget > 0) {
      const portfolio = data?.invest?.portfolio;
      const investments = portfolio?.investments || [];
      // Sum non-compound investment % — these consume from savingsTarget × pct
      const nonCompoundPctSum = investments.reduce((a, inv) => {
        const compound = inv.compound != null ? !!inv.compound : false;
        return compound ? a : a + (Number(inv.pct) || 0);
      }, 0);
      const cashFraction = Math.max(0, Math.min(1, 1 - nonCompoundPctSum));
      const monthlyToCash = savingsTarget * cashFraction;
      const apy = Number(data?.debt?.savingsAPY) || 0;
      const mRate = Math.pow(1 + apy, 1/12) - 1;
      let cash = 0;
      for (let y = 1; y <= yearCount; y++) {
        for (let m = 0; m < 12; m++) {
          cash = cash * (1 + mRate) + monthlyToCash;
        }
        series[y] += cash;
      }
    }

    return series;
  }, [yearCount, data?.savingsTarget, data?.debt?.savingsAPY, data?.invest]);

  // Build per-year row objects
  const rows = useMemoOv(() => {
    const out = [];
    let cumulativeSavings = 0;
    for (let i = 0; i < yearCount; i++) {
      const b = budgetYears[i] || {};
      const takeHome = b.takeHome || 0;
      const expenses = b.expenses || 0;
      const leftover = b.leftover || 0;
      cumulativeSavings += leftover;
      const yearEndIdx = i + 1;
      const debt = debtAtYear[yearEndIdx] || 0;
      const invest = investAtYear[yearEndIdx] || 0;
      const cash = cashAtYear[yearEndIdx] || 0;
      const netWorth = cash + invest - debt;
      out.push({
        year: b.year || (new Date().getFullYear() + i),
        n: i + 1,
        salary: b.salary || 0,
        takeHome,
        expenses,
        leftover,
        cumulativeSavings,
        debt,
        invest,
        cash,
        netWorth,
      });
    }
    return out;
  }, [budgetYears, debtAtYear, investAtYear, cashAtYear, yearCount]);

  const final = rows[rows.length - 1];
  const todayNet = (cashAtYear[0] || 0) + (investAtYear[0] || 0) - (debtAtYear[0] || 0);
  const finalNet = final?.netWorth || 0;
  const delta = finalNet - todayNet;

  return (
    <section className={"card" + (open ? "" : " is-collapsed")}>
      <header
        className="card-head"
        style={{ cursor: "pointer" }}
        onClick={() => setOpen((v) => !v)}
      >
        <h2 style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <span className={"debt-card-chevron" + (open ? " is-open" : "")} style={{ pointerEvents: "none" }} aria-hidden="true">▾</span>
          {yearCount}-year projection
        </h2>
        <span className="card-tag">
          today {fmtUSD0(todayNet)} → Y{yearCount} {fmtUSD0(finalNet)}
          {delta !== 0 && (
            <span style={{ marginLeft: 8, color: delta >= 0 ? "var(--positive)" : "var(--negative)" }}>
              {delta >= 0 ? "+" : ""}{fmtUSD0(delta)}
            </span>
          )}
        </span>
      </header>
      {open && <div className="card-body">
        <p className="footnote" style={{ marginTop: 0 }}>
          Projects forward using salary +{fmtPct(growth.salary, 0)}/yr, rent +{fmtPct(growth.rent, 0)}/yr,
          expenses +{fmtPct(growth.expenses, 0)}/yr (set on the Budget tab). Debt, investments, and cash
          come from your Debt, Investing, and Accounts state.
        </p>

        <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 12, marginTop: 14, flexWrap: "wrap" }}>
          <span className="footnote" style={{ marginRight: "auto", fontStyle: "normal" }}>Show:</span>
          {[1, 2, 3, 5, 7, 10].map((n) => (
            <button
              key={n}
              type="button"
              className="btn-ghost"
              style={yearCount === n ? { background: "var(--accent-bg)", borderColor: "var(--accent)" } : {}}
              onClick={() => setYearCount(n)}
            >
              {n}y
            </button>
          ))}
        </div>

        <table className="ptable">
          <thead>
            <tr>
              <th>Line</th>
              {rows.map((r) => <th key={r.n} className="num">Year {r.n}<br/><span style={{ fontSize: 10, color: "var(--ink-3)", fontWeight: 400 }}>{r.year}</span></th>)}
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Salary</td>
              {rows.map((r) => <td key={r.n} className="num">{fmtUSD0(r.salary)}</td>)}
            </tr>
            <tr>
              <td><strong>Take-home</strong></td>
              {rows.map((r) => <td key={r.n} className="num"><strong>{fmtUSD0(r.takeHome)}</strong></td>)}
            </tr>
            <tr>
              <td>− Annual expenses</td>
              {rows.map((r) => <td key={r.n} className="num neg">{fmtUSD0(r.expenses)}</td>)}
            </tr>
            <tr style={{ borderTop: "1px solid var(--border)" }}>
              <td><strong>= Annual surplus</strong></td>
              {rows.map((r) => (
                <td key={r.n} className={"num " + (r.leftover >= 0 ? "pos" : "neg")}>
                  <strong>{r.leftover >= 0 ? "+" : ""}{fmtUSD0(r.leftover)}</strong>
                </td>
              ))}
            </tr>
            <tr>
              <td><em>Cumulative surplus</em></td>
              {rows.map((r) => <td key={r.n} className="num" style={{ color: "var(--ink-3)" }}>{fmtUSD0(r.cumulativeSavings)}</td>)}
            </tr>
            <tr style={{ borderTop: "1px solid var(--border-2)" }}>
              <td>Debt remaining (end of year)</td>
              {rows.map((r) => <td key={r.n} className={"num " + (r.debt > 0 ? "neg" : "")}>{r.debt > 0 ? fmtUSD0(r.debt) : "—"}</td>)}
            </tr>
            <tr>
              <td>Investments (end of year)</td>
              {rows.map((r) => <td key={r.n} className="num pos">{fmtUSD0(r.invest)}</td>)}
            </tr>
            <tr>
              <td>Cash (end of year) <span style={{ fontSize: 10, color: "var(--ink-3)", marginLeft: 6 }}>accounts + unallocated savings</span></td>
              {rows.map((r) => <td key={r.n} className="num">{fmtUSD0(r.cash)}</td>)}
            </tr>
            <tr style={{ borderTop: "2px solid var(--border-2)" }}>
              <td><strong>= Net worth (end of year)</strong></td>
              {rows.map((r) => (
                <td key={r.n} className={"num " + (r.netWorth >= 0 ? "surplus" : "deficit")}>
                  <strong>{fmtUSD0(r.netWorth)}</strong>
                </td>
              ))}
            </tr>
          </tbody>
        </table>
      </div>}
    </section>
  );
}

// ─── Monthly / Yearly breakdown ──────────────────────────────────────────
// Collapsible card on the Overview page that lists income, taxes, every
// expense category, debt, savings, surplus — in both monthly AND yearly
// columns side-by-side. Lets the user compare per-period totals at a glance.
function MonthlyYearlyBreakdown({ data }) {
  const [open, setOpen] = useStateOv(true);
  const cats = data?.categories || [];
  const monthlyTakeHome = data?.monthlyTakeHome || 0;
  const monthlyTax = data?.monthlyTax || 0;
  const grossMonthly = monthlyTakeHome + monthlyTax;
  const leftover = data?.leftover || 0;

  const rows = [
    { label: "Gross income",         value: grossMonthly,    kind: "in"  },
    { label: "− Tax",                value: monthlyTax,      kind: "out" },
    { label: "= Take-home",          value: monthlyTakeHome, kind: "sub" },
    ...cats.filter((c) => c.group === "Out").map((c) => ({
      label: `− ${c.label}`, value: c.value, kind: "out",
    })),
    { label: "= Available leftover", value: leftover,        kind: "sub" },
    ...cats.filter((c) => c.group === "Save").map((c) => ({
      // Money flowing toward debt (Extra debt paydown) is still an outflow visually,
      // even though it's "your" money. Color it red. Pure savings/investing stays green.
      label: `→ ${c.label}`,
      value: c.value,
      kind: (c.from === "DEBT") ? "out" : "save",
    })),
    { label: "= Discretionary",      value: Math.max(0, leftover - cats.filter((c) => c.group === "Save").reduce((a, c) => a + c.value, 0)), kind: "sub" },
  ];

  return (
    <section className={"card" + (open ? "" : " is-collapsed")}>
      <header
        className="card-head"
        style={{ cursor: "pointer" }}
        onClick={() => setOpen((v) => !v)}
      >
        <h2 style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <span className={"debt-card-chevron" + (open ? " is-open" : "")} style={{ pointerEvents: "none" }} aria-hidden="true">▾</span>
          Monthly & yearly breakdown
        </h2>
        <span className="card-tag">
          {fmtUSD0(grossMonthly)}/mo · {fmtUSD0(grossMonthly * 12)}/yr
        </span>
      </header>
      {open && <div className="card-body">
        <table className="ptable">
          <thead>
            <tr>
              <th>Line</th>
              <th className="num">Monthly</th>
              <th className="num">Yearly</th>
              <th className="num">% of gross</th>
            </tr>
          </thead>
          <tbody>
            {rows.map((r, i) => {
              const pct = grossMonthly > 0 ? r.value / grossMonthly : 0;
              const colorClass = r.kind === "in" ? "pos"
                              : r.kind === "out" ? "neg"
                              : r.kind === "save" ? "pos"
                              : "";
              const isSubtotal = r.kind === "sub";
              return (
                <tr key={i} style={isSubtotal ? { borderTop: "1px solid var(--border-2)", fontWeight: 500 } : {}}>
                  <td>{isSubtotal ? <strong>{r.label}</strong> : r.label}</td>
                  <td className={"num " + colorClass}>
                    {isSubtotal ? <strong>{fmtUSD0(r.value)}</strong> : fmtUSD0(r.value)}
                  </td>
                  <td className={"num " + colorClass}>
                    {isSubtotal ? <strong>{fmtUSD0(r.value * 12)}</strong> : fmtUSD0(r.value * 12)}
                  </td>
                  <td className="num" style={{ color: "var(--ink-3)" }}>{(pct * 100).toFixed(1)}%</td>
                </tr>
              );
            })}
          </tbody>
        </table>
        <p className="footnote" style={{ marginTop: 12 }}>
          Yearly column = monthly × 12. Subtotal rows (Take-home, Available leftover, Discretionary) show
          where the money lands after each major slice.
        </p>
      </div>}
    </section>
  );
}

// ─── Tracked investments card ────────────────────────────────────────────
// Lists every investment that has trackInOverview=true and shows its
// projected balance at its target horizon (or the page horizon if none set).
// Collapsible. Pulls live from window.projectSingleInvestment so it stays
// in sync with the Investing tab without re-computing the whole portfolio.
function TrackedInvestmentsCard({ data }) {
  const [open, setOpen] = useStateOv(true);
  const invData   = data?.invest;
  const portfolio = invData?.portfolio;
  const pageYears = invData?.years || 10;

  if (!portfolio?.investments?.length) return null;

  // Migration + filter to "tracked" investments only
  const migrate = (inv) => ({
    ...inv,
    compound: inv.compound != null ? !!inv.compound : false,
    principle: inv.principle != null ? Number(inv.principle) : 0,
    goal: inv.goal || "",
    trackInOverview: inv.trackInOverview !== false,
    targetYears: inv.targetYears != null ? Number(inv.targetYears) : null,
    returnRate: Number(inv.returnRate) || 0,
  });
  const tracked = portfolio.investments.map(migrate).filter((i) => i.trackInOverview);
  if (!tracked.length) return null;

  // Compute each projection. For non-compound investments we don't know the
  // monthly-from-budget here, so we project them as pure principle compounding.
  const project = window.projectSingleInvestment || function (inv, yrs) {
    const months = Math.max(1, Math.round((yrs || 0) * 12));
    const mRate = Math.pow(1 + (inv.returnRate || 0), 1/12) - 1;
    let bal = inv.compound ? 0 : (Number(inv.principle) || 0);
    let c = inv.compound ? 0 : (Number(inv.principle) || 0);
    const mc = inv.compound ? (Number(inv.principle) || 0) : 0;
    for (let i = 0; i < months; i++) { bal += mc; c += mc; bal *= (1 + mRate); }
    return { final: bal, contributed: c, interest: bal - c };
  };

  const rows = tracked.map((inv) => {
    const yrs = inv.targetYears != null ? inv.targetYears : pageYears;
    const proj = project(inv, yrs);
    return { inv, yrs, ...proj };
  });

  const grandTotal = rows.reduce((a, r) => a + (r.final || 0), 0);
  const grandContrib = rows.reduce((a, r) => a + (r.contributed || 0), 0);
  const grandInterest = rows.reduce((a, r) => a + (r.interest || 0), 0);

  return (
    <section className={"card" + (open ? "" : " is-collapsed")}>
      <header
        className="card-head"
        style={{ cursor: "pointer" }}
        onClick={() => setOpen((v) => !v)}
      >
        <h2 style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <span className={"debt-card-chevron" + (open ? " is-open" : "")} style={{ pointerEvents: "none" }} aria-hidden="true">▾</span>
          Investment projections
        </h2>
        <span className="card-tag">
          {rows.length} tracked · {fmtUSD0(grandTotal)} projected
        </span>
      </header>
      {open && <div className="card-body">
        <p className="footnote" style={{ marginTop: 0 }}>
          Each investment you toggled "Track in Overview" appears here, projected to its target horizon.
          Toggle off on the Investing tab to hide one from this list.
        </p>

        <table className="ptable" style={{ marginTop: 12 }}>
          <thead>
            <tr>
              <th>Investment</th>
              <th>Goal</th>
              <th className="num">Horizon</th>
              <th className="num">Contributed</th>
              <th className="num">Interest</th>
              <th className="num">Projected balance</th>
            </tr>
          </thead>
          <tbody>
            {rows.map((r) => (
              <tr key={r.inv.id}>
                <td>
                  {r.inv.name}
                  {r.inv.compound && <span className="card-tag" style={{ marginLeft: 8, fontSize: 10 }}>compound</span>}
                </td>
                <td>{r.inv.goal || <span style={{ color: "var(--ink-4)" }}>—</span>}</td>
                <td className="num">{r.yrs} yr</td>
                <td className="num">{fmtUSD0(r.contributed)}</td>
                <td className="num pos">{fmtUSD0(r.interest)}</td>
                <td className="num"><strong>{fmtUSD0(r.final)}</strong></td>
              </tr>
            ))}
            <tr style={{ borderTop: "2px solid var(--border-2)", fontWeight: 500 }}>
              <td colSpan={3}><strong>Total tracked</strong></td>
              <td className="num"><strong>{fmtUSD0(grandContrib)}</strong></td>
              <td className="num pos"><strong>{fmtUSD0(grandInterest)}</strong></td>
              <td className="num"><strong>{fmtUSD0(grandTotal)}</strong></td>
            </tr>
          </tbody>
        </table>

        <div className="invest-breakdown-grid" style={{ marginTop: 18 }}>
          <div className="invest-breakdown-cell">
            <div className="invest-breakdown-label">You will contribute</div>
            <div className="invest-breakdown-value">{fmtUSD0(grandContrib)}</div>
            <div className="invest-breakdown-sub">across all tracked investments</div>
          </div>
          <div className="invest-breakdown-cell invest-breakdown-cell-accent">
            <div className="invest-breakdown-label">Interest will earn</div>
            <div className="invest-breakdown-value pos">{fmtUSD0(grandInterest)}</div>
            <div className="invest-breakdown-sub">{grandContrib > 0 ? `+${((grandInterest / grandContrib) * 100).toFixed(0)}% on contributions` : "—"}</div>
          </div>
          <div className="invest-breakdown-cell invest-breakdown-cell-final">
            <div className="invest-breakdown-label">Future balance</div>
            <div className="invest-breakdown-value surplus">{fmtUSD0(grandTotal)}</div>
            <div className="invest-breakdown-sub">at each investment's target horizon</div>
          </div>
        </div>
      </div>}
    </section>
  );
}

window.OverviewCalculator = OverviewCalculator;

</script>

<script type="text/babel" data-presets="react">
// Admin tab — restricted to ADMIN_EMAILS. Shows ALL users from Firestore
// (every account that has ever signed in to this app, across any device),
// plus a fallback view of accounts found in this browser's localStorage if
// Firebase isn't available.
const { useState: useStateAdmin, useEffect: useEffectAdmin, useMemo: useMemoAdmin } = React;

function AdminCalculator() {
  const [cloudUsers, setCloudUsers] = useStateAdmin([]);
  const [loading, setLoading]       = useStateAdmin(true);
  const [selected, setSelected]     = useStateAdmin(null);   // { uid, email, ...profile }
  const [selectedData, setSelectedData] = useStateAdmin(null); // map of key -> JSON string
  const [error, setError]           = useStateAdmin(null);
  const [tick, setTick]             = useStateAdmin(0);

  const sync = window.__firebaseSync;
  const fbAuthReady = sync && sync.enabled && sync.auth && sync.auth.currentUser;

  // Local accounts (this browser only) — shown as a separate section so admin
  // can still see users who never moved to the cloud.
  const localAccounts = useMemoAdmin(() => {
    try { return JSON.parse(window.__rawStorage?.get?.("ledger:auth:accounts") || "{}"); }
    catch { return {}; }
  }, [tick]);
  const currentEmail = window.__rawStorage?.get?.("ledger:auth:currentUser");

  // Pull all users from Firestore on mount + refresh tick
  useEffectAdmin(() => {
    let cancelled = false;
    async function load() {
      if (!fbAuthReady) { setLoading(false); return; }
      setLoading(true);
      setError(null);
      try {
        const users = await sync.listUsers();
        if (!cancelled) {
          // Sort by lastSignIn desc, then email
          users.sort((a, b) => {
            const at = a.lastSignIn ? new Date(a.lastSignIn).getTime() : 0;
            const bt = b.lastSignIn ? new Date(b.lastSignIn).getTime() : 0;
            return bt - at;
          });
          setCloudUsers(users);
        }
      } catch (e) {
        if (!cancelled) setError(e.message || String(e));
      }
      if (!cancelled) setLoading(false);
    }
    load();
    return () => { cancelled = true; };
  }, [tick, fbAuthReady]);

  // When admin clicks a row, fetch that user's full data subcollection.
  const openUser = async (user) => {
    setSelected(user);
    setSelectedData(null);
    if (!sync?.enabled) return;
    try {
      const data = await sync.readUserData(user.uid);
      setSelectedData(data);
    } catch (e) {
      setSelectedData({ __error: e.message || String(e) });
    }
  };

  const fmtDate = (iso) => {
    if (!iso) return "—";
    if (iso.toDate) iso = iso.toDate().toISOString(); // Firestore Timestamp
    const d = new Date(iso);
    if (isNaN(d)) return "—";
    return d.toLocaleDateString() + " " + d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  };

  // Local-only deletion (cloud delete would require a real backend / admin SDK)
  const deleteLocalAccount = (email) => {
    if (email === currentEmail) { alert("Sign in as another admin first."); return; }
    if (!window.confirm(`Delete local copy of ${email}? Cloud data on Firestore stays — only this browser's cache is wiped.`)) return;
    const map = { ...localAccounts };
    delete map[email];
    window.__rawStorage.set("ledger:auth:accounts", JSON.stringify(map));
    const prefix = `ledger:u:${email}:`;
    Object.keys(localStorage).filter((k) => k.startsWith(prefix)).forEach((k) => window.__rawStorage.del(k));
    setTick((t) => t + 1);
  };

  const localOnlyEntries = Object.entries(localAccounts).filter(
    ([email]) => !cloudUsers.find((u) => (u.email || "").toLowerCase() === email)
  );

  return (
    <>
      <header className="page-head">
        <div><h1 className="page-title">Admin <em>panel</em></h1></div>
        <div className="page-head-right">
          <div className="page-head-actions">
            <span className="card-tag">{cloudUsers.length} cloud · {Object.keys(localAccounts).length} local</span>
            <button className="btn-ghost" onClick={() => setTick((t) => t + 1)}>↻ refresh</button>
          </div>
          <div className="page-sub">All users across all devices, via Firestore</div>
        </div>
      </header>

      <div className="admin-explainer">
        <strong>🔐 Admin access:</strong> restricted to <code>{(window.__ADMIN_EMAILS || []).join(", ")}</code>.
        Firestore security rules enforce this on the server — even if a non-admin tries to query the users
        collection directly, they get permission-denied.
        <br/><br/>
        <strong>What you see:</strong> every user who has ever signed in with a password or Google account.
        Click a row to load that user's full saved data from the cloud. Guest accounts and password-less
        local accounts never reach the cloud, so they only show under "This browser only" below.
      </div>

      {error && (
        <div className="admin-error" style={{ background: "#fee", padding: 12, borderRadius: 6, margin: "12px 0" }}>

<script type="text/babel" data-presets="react">
// Monte Carlo simulation — stochastic projection of next-month leftover.
//
// Why this exists: every other projection in this app is deterministic — one
// input → one output. Real spending varies (groceries one month, car repair
// another). A Monte Carlo run samples each expense category from a normal
// distribution (mean = budgeted, σ = volatility preset) and re-runs the
// month's cashflow N times, yielding a probability distribution of outcomes.
//
// Pure functions exposed on window for testing. The React card lives below.

(function buildMonteCarlo() {
  // ── Volatility presets (σ as fraction of mean) ──
  // Picked from typical variance ranges for each category.
  // User picks one preset per category from a select; advanced users can
  // override σ directly via the manual input.
  const VOLATILITY_PRESETS = {
    stable:   { sigma: 0.05, label: "Stable (±5%)",     example: "rent, subs" },
    moderate: { sigma: 0.15, label: "Moderate (±15%)",  example: "groceries, utilities, gas" },
    volatile: { sigma: 0.30, label: "Volatile (±30%)",  example: "dining, entertainment, repairs" },
  };
  // Default volatility for each Budget category. User can override.
  const DEFAULT_VOLATILITY = {
    rent: "stable",
    groceries: "moderate",
    utilities: "moderate",
    carIns: "stable",
    gas: "moderate",
    otherLoan: "stable",
    secondary: "volatile",
    subscriptions: "stable",
  };

  // ── Box-Muller transform for Gaussian samples ──
  // Produces N(0,1) samples; scaled to N(mean, σ) by the caller.
  function normalSample(mean, sigma) {
    const u1 = Math.max(Number.EPSILON, Math.random());
    const u2 = Math.random();
    const z = Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);
    return mean + z * sigma;
  }

  // Run ONE scenario: sample each category, sum into a monthly outflow,
  // return resulting leftover = takeHome − outflow.
  function runScenario(takeHome, categories) {
    let outflow = 0;
    for (const c of categories) {
      // Clamp to non-negative; you can't spend negative dollars on rent.
      const sample = Math.max(0, normalSample(c.mean, c.sigma));
      outflow += sample;
    }
    return takeHome - outflow;
  }

  // Run N scenarios, return sorted array of leftovers.
  function runSimulation({ takeHome, categories, runs = 10000 }) {
    const out = new Array(runs);
    for (let i = 0; i < runs; i++) {
      out[i] = runScenario(takeHome, categories);
    }
    out.sort((a, b) => a - b);
    return out;
  }

  // Extract percentiles from a sorted array.
  // Standard linear interpolation between adjacent ranks.
  function percentiles(sortedOutcomes, pcts) {
    const n = sortedOutcomes.length;
    if (n === 0) return Object.fromEntries(pcts.map((p) => [p, 0]));
    const result = {};
    for (const p of pcts) {
      const rank = (p / 100) * (n - 1);
      const lo = Math.floor(rank);
      const hi = Math.ceil(rank);
      const frac = rank - lo;
      result[p] = sortedOutcomes[lo] * (1 - frac) + sortedOutcomes[hi] * frac;
    }
    return result;
  }

  // Probability of an outcome being below a threshold (e.g. P(leftover < 0)).
  function probBelow(sortedOutcomes, threshold) {
    let lo = 0, hi = sortedOutcomes.length;
    while (lo < hi) {
      const mid = (lo + hi) >>> 1;
      if (sortedOutcomes[mid] < threshold) lo = mid + 1; else hi = mid;
    }
    return lo / sortedOutcomes.length;
  }

  window.MonteCarlo = {
    VOLATILITY_PRESETS,
    DEFAULT_VOLATILITY,
    normalSample,
    runScenario,
    runSimulation,
    percentiles,
    probBelow,
  };
})();

// ─── React card ──────────────────────────────────────────────────────────
const { useState: useStateMC, useMemo: useMemoMC, useEffect: useEffectMC } = React;

function MonteCarloCard({ data }) {
  const [open, setOpen] = useStateMC(true);
  const [volatility, setVolatility] = useStateMC(() => {
    try {
      const saved = JSON.parse(localStorage.getItem("ledger:montecarlo") || "null");
      if (saved?.volatility) return saved.volatility;
    } catch {}
    return { ...window.MonteCarlo.DEFAULT_VOLATILITY };
  });
  const [runs, setRuns] = useStateMC(10000);

  useEffectMC(() => {
    localStorage.setItem("ledger:montecarlo", JSON.stringify({ volatility, runs }));
  }, [volatility, runs]);

  // Build categories array from Budget data
  const mc = window.MonteCarlo;
  const expenses = data?.expenses || {};
  const takeHome = data?.monthlyTakeHome || 0;

  const categories = useMemoMC(() => {
    if (!takeHome || !mc) return [];
    const cats = [];
    const push = (key, mean) => {
      if (mean <= 0) return;
      const preset = mc.VOLATILITY_PRESETS[volatility[key] || "moderate"];
      cats.push({ key, label: key, mean, sigma: mean * preset.sigma });
    };
    push("rent", window.expenseShare ? window.expenseShare(expenses, "rent") : (expenses.rent || 0));
    push("groceries", expenses.groceries != null ? Number(expenses.groceries) || 0 : Number(expenses.expenses) || 0);
    push("utilities", window.expenseShare ? window.expenseShare(expenses, "utilities") : Number(expenses.utilities) || 0);
    push("carIns", Number(expenses.carIns) || 0);
    push("gas", Number(expenses.gas) || 0);
    push("otherLoan", Number(expenses.otherLoan) || 0);
    const sec = (expenses.secondary || []).reduce((a, it) => a + (Number(it.amount) || 0), 0);
    if (sec > 0) cats.push({ key: "secondary", label: "secondary", mean: sec, sigma: sec * mc.VOLATILITY_PRESETS[volatility.secondary || "volatile"].sigma });
    const subs = (expenses.subscriptions || []).reduce((a, it) => a + (Number(it.amount) || 0), 0);
    if (subs > 0) cats.push({ key: "subscriptions", label: "subscriptions", mean: subs, sigma: subs * mc.VOLATILITY_PRESETS[volatility.subscriptions || "stable"].sigma });
    return cats;
  }, [expenses, volatility, takeHome]);

  const simResult = useMemoMC(() => {
    if (!mc || !takeHome || categories.length === 0) return null;
    const t0 = performance.now();
    const sorted = mc.runSimulation({ takeHome, categories, runs });
    const ms = performance.now() - t0;
    const pcts = mc.percentiles(sorted, [5, 25, 50, 75, 95]);
    const pNeg = mc.probBelow(sorted, 0);
    return { sorted, pcts, pNeg, ms };
  }, [categories, takeHome, runs]);

  if (!data || !window.MonteCarlo) return null;

  return (
    <section className={"card" + (open ? "" : " is-collapsed")}>
      <header
        className="card-head"
        style={{ cursor: "pointer" }}
        onClick={() => setOpen((v) => !v)}
      >
        <h2 style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <span className={"debt-card-chevron" + (open ? " is-open" : "")} style={{ pointerEvents: "none" }} aria-hidden="true">▾</span>
          Risk projection (Monte Carlo)
        </h2>
        <span className="card-tag">
          {simResult ? `${runs.toLocaleString()} runs · ${simResult.ms.toFixed(0)}ms` : "no data"}
        </span>
      </header>
      {open && <div className="card-body">
        {!simResult || categories.length === 0 ? (
          <p className="footnote">Set up your Budget first — the simulator needs at least one expense category to sample.</p>
        ) : (
          <>
            <p className="footnote" style={{ marginTop: 0 }}>
              Each of your expense categories is sampled from a normal distribution
              ({runs.toLocaleString()} runs) with σ set by the volatility preset below.
              The chart shows the full distribution of next-month leftover after sampled expenses.
            </p>

            {/* Headline result */}
            <div className="invest-breakdown-grid" style={{ marginBottom: 16 }}>
              <div className="invest-breakdown-cell">
                <div className="invest-breakdown-label">p5 (worst-case)</div>
                <div className="invest-breakdown-value neg">{fmtUSD0(simResult.pcts[5])}</div>
                <div className="invest-breakdown-sub">5% chance leftover ≤ this</div>
              </div>
              <div className="invest-breakdown-cell invest-breakdown-cell-accent">
                <div className="invest-breakdown-label">p50 (median)</div>
                <div className="invest-breakdown-value">{fmtUSD0(simResult.pcts[50])}</div>
                <div className="invest-breakdown-sub">50/50 — typical outcome</div>
              </div>
              <div className="invest-breakdown-cell">
                <div className="invest-breakdown-label">p95 (best-case)</div>
                <div className="invest-breakdown-value pos">{fmtUSD0(simResult.pcts[95])}</div>
                <div className="invest-breakdown-sub">5% chance leftover ≥ this</div>
              </div>
              <div className={"invest-breakdown-cell " + (simResult.pNeg > 0.20 ? "" : "invest-breakdown-cell-final")}>
                <div className="invest-breakdown-label">Risk of red month</div>
                <div className={"invest-breakdown-value " + (simResult.pNeg > 0.20 ? "neg" : "pos")}>
                  {(simResult.pNeg * 100).toFixed(1)}%
                </div>
                <div className="invest-breakdown-sub">probability leftover &lt; $0</div>
              </div>
            </div>

            {/* Histogram of outcomes */}
            <MonteCarloHistogram outcomes={simResult.sorted} pcts={simResult.pcts} />

            {/* Plain-English summary */}
            <p className="footnote" style={{ marginTop: 16 }}>
              <strong>80% confidence interval:</strong> next-month leftover lands between{" "}
              <strong>{fmtUSD0(simResult.pcts[5])}</strong> and{" "}
              <strong>{fmtUSD0(simResult.pcts[95])}</strong>.{" "}
              {simResult.pNeg > 0.20
                ? <span style={{ color: "var(--negative)" }}>⚠ High risk — {(simResult.pNeg * 100).toFixed(0)}% chance you finish the month in the red.</span>
                : simResult.pNeg > 0.05
                  ? <span style={{ color: "var(--gold)" }}>Some risk — {(simResult.pNeg * 100).toFixed(1)}% chance of a deficit.</span>
                  : <span style={{ color: "var(--positive)" }}>Low risk — only {(simResult.pNeg * 100).toFixed(1)}% chance of a deficit.</span>}
            </p>

            {/* Per-category volatility picker */}
            <h3 className="sub-head" style={{ marginTop: 24 }}>Volatility per category</h3>
            <p className="footnote" style={{ marginTop: 0 }}>
              How much does each category vary month-to-month? Pick a preset; the simulator uses it as σ.
            </p>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(220px, 1fr))", gap: 10, marginTop: 12 }}>
              {categories.map((c) => (
                <div key={c.key} className="invest-breakdown-cell" style={{ padding: 10 }}>
                  <div style={{ fontSize: 12, color: "var(--ink-3)", textTransform: "uppercase", letterSpacing: 0.5 }}>
                    {c.label}
                  </div>
                  <div style={{ fontSize: 14, color: "var(--ink)", margin: "2px 0 6px" }}>
                    {fmtUSD0(c.mean)} · σ {fmtUSD0(c.sigma)}
                  </div>
                  <select
                    className="select"
                    style={{ width: "100%" }}
                    value={volatility[c.key] || "moderate"}
                    onChange={(e) => setVolatility((v) => ({ ...v, [c.key]: e.target.value }))}
                  >
                    {Object.entries(window.MonteCarlo.VOLATILITY_PRESETS).map(([k, p]) => (
                      <option key={k} value={k}>{p.label}</option>
                    ))}
                  </select>
                </div>
              ))}
            </div>

            {/* Run count picker */}
            <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 16 }}>
              <span className="footnote" style={{ marginRight: "auto", fontStyle: "normal" }}>Runs:</span>
              {[1000, 5000, 10000, 50000].map((n) => (
                <button
                  key={n}
                  type="button"
                  className="btn-ghost"
                  style={runs === n ? { background: "var(--accent-bg)", borderColor: "var(--accent)" } : {}}
                  onClick={() => setRuns(n)}
                >
                  {n.toLocaleString()}
                </button>
              ))}
            </div>
          </>
        )}
      </div>}
    </section>
  );
}

// ─── Histogram (custom SVG — no library) ─────────────────────────────────
function MonteCarloHistogram({ outcomes, pcts }) {
  if (!outcomes || outcomes.length === 0) return null;
  const min = outcomes[0];
  const max = outcomes[outcomes.length - 1];
  const BINS = 40;
  const bins = new Array(BINS).fill(0);
  const range = max - min || 1;
  outcomes.forEach((v) => {
    const idx = Math.min(BINS - 1, Math.max(0, Math.floor(((v - min) / range) * BINS)));
    bins[idx]++;
  });
  const maxCount = Math.max(...bins);
  const W = 600, H = 160, PAD = 8;
  const barW = (W - 2 * PAD) / BINS;
  // Position of p5 / p50 / p95 markers along x-axis
  const xOf = (v) => PAD + ((v - min) / range) * (W - 2 * PAD);

  return (
    <div style={{ width: "100%", overflow: "hidden" }}>
      <svg width="100%" viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none" style={{ height: 160 }}>
        {/* Zero line */}
        {min < 0 && max > 0 && (
          <line x1={xOf(0)} y1={0} x2={xOf(0)} y2={H - 24}
            stroke="var(--negative)" strokeDasharray="3 3" strokeWidth="1" />
        )}
        {/* Bars */}
        {bins.map((count, i) => {
          const h = (count / maxCount) * (H - 36);
          const binMid = min + (i + 0.5) * (range / BINS);
          // Color bars red if center is below 0 (deficit), green if above
          const color = binMid < 0 ? "rgba(215, 118, 98, 0.7)" : "rgba(77, 167, 122, 0.7)";
          return (
            <rect
              key={i}
              x={PAD + i * barW}
              y={H - 24 - h}
              width={Math.max(0, barW - 1)}
              height={h}
              fill={color}
            />
          );
        })}
        {/* Percentile markers */}
        {[5, 50, 95].map((p) => (
          <g key={p}>
            <line x1={xOf(pcts[p])} y1={4} x2={xOf(pcts[p])} y2={H - 24}
              stroke={p === 50 ? "var(--gold)" : "var(--ink-3)"} strokeWidth={p === 50 ? 1.5 : 1}
              strokeDasharray={p === 50 ? "" : "4 3"} />
            <text x={xOf(pcts[p])} y={12} fill="var(--ink-3)" fontSize="9" textAnchor="middle">
              p{p}
            </text>
          </g>
        ))}
        {/* X-axis labels */}
        <text x={PAD} y={H - 6} fill="var(--ink-3)" fontSize="10">{fmtUSD0(min)}</text>
        <text x={W - PAD} y={H - 6} fill="var(--ink-3)" fontSize="10" textAnchor="end">{fmtUSD0(max)}</text>
      </svg>
    </div>
  );
}

window.MonteCarloCard = MonteCarloCard;

</script>

<script type="text/babel" data-presets="react">
// Math test suite — browser-runnable, no Node required. Asserts against
// every math helper that the app exposes on `window`. Trigger via the
// My-data menu "Run math tests" button (calls window.runMathTests).
//
// Tests are intentionally small and pinned to specific expected values so
// regressions in the cents refactor (Section B) are caught immediately.
(function buildMathTests() {
  const TESTS = [];
  function t(name, fn) { TESTS.push({ name, fn }); }

  // Tolerance for float comparisons (1 cent)
  const APPROX = 0.01;
  function eq(a, b, tol = APPROX) {
    if (typeof a === "number" && typeof b === "number") {
      return Math.abs(a - b) <= tol;
    }
    return a === b;
  }
  function assert(cond, msg) {
    if (!cond) throw new Error(msg || "assertion failed");
  }

  // ── toCents / toDollars round-trip (Section B helpers) ───────────────
  t("toCents: $0 → 0¢", () => {
    assert(window.toCents(0) === 0, "expected 0");
  });
  t("toCents: $1.23 → 123¢", () => {
    assert(window.toCents(1.23) === 123, "expected 123, got " + window.toCents(1.23));
  });
  t("toCents: rounds half-away-from-zero", () => {
    assert(window.toCents(0.005) === 1, "expected 1, got " + window.toCents(0.005));
    assert(window.toCents(-0.005) === -1, "expected -1, got " + window.toCents(-0.005));
  });
  t("toCents/toDollars: round-trip for normal range", () => {
    for (const v of [0, 1, 1.99, 100.5, 1234567.89]) {
      const c = window.toCents(v);
      const back = window.toDollars(c);
      assert(eq(back, v, 0.005), `round-trip lost: ${v} → ${c}¢ → ${back}`);
    }
  });
  t("toCents: handles NaN gracefully", () => {
    assert(window.toCents(NaN) === 0, "expected 0 for NaN");
    assert(window.toDollars(NaN) === 0, "expected 0 for NaN");
  });

  // ── fmtUSD0 (currency format with NaN/Infinity guard) ─────────────────
  t("fmtUSD0: formats integer", () => {
    assert(window.fmtUSD0(1234) === "$1,234", "expected $1,234");
  });
  t("fmtUSD0: handles NaN as em-dash", () => {
    const r = window.fmtUSD0(NaN);
    assert(r === "—" || r === "$0", "expected — or $0, got " + r);
  });
  t("fmtUSD0: handles Infinity as em-dash", () => {
    const r = window.fmtUSD0(Infinity);
    assert(r === "—" || r === "$0", "expected — or $0, got " + r);
  });
  t("fmtUSD0: handles negative", () => {
    const r = window.fmtUSD0(-500);
    assert(r === "-$500" || r === "−$500" || r.startsWith("-"), "expected negative format, got " + r);
  });

  // ── expenseShare (rent/utilities ÷ N people) ──────────────────────────
  t("expenseShare: rent ÷ 2 roommates", () => {
    const e = { rent: 1800, rentSplit: 2 };
    assert(eq(window.expenseShare(e, "rent"), 900), `expected 900, got ${window.expenseShare(e, "rent")}`);
  });
  t("expenseShare: no split = full amount", () => {
    const e = { rent: 1000 };
    assert(eq(window.expenseShare(e, "rent"), 1000), "expected 1000");
  });
  t("expenseShare: empty data returns 0", () => {
    assert(eq(window.expenseShare({}, "rent"), 0), "expected 0");
  });
  t("expenseShare: split=0 doesn't divide by zero", () => {
    const e = { rent: 1000, rentSplit: 0 };
    const r = window.expenseShare(e, "rent");
    assert(isFinite(r) && r > 0, "expected finite positive, got " + r);
  });

  // ── sumExpenses (back-compat for old `expenses` key) ──────────────────
  t("sumExpenses: new schema with groceries+utilities", () => {
    const e = { rent: 1000, groceries: 400, utilities: 200, carIns: 100, gas: 150, otherLoan: 50 };
    const r = window.sumExpenses(e);
    assert(eq(r, 1900), `expected 1900, got ${r}`);
  });
  t("sumExpenses: legacy combined `expenses` field still works", () => {
    const e = { rent: 1000, expenses: 600, carIns: 100, gas: 150, otherLoan: 50 };
    const r = window.sumExpenses(e);
    // legacy 600 → treated as groceries (utilities=0)
    assert(eq(r, 1900), `expected 1900, got ${r}`);
  });
  t("sumExpenses: empty returns 0", () => {
    assert(eq(window.sumExpenses({}), 0), "expected 0");
  });

  // ── optimizeAllocation (the upgraded optimizer) ───────────────────────
  t("optimizer: no debts → 25% / 75% (Savings)", () => {
    const r = window.optimizeAllocation({
      debts: [], cash: 1000, savingsAPY: 0.04,
      constraints: { minEmergencyFund: 0, clearSmallDebtsFirst: false, smallDebtThreshold: 500, maxDebtPctForcedSavings: 0.95 },
      currentLiquid: 999999,
    });
    assert(r.priority === "Savings", "expected Savings priority, got " + r.priority);
  });
  t("optimizer: high debt APR → 90% Debt", () => {
    const r = window.optimizeAllocation({
      debts: [{ balance: 5000, apr: 0.24, minPayment: 100 }],
      cash: 1000, savingsAPY: 0.04,
      constraints: { minEmergencyFund: 0, clearSmallDebtsFirst: false, smallDebtThreshold: 500, maxDebtPctForcedSavings: 0.95 },
      currentLiquid: 999999,
    });
    assert(r.priority === "Debt", "expected Debt priority, got " + r.priority);
    assert(eq(r.pct, 0.9), "expected pct 0.9, got " + r.pct);
  });
  t("optimizer: emergency fund constraint triggers", () => {
    const r = window.optimizeAllocation({
      debts: [{ balance: 5000, apr: 0.24, minPayment: 100 }],
      cash: 1000, savingsAPY: 0.04,
      constraints: { minEmergencyFund: 1000, clearSmallDebtsFirst: false, smallDebtThreshold: 500, maxDebtPctForcedSavings: 0.95 },
      currentLiquid: 100, // below floor
    });
    assert(r.constraintHit === "emergency", "expected emergency constraint, got " + r.constraintHit);
    assert(r.priority === "Savings", "expected Savings priority");
  });
  t("optimizer: small debt clears first (snowball)", () => {
    const r = window.optimizeAllocation({
      debts: [{ balance: 300, apr: 0.05, minPayment: 25 }],
      cash: 1000, savingsAPY: 0.10, // savings beats debt, but small debt wins
      constraints: { minEmergencyFund: 0, clearSmallDebtsFirst: true, smallDebtThreshold: 500, maxDebtPctForcedSavings: 0.95 },
      currentLiquid: 999999,
    });
    assert(r.constraintHit === "smallDebt", "expected smallDebt constraint, got " + r.constraintHit);
    assert(r.priority === "Debt", "expected Debt priority");
  });
  t("optimizer: max-debt-share caps split", () => {
    const r = window.optimizeAllocation({
      debts: [{ balance: 10000, apr: 0.30, minPayment: 200 }],
      cash: 1000, savingsAPY: 0.01,
      constraints: { minEmergencyFund: 0, clearSmallDebtsFirst: false, smallDebtThreshold: 0, maxDebtPctForcedSavings: 0.7 },
      currentLiquid: 999999,
    });
    // Would normally be 0.9 but cap is 0.7
    assert(eq(r.pct, 0.7), "expected pct capped at 0.7, got " + r.pct);
    assert(r.constraintHit === "maxDebtShare", "expected maxDebtShare constraint");
  });

  // ── projectSingleInvestment ──────────────────────────────────────────
  t("projectSingleInvestment: $0 → $0", () => {
    const r = window.projectSingleInvestment(
      { compound: false, principle: 0, returnRate: 0.05 }, 10, 0
    );
    assert(eq(r.final, 0), "expected 0");
  });
  t("projectSingleInvestment: lump sum compounds", () => {
    // $1000 at 10%/yr for 10 years should yield ~$2593
    const r = window.projectSingleInvestment(
      { compound: false, principle: 1000, returnRate: 0.10 }, 10, 0
    );
    assert(r.final > 2500 && r.final < 2700, `expected ~$2593, got ${r.final}`);
  });
  t("projectSingleInvestment: compound contribution mode", () => {
    // $100/mo at 0% for 12 months = $1200
    const r = window.projectSingleInvestment(
      { compound: true, principle: 100, returnRate: 0 }, 1, 0
    );
    assert(eq(r.final, 1200, 5), `expected 1200, got ${r.final}`);
  });
  t("projectSingleInvestment: extreme rate doesn't return Infinity", () => {
    // 10%/month for 50 years would overflow without clamping
    const r = window.projectSingleInvestment(
      { compound: true, principle: 500, returnRate: Math.pow(1.10, 12) - 1 }, 50, 0
    );
    assert(isFinite(r.final), "expected finite, got " + r.final);
  });

  // ── simulatePayoff (deterministic month-by-month) ─────────────────────
  t("simulatePayoff: 0% rate, $1000 balance, $100 min → 10 months", () => {
    const r = window.simulatePayoffWithSavings(
      [{ name: "X", balance: 1000, apr: 0, minPayment: 100 }],
      0, "avalanche", 0, 0, 1
    );
    assert(r.months === 10, `expected 10 months, got ${r.months}`);
    assert(eq(r.totalInterest, 0), "expected 0 interest at 0% rate");
  });
  t("simulatePayoff: high rate produces positive interest", () => {
    const r = window.simulatePayoffWithSavings(
      [{ name: "X", balance: 5000, apr: 0.24, minPayment: 200 }],
      0, "avalanche", 0, 0, 1
    );
    assert(r.totalInterest > 0, "expected interest > 0");
    assert(r.months > 0 && r.months < 600, "expected finite months");
  });
  t("simulatePayoff: monthlyDebtTotal array length matches months", () => {
    const r = window.simulatePayoffWithSavings(
      [{ name: "X", balance: 1000, apr: 0, minPayment: 100 }],
      0, "avalanche", 0, 0, 1
    );
    assert(Array.isArray(r.monthlyDebtTotal), "expected monthlyDebtTotal array");
    assert(r.monthlyDebtTotal[0] === 1000, "expected starting total = 1000");
    assert(eq(r.monthlyDebtTotal[r.monthlyDebtTotal.length - 1], 0), "expected ending total = 0");
  });

  // ── projectMonthEnd (burn rate calc) ─────────────────────────────────
  if (typeof window.projectMonthEnd === "function") {
    t("projectMonthEnd: needs 3+ days of data", () => {
      const r = window.projectMonthEnd({ spentSoFar: 50, daysElapsed: 1, budgetedMonth: 1000, today: new Date(2026, 5, 1) });
      assert(!r.ok, "expected ok:false for day 1");
    });
    t("projectMonthEnd: extrapolates linearly", () => {
      const r = window.projectMonthEnd({ spentSoFar: 300, daysElapsed: 10, budgetedMonth: 900, today: new Date(2026, 5, 10) });
      assert(r.ok, "expected ok:true");
      // 300 / 10 = $30/day, 30 days in June 2026 → projected $900
      assert(eq(r.projectedTotal, 900, 5), `expected ~900, got ${r.projectedTotal}`);
    });
    t("projectMonthEnd: rejects negative spent", () => {
      const r = window.projectMonthEnd({ spentSoFar: -50, daysElapsed: 5, budgetedMonth: 1000 });
      assert(!r.ok, "expected ok:false for negative spent");
    });
  }

  // ── Transactions module (data layer for the Record tab) ─────────────
  t("Transactions: totalCents empty list → 0", () => {
    assert(window.Transactions.totalCents([]) === 0, "expected 0");
    assert(window.Transactions.totalCents(null) === 0, "expected 0 for null");
    assert(window.Transactions.totalCents(undefined) === 0, "expected 0 for undefined");
  });
  t("Transactions: totalCents sums a single entry", () => {
    const r = window.Transactions.totalCents([{ amount_cents: 1234 }]);
    assert(r === 1234, "expected 1234, got " + r);
  });
  t("Transactions: byDay groups + per-day subtotal", () => {
    const txs = [
      { id: 1, amount_cents: 500,  category: "Coffee",    date: "2026-05-24" },
      { id: 2, amount_cents: 1200, category: "Lunch",     date: "2026-05-24" },
      { id: 3, amount_cents: 8000, category: "Groceries", date: "2026-05-23" },
    ];
    const groups = window.Transactions.byDay(txs);
    assert(groups.length === 2, "expected 2 day buckets, got " + groups.length);
    // Newest first
    assert(groups[0].date === "2026-05-24", "expected first bucket = 2026-05-24");
    assert(groups[0].total_cents === 1700, "expected first total 1700, got " + groups[0].total_cents);
    assert(groups[0].items.length === 2, "expected 2 items in first bucket");
    assert(groups[1].total_cents === 8000, "expected second total 8000");
  });
  t("Transactions: monthTotalCents filters by YYYY-MM prefix", () => {
    const txs = [
      { amount_cents: 100, date: "2026-05-01" },
      { amount_cents: 200, date: "2026-05-31" },
      { amount_cents: 999, date: "2026-06-01" }, // different month
    ];
    assert(window.Transactions.monthTotalCents(txs, "2026-05") === 300, "expected 300");
    assert(window.Transactions.monthTotalCents(txs, "2026-06") === 999, "expected 999");
    assert(window.Transactions.monthTotalCents(txs, "2027-01") === 0,   "expected 0");
  });

  // ── CSV export — local helper since the exporter is closure-scoped in calc-record.jsx
  t("CSV escape: fields with commas, quotes, or newlines are quoted properly", () => {
    const csvEscape = (val) => {
      const s = val == null ? "" : String(val);
      if (/[",\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
      return s;
    };
    assert(csvEscape("plain") === "plain", "plain string passes through");
    assert(csvEscape("with, comma") === '"with, comma"', "comma triggers quoting");
    assert(csvEscape('he said "hi"') === '"he said ""hi"""', "embedded quotes doubled");
    assert(csvEscape("line\nbreak") === '"line\nbreak"', "newline triggers quoting");
    assert(csvEscape(null) === "", "null becomes empty string");
    assert(csvEscape(0) === "0", "zero stays as 0 not blank");
  });

  // Runner — returns array of { name, pass, error? }
  window.runMathTests = function runMathTests() {
    const results = [];
    for (const { name, fn } of TESTS) {
      try {
        fn();
        results.push({ name, pass: true });
      } catch (e) {
        results.push({ name, pass: false, error: e.message });
      }
    }
    const passed = results.filter((r) => r.pass).length;
    console.log(`%c${passed}/${results.length} math tests passed`,
      passed === results.length ? "color:green;font-weight:bold" : "color:red;font-weight:bold");
    results.filter((r) => !r.pass).forEach((r) => {
      console.error("✗", r.name, "—", r.error);
    });
    return { passed, total: results.length, results };
  };
})();

</script>

<script type="text/babel" data-presets="react">
// Onboarding wizard — walks new users through setting up their finances in phases.
// Saves into the same localStorage keys the rest of the app uses, so everything is
// pre-populated when they land on the main dashboard.
const { useState: useStateOnb, useEffect: useEffectOnb } = React;

const ONBOARD_KEY = "ledger:onboarded";

// Save the user's wizard inputs into the same localStorage shape the rest of the app uses
function saveOnboardingData(data) {
  // Profile
  const profile = {
    salary: data.income.salary,
    bonus: data.income.bonus,
    additionalIncome: data.income.additionalIncome,
    additionalIncomeLabel: data.income.additionalIncomeLabel || "",
    filing: data.income.filing,
    state: data.income.state,
    city: data.income.city,
    ficaExempt: data.income.ficaExempt,
    jobStartDate: (() => {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    })(),
  };
  localStorage.setItem("ledger:profile", JSON.stringify(profile));

  // Budget — combine wizard expenses + vehicle gas into the existing 5-field model + new sections
  const monthlyGas = (data.vehicle.has && data.vehicle.milesPerDay && data.vehicle.mpg && data.vehicle.gasPrice)
    ? Math.round((data.vehicle.milesPerDay * data.vehicle.workdaysPerMonth * data.vehicle.gasPrice) / data.vehicle.mpg)
    : 0;
  const budget = {
    expenses: {
      rent: data.expenses.rent,
      expenses: data.expenses.groceries + data.expenses.utilities,
      carIns: data.vehicle.has ? data.vehicle.insurance : 0,
      gas: monthlyGas,
      otherLoan: 0,
      otherLoanAutoSync: false,
      secondary: data.expenses.secondary || [],
      subscriptions: data.expenses.subscriptions || [],
    },
    growth: { salary: 0.03, rent: 0.05, expenses: 0.03 },
    commute: {
      homeAddr: "", workAddr: "",
      oneWayMiles: data.vehicle.has ? (data.vehicle.milesPerDay || 0) / 2 : 0,
      driveMinutes: 0, homeResolved: "", workResolved: "",
      mpg: data.vehicle.mpg || 30,
      gasPrice: data.vehicle.gasPrice || 3.5,
      workdaysPerMonth: data.vehicle.workdaysPerMonth || 22,
      extraMilesPerDay: 0,
      status: "idle", error: "",
    },
  };
  localStorage.setItem("ledger:budget", JSON.stringify(budget));

  // Auto
  if (data.vehicle.has) {
    const auto = {
      type: data.vehicle.type,
      year: new Date().getFullYear(),
      make: "", model: "",
      introComplete: true,
      price: data.vehicle.price || 28000,
      down: 4000, tradeIn: 0,
      salesTaxRate: 0.07, fees: 600,
      apr: data.vehicle.financing === "loan" ? 0.069 : 0,
      termMonths: data.vehicle.financing === "loan" ? 60 : 0,
      insurance: data.vehicle.insurance,
      gas: monthlyGas,
      autoGas: true,
      maintenance: 80,
      maintenanceItems: (typeof MAINTENANCE_PRESETS !== "undefined" && MAINTENANCE_PRESETS[data.vehicle.type]) || [],
      regAnnual: 200, parking: 0,
    };
    localStorage.setItem("ledger:auto", JSON.stringify(auto));
  }

  // Debts
  if (data.debts && data.debts.length > 0) {
    const todayISO = (() => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; })();
    const debts = data.debts.map((d, i) => ({
      name: d.name,
      type: d.type,
      balance: d.balance,
      apr: d.apr,
      minPayment: d.minPayment,
      dueDay: 1,
      takenDate: todayISO,
    }));
    const debtState = {
      debts,
      spareCash: 500, autoSpare: true,
      debtPct: 0.5, savingsAPY: 0.04, paymentFreq: 1, strategy: "avalanche",
    };
    localStorage.setItem("ledger:debt", JSON.stringify(debtState));
  }

  // Cash reserves → seed the investing portfolio's emergency/reserve allocations + a savings goal note
  if (data.reserves && (data.reserves.emergencyGoal > 0 || data.reserves.reserveGoal > 0 || data.reserves.emergencyMonthly > 0)) {
    try {
      const inv = JSON.parse(localStorage.getItem("ledger:invest-v2") || "null") || {};
      const portfolio = inv.portfolio || {
        emergency: 0, reserve: 0,
        investments: [{ id: 1, name: "Stocks", pct: 0.30, returnRate: 0.10, horizon: "long", returnPeriod: "yearly", returnInput: 0.10, platform: "Fidelity" }],
      };
      // Allocate some of monthly savings toward emergency/reserve until the goal is hit
      // (rough heuristic: bias 30% emergency / 10% reserve / 60% investments if goal is set)
      if (data.reserves.emergencyGoal > 0) portfolio.emergency = 0.30;
      if (data.reserves.reserveGoal > 0)   portfolio.reserve   = 0.10;
      // Re-normalize investments to fill remaining %
      const cashShare = (portfolio.emergency || 0) + (portfolio.reserve || 0);
      const remaining = Math.max(0, 1 - cashShare);
      const invSum = portfolio.investments.reduce((a, b) => a + b.pct, 0) || 1;
      portfolio.investments = portfolio.investments.map((x) => ({ ...x, pct: (x.pct / invSum) * remaining }));
      inv.portfolio = portfolio;
      inv.savingsAPY = data.reserves.savingsApy ?? inv.savingsAPY ?? 0.04;
      // Save extra metadata for the user's reference (not yet used by the Investing tab)
      inv.reservesGoal = {
        emergencyGoal:    data.reserves.emergencyGoal,
        emergencyHave:    data.reserves.emergencyHave,
        emergencyMonthly: data.reserves.emergencyMonthly,
        reserveGoal:      data.reserves.reserveGoal,
      };
      localStorage.setItem("ledger:invest-v2", JSON.stringify(inv));
    } catch {}
  }

  localStorage.setItem(ONBOARD_KEY, "1");
}
