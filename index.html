<script type="text/babel" data-presets="react">
// Onboarding wizard — walks new users through setting up their finances in phases.
// Saves into the same localStorage keys the rest of the app uses, so everything is
// pre-populated when they land on the main dashboard.
const { useState: useStateOnb, useEffect: useEffectOnb } = React;

const ONBOARD_KEY = "ledger:onboarded";

// Save the user's wizard inputs into the same localStorage shape the rest of the app uses
function saveOnboardingData(data) {
  // Profile
  const profile = {
    salary: data.income.salary,
    bonus: data.income.bonus,
    additionalIncome: data.income.additionalIncome,
    additionalIncomeLabel: data.income.additionalIncomeLabel || "",
    filing: data.income.filing,
    state: data.income.state,
    city: data.income.city,
    ficaExempt: data.income.ficaExempt,
    jobStartDate: (() => {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    })(),
  };
  localStorage.setItem("ledger:profile", JSON.stringify(profile));

  // Budget — combine wizard expenses + vehicle gas into the existing 5-field model + new sections
  const monthlyGas = (data.vehicle.has && data.vehicle.milesPerDay && data.vehicle.mpg && data.vehicle.gasPrice)
    ? Math.round((data.vehicle.milesPerDay * data.vehicle.workdaysPerMonth * data.vehicle.gasPrice) / data.vehicle.mpg)
    : 0;
  const budget = {
    expenses: {
      rent: data.expenses.rent,
      expenses: data.expenses.groceries + data.expenses.utilities,
      carIns: data.vehicle.has ? data.vehicle.insurance : 0,
      gas: monthlyGas,
      otherLoan: 0,
      otherLoanAutoSync: false,
      secondary: data.expenses.secondary || [],
      subscriptions: data.expenses.subscriptions || [],
    },
    growth: { salary: 0.03, rent: 0.05, expenses: 0.03 },
    commute: {
      homeAddr: "", workAddr: "",
      oneWayMiles: data.vehicle.has ? (data.vehicle.milesPerDay || 0) / 2 : 0,
      driveMinutes: 0, homeResolved: "", workResolved: "",
      mpg: data.vehicle.mpg || 30,
      gasPrice: data.vehicle.gasPrice || 3.5,
      workdaysPerMonth: data.vehicle.workdaysPerMonth || 22,
      extraMilesPerDay: 0,
      status: "idle", error: "",
    },
  };
  localStorage.setItem("ledger:budget", JSON.stringify(budget));

  // Auto
  if (data.vehicle.has) {
    const auto = {
      type: data.vehicle.type,
      year: new Date().getFullYear(),
      make: "", model: "",
      introComplete: true,
      price: data.vehicle.price || 28000,
      down: 4000, tradeIn: 0,
      salesTaxRate: 0.07, fees: 600,
      apr: data.vehicle.financing === "loan" ? 0.069 : 0,
      termMonths: data.vehicle.financing === "loan" ? 60 : 0,
      insurance: data.vehicle.insurance,
      gas: monthlyGas,
      autoGas: true,
      maintenance: 80,
      maintenanceItems: (typeof MAINTENANCE_PRESETS !== "undefined" && MAINTENANCE_PRESETS[data.vehicle.type]) || [],
      regAnnual: 200, parking: 0,
    };
    localStorage.setItem("ledger:auto", JSON.stringify(auto));
  }

  // Debts
  if (data.debts && data.debts.length > 0) {
    const todayISO = (() => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; })();
    const debts = data.debts.map((d, i) => ({
      name: d.name,
      type: d.type,
      balance: d.balance,
      apr: d.apr,
      minPayment: d.minPayment,
      dueDay: 1,
      takenDate: todayISO,
    }));
    const debtState = {
      debts,
      spareCash: 500, autoSpare: true,
      debtPct: 0.5, savingsAPY: 0.04, paymentFreq: 1, strategy: "avalanche",
    };
    localStorage.setItem("ledger:debt", JSON.stringify(debtState));
  }

  // Cash reserves → seed the investing portfolio's emergency/reserve allocations + a savings goal note
  if (data.reserves && (data.reserves.emergencyGoal > 0 || data.reserves.reserveGoal > 0 || data.reserves.emergencyMonthly > 0)) {
    try {
      const inv = JSON.parse(localStorage.getItem("ledger:invest-v2") || "null") || {};
      const portfolio = inv.portfolio || {
        emergency: 0, reserve: 0,
        investments: [{ id: 1, name: "Stocks", pct: 0.30, returnRate: 0.10, horizon: "long", returnPeriod: "yearly", returnInput: 0.10, platform: "Fidelity" }],
      };
      // Allocate some of monthly savings toward emergency/reserve until the goal is hit
      // (rough heuristic: bias 30% emergency / 10% reserve / 60% investments if goal is set)
      if (data.reserves.emergencyGoal > 0) portfolio.emergency = 0.30;
      if (data.reserves.reserveGoal > 0)   portfolio.reserve   = 0.10;
      // Re-normalize investments to fill remaining %
      const cashShare = (portfolio.emergency || 0) + (portfolio.reserve || 0);
      const remaining = Math.max(0, 1 - cashShare);
      const invSum = portfolio.investments.reduce((a, b) => a + b.pct, 0) || 1;
      portfolio.investments = portfolio.investments.map((x) => ({ ...x, pct: (x.pct / invSum) * remaining }));
      inv.portfolio = portfolio;
      inv.savingsAPY = data.reserves.savingsApy ?? inv.savingsAPY ?? 0.04;
      // Save extra metadata for the user's reference (not yet used by the Investing tab)
      inv.reservesGoal = {
        emergencyGoal:    data.reserves.emergencyGoal,
        emergencyHave:    data.reserves.emergencyHave,
        emergencyMonthly: data.reserves.emergencyMonthly,
        reserveGoal:      data.reserves.reserveGoal,
      };
      localStorage.setItem("ledger:invest-v2", JSON.stringify(inv));
    } catch {}
  }

  localStorage.setItem(ONBOARD_KEY, "1");
}

// ─── Phase 2: Account (sign in / sign up / guest) ─────────────────────
function AccountPhase({ data, setData, next }) {
  const [mode, setMode] = useStateOnb(data.account?.mode || "choice"); // choice | signin | signup | guest
  const [email, setEmail] = useStateOnb(data.account?.email || "");
  const [firstName, setFirstName] = useStateOnb(data.account?.firstName || "");
  const [lastName, setLastName] = useStateOnb(data.account?.lastName || "");
  const [password, setPassword] = useStateOnb("");
  const [error, setError] = useStateOnb("");
  const [busy, setBusy] = useStateOnb(false);

  const existingAccounts = (() => {
    try { return JSON.parse(window.__rawStorage?.get?.("ledger:auth:accounts") || "{}"); }
    catch { return {}; }
  })();
  const hasExisting = Object.keys(existingAccounts).length > 0;

  const updAccount = (patch) => setData((d) => ({ ...d, account: { ...d.account, ...patch } }));

  const submit = async () => {
    setError("");
    const cleanEmail = email.trim().toLowerCase();
    if (mode !== "guest" && (!cleanEmail || !cleanEmail.includes("@"))) {
      setError("Enter a valid email."); return;
    }
    setBusy(true);
    try {
      // Hash password (SHA-256 via auth.jsx's helper, replicated here for safety)
      const enc = new TextEncoder().encode(password || "");
      const buf = await crypto.subtle.digest("SHA-256", enc);
      const hash = Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");
      const map = JSON.parse(window.__rawStorage.get("ledger:auth:accounts") || "{}");

      if (mode === "signup") {
        if (map[cleanEmail]) { setError("That email is already registered. Sign in instead."); setBusy(false); return; }
        const displayName = `${firstName.trim()} ${lastName.trim()}`.trim() || cleanEmail.split("@")[0];
        map[cleanEmail] = {
          firstName: firstName.trim(), lastName: lastName.trim(), name: displayName,
          passHash: hash, createdAt: new Date().toISOString(), lastSignIn: new Date().toISOString(),
        };
        window.__rawStorage.set("ledger:auth:accounts", JSON.stringify(map));
        window.__rawStorage.set("ledger:auth:currentUser", cleanEmail);
        updAccount({ email: cleanEmail, firstName, lastName, mode: "signup" });
      } else if (mode === "signin") {
        const account = map[cleanEmail];
        if (!account) { setError("No account with that email on this browser."); setBusy(false); return; }
        // Password is OPTIONAL — only validated if the user provides one AND account has one.
        if (password && account.passHash && account.passHash !== hash) {
          setError("Wrong password. (Or leave it blank — email is enough on this browser.)"); setBusy(false); return;
        }
        account.lastSignIn = new Date().toISOString();
        map[cleanEmail] = account;
        window.__rawStorage.set("ledger:auth:accounts", JSON.stringify(map));
        window.__rawStorage.set("ledger:auth:currentUser", cleanEmail);
        updAccount({ email: cleanEmail, firstName: account.firstName, lastName: account.lastName, mode: "signin" });
      } else if (mode === "guest") {
        window.__rawStorage.set("ledger:auth:currentUser", "_guest");
        updAccount({ email: "_guest", firstName: "Guest", lastName: "", mode: "guest" });
      }
      setBusy(false);
      next();
    } catch (e) {
      setError("Something went wrong: " + (e.message || "unknown"));
      setBusy(false);
    }
  };

  // Step 1 — choice screen
  if (mode === "choice") {
    return (
      <div className="onb-account-choice">
        <p className="expense-section-hint" style={{ textAlign: "center", marginTop: 0 }}>
          Your data will be saved under your account so you can come back to it anytime.
        </p>
        <div className="onb-account-options">
          <button className="onb-account-option" onClick={() => setMode(hasExisting ? "signin" : "signup")}>
            <div className="onb-account-icon">✦</div>
            <div className="onb-account-option-title">{hasExisting ? "Sign in" : "Create an account"}</div>
            <div className="onb-account-option-sub">
              {hasExisting ? "You already have an account on this browser" : "Save your finances with email + password"}
            </div>
          </button>
          {hasExisting && (
            <button className="onb-account-option" onClick={() => setMode("signup")}>
              <div className="onb-account-icon">+</div>
              <div className="onb-account-option-title">Create a new account</div>
              <div className="onb-account-option-sub">For a different person on this browser</div>
            </button>
          )}
          <button className="onb-account-option onb-account-option-subtle" onClick={() => setMode("guest")}>
            <div className="onb-account-icon">👤</div>
            <div className="onb-account-option-title">Continue as guest</div>
            <div className="onb-account-option-sub">No account — data is still saved on this device only</div>
          </button>
        </div>
      </div>
    );
  }

  // Step 2 — form for chosen mode
  if (mode === "guest") {
    // No form needed — just confirm and continue
    return (
      <div className="onb-form" style={{ alignItems: "center" }}>
        <div style={{ textAlign: "center", padding: "20px 0" }}>
          <div className="onb-account-icon" style={{ margin: "0 auto 16px", width: 56, height: 56, fontSize: 28 }}>👤</div>
          <p style={{ color: "var(--ink-2)", maxWidth: 360, margin: "0 auto 20px" }}>
            Continue as guest — your data is saved in this browser only.
            Use the My data button later to back up or restore.
          </p>
          <div style={{ display: "flex", gap: 10, justifyContent: "center" }}>
            <button className="btn-ghost" onClick={() => setMode("choice")}>← Back</button>
            <button className="btn-primary" onClick={submit} disabled={busy}>
              {busy ? "..." : "Continue →"}
            </button>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className="onb-form">
      <button type="button" className="btn-link" onClick={() => setMode("choice")} style={{ alignSelf: "flex-start" }}>
        ← Back
      </button>
      {mode === "signup" && (
        <div className="login-name-row">
          <Field label="First name">
            <input type="text" className="text-input" value={firstName}
              onChange={(e) => setFirstName(e.target.value)} placeholder="Nischal" />
          </Field>
          <Field label="Last name">
            <input type="text" className="text-input" value={lastName}
              onChange={(e) => setLastName(e.target.value)} placeholder="Sunar" />
          </Field>
        </div>
      )}
      <Field label="Email">
        <input type="email" className="text-input" value={email}
          onChange={(e) => setEmail(e.target.value)} placeholder="you@example.com" />
      </Field>
      <Field
        label="Password"
        hint={mode === "signin" ? "optional — leave blank to sign in with just email" : "optional — local only"}
      >
        <input type="password" className="text-input" value={password}
          onChange={(e) => setPassword(e.target.value)} placeholder="optional"
          onKeyDown={(e) => e.key === "Enter" && submit()} />
      </Field>
      {error && <div className="login-error">{error}</div>}
      <button className="btn-primary" onClick={submit} disabled={busy} style={{ marginTop: 4 }}>
        {busy ? "..." : (mode === "signin" ? "Sign in →" : "Create account →")}
      </button>
      <div style={{ textAlign: "center", fontSize: 12, color: "var(--ink-3)", marginTop: 4 }}>
        {mode === "signin"
          ? <>No account? <button type="button" className="btn-link" onClick={() => setMode("signup")}>Create one</button></>
          : <>Already have one? <button type="button" className="btn-link" onClick={() => setMode("signin")}>Sign in</button></>}
      </div>
    </div>
  );
}

// ─── Phase 3: Vehicle ──────────────────────────────────────────────────
function VehiclePhase({ data, setData }) {

                  }}

                  <span className="vehicle-type-glyph">{t.glyph}</span>

                { value: "lease", label: "Leased" },
              ]}
            />
          </Field>

          <div className="row-2">

              <Money value={v.insurance} onChange={(val) => upd("insurance", val)} placeholder="130" />
            </Field>
            <Field label="Miles per day" hint="round-trip">
              <NumberInput value={v.milesPerDay} onChange={(val) => upd("milesPerDay", val)} suffix="mi" step={1} />
            </Field>

// ─── Phase 4: Expenses ─────────────────────────────────────────────────
function ExpensesPhase({ data, setData }) {
  const exp = data.expenses;
  const upd = (k, v) => setData((d) => ({ ...d, expenses: { ...d.expenses, [k]: v } }));

  // Subscriptions: chip toggles add/remove; rendered list below lets user edit amount.
  // All mutations use functional setData so fast successive clicks don't drop changes.
  const subs = exp.subscriptions || [];
  const mutateSubs = (fn) => setData((d) => {
    const cur = d.expenses.subscriptions || [];
    return { ...d, expenses: { ...d.expenses, subscriptions: fn(cur) } };
  });
  const toggleSub = (name, amount) => mutateSubs((cur) => {
    const exists = cur.find((s) => s.name === name);
    if (exists) return cur.filter((s) => s.name !== name);
    const id = Math.max(0, ...cur.map((s) => s.id || 0)) + 1;
    return [...cur, { id, name, amount }];
  });
  const updSubAmount = (id, amount) => mutateSubs((cur) => cur.map((s) => s.id === id ? { ...s, amount } : s));
  const updSubName   = (id, name)   => mutateSubs((cur) => cur.map((s) => s.id === id ? { ...s, name } : s));
  const removeSub    = (id)         => mutateSubs((cur) => cur.filter((s) => s.id !== id));
  const addCustomSub = () => mutateSubs((cur) => {
    const id = Math.max(0, ...cur.map((s) => s.id || 0)) + 1;
    return [...cur, { id, name: "New subscription", amount: 0 }];
  });

  // Just names — amounts default to 0 so the user enters their own price below
  const presetSubs = [
    { name: "Netflix" }, { name: "Spotify" }, { name: "Gym" },
    { name: "iCloud / Drive" }, { name: "YouTube Premium" },
    { name: "Amazon Prime" }, { name: "ChatGPT / AI" }, { name: "Disney+" }, { name: "Hulu" },
  ];
  const subsTotal = subs.reduce((a, s) => a + (Number(s.amount) || 0), 0);

  // Shared-housing split — applies to BOTH rent AND utilities since they're typically
  // shared the same way among roommates. We save each user's share into exp.rent / exp.utilities.
  const splitOn      = !!exp.splitRent;
  const fullRent     = exp.rentFull      != null ? exp.rentFull      : exp.rent;
  const fullUtil     = exp.utilitiesFull != null ? exp.utilitiesFull : exp.utilities;
  const peopleCount  = exp.rentPeople || 2;
  const splitMethod  = exp.splitMethod || "equal";
  const customPct    = exp.rentShareLast != null ? exp.rentShareLast : Math.round(100 / peopleCount);

  const shareFor = (full) => {
    if (!splitOn) return full;
    if (splitMethod === "custom") return Math.round((full * customPct) / 100);
    return Math.round(full / Math.max(1, peopleCount));
  };
  const rentShare = shareFor(fullRent || 0);
  const utilShare = shareFor(fullUtil || 0);

  // Keep the saved per-user shares in sync whenever any split input changes
  React.useEffect(() => {
    if (splitOn) {
      if (rentShare !== exp.rent)      upd("rent", rentShare);
      if (utilShare !== exp.utilities) upd("utilities", utilShare);
    } else {
      if (exp.rentFull      != null && exp.rentFull      !== exp.rent)      upd("rent", exp.rentFull);
      if (exp.utilitiesFull != null && exp.utilitiesFull !== exp.utilities) upd("utilities", exp.utilitiesFull);
    }
  }, [splitOn, exp.rentFull, exp.utilitiesFull, peopleCount, splitMethod, customPct]);

  return (
    <div className="onb-form">
      <div className="onb-shared-housing">
        <div className="onb-shared-head">
          Shared housing costs
          <span className="onb-shared-hint">— rent & utilities split the same way</span>
        </div>
        <div className="row-2">
          <Field label="Rent / mortgage" hint={splitOn ? "full monthly amount" : "monthly"}>
            <Money
              value={fullRent}
              onChange={(v) => {
                upd("rentFull", v);
                if (!splitOn) upd("rent", v);
              }}
              placeholder="1,500"
            />
          </Field>
          <Field label="Utilities" hint={splitOn ? "full monthly amount" : "water, power, gas"}>
            <Money
              value={fullUtil}
              onChange={(v) => {
                upd("utilitiesFull", v);
                if (!splitOn) upd("utilities", v);
              }}
              placeholder="200"
            />
          </Field>
        </div>
      </div>

      <Field label="Do you split rent / utilities with others?" hint="roommates, partner, family">
        <Segment
          value={splitOn ? "yes" : "no"}
          onChange={(v) => {
            const on = v === "yes";
            upd("splitRent", on);
            if (on) {
              if (!exp.rentFull)      upd("rentFull",      exp.rent || 0);
              if (!exp.utilitiesFull) upd("utilitiesFull", exp.utilities || 0);
            }
          }}
          options={[
            { value: "no",  label: "No, it's just me" },
            { value: "yes", label: "Yes, with others" },
          ]}
        />
      </Field>

      {splitOn && (
        <div className="onb-split-box">
          <div className="row-2">
            <Field label="Total people sharing" hint="including you">
              <NumberInput
                value={peopleCount}
                onChange={(v) => upd("rentPeople", Math.max(1, Math.round(v) || 1))}
                suffix=""
                step={1}
              />
            </Field>
            <Field label="Split method">
              <Segment
                value={splitMethod}
                onChange={(v) => upd("splitMethod", v)}
                options={[
                  { value: "equal",  label: "Equal" },
                  { value: "custom", label: "Custom %" },
                ]}
              />
            </Field>
          </div>
          {splitMethod === "custom" && (
            <Field label="Your share" hint="% of full amounts (applies to both rent and utilities)">
              <NumberInput
                value={customPct}
                onChange={(v) => upd("rentShareLast", Math.max(0, Math.min(100, v)))}
                suffix="%"
              />
            </Field>
          )}
          <div className="onb-split-result">
            <div className="onb-split-line">
              <span>Your rent:</span>
              <strong>${rentShare.toLocaleString()}/mo</strong>
              <span className="onb-split-formula">
                {splitMethod === "custom"
                  ? `(${customPct}% of $${(fullRent||0).toLocaleString()})`
                  : `($${(fullRent||0).toLocaleString()} ÷ ${peopleCount})`}
              </span>
            </div>
            <div className="onb-split-line">
              <span>Your utilities:</span>
              <strong>${utilShare.toLocaleString()}/mo</strong>
              <span className="onb-split-formula">
                {splitMethod === "custom"
                  ? `(${customPct}% of $${(fullUtil||0).toLocaleString()})`
                  : `($${(fullUtil||0).toLocaleString()} ÷ ${peopleCount})`}
              </span>
            </div>
            <div className="onb-split-line onb-split-total">
              <span>Total your share:</span>
              <strong>${(rentShare + utilShare).toLocaleString()}/mo</strong>
            </div>
          </div>
        </div>
      )}

      <Field label="Groceries" hint="food at home">
        <Money value={exp.groceries} onChange={(v) => upd("groceries", v)} placeholder="500" />
      </Field>

      <Field
        label={`Subscriptions ${subsTotal > 0 ? `· $${subsTotal}/mo` : ""}`}
        hint="click chips to add — then enter your price below"
      >
        <div className="onb-chip-row">
          {presetSubs.map((s) => {
            const on = subs.some((x) => x.name === s.name);
            return (
              <button
                key={s.name}
                type="button"
                className={"onb-chip" + (on ? " is-on" : "")}
                onClick={() => toggleSub(s.name, 0)}
              >
                {on && "✓ "}{s.name}
              </button>
            );
          })}
          <button type="button" className="onb-chip" onClick={addCustomSub}>+ Custom</button>
        </div>

        {subs.length > 0 && (
          <div className="onb-sub-list">
            {subs.map((s) => (
              <div key={s.id} className="onb-sub-row">
                <input
                  type="text"
                  className="text-input"
                  value={s.name}
                  onChange={(e) => updSubName(s.id, e.target.value)}
                />
                <Money value={s.amount} onChange={(v) => updSubAmount(s.id, v)} placeholder="0" />
                <button type="button" className="icon-btn" onClick={() => removeSub(s.id)} title="Remove">×</button>
              </div>
            ))}
          </div>
        )}
      </Field>

      <Field label="Miscellaneous" hint="anything else">
        <Money value={exp.misc} onChange={(v) => upd("misc", v)} placeholder="0" />
      </Field>
    </div>
  );
}

// ─── Phase 5: Cash reserves (Emergency fund + buffer) ─────────────────
function CashReservesPhase({ data, setData }) {
  const r = data.reserves;
  const upd = (k, v) => setData((d) => ({ ...d, reserves: { ...d.reserves, [k]: v } }));

  // Quick presets for emergency-fund size (3 / 6 / 12 months of expenses)
  const monthlyExp = (data.expenses.rent || 0) + (data.expenses.groceries || 0)
                   + (data.expenses.utilities || 0) + (data.expenses.misc || 0);
  const presets = [
    { label: "3 months",  months: 3,  amount: Math.round(monthlyExp * 3) },
    { label: "6 months",  months: 6,  amount: Math.round(monthlyExp * 6) },
    { label: "12 months", months: 12, amount: Math.round(monthlyExp * 12) },
  ];

  const monthlyContribution = r.emergencyMonthly || 0;
  const monthsToGoal = monthlyContribution > 0 && r.emergencyGoal > 0
    ? Math.ceil(Math.max(0, r.emergencyGoal - (r.emergencyHave || 0)) / monthlyContribution)
    : null;

  return (
    <div className="onb-form">
      <p className="expense-section-hint" style={{ marginTop: -4 }}>
        Cash you keep aside for emergencies — separate from your investments.
        Most advisors recommend <strong>3–6 months of expenses</strong> in a
        high-yield savings account before serious investing.
      </p>

      <Field
        label="Emergency fund goal"
        hint={monthlyExp > 0 ? `your monthly expenses are about $${monthlyExp.toLocaleString()}` : "what you'd want saved up for emergencies"}
      >
        <Money value={r.emergencyGoal || 0} onChange={(v) => upd("emergencyGoal", v)} placeholder="10,000" />
      </Field>

      {monthlyExp > 0 && (
        <div className="onb-chip-row" style={{ marginTop: -6 }}>
          {presets.map((p) => (
            <button
              key={p.months}
              type="button"
              className={"onb-chip" + (r.emergencyGoal === p.amount ? " is-on" : "")}
              onClick={() => upd("emergencyGoal", p.amount)}
            >
              {p.label} <span className="onb-chip-amt">${p.amount.toLocaleString()}</span>
            </button>
          ))}
        </div>
      )}

      <div className="row-2">
        <Field label="Already saved" hint="how much you have now">
          <Money value={r.emergencyHave || 0} onChange={(v) => upd("emergencyHave", v)} placeholder="0" />
        </Field>
        <Field label="Monthly contribution" hint="amount you add each month">
          <Money value={r.emergencyMonthly || 0} onChange={(v) => upd("emergencyMonthly", v)} placeholder="200" />
        </Field>
      </div>

      {monthsToGoal != null && monthsToGoal > 0 && (
        <div className="onb-split-result">
          <span>You'll hit your goal in</span>
          <strong>{monthsToGoal} {monthsToGoal === 1 ? "month" : "months"}</strong>
          <span className="onb-split-formula">
            (${(r.emergencyGoal - (r.emergencyHave || 0)).toLocaleString()} ÷ ${(r.emergencyMonthly || 0).toLocaleString()}/mo)
          </span>
        </div>
      )}

      <Field
        label="Short-term reserve"
        hint="for upcoming purchases — car repairs, travel, etc. (optional)"
      >
        <Money value={r.reserveGoal || 0} onChange={(v) => upd("reserveGoal", v)} placeholder="2,000" />
      </Field>

      <Field label="Savings APY" hint="high-yield savings account interest rate">
        <NumberInput
          value={(r.savingsApy || 0) * 100}
          onChange={(v) => upd("savingsApy", (v || 0) / 100)}
          suffix="%"
        />
      </Field>
    </div>
  );
}

// ─── Phase 6: Debt ─────────────────────────────────────────────────────
function DebtPhase({ data, setData }) {
  const [hasDebt, setHasDebt] = useStateOnb(data.debts.length > 0 ? "yes" : null);
  const types = typeof DEBT_TYPES !== "undefined" ? DEBT_TYPES : {};
  const presets = ["credit_card", "student_loan", "car_loan", "personal_loan"];

  const todayISO = (() => {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  })();
  const addDebt = (typeKey) => {
    const t = types[typeKey];
    const balance = 1000;
    const minPayment = typeof estimateMinPayment === "function" ? estimateMinPayment(typeKey, balance, t?.apr || 0.09) : 50;
    setData((d) => {
      const id = Math.max(0, ...d.debts.map((x) => x.id || 0)) + 1;
      return {
        ...d,
        debts: [...d.debts, {
          id, name: t?.label || "Debt",
          type: typeKey,
          balance, apr: t?.apr || 0.09, minPayment,
          takenDate: todayISO,
        }],
      };
    });
  };
  const updDebt = (id, k, v) => setData((d) => ({
    ...d, debts: d.debts.map((x) => x.id === id ? { ...x, [k]: v } : x),
  }));
  const removeDebt = (id) => setData((d) => ({ ...d, debts: d.debts.filter((x) => x.id !== id) }));

  return (
    <div className="onb-form">
      <Field label="Do you have any debts?">
        <Segment
          value={hasDebt || ""}
          onChange={(v) => { setHasDebt(v); if (v === "no") setData((d) => ({ ...d, debts: [] })); }}
          options={[
            { value: "yes", label: "Yes" },
            { value: "no",  label: "Debt-free!" },
          ]}
        />
      </Field>

      {hasDebt === "yes" && (
        <>
          <Field label="Quick-add common debts" hint="click to add — edit details below">
            <div className="onb-chip-row">
              {presets.map((k) => (
                <button key={k} type="button" className="onb-chip" onClick={() => addDebt(k)}>
                  {types[k]?.icon} {types[k]?.label}
                </button>
              ))}
              <button type="button" className="onb-chip" onClick={() => addDebt("other")}>
                + Custom
              </button>
            </div>
          </Field>

          {data.debts.length > 0 && (
            <div className="onb-debt-list">
              {data.debts.map((d) => {
                const t = types[d.type] || types.other;
                return (
                  <div key={d.id} className="onb-debt-card">
                    <div className="onb-debt-row">
                      <span className="onb-debt-icon">{t?.icon || "•"}</span>
                      <input
                        type="text"
                        className="text-input"
                        value={d.name}
                        onChange={(e) => updDebt(d.id, "name", e.target.value)}
                      />
                      <Money value={d.balance} onChange={(v) => updDebt(d.id, "balance", v)} placeholder="balance" />
                      <NumberInput value={(d.apr * 100).toFixed(1)} onChange={(v) => updDebt(d.id, "apr", v / 100)} suffix="%" />
                      <button className="icon-btn" onClick={() => removeDebt(d.id)}>×</button>
                    </div>
                    <div className="onb-debt-meta">
                      <Field label="When did you take this loan?" hint="origination date">
                        <div
                          className="date-picker"
                          onClick={(e) => {
                            const inp = e.currentTarget.querySelector("input[type=date]");
                            if (inp && typeof inp.showPicker === "function") { try { inp.showPicker(); } catch {} } else { inp?.focus(); }
                          }}
                        >
                          <span className="date-picker-icon" aria-hidden="true">📅</span>
                          <input
                            type="date"
                            className="date-input"
                            value={d.takenDate || todayISO}
                            onChange={(e) => updDebt(d.id, "takenDate", e.target.value)}
                          />
                          <span className="date-picker-caret" aria-hidden="true">▾</span>
                        </div>
                      </Field>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </>
      )}
    </div>
  );
}

// ─── Phase 6: Finish ───────────────────────────────────────────────────
function FinishPhase({ data, finish }) {
  return (
    <div className="onb-finish">
      <div className="onb-finish-glyph">✦</div>
      <h2 className="onb-finish-title">You're all set!</h2>
      <p className="onb-finish-sub">Here's what we set up — you can edit any of it anytime.</p>
      <div className="onb-summary">
        <div className="onb-summary-row">
          <span>Income</span>
          <strong>${data.income.salary.toLocaleString()}/yr in {data.income.city || data.income.state}</strong>
        </div>
        {data.vehicle.has && (
          <div className="onb-summary-row">
            <span>Vehicle</span>
            <strong>{data.vehicle.type}, {data.vehicle.financing}, ${data.vehicle.insurance}/mo insurance</strong>
          </div>
        )}
        <div className="onb-summary-row">
          <span>Monthly expenses</span>
          <strong>${(data.expenses.rent + data.expenses.groceries + data.expenses.utilities + data.expenses.misc).toLocaleString()}</strong>
        </div>
        {data.reserves && data.reserves.emergencyGoal > 0 && (
          <div className="onb-summary-row">
            <span>Emergency fund goal</span>
            <strong>${data.reserves.emergencyGoal.toLocaleString()}</strong>
          </div>
        )}
        {data.debts.length > 0 && (
          <div className="onb-summary-row">
            <span>Debts</span>
            <strong>{data.debts.length} totaling ${data.debts.reduce((a, d) => a + d.balance, 0).toLocaleString()}</strong>
          </div>
        )}
      </div>
      <button className="btn-primary onb-cta" onClick={finish}>
        Open my dashboard →
      </button>
    </div>
  );
}

// ─── Main wizard shell ─────────────────────────────────────────────────
function OnboardingWizard({ onClose }) {
  const [phase, setPhase] = useStateOnb(0);
  const [data, setData] = useStateOnb({
    account: null, // { email, firstName, lastName, mode } — set in AccountPhase
    income: { salary: 65000, bonus: 0, additionalIncome: 0, additionalIncomeLabel: "", filing: "single", state: "NY", city: "", ficaExempt: false },
    vehicle: { has: null, type: "sedan", financing: "loan", insurance: 130, milesPerDay: 0, mpg: 30, gasPrice: 3.5, workdaysPerMonth: 22, price: 28000 },
    expenses: { rent: 1500, groceries: 500, utilities: 200, misc: 0, subscriptions: [], secondary: [] },
    reserves: { emergencyGoal: 0, emergencyHave: 0, emergencyMonthly: 0, reserveGoal: 0, savingsApy: 0.04 },
    debts: [],
  });

  const phases = [
    { title: "Welcome",          render: (p) => <WelcomePhase       {...p} /> },
    { title: "Your account",     render: (p) => <AccountPhase       {...p} /> },
    { title: "Your income",      render: (p) => <IncomePhase        {...p} /> },
    { title: "Your vehicle",     render: (p) => <VehiclePhase       {...p} /> },
    { title: "Monthly expenses", render: (p) => <ExpensesPhase      {...p} /> },
    { title: "Cash reserves",    render: (p) => <CashReservesPhase  {...p} /> },
    { title: "Any debts?",       render: (p) => <DebtPhase          {...p} /> },
    { title: "Ready",            render: (p) => <FinishPhase        {...p} /> },
  ];
  const total = phases.length;
  const isFirst = phase === 0;
  const isLast = phase === total - 1;
  const next = () => setPhase((p) => Math.min(total - 1, p + 1));
  const back = () => setPhase((p) => Math.max(0, p - 1));
  const finish = () => { saveOnboardingData(data); onClose(true); };
  const skip   = () => { localStorage.setItem(ONBOARD_KEY, "1"); onClose(false); };

  return (
    <div className="onb-overlay">
      <div className="onb-shell">
        <header className="onb-head">
          <div className="onb-progress">
            {phases.map((p, i) => (
              <div key={i}
                   className={"onb-progress-dot" + (i === phase ? " is-active" : "") + (i < phase ? " is-done" : "")}
                   title={p.title} />
            ))}
          </div>
          <button className="onb-skip" onClick={skip} title="Skip onboarding — you can re-run from My data">
            Skip for now
          </button>
        </header>

        <div className="onb-stage">
          {!isFirst && !isLast && (
            <div className="onb-phase-head">
              <div className="onb-phase-step">Step {phase + 1} of {total - 1}</div>
              <h2 className="onb-phase-title">{phases[phase].title}</h2>
            </div>
          )}
          <div className="onb-phase-body" key={phase}>
            {phases[phase].render({ data, setData, next, back, finish })}
          </div>
        </div>

        {!isFirst && !isLast && (
          <footer className="onb-foot">
            <button className="btn-ghost" onClick={back}>← Back</button>
            <button className="btn-primary" onClick={next}>Next →</button>
          </footer>
        )}
      </div>
    </div>
  );
}

window.OnboardingWizard = OnboardingWizard;
window.ONBOARD_KEY = ONBOARD_KEY;

</script>

<script type="text/babel" data-presets="react">
// Root app with sidebar navigation between calculators.
// Holds the shared profile (salary/filing/state/city) so all calculators share it.
const { useState: useStateApp, useEffect: useEffectApp } = React;

const DEFAULT_PROFILE = {
  salary: 65000,
  bonus: 0,
  additionalIncome: 0,
  additionalIncomeLabel: "",
  filing: "single",
  state: "NY",
  city: "Buffalo",
  ficaExempt: false,
  jobStartDate: (() => {
    // Use LOCAL date, not UTC — otherwise the default shows tomorrow's date for users east of UTC late in the day
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  })(),
};

function useProfile() {
  const [profile, setProfile] = useStateApp(DEFAULT_PROFILE);
  useEffectApp(() => {
    try {
      const saved = JSON.parse(localStorage.getItem("ledger:profile") || "null");
      if (saved) setProfile((p) => ({ ...p, ...saved }));
    } catch {}
  }, []);
  useEffectApp(() => {
    localStorage.setItem("ledger:profile", JSON.stringify(profile));
  }, [profile]);
  return [profile, setProfile];
}

// Light / dark mode toggle — uses the existing "forest" (dark) and "cream" (light)
// palettes from theme-tweaks.jsx. Persists choice to localStorage and re-applies
// on the next microtask to win against ThemeTweaks's mount-time effect.
// Top-right profile dropdown — avatar + click-to-expand menu
function ProfileCorner() {
  const [open, setOpen] = useStateApp(false);
  React.useEffect(() => {
    if (!open) return;
    const close = (e) => {
      if (!e.target.closest(".profile-corner")) setOpen(false);
    };
    document.addEventListener("mousedown", close);
    return () => document.removeEventListener("mousedown", close);
  }, [open]);

  const u = window.__currentUser;
  if (!u) return null;

  const display = (u.firstName || u.lastName)
    ? `${u.firstName || ""} ${u.lastName || ""}`.trim()
    : (u.name || "Guest");
  const initials = ((u.firstName || u.name || u.email || "?").charAt(0) +
                   (u.lastName ? u.lastName.charAt(0) : "")).toUpperCase();
  let lastSeen = "";
  if (u.lastSignIn && u.email !== "_guest") {
    const diff = Date.now() - new Date(u.lastSignIn).getTime();
    const min = Math.round(diff / 60000);
    if (min < 1) lastSeen = "Just now";
    else if (min < 60) lastSeen = `${min}m ago`;
    else if (min < 1440) lastSeen = `${Math.round(min/60)}h ago`;
    else lastSeen = `${Math.round(min/1440)}d ago`;
  }

  return (
    <div className={"profile-corner" + (open ? " is-open" : "")}>
      <button
        type="button"
        className="profile-corner-trigger"
        onClick={() => setOpen((v) => !v)}
        aria-label="Profile menu"
        title={display}
      >
        <span className="profile-corner-avatar">{initials}</span>
        <span className="profile-corner-name">{display}</span>
        <span className="profile-corner-caret">▾</span>
      </button>
      {open && (
        <div className="profile-corner-menu">
          <div className="profile-corner-head">
            <div className="profile-corner-avatar-lg">{initials}</div>
            <div className="profile-corner-meta">
              <div className="profile-corner-meta-name">{display}</div>
              <div className="profile-corner-meta-email">
                {u.email === "_guest" ? "Guest · data not saved" : u.email}
              </div>
              {lastSeen && (
                <div className="profile-corner-meta-lastseen">Signed in {lastSeen}</div>
              )}
            </div>
          </div>
          <div className="profile-corner-divider" />
          <button className="profile-corner-item" onClick={() => { setOpen(false); window.__switchAccount && window.__switchAccount(); }}>
            <span style={{ width: 20 }}>↻</span> Switch account
          </button>
          <button className="profile-corner-item" onClick={() => { setOpen(false); window.__signOut && window.__signOut(); }}>
            <span style={{ width: 20 }}>⎋</span> Sign out
          </button>
        </div>
      )}
    </div>
  );
}

function ColorModeToggle() {
  const [mode, setMode] = useStateApp(() => {
    // Default to LIGHT mode for new visitors — they opt-in to dark via the toggle
    try { return localStorage.getItem("ledger:colorMode") || "light"; } catch { return "light"; }
  });
  useEffectApp(() => {
    try { localStorage.setItem("ledger:colorMode", mode); } catch {}
    const apply = () => {
      if (window.applyTheme) {
        window.applyTheme(mode === "light" ? "cream" : "forest", "", "serif");
      }
      document.documentElement.dataset.colorMode = mode;
    };
    apply();
    // Re-apply on next tick to override ThemeTweaks's initial mount effect.
    const t = setTimeout(apply, 0);
    return () => clearTimeout(t);
  }, [mode]);
  return (
    <button
      type="button"
      className={"color-mode-toggle " + (mode === "light" ? "is-light" : "is-dark")}
      onClick={() => setMode((m) => (m === "dark" ? "light" : "dark"))}
      title={mode === "dark" ? "Switch to light mode" : "Switch to dark mode"}
      aria-label="Toggle color mode"
    >
      <span className="cmt-glyph">{mode === "dark" ? "☀" : "☾"}</span>
    </button>
  );
}

const CALCULATORS = [
  { id: "overview",  label: "Overview & totals",     glyph: "O" },
  { id: "budget",    label: "Budget & cashflow",     glyph: "B" },
  { id: "expenses",  label: "Monthly expenses",      glyph: "E" },
  { id: "household", label: "Household & roommates", glyph: "H" },
  { id: "invest",    label: "Savings & investing",   glyph: "S" },
  { id: "tax",       label: "Tax estimator",         glyph: "T" },
  { id: "auto",      label: "Auto & vehicle",        glyph: "A" },
  { id: "debt",      label: "Debt payoff",           glyph: "D" },
];

function App() {
  const [profile, setProfile] = useProfile();
  // Tick so the sidebar can re-render when debt data is added/removed from any tab
  const [, setNavTick] = useStateApp(0);
  useEffectApp(() => {
    const id = setInterval(() => setNavTick((t) => t + 1), 1500);
    return () => clearInterval(id);
  }, []);
  const [onboardOpen, setOnboardOpen] = useStateApp(() => {
    try {
      // Shareable links can force the welcome flow:
      //   /ledger/?welcome  → just shows the wizard (keeps existing data)
      //   /ledger/?reset    → wipes ALL saved data + shows wizard (fresh demo)
      const url = new URL(window.location.href);
      if (url.searchParams.has("reset")) {
        // Nuke every Ledger key — give the recipient a totally clean slate
        Object.keys(localStorage)
          .filter((k) => k.startsWith("ledger:"))
          .forEach((k) => localStorage.removeItem(k));
        // Strip the param so a refresh doesn't keep resetting
        url.searchParams.delete("reset");
        window.history.replaceState({}, "", url.toString());
        return true;
      }
      if (url.searchParams.has("welcome")) {
        localStorage.removeItem("ledger:onboarded");
        url.searchParams.delete("welcome");
        window.history.replaceState({}, "", url.toString());
        return true;
      }
      return !localStorage.getItem("ledger:onboarded");
    } catch { return false; }
  });
  const closeOnboard = (didFinish) => {
    setOnboardOpen(false);
    if (didFinish) {
      // Re-read profile from the newly-saved localStorage so the dashboard reflects wizard data
      try {
        const saved = JSON.parse(localStorage.getItem("ledger:profile") || "null");
        if (saved) setProfile((p) => ({ ...p, ...saved }));
      } catch {}
    }
  };
  // Expose so DataButton or other UI can re-launch the wizard
  React.useEffect(() => {
    window.__openOnboarding = () => { try { localStorage.removeItem("ledger:onboarded"); } catch {} setOnboardOpen(true); };
  }, []);

  const [sidebarHidden, setSidebarHidden] = useStateApp(() => {
    const saved = localStorage.getItem("ledger:sidebarHidden");
    if (saved === "1") return true;
    if (saved === "0") return false;
    // First visit: hide by default on narrow laptops so the page isn't cramped.
    return typeof window !== "undefined" && window.innerWidth < 1280;
  });
  useEffectApp(() => {
    localStorage.setItem("ledger:sidebarHidden", sidebarHidden ? "1" : "0");
  }, [sidebarHidden]);

  const [active, setActive] = useStateApp(() => {
    const hash = window.location.hash.slice(1);
    return CALCULATORS.find((c) => c.id === hash)?.id || "budget";
  });

  useEffectApp(() => { window.location.hash = active; }, [active]);
  useEffectApp(() => {
    const onHash = () => {
      const id = window.location.hash.slice(1);
      if (CALCULATORS.find((c) => c.id === id)) setActive(id);
    };
    window.addEventListener("hashchange", onHash);
    return () => window.removeEventListener("hashchange", onHash);
  }, []);

  const renderCalc = () => {
    switch (active) {
      case "budget":    return <BudgetCalculator profile={profile} setProfile={setProfile} />;
      case "expenses":  return <ExpensesCalculator profile={profile} />;
      case "household": return <HouseholdCalculator profile={profile} getBudgetData={() => window.__ledgerData} />;
      case "invest":    return <InvestingCalculator profile={profile} getBudgetData={() => window.__ledgerData} />;
      case "tax":       return <TaxEstimator    profile={profile} setProfile={setProfile} />;
      case "auto":      return <AutoLoan getBudgetData={() => window.__ledgerData} />;
      case "debt":      return <DebtPayoff getBudgetData={() => window.__ledgerData} />;
      case "overview":  return <OverviewCalculator profile={profile} getBudgetData={() => window.__ledgerData} />;
      default:          return null;
    }
  };

  return (
    <div className={"app" + (sidebarHidden ? " app-sidebar-hidden" : "")}>
      <aside className="sidebar">
        <div className="brand">
          <button
            type="button"
            className="brand-logo-btn"
            onClick={() => {
              const ok = window.confirm("Open the welcome / setup screen?\n\nYour existing data stays saved — you can change anything you want or just click 'Skip for now' to return.");
              if (ok) setOnboardOpen(true);
            }}
            title="Click to re-open the welcome / setup screen"
            aria-label="Open onboarding wizard"
          >
            <span className="brand-mark">$</span>
            <span className="brand-name">Ledger</span>
          </button>
          <ColorModeToggle />
          <button
            className="sidebar-toggle"
            onClick={() => setSidebarHidden(true)}
            title="Hide sidebar"
            aria-label="Hide sidebar"
          >
            ‹
          </button>
        </div>

        <div className="nav-section">Calculators</div>
        <nav className="nav">
          {/* Hide tabs that don't apply yet — e.g. Debt only shows when user has at least one debt */}
          {CALCULATORS
            .filter((c) => {
              if (c.id === "debt") {
                try {
                  const ds = JSON.parse(localStorage.getItem("ledger:debt") || "null");
                  return (ds?.debts || []).length > 0;
                } catch { return false; }
              }
              return true;
            })
            .map((c) => (
            <button
              key={c.id}
              className={"nav-item" + (active === c.id ? " is-active" : "")}
              onClick={() => setActive(c.id)}
            >
              <span className="nav-glyph">{c.glyph}</span>
              <span>{c.label}</span>
            </button>
          ))}
          <button
            type="button"
            className="nav-item nav-item-hide"
            onClick={() => setSidebarHidden(true)}
            title="Hide sidebar"
            aria-label="Hide sidebar"
          >
            <span className="nav-glyph">‹</span>
            <span>Hide sidebar</span>
          </button>
        </nav>

        <div className="sidebar-data-bottom">
          <DataButton />
        </div>
{/* Profile pill lives in the top-right corner (ProfileCorner). The old SALARY/LOCATION/FILING
    sidebar block was a duplicate of the same info — removed to clean up the sidebar. */}

        <div className="sidebar-foot">
          Personal finance toolkit. All math runs in your browser; nothing is sent anywhere.
        </div>
      </aside>

      <button
        className="sidebar-show"
        onClick={() => setSidebarHidden(false)}
        title="Show sidebar"
        aria-label="Show sidebar"
      >
        ›
      </button>

      <main className="main">
        {renderCalc()}
        <footer className="footer">
          2025 federal brackets &middot; state effective rates &middot; FICA wage base $176,100 &middot; not tax or financial advice.
        </footer>
      </main>
      <ProfileCorner />
      <AIAssistant getData={() => window.__ledgerData || { profile, expenses: {}, growth: {}, commute: {}, tax: null }} />
      <ThemeTweaks />
      {onboardOpen && <OnboardingWizard onClose={closeOnboard} />}
    </div>
  );
}

function startLedgerApp() {
  const root = ReactDOM.createRoot(document.getElementById("root"));
  // AuthGate shows the LoginScreen when no user is signed in.
  // Once signed in, it renders <App /> with localStorage namespaced to that user.
  const AuthGateC = window.AuthGate;
  root.render(AuthGateC ? <AuthGateC><App /></AuthGateC> : <App />);
}
// Framer Motion is loaded as an ESM module; wait for it before mounting so
// motion / AnimatePresence are guaranteed to be available everywhere.
if (window.FramerMotion) startLedgerApp();
else window.addEventListener("framer-motion-ready", startLedgerApp, { once: true });

</script>
</body></html>
