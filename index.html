function amortize(principal, annualRate, months) {
  const r = annualRate / 12;
  if (principal <= 0 || months <= 0) return { payment: 0, schedule: [] };
  const payment = r === 0
    ? principal / months
    : principal * (r * Math.pow(1 + r, months)) / (Math.pow(1 + r, months) - 1);
  const schedule = [];
  let balance = principal;
  for (let m = 1; m <= months; m++) {
    const interest = balance * r;
    const principalPaid = payment - interest;
    balance = Math.max(0, balance - principalPaid);
    schedule.push({ m, payment, interest, principal: principalPaid, balance });
  }
  return { payment, schedule };
}

// Typeable combobox: shows a dropdown of options, but you can also type freely.
// Filters as you type. Hitting Enter or clicking commits the value.
function ComboInput({ value, onChange, options, placeholder, disabled }) {
  const [open, setOpen] = useStateAuto(false);
  const [active, setActive] = useStateAuto(0);
  const inputRef = React.useRef(null);

  const filtered = React.useMemo(() => {
    const q = (value || "").trim().toLowerCase();
    if (!q) return options.slice(0, 200); // show all on focus when empty
    const prefix = [], substr = [];
    for (const o of options) {
      const lc = o.toLowerCase();
      if (lc.startsWith(q))    prefix.push(o);
      else if (lc.includes(q)) substr.push(o);
    }
    return [...prefix, ...substr].slice(0, 12);
  }, [value, options]);

  const pick = (v) => { onChange(v); setOpen(false); };

  return (
    <div className="combo-wrap">
      <input
        ref={inputRef}
        type="text"
        className="text-input combo-input"
        placeholder={placeholder}
        value={value || ""}
        disabled={disabled}
        onFocus={() => setOpen(true)}
        onBlur={() => setTimeout(() => setOpen(false), 150)}
        onChange={(e) => { onChange(e.target.value); setOpen(true); setActive(0); }}
        onKeyDown={(e) => {
          if (!open && (e.key === "ArrowDown" || e.key === "Enter")) {
            setOpen(true);
            return;
          }
          if (!open) return;
          if (e.key === "ArrowDown") { e.preventDefault(); setActive((a) => Math.min(a + 1, filtered.length - 1)); }
          else if (e.key === "ArrowUp")   { e.preventDefault(); setActive((a) => Math.max(a - 1, 0)); }
          else if (e.key === "Enter")     { e.preventDefault(); if (filtered[active]) pick(filtered[active]); }
          else if (e.key === "Escape")    { setOpen(false); }
        }}
        autoComplete="off"
        spellCheck={false}
      />
      <button
        type="button"
        className="combo-toggle"
        disabled={disabled}
        onMouseDown={(e) => {
          e.preventDefault(); // prevent input blur
          if (open) setOpen(false);
          else {
            setOpen(true);
            inputRef.current && inputRef.current.focus();
          }
        }}
        title="Show all options"
        aria-label="Toggle options"
      >
        ▾
      </button>
      {open && filtered.length > 0 && (
        <ul className="ac-list combo-list">
          {filtered.map((o, i) => (
            <li
              key={o}
              className={"ac-item" + (i === active ? " is-active" : "") + (o === value ? " is-current" : "")}
              onMouseDown={(e) => { e.preventDefault(); pick(o); }}
              onMouseEnter={() => setActive(i)}
            >
              {o}
              {o === value && <span style={{ marginLeft: "auto", color: "var(--accent)" }}>✓</span>}
            </li>
          ))}
        </ul>
      )}
    </div>
  );
}

function AutoLoan({ getBudgetData }) {
  const [v, setV] = useStateAuto({
    type: "sedan", year: CURRENT_YEAR, make: "", model: "",
    introComplete: false,
    price: 32000, down: 4000, tradeIn: 0,
    salesTaxRate: 0.07, fees: 600,
    apr: 0.069, termMonths: 60,
    insurance: 130,
    gas: 200,
    autoGas: true,
    maintenance: 80,
    maintenanceItems: MAINTENANCE_PRESETS.sedan,
    regAnnual: 200,
    parking: 0,
  });

  // Live re-read of Budget commute data so gas auto-syncs.
  const [, setTick] = useStateAuto(0);
  useEffectAuto(() => {
    const id = setInterval(() => setTick((t) => t + 1), 1500);
    return () => clearInterval(id);
  }, []);

  useEffectAuto(() => {
    try {
      const saved = JSON.parse(localStorage.getItem("ledger:auto") || "null");
      if (saved) setV((cur) => ({ ...cur, ...saved }));
    } catch {}
  }, []);
  useEffectAuto(() => {
    localStorage.setItem("ledger:auto", JSON.stringify(v));
  }, [v]);

  const upd = (k, val) => setV((s) => ({ ...s, [k]: val }));

  // When user picks a vehicle type, pull in smart defaults for MPG-relevant fields & maintenance.
  const applyTypeDefaults = (typeId) => {
    const type = VEHICLE_TYPES.find((t) => t.id === typeId);
    if (!type) return;
    setV((s) => ({
      ...s,
      type: typeId,
      insurance: s.introComplete ? s.insurance : type.defaults.insurance,
      price:     s.introComplete ? s.price     : type.defaults.basePrice,
      maintenanceItems: MAINTENANCE_PRESETS[typeId] || s.maintenanceItems,
    }));
  };

  // Auto-sync gas from Budget. We prefer the Budget commute calculation (if the user
  // has typed addresses + mpg + gas-price), and fall back to expenses.gas (which Budget's
  // commute card writes into automatically) so the value is always current either way.
  const budgetData = getBudgetData && getBudgetData();
  const budgetGas = (() => {
    // 1. Direct commute calc cost
    const c = budgetData?.commute?.cost;
    if (c != null && c > 0) return Math.round(c);
    // 2. Recompute from raw commute fields if available
    const cm = budgetData?.commute;
    if (cm && cm.oneWayMiles > 0 && cm.mpg > 0 && cm.gasPrice > 0 && cm.workdaysPerMonth > 0) {
      const totalMilesPerDay = (cm.oneWayMiles * 2) + (cm.extraMilesPerDay || 0);
      const gallonsPerDay = totalMilesPerDay / cm.mpg;
      return Math.round(gallonsPerDay * cm.gasPrice * cm.workdaysPerMonth);
    }
    // 3. Fallback: expenses.gas (which Budget keeps in sync with the commute calc)
    const ex = budgetData?.expenses?.gas;
    return ex != null && ex > 0 ? Math.round(ex) : null;
  })();
  useEffectAuto(() => {
    if (v.autoGas && budgetGas != null && Math.abs(budgetGas - v.gas) > 0.5) {
      setV((s) => ({ ...s, gas: budgetGas }));
    }
  }, [v.autoGas, budgetGas]);

  const calc = useMemoAuto(() => {
    const taxable = Math.max(0, v.price - v.tradeIn);
    const tax = taxable * v.salesTaxRate;
    const principal = Math.max(0, v.price + tax + v.fees - v.down - v.tradeIn);
    const { payment, schedule } = amortize(principal, v.apr, v.termMonths);
    const totalPaid = payment * v.termMonths;
    const totalInterest = Math.max(0, totalPaid - principal);

    // Itemized maintenance → monthly
    const items = v.maintenanceItems || [];
    const maintMonthly = items.length > 0
      ? items.reduce((a, it) => a + (it.cost || 0) * (it.perYear || 0) / 12, 0)
      : (v.maintenance || 0);
    const maintAnnual = maintMonthly * 12;

    const monthlyOwnership = (v.insurance || 0) + (v.gas || 0) + maintMonthly
                           + (v.parking || 0) + (v.regAnnual || 0) / 12;
    const monthlyTotal  = payment + monthlyOwnership;
    const annualTotal   = monthlyTotal * 12;
    const fiveYearTotal = monthlyTotal * 60 + v.down + v.tradeIn;

    return {
      taxable, tax, principal, payment, schedule,
      totalPaid, totalInterest,
      maintMonthly, maintAnnual,
      monthlyOwnership, monthlyTotal, annualTotal, fiveYearTotal,
    };
  }, [v]);

  // If user has never completed intro and there's no saved breakdown yet, show flow.
  const showIntro = !v.introComplete;
  if (showIntro) {
    return (
      <VehicleIntro
        v={v}
        onTypeSelect={applyTypeDefaults}
        onUpdate={upd}
        onContinue={() => upd("introComplete", true)}
      />
    );
  }

  return (
    <>

        <div>
          <h1 className="page-title">Auto <em>&amp; vehicle costs</em></h1>
        </div>
        <div className="page-head-right">
          <div className="page-head-actions">
            <button
              className="export-btn"
              onClick={() => upd("introComplete", false)}
              title="Edit vehicle profile"
            >
              <span className="export-btn-icon">✎</span>
              <span className="export-btn-label">Edit vehicle</span>
            </button>
            <ExportButton calculatorName="Auto & vehicle costs" />
          </div>
          <div className="page-sub">
            {(() => {
              const t = VEHICLE_TYPES.find((x) => x.id === v.type);
              const parts = [];
              if (v.year)  parts.push(v.year);
              if (v.make)  parts.push(v.make);
              if (v.model) parts.push(v.model);
              if (parts.length === 0 && t) parts.push(t.label);
              return `${t?.glyph || "—"} ${parts.join(" ") || "Your vehicle"}`;
            })()}
          </div>
        </div>
      </header>

      <CarHero v={v} />

      <div className="layout">
        <aside className="col-inputs">
          <section className="card">
            <header className="card-head"><h2>Vehicle & price</h2></header>
            <div className="card-body stack">
              <Field label="Vehicle price">
                <Money value={v.price} onChange={(x) => upd("price", x)} placeholder="32,000" />
              </Field>
              <Field label="Down payment">
                <Money value={v.down} onChange={(x) => upd("down", x)} placeholder="4,000" />
              </Field>
              <Field label="Trade-in value" hint="optional">
                <Money value={v.tradeIn} onChange={(x) => upd("tradeIn", x)} placeholder="0" />
              </Field>
              <div className="row-2">
                <Field label="Sales tax">
                  <NumberInput
                    value={Math.round((v.salesTaxRate || 0) * 1e6) / 1e4}
                    onChange={(x) => upd("salesTaxRate", Math.round((x || 0) * 1e4) / 1e6)}
                    suffix="%"
                  />
                </Field>
                <Field label="Fees" hint="title, doc">
                  <Money value={v.fees} onChange={(x) => upd("fees", x)} placeholder="600" />
                </Field>
              </div>
            </div>
          </section>

function PiBarChart({ schedule }) {
  if (!schedule.length) return null;
  const buckets = 12;
  const size = Math.ceil(schedule.length / buckets);
  const groups = [];
  for (let i = 0; i < schedule.length; i += size) {
    const slice = schedule.slice(i, i + size);
    groups.push({
      from: slice[0].m,
      to: slice[slice.length - 1].m,
      principal: slice.reduce((a, b) => a + b.principal, 0),
      interest:  slice.reduce((a, b) => a + b.interest, 0),
    });
  }
  const max = Math.max(...groups.map((g) => g.principal + g.interest)) || 1;

  return (
    <>
      <div style={{ display: "grid", gridTemplateColumns: `repeat(${groups.length}, 1fr)`, gap: 8, height: 180, alignItems: "end", marginBottom: 12 }}>
        {groups.map((g, i) => {
          const totH = ((g.principal + g.interest) / max) * 100;
          const pH = (g.principal / (g.principal + g.interest)) * totH;
          const iH = totH - pH;
          return (
            <div key={i} style={{ display: "flex", flexDirection: "column", justifyContent: "flex-end", height: "100%" }}>
              <div style={{ background: "var(--gold-dim)", height: iH + "%" }} title={`Interest ${fmtUSD0(g.interest)}`} />
              <div style={{ background: "var(--accent)", height: pH + "%", borderRadius: "3px 3px 0 0" }} title={`Principal ${fmtUSD0(g.principal)}`} />
            </div>
          );
        })}
      </div>
      <div style={{ display: "grid", gridTemplateColumns: `repeat(${groups.length}, 1fr)`, gap: 8 }}>
        {groups.map((g, i) => (
          <div key={i} style={{ fontFamily: "var(--display)", fontSize: 11, color: "var(--ink-3)", textAlign: "center", fontFeatureSettings: '"tnum"' }}>
            {g.from}–{g.to}

        ))}

      <div className="proj-legend" style={{ marginTop: 14 }}>
        <span><i className="dot" style={{ background: "var(--accent)" }} /> Principal</span>
        <span><i className="dot" style={{ background: "var(--gold-dim)" }} /> Interest</span>
      </div>
    </>
  );
}

<script type="text/babel" data-presets="react">
// Debt payoff — snowball vs avalanche. List debts, set extra monthly, see months saved.
const { useState: useStateDebt, useMemo: useMemoDebt, useEffect: useEffectDebt } = React;

// Debt types — each has a sensible APR default + a way to estimate minimum monthly payment.
const DEBT_TYPES = {
  credit_card:   { label: "Credit card",   icon: "💳", apr: 0.219, termYears: 0,  estimateMethod: "percent" },
  personal_loan: { label: "Personal loan", icon: "💵", apr: 0.115, termYears: 5,  estimateMethod: "amortize" },
  student_loan:  { label: "Student loan",  icon: "🎓", apr: 0.058, termYears: 10, estimateMethod: "amortize" },
  car_loan:      { label: "Car loan",      icon: "🚗", apr: 0.069, termYears: 5,  estimateMethod: "amortize" },
  mortgage:      { label: "Mortgage",      icon: "🏠", apr: 0.070, termYears: 30, estimateMethod: "amortize" },
  medical:       { label: "Medical",       icon: "🏥", apr: 0.000, termYears: 2,  estimateMethod: "amortize" },
  family:        { label: "Family / friend", icon: "👥", apr: 0.000, termYears: 3,  estimateMethod: "amortize" },
  other:         { label: "Other",         icon: "•",  apr: 0.090, termYears: 5,  estimateMethod: "amortize" },
};

// Compute a recommended minimum monthly payment for the given debt type & balance.
// - credit_card: 2% of balance OR $25, whichever is larger (industry-standard minimum formula)
// - amortize: standard mortgage-style payment over the type's typical term
function estimateMinPayment(type, balance, apr) {
  const t = DEBT_TYPES[type] || DEBT_TYPES.other;
  if (!balance || balance <= 0) return 0;
  if (t.estimateMethod === "percent") {
    return Math.max(25, Math.round(balance * 0.02));
  }
  const r = (apr || t.apr) / 12;
  const n = t.termYears * 12;
  if (n <= 0) return Math.round(balance);
  if (r === 0) return Math.round(balance / n);
  const pmt = balance * (r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
  return Math.round(pmt);
}

// Simulate debt payoff, optionally tracking a parallel savings bucket.
// paymentFreqMonths: how often the accumulated 'extra' is applied to debt (1, 3, 6, 12).
// Between payments, unspent extra sits in the debt fund earning the savings APY.
function simulatePayoffWithSavings(debts, monthlyExtra, strategy, monthlySavings, savingsAPY, paymentFreqMonths = 1) {
  const list = debts.map((d, i) => ({
    id: i, name: d.name, balance: d.balance, apr: d.apr, minPayment: d.minPayment,
    paidInterest: 0, paidoffMonth: null,
  })).filter((d) => d.balance > 0);

  const monthlySavingsRate = Math.pow(1 + (savingsAPY || 0), 1/12) - 1;
  let savingsBalance = 0;
  let pendingExtra = 0; // accumulated extra waiting to be applied at next payment interval
  let runningExtra = 0; // freed-up minimums from paid-off debts (roll forward)

  let month = 0;
  const MAX = 600;

  while (list.some((d) => d.balance > 0) && month < MAX) {
    month++;
    // Grow savings + contribute monthly savings
    savingsBalance = savingsBalance * (1 + monthlySavingsRate) + (monthlySavings || 0);
    // Pending extra also earns APY (sitting in same savings account between payments)
    pendingExtra = pendingExtra * (1 + monthlySavingsRate) + (monthlyExtra || 0);

    // Charge interest on each debt
    for (const d of list) {
      if (d.balance <= 0) continue;
      const i = d.balance * (d.apr / 12);
      d.balance += i;
      d.paidInterest += i;
    }

    // Apply minimums every month
    for (const d of list) {
      if (d.balance <= 0) continue;
      const pay = Math.min(d.minPayment, d.balance);
      d.balance -= pay;
      if (d.balance <= 0.005) {
        d.balance = 0;
        if (d.paidoffMonth === null) d.paidoffMonth = month;
      }
    }

    // Apply the lump sum (pendingExtra + rolled minimums) ONLY at payment intervals
    const isPaymentMonth = (month % paymentFreqMonths === 0);
    if (isPaymentMonth) {
      let leftover = pendingExtra + runningExtra;
      pendingExtra = 0;
      const targets = list
        .filter((d) => d.balance > 0)
        .sort((a, b) => strategy === "snowball" ? a.balance - b.balance : b.apr - a.apr);
      let i = 0;
      while (leftover > 0 && targets[i]) {
        const t = targets[i];
        const pay = Math.min(leftover, t.balance);
        t.balance -= pay;
        leftover -= pay;
        if (t.balance <= 0.005) {
          t.balance = 0;
          if (t.paidoffMonth === null) t.paidoffMonth = month;
        }
        i++;
      }
      // Any leftover after all debts cleared goes into savings
      if (leftover > 0) savingsBalance += leftover;
    }

    // Roll freed minimums forward for next payment interval
    runningExtra += list
      .filter((d) => d.balance === 0 && d.paidoffMonth === month)
      .reduce((a, b) => a + b.minPayment, 0);
  }

  // Add any leftover pending extra to savings when done
  savingsBalance += pendingExtra;

  return {
    months: month,
    totalInterest: list.reduce((a, b) => a + b.paidInterest, 0),
    perDebt: list,
    savingsBalance,
  };
}

function simulatePayoff(debts, extra, strategy) {
  // Clone debts with running balances.
  const list = debts.map((d, i) => ({
    id: i, name: d.name, balance: d.balance, apr: d.apr, minPayment: d.minPayment,
    paidInterest: 0, paidoffMonth: null,
  })).filter((d) => d.balance > 0);

  const events = [];
  let month = 0;
  const MAX = 600; // 50 years cap

  while (list.some((d) => d.balance > 0) && month < MAX) {
    month++;
    // 1. Charge interest
    for (const d of list) {
      if (d.balance <= 0) continue;
      const i = d.balance * (d.apr / 12);
      d.balance += i;
      d.paidInterest += i;
    }
    // 2. Apply minimums
    let leftover = extra;
    for (const d of list) {
      if (d.balance <= 0) continue;
      const pay = Math.min(d.minPayment, d.balance);
      d.balance -= pay;
      // capture freed-up minimums to roll
      if (d.balance <= 0.005) {
        d.balance = 0;
        if (d.paidoffMonth === null) d.paidoffMonth = month;
      }
    }
    // 3. Apply extra to the chosen target
    const targets = list
      .filter((d) => d.balance > 0)
      .sort((a, b) => strategy === "snowball" ? a.balance - b.balance : b.apr - a.apr);
    let i = 0;
    while (leftover > 0 && targets[i]) {
      const t = targets[i];
      const pay = Math.min(leftover, t.balance);
      t.balance -= pay;
      leftover -= pay;
      if (t.balance <= 0.005) {
        t.balance = 0;
        if (t.paidoffMonth === null) t.paidoffMonth = month;
      }
      i++;
    }
    // Also: roll freed minimums forward (debt snowball / avalanche cascading)
    // Already handled implicitly because remaining extra cascades next month
    // through unchanged minimums; but a stricter implementation rolls minimums of
    // paid-off debts into extra. Add that:
    extra += list
      .filter((d) => d.balance === 0 && d.paidoffMonth === month)
      .reduce((a, b) => a + b.minPayment, 0);
  }

  const totalInterest = list.reduce((a, b) => a + b.paidInterest, 0);
  return { months: month, totalInterest, perDebt: list };
}

function DebtPayoff({ getBudgetData }) {
  const todayISO = (() => {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  })();
  const [debts, setDebts] = useStateDebt([
    { name: "Credit card",  type: "credit_card",  balance: 5400,  apr: 0.234, minPayment: 150, dueDay: 1,  takenDate: todayISO },
    { name: "Student loan", type: "student_loan", balance: 18500, apr: 0.058, minPayment: 220, dueDay: 15, takenDate: todayISO },
    { name: "Car loan",     type: "car_loan",     balance: 9200,  apr: 0.069, minPayment: 295, dueDay: 10, takenDate: todayISO },
  ]);
  const [spareCash, setSpareCash] = useStateDebt(500);
  const [autoSpare, setAutoSpare] = useStateDebt(true);
  const [debtPct, setDebtPct] = useStateDebt(0.5);
  const [savingsAPY, setSavingsAPY] = useStateDebt(0.04);
  const [paymentFreq, setPaymentFreq] = useStateDebt(1); // months
  const [strategy, setStrategy] = useStateDebt("avalanche");
  // Per-debt expand/collapse state (not persisted — just a UI preference for the session)
  const [expandedDebts, setExpandedDebts] = useStateDebt({}); // { [idx]: bool }
  const isExpanded = (i) => expandedDebts[i] !== false; // default: expanded
  const toggleExpanded = (i) => setExpandedDebts((m) => ({ ...m, [i]: !isExpanded(i) }));
  const collapseAll = () => setExpandedDebts(Object.fromEntries(debts.map((_, i) => [i, false])));
  const expandAll   = () => setExpandedDebts({});
  // Whole "Your debts" section open/closed
  const [debtsListOpen, setDebtsListOpen] = useStateDebt(true);
  // Custom $ amount to pay toward debt (overrides the % slider when set)
  const [customDebtAmount, setCustomDebtAmount] = useStateDebt(null);

  // Auto-link spare cash to Budget's monthly leftover when autoSpare is on.
  const budgetData = getBudgetData && getBudgetData();
  const budgetLeftover = useMemoDebt(() => {
    if (!budgetData || !budgetData.tax || !budgetData.expenses) return null;
    const monthlyTakeHome = budgetData.tax.takeHome / 12;
    const monthlyExp = window.sumExpenses ? window.sumExpenses(budgetData.expenses) : Object.values(budgetData.expenses).filter(v => typeof v === "number").reduce((a, b) => a + b, 0);
    return Math.max(0, Math.round(monthlyTakeHome - monthlyExp));
  }, [budgetData?.tax?.takeHome, JSON.stringify(budgetData?.expenses || {})]);

  useEffectDebt(() => {
    if (autoSpare && budgetLeftover != null) setSpareCash(budgetLeftover);
  }, [autoSpare, budgetLeftover]);

  // Force re-read of budget data periodically so the link stays live.
  const [, setTick] = useStateDebt(0);
  useEffectDebt(() => {
    const id = setInterval(() => setTick((t) => t + 1), 1500);
    return () => clearInterval(id);
  }, []);

  useEffectDebt(() => {
    try {
      const saved = JSON.parse(localStorage.getItem("ledger:debt") || "null");
      if (saved) {
        saved.debts && setDebts(saved.debts);
        typeof saved.spareCash === "number" && setSpareCash(saved.spareCash);
        typeof saved.autoSpare === "boolean" && setAutoSpare(saved.autoSpare);
        typeof saved.debtPct === "number" && setDebtPct(saved.debtPct);
        typeof saved.savingsAPY === "number" && setSavingsAPY(saved.savingsAPY);
        typeof saved.paymentFreq === "number" && setPaymentFreq(saved.paymentFreq);
        saved.strategy && setStrategy(saved.strategy);
      }
    } catch {}
  }, []);
  useEffectDebt(() => {
    localStorage.setItem("ledger:debt", JSON.stringify({ debts, spareCash, autoSpare, debtPct, savingsAPY, paymentFreq, strategy }));
  }, [debts, spareCash, autoSpare, debtPct, savingsAPY, paymentFreq, strategy]);

  // Derive extra-toward-debt and to-savings from EITHER the % slider OR a custom $ amount.
  // When customDebtAmount is a number, it wins (and the slider is shown as just a visual).
  const useCustom = customDebtAmount != null && customDebtAmount >= 0;
  const extra     = useCustom
    ? Math.min(Math.round(customDebtAmount), Math.round(spareCash))
    : Math.round(spareCash * debtPct);
  const toSavings = Math.max(0, Math.round(spareCash) - extra);
  const effectivePct = spareCash > 0 ? extra / spareCash : 0;

  const updDebt = (i, k, v) => setDebts((d) => d.map((x, j) => j === i ? { ...x, [k]: v } : x));
  const removeDebt = (i) => setDebts((d) => d.filter((_, j) => j !== i));
  const addDebt = () => setDebts((d) => [...d, {
    name: "New debt", type: "other", balance: 1000, apr: 0.10, minPayment: 50,
    dueDay: 1, takenDate: todayISO,
  }]);

  // When user picks a debt type, prefill APR and recompute the suggested min payment.
  const applyDebtType = (i, typeKey) => {
    const t = DEBT_TYPES[typeKey];
    if (!t) return;
    setDebts((arr) => arr.map((x, j) => {
      if (j !== i) return x;
      const next = { ...x, type: typeKey };
      // Only prefill APR if it was at default/zero — don't clobber a user-entered rate
      if (!x.apr || x.apr === 0 || x.apr === DEBT_TYPES[x.type || "other"]?.apr) {
        next.apr = t.apr;
      }
      next.minPayment = estimateMinPayment(typeKey, x.balance, next.apr);
      return next;
    }));
  };
  const reEstimateMin = (i) => {
    setDebts((arr) => arr.map((x, j) => {
      if (j !== i) return x;
      return { ...x, minPayment: estimateMinPayment(x.type || "other", x.balance, x.apr) };
    }));
  };

  const totals = useMemoDebt(() => ({
    balance: debts.reduce((a, b) => a + b.balance, 0),
    min:     debts.reduce((a, b) => a + b.minPayment, 0),
  }), [debts]);

  const chosen   = useMemoDebt(() => simulatePayoffWithSavings(debts, extra, strategy, toSavings, savingsAPY, paymentFreq), [debts, extra, strategy, toSavings, savingsAPY, paymentFreq]);
  const allDebt  = useMemoDebt(() => simulatePayoffWithSavings(debts, spareCash, strategy, 0, savingsAPY, paymentFreq), [debts, spareCash, strategy, savingsAPY, paymentFreq]);
  const allSave  = useMemoDebt(() => simulatePayoffWithSavings(debts, 0, strategy, spareCash, savingsAPY, paymentFreq), [debts, spareCash, strategy, savingsAPY, paymentFreq]);
  const other  = useMemoDebt(() => simulatePayoff(debts, extra, strategy === "snowball" ? "avalanche" : "snowball"), [debts, extra, strategy]);
  const minOnly = useMemoDebt(() => simulatePayoff(debts, 0, strategy), [debts, strategy]);

  const monthsSaved = Math.max(0, minOnly.months - chosen.months);
  const interestSaved = Math.max(0, minOnly.totalInterest - chosen.totalInterest);

  return (
    <>
      <header className="page-head">
        <div><h1 className="page-title">Debt <em>payoff</em></h1></div>
        <div className="page-head-right">
          <div className="page-head-actions">
            <ExportButton calculatorName="Debt payoff" />
          </div>
          <div className="page-sub">Snowball vs avalanche · find your fastest exit</div>
        </div>
      </header>

      <div className="layout">
        <aside className="col-inputs">
          <section className="card" id="split-card">
            <header className="card-head">
              <h2>Save vs pay down</h2>
              <span className="card-tag">
                {fmtUSD0(extra)}<span style={{ color: "var(--ink-3)" }}>/mo to debt</span>
              </span>
            </header>
            <div className="card-body stack">
              {/* The new "Auto-optimize" replaces the old "Spare cash" + slider + APY math.
                  Reads the Budget surplus, picks the best split based on debt APR vs savings APY,
                  then applies it. Single button — user just clicks to optimize. */}
              <div className="debt-optimize-box">
                <div className="debt-optimize-row">
                  <div className="debt-optimize-eyebrow">
                    {budgetLeftover != null && budgetLeftover > 0
                      ? "From your Budget surplus"
                      : (spareCash > 0 ? "Cash you'll commit" : "Pick an amount to commit")}
                  </div>
                  <div className="debt-optimize-val">
                    {budgetLeftover != null && budgetLeftover > 0
                      ? <>{fmtUSD0(budgetLeftover)}<span className="debt-optimize-val-sub">/mo</span></>
                      : (spareCash > 0
                          ? <>{fmtUSD0(spareCash)}<span className="debt-optimize-val-sub">/mo</span></>
                          : <Money value={spareCash} onChange={(v) => { setSpareCash(v); setAutoSpare(false); }} placeholder="500" />
                        )}
                  </div>
                </div>
                <button
                  className="btn-primary debt-optimize-btn"
                  onClick={() => {
                    // Use whichever cash source is available — budget surplus, current spareCash, or fallback to minimums total
                    let cash = (budgetLeftover != null && budgetLeftover > 0)
                      ? budgetLeftover
                      : (spareCash > 0 ? spareCash : Math.max(500, totals.min));
                    setSpareCash(cash);
                    setAutoSpare(budgetLeftover != null && budgetLeftover > 0);
                    // Smart split: heavy on whichever side has the better rate
                    const avgApr = debts.length > 0
                      ? debts.reduce((a, d) => a + (d.apr * d.balance), 0) / Math.max(1, debts.reduce((a, d) => a + d.balance, 0))
                      : 0;
                    let pct = 0.5;
                    if (avgApr - savingsAPY > 0.05) pct = 0.9;
                    else if (avgApr - savingsAPY > 0.02) pct = 0.75;
                    else if (avgApr - savingsAPY > -0.01) pct = 0.5;
                    else pct = 0.25;
                    setDebtPct(pct);
                    setCustomDebtAmount(null);
                    // Also auto-estimate each debt's min payment from its type
                    setDebts((arr) => arr.map((d) => ({
                      ...d,
                      minPayment: d.minPayment > 0 ? d.minPayment : estimateMinPayment(d.type || "other", d.balance, d.apr),
                    })));
                  }}
                >
                  ✦ Optimize automatically
                </button>
                <p className="debt-optimize-explain">
                  Picks the smartest split based on your debt APR vs savings APY.
                  Higher debt rates → more to debt. {budgetLeftover == null && "Without Budget data, uses the cash amount above."} You can still adjust below.
                </p>
              </div>

              <details className="debt-manual-details">
                <summary>Manual override</summary>
                <div className="stack" style={{ gap: 12, paddingTop: 12 }}>
                  <Field label="Exact amount toward debt" hint="leave blank to use the slider">
                    <Money
                      value={useCustom ? customDebtAmount : 0}
                      onChange={(v) => setCustomDebtAmount(v > 0 ? v : null)}
                      placeholder={`e.g. ${Math.round(spareCash * 0.5)}`}
                    />
                  </Field>
                  <Field label={`Or split: ${fmtUSD0(extra)}/mo debt · ${fmtUSD0(toSavings)}/mo save`}>
                    <div className="split-slider-wrap">
                      <input
                        type="range" min={0} max={1} step={0.05}
                        value={useCustom ? effectivePct : debtPct}
                        onChange={(e) => { setDebtPct(Number(e.target.value)); setCustomDebtAmount(null); }}
                      />
                      <div className="split-slider-labels">
                        <span style={{ color: "var(--positive)" }}>{Math.round((1-(useCustom?effectivePct:debtPct))*100)}% save</span>
                        <span style={{ color: "var(--gold)" }}>{Math.round((useCustom?effectivePct:debtPct)*100)}% pay debt</span>
                      </div>
                    </div>
                  </Field>
                  <div className="split-bar">
                    <div className="split-bar-save" style={{ width: ((1-(useCustom?effectivePct:debtPct))*100) + "%" }} />
                    <div className="split-bar-debt" style={{ width: ((useCustom?effectivePct:debtPct)*100) + "%" }} />
                  </div>
                  <Field label="Savings APY" hint="high-yield savings, etc.">
                    <NumberInput value={(savingsAPY * 100).toFixed(2)} onChange={(v) => setSavingsAPY(v / 100)} suffix="%" />
                  </Field>
                  <Field label="Payment frequency" hint={paymentFreq === 1 ? "applied each month" : `lump sum every ${paymentFreq} months`}>
                    <Segment
                      value={paymentFreq}
                      onChange={setPaymentFreq}
                      options={[
                        { value: 1,  label: "Monthly" },
                        { value: 3,  label: "3 mo" },
                        { value: 6,  label: "6 mo" },
                        { value: 12, label: "Yearly" },
                      ]}
                    />
                  </Field>
                </div>
              </details>
            </div>
          </section>

          <section className="card">
            <header className="card-head"><h2>Strategy</h2></header>
            <div className="card-body stack">
              <Field label="Method" hint={strategy === "snowball" ? "smallest balance first" : "highest rate first"}>
                <Segment
                  value={strategy}
                  onChange={setStrategy}
                  options={[
                    { value: "avalanche", label: "Avalanche" },
                    { value: "snowball",  label: "Snowball" },
                  ]}
                />
              </Field>
            </div>
          </section>

          <section className="card">
            <header className="card-head">
              <h2>Totals</h2>
              <span className="card-tag">{debts.length} debts</span>
            </header>
            <div className="card-body">
              <div className="kpi" style={{ border: "none", background: "transparent", padding: 0, marginBottom: 12 }}>
                <div className="kpi-eyebrow">Total balance</div>
                <div className="kpi-num">{fmtUSD0(totals.balance)}</div>
              </div>
              <div className="kpi" style={{ border: "none", background: "transparent", padding: 0 }}>
                <div className="kpi-eyebrow">Minimums + extra</div>
                <div className="kpi-num">{fmtUSD0(totals.min + extra)}<span style={{ fontSize: 14, color: "var(--ink-3)" }}>/mo</span></div>
                <div className="kpi-sub">{fmtUSD0(totals.min)} min + {fmtUSD0(extra)} extra</div>
              </div>
            </div>
          </section>
        </aside>

        <section className="col-results">
          <section className="hero-card">
            <div className="hero-grid">
              <div className="hero-block">
                <div className="hero-eyebrow">Debt-free in</div>
                <div className="hero-num surplus">
                  {Math.floor(chosen.months / 12)}<span className="hero-num-sm">y</span>
                  {" "}{chosen.months % 12}<span className="hero-num-sm">m</span>
                </div>
                <div className="hero-sub">
                  vs {Math.floor(minOnly.months / 12)}y {minOnly.months % 12}m on minimums alone
                </div>
              </div>
              <div className="hero-divider" />
              <div className="hero-block">
                <div className="hero-eyebrow">Interest saved</div>
                <div className="hero-num surplus">{fmtUSD0(interestSaved)}</div>
                <div className="hero-sub">
                  {fmtUSD0(chosen.totalInterest)} paid vs {fmtUSD0(minOnly.totalInterest)} on minimums
                </div>
              </div>
            </div>
          </section>

          <div className="kpi-grid">
            <div className="kpi">
              <div className="kpi-eyebrow">Saved by debt-free date</div>
              <div className="kpi-num pos">{fmtUSD0(chosen.savingsBalance)}</div>
              <div className="kpi-sub">at {fmtPct(savingsAPY, 1)} APY</div>
            </div>
            <div className="kpi">
              <div className="kpi-eyebrow">Net position</div>
              <div className={"kpi-num " + (chosen.savingsBalance - chosen.totalInterest >= 0 ? "pos" : "neg")}>
                {fmtUSD0(chosen.savingsBalance - chosen.totalInterest)}
              </div>
              <div className="kpi-sub">savings minus interest paid</div>
            </div>
            <div className="kpi">
              <div className="kpi-eyebrow">Months saved</div>
              <div className="kpi-num pos">{monthsSaved}</div>
              <div className="kpi-sub">vs minimums-only</div>
            </div>
          </div>

          <section className="card">
            <header className="card-head">
              <h2>How splitting changes the outcome</h2>
              <span
                className="card-tag card-tag-link"
                onClick={() => {
                  const el = document.getElementById("split-card");
                  if (!el) return;
                  const top = el.getBoundingClientRect().top + window.scrollY - 24;
                  window.scrollTo({ top, behavior: "smooth" });
                  el.classList.add("flash-highlight");
                  setTimeout(() => el.classList.remove("flash-highlight"), 1500);
                }}
              >
                edit split <span className="card-tag-arrow">→</span>
              </span>
            </header>
            <div className="card-body">
              <table className="ptable">
                <thead>
                  <tr>
                    <th>Scenario</th>
                    <th className="num">Debt-free in</th>
                    <th className="num">Interest paid</th>
                    <th className="num">Savings built</th>
                    <th className="num">Net</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td><strong>Your split</strong> <span className="row-hint" style={{display:"inline",marginLeft:6,fontSize:11}}>{fmtUSD0(extra)} debt · {fmtUSD0(toSavings)} save</span></td>
                    <td className="num">{Math.floor(chosen.months / 12)}y {chosen.months % 12}m</td>
                    <td className="num neg">{fmtUSD0(chosen.totalInterest)}</td>
                    <td className="num pos">{fmtUSD0(chosen.savingsBalance)}</td>
                    <td className={"num " + (chosen.savingsBalance - chosen.totalInterest >= 0 ? "pos" : "neg")}>
                      {fmtUSD0(chosen.savingsBalance - chosen.totalInterest)}
                    </td>
                  </tr>
                  <tr>
                    <td>All to debt <span className="row-hint" style={{display:"inline",marginLeft:6,fontSize:11}}>{fmtUSD0(spareCash)} debt</span></td>
                    <td className="num">{Math.floor(allDebt.months / 12)}y {allDebt.months % 12}m</td>
                    <td className="num neg">{fmtUSD0(allDebt.totalInterest)}</td>
                    <td className="num">$0</td>
                    <td className="num neg">{fmtUSD0(-allDebt.totalInterest)}</td>
                  </tr>
                  <tr>
                    <td>All to savings <span className="row-hint" style={{display:"inline",marginLeft:6,fontSize:11}}>{fmtUSD0(spareCash)} save</span></td>
                    <td className="num">{Math.floor(allSave.months / 12)}y {allSave.months % 12}m</td>
                    <td className="num neg">{fmtUSD0(allSave.totalInterest)}</td>
                    <td className="num pos">{fmtUSD0(allSave.savingsBalance)}</td>
                    <td className={"num " + (allSave.savingsBalance - allSave.totalInterest >= 0 ? "pos" : "neg")}>
                      {fmtUSD0(allSave.savingsBalance - allSave.totalInterest)}
                    </td>
                  </tr>
                  <tr>
                    <td>Minimums only <span className="row-hint" style={{display:"inline",marginLeft:6,fontSize:11}}>baseline</span></td>
                    <td className="num">{Math.floor(minOnly.months / 12)}y {minOnly.months % 12}m</td>
                    <td className="num neg">{fmtUSD0(minOnly.totalInterest)}</td>
                    <td className="num">$0</td>
                    <td className="num neg">{fmtUSD0(-minOnly.totalInterest)}</td>
                  </tr>
                </tbody>
              </table>
              <p className="footnote">
                <strong>Net</strong> = savings built up by debt-free date minus interest paid on debt.
                When debt APR is much higher than savings APY, putting more toward debt usually wins.
                When APRs are close, splitting builds peace of mind (cash buffer) while still paying down.
              </p>
            </div>
          </section>

          <section className="card">
            <header className="card-head" style={{ cursor: "pointer" }} onClick={() => setDebtsListOpen((v) => !v)}>
              <h2 style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <span
                  className={"debt-card-chevron" + (debtsListOpen ? " is-open" : "")}
                  style={{ pointerEvents: "none" }}
                  aria-hidden="true"
                >▾</span>
                Your debts
                <span className="debt-section-summary">
                  <strong>{debts.length}</strong> {debts.length === 1 ? "debt" : "debts"}
                  <span className="debt-section-sep">·</span>
                  <strong>{fmtUSD0(totals.balance)}</strong> total
                  {totals.min > 0 && (
                    <>
                      <span className="debt-section-sep">·</span>
                      <strong>{fmtUSD0(totals.min)}/mo</strong> minimums
                    </>
                  )}
                </span>
              </h2>
              {debtsListOpen && (
                <span className="card-tag" style={{ display: "flex", gap: 4, flexWrap: "wrap" }} onClick={(e) => e.stopPropagation()}>
                  <button
                    className="btn-link"
                    onClick={() => {
                      // Recompute min payment for every debt based on its type/balance/APR
                      setDebts((arr) => arr.map((d) => ({
                        ...d,
                        minPayment: estimateMinPayment(d.type || "other", d.balance, d.apr),
                      })));
                    }}
                    title="Auto-estimate every debt's minimum payment based on its type"
                  >
                    ✦ optimize all
                  </button>
                  {debts.length > 1 && (
                    <>
                      <span style={{ color: "var(--ink-3)" }}>·</span>
                      <button className="btn-link" onClick={expandAll}>expand all</button>
                      <span style={{ color: "var(--ink-3)" }}>·</span>
                      <button className="btn-link" onClick={collapseAll}>collapse all</button>
                    </>
                  )}
                </span>
              )}
            </header>
            {debtsListOpen && <div className="card-body">
              {debts.map((d, i) => {
                const typeInfo = DEBT_TYPES[d.type || "other"] || DEBT_TYPES.other;
                const open = isExpanded(i);
                return (
                  <div key={i} className={"debt-card" + (open ? "" : " is-collapsed")}>
                    <div className="debt-card-head">
                      <button
                        type="button"
                        className={"debt-card-chevron" + (open ? " is-open" : "")}
                        onClick={() => toggleExpanded(i)}
                        title={open ? "Collapse" : "Expand"}
                        aria-label={open ? "Collapse" : "Expand"}
                      >▾</button>
                      <span className="debt-card-icon">{typeInfo.icon}</span>
                      <input
                        className="text-input debt-card-name"
                        value={d.name}
                        onChange={(e) => updDebt(i, "name", e.target.value)}
                        placeholder="Debt name"
                      />
                      <select
                        className="select debt-card-type"
                        value={d.type || "other"}
                        onChange={(e) => applyDebtType(i, e.target.value)}
                        title="Debt type — picks sensible APR + payment defaults"
                      >
                        {Object.entries(DEBT_TYPES).map(([k, t]) => (
                          <option key={k} value={k}>{t.icon} {t.label}</option>
                        ))}
                      </select>
                      <button className="icon-btn" onClick={() => removeDebt(i)} title="Remove debt">×</button>
                    </div>
                    {!open && (
                      <button
                        type="button"
                        className="debt-card-summary"
                        onClick={() => toggleExpanded(i)}
                        title="Click to expand"
                      >
                        <span><strong>{fmtUSD0(d.balance)}</strong> balance</span>
                        <span className="debt-card-summary-sep">·</span>
                        <span>{(d.apr * 100).toFixed(1)}% APR</span>
                        <span className="debt-card-summary-sep">·</span>
                        <span>{fmtUSD0(d.minPayment || 0)}/mo min</span>
                        {d.dueDay && <><span className="debt-card-summary-sep">·</span><span>due {d.dueDay}{["st","nd","rd"][((d.dueDay+90)%100-10)%10-1] || "th"}</span></>}
                      </button>
                    )}
                    {open && <div className="debt-card-grid">
                      <Field label="Balance">
                        <Money value={d.balance} onChange={(v) => updDebt(i, "balance", v)} />
                      </Field>
                      <Field label="APR" hint={typeInfo.label.toLowerCase() + " typical"}>
                        <NumberInput value={(d.apr * 100).toFixed(2)} onChange={(v) => updDebt(i, "apr", v / 100)} suffix="%" />
                      </Field>
                      <Field label="Min / mo" hint={typeInfo.estimateMethod === "percent" ? "2% of balance" : `over ${typeInfo.termYears}y`}>
                        <div style={{ display: "flex", gap: 6 }}>
                          <Money value={d.minPayment} onChange={(v) => updDebt(i, "minPayment", v)} />
                          <button
                            type="button"
                            className="icon-btn-square"
                            title={"Auto-estimate from " + typeInfo.label + " (" + (typeInfo.estimateMethod === "percent" ? "2% / $25 min" : typeInfo.termYears + "y term") + ")"}
                            onClick={() => reEstimateMin(i)}
                          >↻</button>
                        </div>
                      </Field>
                      <Field label="Due day" hint="day of month">
                        <NumberInput value={d.dueDay || 1} onChange={(v) => updDebt(i, "dueDay", Math.max(1, Math.min(31, Math.round(v) || 1)))} suffix="" />
                      </Field>
                      <Field label="Date taken" hint="when debt started">
                        <div
                          className="date-picker"
                          onClick={(e) => {
                            const inp = e.currentTarget.querySelector("input[type=date]");
                            if (inp && typeof inp.showPicker === "function") { try { inp.showPicker(); } catch {} } else { inp?.focus(); }
                          }}
                        >
                          <span className="date-picker-icon" aria-hidden="true">📅</span>
                          <input
                            type="date"
                            className="date-input"
                            value={d.takenDate || todayISO}
                            onChange={(e) => updDebt(i, "takenDate", e.target.value)}
                          />
                          <span className="date-picker-caret" aria-hidden="true">▾</span>
                        </div>
                      </Field>
                    </div>}
                  </div>
                );
              })}
              <button className="btn-add-member" onClick={addDebt} style={{ marginTop: 4 }}>
                <span className="btn-add-member-plus">+</span>
                <span className="btn-add-member-text">
                  <span className="btn-add-member-title">Add another debt</span>
                  <span className="btn-add-member-sub">credit card, loan, mortgage, etc.</span>
                </span>
              </button>
            </div>}
          </section>

          <section className="card">
            <header className="card-head"><h2>Payoff order</h2></header>
            <div className="card-body">
              <table className="ptable">
                <thead>
                  <tr>
                    <th>Debt</th>
                    <th className="num">Starting balance</th>
                    <th className="num">APR</th>
                    <th className="num">Interest paid</th>
                    <th className="num">Paid off</th>
                  </tr>
                </thead>
                <tbody>
                  {chosen.perDebt
                    .slice()
                    .sort((a, b) => (a.paidoffMonth ?? 9999) - (b.paidoffMonth ?? 9999))
                    .map((d) => {
                      const orig = debts[d.id];
                      return (
                        <tr key={d.id}>
                          <td>{d.name}</td>
                          <td className="num">{fmtUSD0(orig.balance)}</td>
                          <td className="num">{fmtPct(orig.apr, 1)}</td>
                          <td className="num" style={{ color: "var(--gold)" }}>{fmtUSD0(d.paidInterest)}</td>
                          <td className="num">{d.paidoffMonth ? `Month ${d.paidoffMonth}` : "—"}</td>
                        </tr>
                      );
                    })}
                </tbody>
              </table>
            </div>
          </section>
        </section>
      </div>
    </>
  );
}

window.DebtPayoff = DebtPayoff;

</script>

<script type="text/babel" data-presets="react">
// Overview — consolidated summary pulling from Budget, Auto, Debt, Investing, Household.
const { useState: useStateOv, useMemo: useMemoOv, useEffect: useEffectOv } = React;

function readLS(key, fallback = null) {
  try {
    const v = localStorage.getItem(key);
    return v ? JSON.parse(v) : fallback;
  } catch { return fallback; }
}

function OverviewCalculator({ profile, getBudgetData }) {
  const [view, setView] = useStateOv("monthly");
  const [, setTick] = useStateOv(0);

  // Re-poll periodically so this stays live with other calculators
  useEffectOv(() => {
    const id = setInterval(() => setTick((t) => t + 1), 1500);
    return () => clearInterval(id);
  }, []);

  const data = useMemoOv(() => {
    const budget = getBudgetData() || {};
    const budgetSaved = readLS("ledger:budget") || {};
    const expenses = budget.expenses || budgetSaved.expenses || {};
    const tax = budget.tax || (profile ? computeTaxes(profile) : null);

    const auto = readLS("ledger:auto") || {};
    const debt = readLS("ledger:debt") || {};
    const invest = readLS("ledger:invest-v2") || {};
    const household = readLS("ledger:household") || null;

    // Monthly numbers
    const monthlyTakeHome = tax ? tax.takeHome / 12 : 0;
    const monthlyTax = tax ? tax.totalTax / 12 : 0;

    // Vehicle (Auto tab) — full ownership cost
    let autoMonthly = 0;
    if (auto && auto.price > 0) {
      const principal = Math.max(0, (auto.price || 0) + (auto.price - (auto.tradeIn || 0)) * (auto.salesTaxRate || 0) + (auto.fees || 0) - (auto.down || 0) - (auto.tradeIn || 0));
      const r = (auto.apr || 0) / 12;
      const n = auto.termMonths || 60;
      const payment = (principal > 0 && r > 0)
        ? principal * (r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1)
        : (principal > 0 ? principal / n : 0);
      autoMonthly = payment
        + (auto.insurance || 0)
        + (auto.gas || 0)
        + (auto.maintenance || 0)
        + (auto.parking || 0)
        + (auto.regAnnual || 0) / 12;
    }

    // Debt monthly outflow
    const debtTotal = (debt.debts || []).reduce((a, b) => a + (b.minPayment || 0), 0);
    const extraToDebt = (debt.spareCash || 0) * (debt.debtPct || 0);

    // Savings allocation (from investing card)
    const savingsTarget = (debt.spareCash || 0) * (1 - (debt.debtPct || 0));

    // Categorize budget expenses
    const rent = expenses.rent || 0;
    const otherMonthly = (expenses.expenses || 0);
    const carInsBudget = expenses.carIns || 0;
    const gasBudget    = expenses.gas || 0;
    const otherLoan    = expenses.otherLoan || 0;

    // Consolidate the previously-confusing debt rows:
    // - Budget "Other loan" + Debt tab "minimums" used to show as TWO separate lines
    //   even though the otherLoan field is meant to be synced from the Debt tab.
    // - Now: if Debt tab has tracked debts, use that single source.
    //        Otherwise, fall back to Budget's otherLoan.
    // This eliminates the double-counting and the confusing 3-debt-row layout.
    const hasTrackedDebts = (debt.debts || []).length > 0;
    const debtMinimums = hasTrackedDebts ? debtTotal : otherLoan;

    // Build categories with explicit segments
    const categories = [
      { label: "Tax",              value: monthlyTax,      color: "#D77662", group: "Out" },
      { label: "Rent / housing",   value: rent,            color: "#5A8FA3", group: "Out" },
      { label: "Living expenses",  value: otherMonthly,    color: "#7B6E55", group: "Out" },
      { label: "Vehicle costs",    value: autoMonthly || (carInsBudget + gasBudget), color: "#C9A96E", group: "Out" },
      { label: "Debt minimums",    value: debtMinimums,    color: "#9C7C4B", group: "Out",
        from: hasTrackedDebts ? "DEBT" : "BUDGET" },
      { label: "Extra debt paydown", value: extraToDebt,   color: "#8B5A3C", group: "Save", from: "DEBT" },
      { label: "Going to savings", value: savingsTarget,   color: "#4DA77A", group: "Save", from: "SAVINGS" },
    ].filter((c) => c.value > 0);

    // True outflows = everything in the "Out" group (real bills, taxes, debt minimums).
    // Savings + extra debt paydown are ALLOCATIONS of leftover, not outflows —
    // they're still your money, just earmarked. So leftover = take-home − Out only.
    const totalOut = categories.reduce((a, c) => a + c.value, 0);            // includes Save (for backward compat with the chart)
    const realOutflows = categories.filter((c) => c.group === "Out").reduce((a, c) => a + c.value, 0);
    const earmarked    = categories.filter((c) => c.group === "Save").reduce((a, c) => a + c.value, 0);
    const leftover = monthlyTakeHome - realOutflows; // POSITIVE leftover includes savings

    return {
      tax, monthlyTakeHome, monthlyTax,
      categories, totalOut, realOutflows, earmarked, leftover,
      autoMonthly, debtTotal, savingsTarget, extraToDebt,
      auto, debt, invest, household,
      expenses,
    };
  }, [getBudgetData, profile, setTick]); // eslint-disable-line

  const mult = view === "monthly" ? 1 : 12;
  const periodLabel = view === "monthly" ? "/mo" : "/yr";

  return (
    <>
      <header className="page-head">
        <div>
          <h1 className="page-title">Overview <em>&amp; totals</em></h1>
        </div>
        <div className="page-head-right">
          <div className="page-head-actions">
            <div className="view-toggle">
              <Segment
                value={view}
                onChange={setView}
                options={[
                  { value: "monthly",  label: "Monthly" },
                  { value: "annually", label: "Annually" },
                ]}
              />
            </div>
            <ExportButton calculatorName="Overview" />
          </div>
          <div className="page-sub">Everything in one place — where every dollar goes</div>
        </div>
      </header>

      <div className="col-results" style={{ display: "flex", flexDirection: "column", gap: 16 }}>
        {/* Consistent across pages: leftover/after-expenses on LEFT, take-home on RIGHT */}
        <section className="hero-card">
          <div className="hero-grid">
            <div className="hero-block">
              <div className="hero-eyebrow">{view === "monthly" ? "Monthly" : "Annual"} after expenses</div>
              <div className={"hero-num " + (data.leftover >= 0 ? "surplus" : "deficit")}>
                {data.leftover >= 0 ? "+" : ""}{fmtUSD0(data.leftover * mult)}
              </div>
              <div className="hero-sub">
                {data.leftover >= 0
                  ? (data.earmarked > 0
                      ? `includes ${fmtUSD0(data.earmarked * mult)} you've earmarked for savings & extra debt`
                      : "untracked / discretionary")
                  : "shortfall — adjust elsewhere"}
              </div>
            </div>
            <div className="hero-divider" />
            <div className="hero-block">
              <div className="hero-eyebrow">{view === "monthly" ? "Monthly" : "Annual"} take-home</div>
              <div className="hero-num">{fmtUSD0(data.monthlyTakeHome * mult)}</div>
              <div className="hero-sub">{fmtPct(data.tax?.effectiveRate || 0)} effective tax rate</div>
            </div>
          </div>
        </section>

        {/* ✦ Optimize — only shows when leftover < 0. Suggests specific cuts to flip the
            shortfall into a surplus, ranked by impact + ease (savings rate first, etc.) */}
        <OptimizePanel data={data} view={view} mult={mult} />

        <section className="card">
          <header className="card-head">
            <h2>Where every dollar goes</h2>
            <span className="card-tag">
              {fmtUSD0(data.totalOut * mult)}{periodLabel} tracked
            </span>
          </header>
          <div className="card-body">
            <div className="stack-bar" style={{ height: 18, marginBottom: 16 }}>
              {data.categories.map((c, i) => (
                <div
                  key={i}
                  style={{
                    width: ((c.value / data.monthlyTakeHome) * 100) + "%",
                    background: c.color,
                  }}
                  title={`${c.label}: ${fmtUSD0(c.value * mult)}${periodLabel}`}
                />
              ))}
              {data.leftover > 0 && (
                <div
                  style={{
                    width: ((data.leftover / data.monthlyTakeHome) * 100) + "%",
                    background: "var(--accent-dim)",
                    opacity: 0.4,
                  }}
                  title={`Leftover: ${fmtUSD0(data.leftover * mult)}${periodLabel}`}
                />
              )}
            </div>
            <ul className="legend">
              {data.categories.map((c, i) => (
                <li key={i}>
                  <span className="legend-dot" style={{ background: c.color }} />
                  <span className="legend-label">{c.label}</span>
                  <span className="legend-val">
                    {fmtUSD0(c.value * mult)}
                    <span className="legend-pct"> · {fmtPct(c.value / data.monthlyTakeHome, 0)}</span>
                  </span>
                </li>
              ))}
              {data.leftover > 0 && (
                <li>
                  <span className="legend-dot" style={{ background: "var(--accent-dim)", opacity: 0.5 }} />
                  <span className="legend-label" style={{ fontStyle: "italic", fontFamily: "var(--display)", color: "var(--ink-3)" }}>
                    Untracked / discretionary
                  </span>
                  <span className="legend-val">
                    {fmtUSD0(data.leftover * mult)}
                    <span className="legend-pct"> · {fmtPct(data.leftover / data.monthlyTakeHome, 0)}</span>
                  </span>
                </li>
              )}
            </ul>
          </div>
        </section>

        <section className="card">
          <header className="card-head">
            <h2>Full breakdown by source</h2>
          </header>
          <div className="card-body" style={{ overflowX: "auto" }}>
            <table className="ptable" style={{ minWidth: 500 }}>
              <thead>
                <tr>
                  <th>From</th>
                  <th>Line item</th>
                  <th className="num">{view === "monthly" ? "Per month" : "Per year"}</th>
                  <th className="num">% of take-home</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td className="row-source">Income</td>
                  <td>Gross salary{profile?.bonus ? " + bonus" : ""}</td>
                  <td className="num">{fmtUSD0((data.tax?.gross || 0) * mult / 12)}</td>
                  <td className="num">—</td>
                </tr>
                <tr>
                  <td className="row-source">Tax</td>
                  <td>Federal + state + FICA</td>
                  <td className="num neg">{fmtUSD0(data.monthlyTax * mult)}</td>
                  <td className="num">{fmtPct(data.monthlyTax / data.monthlyTakeHome, 1)}</td>
                </tr>
                <tr className="ptable-year-start">
                  <td className="row-source">Take-home</td>
                  <td><strong>Net pay</strong></td>
                  <td className="num"><strong>{fmtUSD0(data.monthlyTakeHome * mult)}</strong></td>
                  <td className="num">100%</td>
                </tr>
                <tr>
                  <td className="row-source">Budget</td>
                  <td>Rent / housing</td>
                  <td className="num neg">{fmtUSD0((data.expenses.rent || 0) * mult)}</td>
                  <td className="num">{fmtPct((data.expenses.rent || 0) / data.monthlyTakeHome, 1)}</td>
                </tr>
                <tr>
                  <td className="row-source">Budget</td>
                  <td>Living expenses</td>
                  <td className="num neg">{fmtUSD0((data.expenses.expenses || 0) * mult)}</td>
                  <td className="num">{fmtPct((data.expenses.expenses || 0) / data.monthlyTakeHome, 1)}</td>
                </tr>
                <tr>
                  <td className="row-source">Auto</td>
                  <td>Vehicle (loan + insurance + gas + upkeep)</td>
                  <td className="num neg">{fmtUSD0(data.autoMonthly * mult)}</td>
                  <td className="num">{fmtPct(data.autoMonthly / data.monthlyTakeHome, 1)}</td>
                </tr>
                {/* Single consolidated debt line — uses Debt tab data if tracked, else Budget's otherLoan.
                    No more duplicate "Other loan + Tracked minimums" double-counting. */}
                {(() => {
                  const hasTracked = (data.debt?.debts || []).length > 0;
                  const minVal = hasTracked ? data.debtTotal : (data.expenses.otherLoan || 0);
                  if (minVal === 0) return null;
                  return (
                    <tr>
                      <td className="row-source">{hasTracked ? "Debt" : "Budget"}</td>
                      <td>Loan / debt minimums {hasTracked && <span className="row-hint" style={{display:"inline",marginLeft:6,fontSize:11}}>(from Debt tab)</span>}</td>
                      <td className="num neg">{fmtUSD0(minVal * mult)}</td>
                      <td className="num">{fmtPct(minVal / data.monthlyTakeHome, 1)}</td>
                    </tr>
                  );
                })()}
                {data.extraToDebt > 0 && (
                  <tr>
                    <td className="row-source">Debt</td>
                    <td>Extra debt paydown <span className="row-hint" style={{display:"inline",marginLeft:6,fontSize:11}}>(above minimums)</span></td>
                    <td className="num">{fmtUSD0(data.extraToDebt * mult)}</td>
                    <td className="num">{fmtPct(data.extraToDebt / data.monthlyTakeHome, 1)}</td>
                  </tr>
                )}
                {data.savingsTarget > 0 && (
                  <tr>
                    <td className="row-source">Savings</td>
                    <td>Going to savings &amp; investing</td>
                    <td className="num pos">{fmtUSD0(data.savingsTarget * mult)}</td>
                    <td className="num">{fmtPct(data.savingsTarget / data.monthlyTakeHome, 1)}</td>
                  </tr>
                )}
                <tr className="ptable-year-start">
                  <td className="row-source">Total</td>
                  <td><strong>Tracked outflow</strong></td>
                  <td className="num neg"><strong>{fmtUSD0(data.totalOut * mult)}</strong></td>
                  <td className="num"><strong>{fmtPct(data.totalOut / data.monthlyTakeHome, 1)}</strong></td>
                </tr>
                <tr className={data.leftover >= 0 ? "" : ""}>
                  <td className="row-source">Leftover</td>
                  <td><strong>{data.leftover >= 0 ? "Discretionary / untracked" : "Shortfall"}</strong></td>
                  <td className={"num " + (data.leftover >= 0 ? "pos" : "neg")}>
                    <strong>{data.leftover >= 0 ? "+" : ""}{fmtUSD0(data.leftover * mult)}</strong>
                  </td>
                  <td className="num">{fmtPct(data.leftover / data.monthlyTakeHome, 1)}</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>

        <div className="grid-2">
          <section className="card">
            <header className="card-head"><h2>Health checks</h2></header>
            <div className="card-body">
              <HealthCheck data={data} />
            </div>
          </section>

          <section className="card">
            <header className="card-head"><h2>Quick stats</h2></header>
            <div className="card-body">
              <div className="quick-stats">
                <div className="quick-stat">
                  <div className="quick-stat-label">Savings rate</div>
                  <div className="quick-stat-val">{fmtPct(data.savingsTarget / data.monthlyTakeHome, 1)}</div>
                </div>
                <div className="quick-stat">
                  <div className="quick-stat-label">Vehicle share of income</div>
                  <div className="quick-stat-val">{fmtPct(data.autoMonthly / data.monthlyTakeHome, 1)}</div>
                </div>
                <div className="quick-stat">
                  <div className="quick-stat-label">Rent share of income</div>
                  <div className="quick-stat-val">{fmtPct((data.expenses.rent || 0) / data.monthlyTakeHome, 1)}</div>
                </div>
                <div className="quick-stat">
                  <div className="quick-stat-label">Debt-to-income ratio</div>
                  <div className="quick-stat-val">{fmtPct((data.debtTotal + data.extraToDebt + (data.expenses.otherLoan || 0)) / data.monthlyTakeHome, 1)}</div>
                </div>
              </div>
            </div>
          </section>
        </div>

        <p className="footnote" style={{ textAlign: "center" }}>
          All numbers pulled live from your Budget, Auto, Debt, and Investing tabs. Edit any of them — this view updates automatically.
        </p>
      </div>
    </>
  );
}

function HealthCheck({ data }) {
  const checks = [];
  const rentPct = (data.expenses.rent || 0) / data.monthlyTakeHome;
  if (rentPct > 0) {
    if (rentPct < 0.30) checks.push({ kind: "ok",   label: "Rent under 30% of take-home",      detail: `${fmtPct(rentPct)} — healthy` });
    else if (rentPct < 0.40) checks.push({ kind: "warn", label: "Rent is 30–40% of take-home", detail: `${fmtPct(rentPct)} — on the high side` });
    else checks.push({ kind: "bad", label: "Rent over 40% of take-home", detail: `${fmtPct(rentPct)} — consider a cheaper option` });
  }
  const carPct = data.autoMonthly / data.monthlyTakeHome;
  if (carPct > 0) {
    if (carPct < 0.15) checks.push({ kind: "ok",   label: "Vehicle costs under 15%", detail: `${fmtPct(carPct)} — reasonable` });
    else if (carPct < 0.25) checks.push({ kind: "warn", label: "Vehicle 15–25% of income", detail: `${fmtPct(carPct)} — borderline` });
    else checks.push({ kind: "bad", label: "Vehicle over 25% of income", detail: `${fmtPct(carPct)} — significant burden` });
  }
  const savingsRate = data.savingsTarget / data.monthlyTakeHome;
  if (savingsRate >= 0.20) checks.push({ kind: "ok",   label: "Saving 20%+", detail: "great rate" });
  else if (savingsRate >= 0.10) checks.push({ kind: "warn", label: "Saving 10–20%", detail: "OK, consider increasing" });
  else checks.push({ kind: "bad", label: "Saving less than 10%", detail: "increase if possible" });
  if (data.leftover < 0) {
    checks.push({ kind: "bad", label: "Monthly deficit", detail: `${fmtUSD0(data.leftover)} short` });
  }
  return (
    <ul className="health-list">
      {checks.map((c, i) => (
        <li key={i} className={"health-item health-" + c.kind}>
          <span className="health-icon">{c.kind === "ok" ? "✓" : c.kind === "warn" ? "!" : "×"}</span>
          <span>
            <div className="health-label">{c.label}</div>
            <div className="health-detail">{c.detail}</div>
          </span>
        </li>
      ))}
    </ul>
  );
}

// ─── Optimize panel ────────────────────────────────────────────────────
// Shows up only when monthly leftover < 0 (i.e. user is overspending allocations).
// Lists 3-4 specific cut suggestions ranked by impact, each with a one-click apply.
function OptimizePanel({ data, view, mult }) {
  if (!data || data.leftover >= 0) {
    // Already in surplus
    const trulyUntracked = data.leftover - (data.earmarked || 0);
    return (
      <section className="optimize-panel optimize-panel-good">
        <div className="optimize-icon">✓</div>
        <div className="optimize-body">
          <div className="optimize-title">
            You're in the green — {fmtUSD0(data.leftover * mult)}{view === "monthly" ? "/mo" : "/yr"} after bills
          </div>
          <div className="optimize-sub">
            {data.earmarked > 0 ? (
              <>You've earmarked <strong>{fmtUSD0(data.earmarked * mult)}</strong> for savings & extra debt paydown.
              {trulyUntracked > 0
                ? <> The remaining <strong>{fmtUSD0(trulyUntracked * mult)}</strong> is untracked — route it toward investments or your emergency fund.</>
                : <> Every dollar has a job — well done.</>}
              </>
            ) : (
              <>That money isn't going anywhere tracked. Consider routing it to <strong>investments</strong> or your <strong>emergency fund</strong>.</>
            )}
          </div>
        </div>
      </section>
    );
  }

  const deficit = -data.leftover; // positive number = how much we need to free up

  // Build the list of levers, with the biggest opportunities ranked first
  const levers = [];

  if (data.extraToDebt > 0) {
    const cut = Math.min(data.extraToDebt, deficit);
    levers.push({
      key: "extraDebt",
      icon: "⚖",
      title: `Pause extra debt paydown — save ${fmtUSD0(cut)}/mo`,
      detail: `You're paying ${fmtUSD0(data.extraToDebt)}/mo above minimums. Pausing the extra closes ${Math.round((cut/deficit)*100)}% of your gap. Minimums still get paid.`,
      apply: () => {
        const cur = readLS("ledger:debt") || {};
        cur.debtPct = 0; cur.autoSpare = false;
        localStorage.setItem("ledger:debt", JSON.stringify(cur));
        window.location.reload();
      },
    });
  }

  if (data.savingsTarget > 0) {
    const cut = Math.min(data.savingsTarget, deficit);
    levers.push({
      key: "savings",
      icon: "💼",
      title: `Trim savings rate — save ${fmtUSD0(cut)}/mo`,
      detail: `You're routing ${fmtUSD0(data.savingsTarget)}/mo to savings. Trimming this could close ${Math.round((cut/deficit)*100)}% of the gap, but slows your investing.`,
      apply: () => {
        const cur = readLS("ledger:debt") || {};
        cur.debtPct = 1; cur.autoSpare = false;
        localStorage.setItem("ledger:debt", JSON.stringify(cur));
        window.location.reload();
      },
    });
  }

  // Subscriptions — gather from expenses
  const subs = (data.expenses?.subscriptions || []);
  const subsTotal = subs.reduce((a, s) => a + (Number(s.amount) || 0), 0);
  if (subsTotal > 0) {
    levers.push({
      key: "subs",
      icon: "💳",
      title: `Audit subscriptions — up to ${fmtUSD0(subsTotal)}/mo`,
      detail: `You have ${subs.length} subscription${subs.length !== 1 ? "s" : ""} totaling ${fmtUSD0(subsTotal)}/mo: ${subs.slice(0, 4).map(s => s.name).join(", ")}${subs.length > 4 ? "…" : ""}. Cancel any you don't use.`,
      apply: null, // user-driven on Expenses tab
    });
  }

  // Vehicle — if monthly auto cost is high
  if (data.autoMonthly > 400) {
    levers.push({
      key: "auto",
      icon: "🚗",
      title: `Vehicle costs are ${fmtUSD0(data.autoMonthly)}/mo`,
      detail: `Insurance + gas + maintenance + loan together. Shopping insurance, refinancing the loan, or carpooling could trim 10-30%.`,
      apply: null,
    });
  }

  // Secondary spending
  const secondary = (data.expenses?.secondary || []);
  const secTotal = secondary.reduce((a, s) => a + (Number(s.amount) || 0), 0);
  if (secTotal > 0) {
    levers.push({
      key: "sec",
      icon: "✂",
      title: `Secondary "wants" spend — ${fmtUSD0(secTotal)}/mo`,
      detail: `Dining, clothes, entertainment, etc. Often the easiest to trim without hurting your life.`,
      apply: null,
    });
  }

  return (
    <section className="optimize-panel optimize-panel-bad">
      <div className="optimize-head">
        <div className="optimize-icon">✦</div>
        <div className="optimize-body">
          <div className="optimize-title">
            You're {fmtUSD0(deficit)}/mo short ({fmtUSD0(deficit * 12)}/yr)
          </div>
          <div className="optimize-sub">
            Your allocations add up to more than your take-home. Here are the biggest levers to flip back into the green:
          </div>
        </div>
      </div>
      <ul className="optimize-list">
        {levers.slice(0, 4).map((l) => (
          <li key={l.key} className="optimize-item">
            <span className="optimize-item-icon">{l.icon}</span>
            <div className="optimize-item-body">
              <div className="optimize-item-title">{l.title}</div>
              <div className="optimize-item-detail">{l.detail}</div>
            </div>
            {l.apply && (
              <button className="btn-link" onClick={l.apply}>Apply →</button>
            )}
          </li>
        ))}
      </ul>
    </section>
  );
}
