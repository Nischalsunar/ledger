// Standalone calculator that hosts the 3-tier expense editor full-width.
// Shares localStorage `ledger:budget` with the Budget tab so changes flow both ways.
function ExpensesCalculator({ profile }) {
  const [expenses, setExpenses] = useStateBudget({
    rent: 1500, expenses: 600, carIns: 150, gas: 200, otherLoan: 0,
    secondary: [], subscriptions: [],
  });
  const [view, setView] = useStateBudget("monthly");

  useEffectBudget(() => {
    try {
      const saved = JSON.parse(localStorage.getItem("ledger:budget") || "null");
      if (saved && saved.expenses) setExpenses((cur) => ({ ...cur, ...saved.expenses }));
    } catch {}
  }, []);

  useEffectBudget(() => {
    try {
      const cur = JSON.parse(localStorage.getItem("ledger:budget") || "{}");
      cur.expenses = expenses;
      localStorage.setItem("ledger:budget", JSON.stringify(cur));
      window.__ledgerData = { ...(window.__ledgerData || {}), expenses };
    } catch {}
  }, [expenses]);

  // Live tick to re-read Debt-tab sum for the Other Loan sync
  const [, setTickExp] = useStateBudget(0);
  useEffectBudget(() => {
    const id = setInterval(() => setTickExp((t) => t + 1), 1500);
    return () => clearInterval(id);
  }, []);

  const monthlyTotal = useMemoBudget(
    () => (window.sumExpenses ? window.sumExpenses(expenses) : 0),
    [expenses]
  );
  const periodMult = view === "monthly" ? 1 : 12;
  const periodLabel = view === "monthly" ? "/mo" : "/yr";

  const primarySubtotal = (Number(expenses.rent) || 0) + (Number(expenses.expenses) || 0)
                       + (Number(expenses.carIns) || 0) + (Number(expenses.gas) || 0)
                       + (Number(expenses.otherLoan) || 0);
  const secondarySubtotal = (expenses.secondary || []).reduce((a, it) => a + (Number(it.amount) || 0), 0);
  const subsSubtotal      = (expenses.subscriptions || []).reduce((a, it) => a + (Number(it.amount) || 0), 0);

  const budgetData = window.__ledgerData;
  const monthlyTakeHome = budgetData?.tax ? budgetData.tax.takeHome / 12 : null;
  const pctOfIncome = monthlyTakeHome && monthlyTakeHome > 0 ? (monthlyTotal / monthlyTakeHome) : null;

  return (
    <>
      <header className="page-head">
        <div><h1 className="page-title">Monthly <em>expenses</em></h1></div>
        <div className="page-head-right">
          <div className="page-head-actions">
            <div className="view-toggle">
              <Segment
                value={view}
                onChange={setView}
                options={[
                  { value: "monthly", label: "Monthly" },
                  { value: "annually", label: "Annually" },
                ]}
              />
            </div>
            <ExportButton calculatorName="Monthly expenses" />
          </div>
          <div className="page-sub">Primary needs · Secondary wants · Subscriptions</div>
        </div>
      </header>

      <section className="hero-card">
        <div className="hero-grid">
          <div className="hero-block">
            <div className="hero-eyebrow">{view === "monthly" ? "Monthly" : "Annual"} expenses</div>
            <div className="hero-num">{fmtUSD0(monthlyTotal * periodMult)}</div>
            <div className="hero-sub">
              {pctOfIncome != null
                ? `${(pctOfIncome * 100).toFixed(0)}% of your take-home`
                : "open Budget tab to see % of income"}
            </div>
          </div>
          <div className="hero-divider" />
          <div className="hero-block">
            <div className="hero-eyebrow">Breakdown</div>
            <div className="expense-tier-summary">
              <div className="expense-tier-line">
                <span className="expense-tier-dot" style={{ background: "#4DA77A" }} />
                <span className="expense-tier-label">Primary</span>
                <span className="expense-tier-val">{fmtUSD0(primarySubtotal * periodMult)}{periodLabel}</span>
              </div>
              <div className="expense-tier-line">
                <span className="expense-tier-dot" style={{ background: "#C9A96E" }} />
                <span className="expense-tier-label">Secondary</span>
                <span className="expense-tier-val">{fmtUSD0(secondarySubtotal * periodMult)}{periodLabel}</span>
              </div>
              <div className="expense-tier-line">
                <span className="expense-tier-dot" style={{ background: "#7B6E55" }} />
                <span className="expense-tier-label">Subscriptions</span>
                <span className="expense-tier-val">{fmtUSD0(subsSubtotal * periodMult)}{periodLabel}</span>
              </div>
            </div>
          </div>
        </div>
      </section>

      <div className="expense-tiers-stack">
        <BudgetExpenses expenses={expenses} setExpenses={setExpenses} />
      </div>
    </>
  );
}

<script type="text/babel" data-presets="react">
// Household calculator — multiple earners share housing, keep personal savings separate.
const { useState: useStateHH, useMemo: useMemoHH, useEffect: useEffectHH } = React;

// Build the default household with member 0 = "Me" pre-filled from the Budget profile.
// Single member by default; user adds others via "Add household member".
function buildDefaultHousehold(profile) {
  return {
    members: [
      {
        id: 1, name: "Me", color: "#4DA77A",
        syncFromProfile: true,  // keep this member in sync with the Budget profile
        salary: profile?.salary ?? 65000,
        bonus:  profile?.bonus ?? 0,
        filing: profile?.filing ?? "single",
        state:  profile?.state ?? "NY",
        city:   profile?.city ?? "Buffalo",
        ficaExempt: profile?.ficaExempt ?? false,
        personalExpenses: { carIns: 130, gas: 180, otherLoan: 0, personal: 200 },
      },
    ],
    shared: {
    rent:      1800,
    utilities: 250,
    groceries: 500,
    internet:  60,
    other:     0,
  },
    splitMode: "equal", // equal | income | custom
    customSplits: {}, // { memberId: percentage 0-1 }
  };
}
const DEFAULT_HOUSEHOLD = buildDefaultHousehold(null);

const MEMBER_COLORS = ["#4DA77A", "#C9A96E", "#5A8FA3", "#B85450", "#7B6E55", "#A07ABE"];

const PERSONAL_FIELDS = [
  { key: "carIns",    label: "Car insurance" },
  { key: "gas",       label: "Gas" },
  { key: "otherLoan", label: "Other loan",  hint: "student, credit" },
  { key: "personal",  label: "Personal",    hint: "subs, fun" },
];

const SHARED_FIELDS = [
  { key: "rent",      label: "Rent" },
  { key: "utilities", label: "Utilities" },
  { key: "groceries", label: "Groceries" },
  { key: "internet",  label: "Internet" },
  { key: "other",     label: "Other shared" },
];

function computeMemberSplit(household, memberId) {
  const { members, splitMode, customSplits } = household;
  if (splitMode === "equal") return 1 / members.length;
  if (splitMode === "custom") {
    return customSplits[memberId] ?? (1 / members.length);
  }
  // income-proportional
  const incomes = members.map((m) => computeTaxes(m).takeHome);
  const total = incomes.reduce((a, b) => a + b, 0) || 1;
  const idx = members.findIndex((m) => m.id === memberId);
  return incomes[idx] / total;
}

function HouseholdCalculator({ profile, getBudgetData }) {
  const [household, setHousehold] = useStateHH(() => buildDefaultHousehold(profile));
  const [view, setView] = useStateHH("monthly");
  // Re-read Budget data periodically so the "Me" member stays live-synced
  const [, setTickHH] = useStateHH(0);
  useEffectHH(() => {
    const id = setInterval(() => setTickHH((t) => t + 1), 1500);
    return () => clearInterval(id);
  }, []);
  const budgetData = getBudgetData && getBudgetData();
  const budgetExpenses = budgetData?.expenses;

  useEffectHH(() => {
    try {
      const saved = JSON.parse(localStorage.getItem("ledger:household") || "null");
      if (saved) {
        // Migrate older saves: ensure first member is "Me" and flagged for profile sync
        if (saved.members && saved.members.length > 0 && !saved.members[0].syncFromProfile) {
          saved.members[0] = { ...saved.members[0], name: "Me", syncFromProfile: true };
        }
        setHousehold(saved);
      }
    } catch {}
  }, []);
  useEffectHH(() => {
    localStorage.setItem("ledger:household", JSON.stringify(household));
  }, [household]);

  // Live-sync the "Me" member's profile + personal expenses from the Budget tab.
  // Income: salary + bonus + additionalIncome. Personal expenses: carIns + gas +
  // otherLoan + (secondary + subscriptions rolled up as "personal" discretionary).
  useEffectHH(() => {
    setHousehold((h) => {
      if (!h.members.length) return h;
      const me = h.members[0];
      if (!me.syncFromProfile) return h;
      const secondaryTotal = (budgetExpenses?.secondary || []).reduce((a, it) => a + (Number(it.amount) || 0), 0);
      const subsTotal      = (budgetExpenses?.subscriptions || []).reduce((a, it) => a + (Number(it.amount) || 0), 0);
      const personalDiscretionary = Math.round(secondaryTotal + subsTotal);
      const next = {
        ...me,
        salary: profile.salary,
        bonus:  profile.bonus,
        additionalIncome: profile.additionalIncome || 0,
        additionalIncomeLabel: profile.additionalIncomeLabel || "",
        filing: profile.filing,
        state:  profile.state,
        city:   profile.city,
        ficaExempt: profile.ficaExempt,
        personalExpenses: {
          ...me.personalExpenses,
          carIns:    budgetExpenses?.carIns    ?? me.personalExpenses.carIns,
          gas:       budgetExpenses?.gas       ?? me.personalExpenses.gas,
          otherLoan: budgetExpenses?.otherLoan ?? me.personalExpenses.otherLoan,
          personal:  budgetExpenses ? personalDiscretionary : me.personalExpenses.personal,
        },
      };
      // Skip update if nothing changed (avoid render loops)
      const profileKeys = ["salary","bonus","additionalIncome","additionalIncomeLabel","filing","state","city","ficaExempt"];
      const expKeys = ["carIns","gas","otherLoan","personal"];
      const sameProfile = profileKeys.every((k) => next[k] === me[k]);
      const sameExp = expKeys.every((k) => next.personalExpenses[k] === me.personalExpenses[k]);
      if (sameProfile && sameExp) return h;
      return { ...h, members: [next, ...h.members.slice(1)] };
    });
  }, [
    profile.salary, profile.bonus, profile.additionalIncome, profile.additionalIncomeLabel,
    profile.filing, profile.state, profile.city, profile.ficaExempt,
    budgetExpenses?.carIns, budgetExpenses?.gas, budgetExpenses?.otherLoan,
    JSON.stringify(budgetExpenses?.secondary || []),
    JSON.stringify(budgetExpenses?.subscriptions || []),
  ]);

  const updMember = (id, patch) => setHousehold((h) => ({
    ...h,
    members: h.members.map((m) => m.id === id ? { ...m, ...patch } : m),
  }));
  const updMemberExpense = (id, key, value) => {
    setHousehold((h) => ({
      ...h,
      members: h.members.map((m) => m.id === id
        ? { ...m, personalExpenses: { ...m.personalExpenses, [key]: value } }
        : m),
    }));
    // If editing the "Me" member's personal expenses AND it's profile-synced,
    // push the change back to the Budget tab so the link is bidirectional.
    // Maps household keys → budget expense keys.
    const member = household.members.find((m) => m.id === id);
    if (member?.syncFromProfile) {
      const budgetKeyMap = { carIns: "carIns", gas: "gas", otherLoan: "otherLoan" };
      const budgetKey = budgetKeyMap[key];
      if (budgetKey) {
        try {
          const budget = JSON.parse(localStorage.getItem("ledger:budget") || "{}");
          budget.expenses = { ...(budget.expenses || {}), [budgetKey]: value };
          // Edits on Household tab break the auto-sync from other sources
          if (budgetKey === "carIns") budget.expenses.carInsAutoSync = false;
          if (budgetKey === "gas") budget.expenses.gasAutoSync = false;
          if (budgetKey === "otherLoan") budget.expenses.otherLoanAutoSync = false;
          localStorage.setItem("ledger:budget", JSON.stringify(budget));
          window.__ledgerData = { ...(window.__ledgerData || {}), expenses: budget.expenses };
        } catch {}
      }
    }
  };
  const updShared = (key, value) => setHousehold((h) => ({
    ...h,
    shared: { ...h.shared, [key]: value },
  }));
  const addMember = () => {
    const newId = Math.max(0, ...household.members.map((m) => m.id)) + 1;
    const color = MEMBER_COLORS[household.members.length % MEMBER_COLORS.length];
    setHousehold((h) => ({
      ...h,
      members: [...h.members, {
        id: newId, name: `Person ${newId}`, color,
        salary: 50000, filing: "single", state: profile.state, city: profile.city, ficaExempt: false,
        personalExpenses: { carIns: 130, gas: 180, otherLoan: 0, personal: 200 },
      }],
    }));
  };
  const removeMember = (id) => {
    if (household.members.length <= 1) return;
    setHousehold((h) => ({ ...h, members: h.members.filter((m) => m.id !== id) }));
  };

  // Per-member calculations
  const memberStats = useMemoHH(() => {
    return household.members.map((m) => {
      const tax = computeTaxes(m);
      const split = computeMemberSplit(household, m.id);
      const sharedTotal = Object.values(household.shared).reduce((a, b) => a + b, 0);
      const personalTotal = Object.values(m.personalExpenses).reduce((a, b) => a + b, 0);
      const sharedShare = sharedTotal * split;
      const monthlyTakeHome = tax.takeHome / 12;
      const monthlyLeftover = monthlyTakeHome - sharedShare - personalTotal;
      return {
        ...m,
        tax,
        split,
        sharedShare,
        personalTotal,
        monthlyTakeHome,
        monthlyLeftover,
        annualLeftover: monthlyLeftover * 12,
      };
    });
  }, [household]);

  const totalSharedMonthly = Object.values(household.shared).reduce((a, b) => a + b, 0);
  const totalHouseholdIncome = memberStats.reduce((a, m) => a + m.monthlyTakeHome, 0);
  const totalHouseholdLeftover = memberStats.reduce((a, m) => a + m.monthlyLeftover, 0);

  const isMonthly = view === "monthly";
  const periodMult = isMonthly ? 1 : 12;
  const periodLabel = isMonthly ? "/mo" : "/yr";

  return (
    <>
      <header className="page-head">
        <div>
          <h1 className="page-title">Household <em>&amp;</em> roommates</h1>
        </div>
        <div className="page-head-right">
          <div className="page-head-actions">
            <div className="view-toggle">
              <Segment
                value={view}
                onChange={setView}
                options={[
                  { value: "monthly",  label: "Monthly" },
                  { value: "annually", label: "Annually" },
                ]}
              />
            </div>
            <ExportButton calculatorName="Household" />
          </div>
          <div className="page-sub">
            Multiple earners · shared housing · independent savings
          </div>
        </div>
      </header>

      <div className="layout">
        <aside className="col-inputs">
          {/* Members */}
          {household.members.map((m, idx) => (
            <MemberCard
              key={m.id}
              member={m}
              index={idx}
              isOnly={household.members.length === 1}
              onUpdate={(patch) => updMember(m.id, patch)}
              onUpdateExpense={(k, v) => updMemberExpense(m.id, k, v)}
              onRemove={() => removeMember(m.id)}
            />
          ))}
          <button
            className="btn-add-member"
            onClick={addMember}
            title="Add a roommate / partner / family member"
          >
            <span className="btn-add-member-plus">+</span>
            <span className="btn-add-member-text">
              <span className="btn-add-member-title">Add another person</span>
              <span className="btn-add-member-sub">roommate, partner, family member</span>
            </span>
          </button>

          {/* Shared expenses */}
          <section className="card">
            <header className="card-head">
              <h2>Shared expenses</h2>
              <span className="card-tag">${Math.round(totalSharedMonthly).toLocaleString()}/mo</span>
            </header>
            <div className="card-body stack">
              {SHARED_FIELDS.map((f) => (
                <Field key={f.key} label={f.label}>
                  <Money
                    value={household.shared[f.key]}
                    onChange={(v) => updShared(f.key, v)}
                    placeholder="0"
                  />
                </Field>
              ))}
            </div>
          </section>

          {/* Split method */}
          <section className="card">
            <header className="card-head"><h2>Split method</h2></header>
            <div className="card-body stack">
              <Segment
                value={household.splitMode}
                onChange={(v) => setHousehold((h) => ({ ...h, splitMode: v }))}
                options={[
                  { value: "equal",  label: "Equal" },
                  { value: "income", label: "By income" },
                  { value: "custom", label: "Custom %" },
                ]}
              />
              {household.splitMode === "custom" && (
                <div className="stack" style={{ gap: 10, marginTop: 8 }}>
                  {household.members.map((m) => {
                    const pct = household.customSplits[m.id] ?? (1 / household.members.length);
                    return (
                      <div key={m.id} className="slider-row">
                        <div className="slider-label">
                          <span className="member-dot" style={{ background: m.color }} />
                          {m.name}
                        </div>
                        <input
                          type="range" min={0} max={1} step={0.05}
                          value={pct}
                          onChange={(e) => setHousehold((h) => ({
                            ...h,
                            customSplits: { ...h.customSplits, [m.id]: Number(e.target.value) },
                          }))}
                        />
                        <div className="slider-val">{(pct * 100).toFixed(0)}%</div>
                      </div>
                    );
                  })}
                </div>
              )}
              <p className="footnote" style={{ marginTop: 4 }}>
                {household.splitMode === "equal" && "Each person pays an equal share of all shared expenses."}
                {household.splitMode === "income" && "Higher earners pay proportionally more — split by take-home pay."}
                {household.splitMode === "custom" && "Set each person's share manually. They don't need to sum to 100%."}
              </p>
            </div>
          </section>
        </aside>

        <section className="col-results">
          {/* Hero: combined household */}
          {/* Order matches the Budget tab: leftover on LEFT (headline result),
              take-home on RIGHT (source) — so the same metric sits in the same place
              across pages. */}
          <section className="hero-card">
            <div className="hero-grid">
              <div className="hero-block">
                <div className="hero-eyebrow">{isMonthly ? "Monthly" : "Annual"} after expenses</div>
                <div className={"hero-num " + (totalHouseholdLeftover >= 0 ? "surplus" : "deficit")}>
                  {fmtUSD0(totalHouseholdLeftover * periodMult)}
                </div>
                <div className="hero-sub">across the household, after everything</div>
              </div>
              <div className="hero-divider" />
              <div className="hero-block">
                <div className="hero-eyebrow">Combined take-home</div>
                <div className="hero-num">
                  {fmtUSD0(totalHouseholdIncome * periodMult)}
                  <span className="hero-num-sm">{periodLabel}</span>
                </div>
                <div className="hero-sub">{household.members.length} earner{household.members.length !== 1 ? "s" : ""}</div>
              </div>
            </div>
          </section>

          {/* Per-member breakdown */}
          <div className="member-grid">
            {memberStats.map((m) => (
              <MemberBreakdown
                key={m.id}
                m={m}
                periodMult={periodMult}
                periodLabel={periodLabel}
              />
            ))}
          </div>

          {/* Comparison table */}
          <section className="card">
            <header className="card-head">
              <h2>Side-by-side comparison</h2>
              <span className="card-tag">{isMonthly ? "monthly" : "annual"}</span>
            </header>
            <div className="card-body" style={{ overflowX: "auto" }}>
              <table className="ptable" style={{ minWidth: 600 }}>
                <thead>
                  <tr>
                    <th>Line item</th>
                    {memberStats.map((m) => (
                      <th key={m.id} className="num">
                        <span className="member-dot" style={{ background: m.color, marginRight: 6 }} />
                        {m.name}
                      </th>
                    ))}
                    <th className="num">Total</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td>Gross salary</td>
                    {memberStats.map((m) => <td key={m.id} className="num">{fmtUSD0(m.salary * periodMult / 12)}</td>)}
                    <td className="num">{fmtUSD0(memberStats.reduce((a, m) => a + m.salary * periodMult / 12, 0))}</td>
                  </tr>
                  <tr>
                    <td>Tax</td>
                    {memberStats.map((m) => <td key={m.id} className="num neg">{fmtUSD0(m.tax.totalTax * periodMult / 12)}</td>)}
                    <td className="num neg">{fmtUSD0(memberStats.reduce((a, m) => a + m.tax.totalTax * periodMult / 12, 0))}</td>
                  </tr>
                  <tr>
                    <td><strong>Take-home</strong></td>
                    {memberStats.map((m) => <td key={m.id} className="num"><strong>{fmtUSD0(m.monthlyTakeHome * periodMult)}</strong></td>)}
                    <td className="num"><strong>{fmtUSD0(totalHouseholdIncome * periodMult)}</strong></td>
                  </tr>
                  <tr>
                    <td>Shared share <span className="row-hint" style={{display:"inline",marginLeft:6,fontSize:11}}>({(m => null)}{}{})</span></td>
                    {memberStats.map((m) => (
                      <td key={m.id} className="num neg">
                        {fmtUSD0(m.sharedShare * periodMult)}
                        <span className="row-hint" style={{display:"block",fontSize:10}}>{(m.split*100).toFixed(0)}%</span>
                      </td>
                    ))}
                    <td className="num neg">{fmtUSD0(totalSharedMonthly * periodMult)}</td>
                  </tr>
                  <tr>
                    <td>Personal expenses</td>
                    {memberStats.map((m) => <td key={m.id} className="num neg">{fmtUSD0(m.personalTotal * periodMult)}</td>)}
                    <td className="num neg">{fmtUSD0(memberStats.reduce((a, m) => a + m.personalTotal * periodMult, 0))}</td>
                  </tr>
                  <tr className="ptable-year-start">
                    <td><strong>Personal savings</strong></td>
                    {memberStats.map((m) => (
                      <td key={m.id} className={"num " + (m.monthlyLeftover >= 0 ? "pos" : "neg")}>
                        <strong>{m.monthlyLeftover >= 0 ? "+" : ""}{fmtUSD0(m.monthlyLeftover * periodMult)}</strong>
                      </td>
                    ))}
                    <td className={"num " + (totalHouseholdLeftover >= 0 ? "pos" : "neg")}>
                      <strong>{totalHouseholdLeftover >= 0 ? "+" : ""}{fmtUSD0(totalHouseholdLeftover * periodMult)}</strong>
                    </td>
                  </tr>
                </tbody>
              </table>
              <p className="footnote">
                Each person's savings stay separate — they only contribute their split of shared expenses.
                Personal expenses and personal income don't get pooled. Useful for couples, roommates, and partners who keep finances individual.
              </p>
            </div>
          </section>
        </section>
      </div>
    </>
  );
}

function MemberCard({ member, index, isOnly, onUpdate, onUpdateExpense, onRemove }) {
  const m = member;
  return (
    <section className="card member-card" style={{ borderLeftColor: m.color }}>
      <header className="card-head">
        <h2>
          <span className="member-dot" style={{ background: m.color }} />
          <input
            type="text"
            className="member-name-input"
            value={m.name}
            onChange={(e) => onUpdate({ name: e.target.value })}
          />
          {m.syncFromProfile && (
            <span className="member-sync-badge" title="Income, location and filing status come from the Budget tab. Edit them there.">
              ↻ from Budget
            </span>
          )}
        </h2>
        {!isOnly && !m.syncFromProfile && (
          <button className="icon-btn" onClick={onRemove} title="Remove person">×</button>
        )}
      </header>
      <div className="card-body stack">
        <Field label="Annual salary">
          <Money value={m.salary} onChange={(v) => onUpdate({ salary: v })} placeholder="65,000" />
        </Field>
        <Field label="Annual bonus" hint="optional">
          <Money value={m.bonus || 0} onChange={(v) => onUpdate({ bonus: v })} placeholder="0" />
        </Field>
        <Field label="Additional income" hint={m.additionalIncomeLabel || "freelance, side gig, rental"}>
          <Money value={m.additionalIncome || 0} onChange={(v) => onUpdate({ additionalIncome: v })} placeholder="0" />
        </Field>
        <Field label="Filing">
          <Segment
            value={m.filing}
            onChange={(v) => onUpdate({ filing: v })}
            options={[
              { value: "single",  label: "Single" },
              { value: "married", label: "Married" },
            ]}
          />
        </Field>
        <div className="row-2">
          <Field label="State">
            <select className="select" value={m.state} onChange={(e) => onUpdate({ state: e.target.value })}>
              {Object.entries(STATE_NAMES)
                .sort((a, b) => a[1].localeCompare(b[1]))
                .map(([code, name]) => <option key={code} value={code}>{name}</option>)}
            </select>
          </Field>
          <Field label="City" hint="optional">
            <input
              type="text"
              className="text-input"
              placeholder="e.g. Buffalo"
              value={m.city || ""}
              onChange={(e) => onUpdate({ city: e.target.value })}
            />
          </Field>
        </div>
        <Toggle
          value={!!m.ficaExempt}
          onChange={(v) => onUpdate({ ficaExempt: v })}
          label="FICA exempt"
          hint="F-1 / J-1 non-resident"
        />

        <h3 className="sub-head" style={{ marginTop: 10, marginBottom: 4 }}>
          Personal expenses
          {m.syncFromProfile && (
            <span className="member-sync-badge" title="Mirrors your Budget tab — car insurance, transportation, loans, plus secondary + subscriptions rolled up as 'Personal'.">
              ↻ from Budget
            </span>
          )}
        </h3>
        {PERSONAL_FIELDS.map((f) => (
          <Field key={f.key} label={f.label} hint={f.hint}>
            <Money
              value={m.personalExpenses[f.key]}
              onChange={(v) => onUpdateExpense(f.key, v)}
              placeholder="0"
            />
          </Field>
        ))}
      </div>
    </section>
  );
}

function MemberBreakdown({ m, periodMult, periodLabel }) {
  const monthlyTakeHome = m.monthlyTakeHome;
  const total = monthlyTakeHome;
  const segs = [
    { label: "Shared share",  value: m.sharedShare,    color: "#7B6E55" },
    { label: "Personal exp.", value: m.personalTotal,  color: "#9C7C4B" },
    { label: m.monthlyLeftover >= 0 ? "Savings" : "Shortfall",
      value: Math.abs(m.monthlyLeftover),
      color: m.monthlyLeftover >= 0 ? m.color : "var(--negative)" },
  ].filter((s) => s.value > 0);
  const sum = segs.reduce((a, s) => a + s.value, 0) || 1;

  return (
    <div className="member-summary" style={{ borderLeftColor: m.color }}>
      <div className="member-summary-head">
        <span className="member-summary-name">
          <span className="member-dot" style={{ background: m.color }} />
          {m.name}
        </span>
        <span className="member-summary-takehome">{fmtUSD0(monthlyTakeHome * periodMult)}{periodLabel}</span>
      </div>
      <div className="stack-bar" style={{ height: 12, marginTop: 12, marginBottom: 12 }}>
        {segs.map((s, i) => (
          <div
            key={i}
            style={{ width: (s.value / sum * 100) + "%", background: s.color }}
            title={`${s.label}: ${fmtUSD0(s.value)}`}
          />
        ))}
      </div>
      <div className="member-summary-rows">
        <div className="member-summary-row">
          <span>Tax</span>
          <span className="num neg">{fmtUSD0(m.tax.totalTax * periodMult / 12)}</span>
        </div>
        <div className="member-summary-row">
          <span>Shared share <span style={{color:"var(--ink-4)",fontStyle:"italic"}}>({(m.split*100).toFixed(0)}%)</span></span>
          <span className="num neg">{fmtUSD0(m.sharedShare * periodMult)}</span>
        </div>
        <div className="member-summary-row">
          <span>Personal expenses</span>
          <span className="num neg">{fmtUSD0(m.personalTotal * periodMult)}</span>
        </div>
        <div className="member-summary-row member-summary-total">
          <span>Personal savings</span>
          <span className={"num " + (m.monthlyLeftover >= 0 ? "pos" : "neg")}>
            <strong>{m.monthlyLeftover >= 0 ? "+" : ""}{fmtUSD0(m.monthlyLeftover * periodMult)}</strong>
          </span>
        </div>
      </div>
    </div>
  );
}

window.HouseholdCalculator = HouseholdCalculator;

</script>

<script type="text/babel" data-presets="react">
// Savings & Investing — portfolio editor with arbitrary investment types + cash buckets.
const { useMemo: useMemoInvest, useEffect: useEffectInvest, useState: useStateInvest } = React;

const INVEST_COLORS = ["#4DA77A", "#C9A96E", "#7B6E55", "#5A8FA3", "#9C7C4B", "#B85450", "#4FB5B0", "#A07ABE"];

// Common brokerages / platforms — used as suggestions in the platform dropdown
const INVEST_PLATFORMS = [
  "Fidelity", "Vanguard", "Schwab", "Robinhood", "E*TRADE", "Wealthfront", "Betterment",
  "Coinbase", "Binance", "Kraken", "Public", "M1 Finance", "Acorns", "SoFi", "Other"
];

// Return-period options. Each maps to a per-period rate the user enters; we convert to annual.
const RETURN_PERIODS = {
  monthly: { label: "Monthly",  per: 12, defaultHorizon: "short" },
  "3mo":   { label: "Quarterly (3 mo)", per: 4,  defaultHorizon: "short" },
  "6mo":   { label: "Semi-annual (6 mo)", per: 2,  defaultHorizon: "long"  },
  yearly:  { label: "Yearly",   per: 1,  defaultHorizon: "long"  },
};

// Convert a per-period rate (e.g. 0.8% monthly) into an annual rate for the projection math.
// returnInput is the user-entered decimal for one period (0.008 = 0.8%).
function periodToAnnual(returnInput, period) {
  const per = RETURN_PERIODS[period]?.per || 1;
  return Math.pow(1 + (returnInput || 0), per) - 1;
}
function annualToPeriod(annualRate, period) {
  const per = RETURN_PERIODS[period]?.per || 1;
  return Math.pow(1 + (annualRate || 0), 1 / per) - 1;
}

const DEFAULT_PORTFOLIO = {
  emergency: 0.30,
  reserve:   0.10,
  investments: [
    { id: 1, name: "Stocks",       pct: 0.30, returnRate: 0.10, horizon: "long",  returnPeriod: "yearly",  returnInput: 0.10,  platform: "Fidelity"   },
    { id: 2, name: "Real Estate",  pct: 0.15, returnRate: 0.07, horizon: "long",  returnPeriod: "yearly",  returnInput: 0.07,  platform: "Other"      },
    { id: 3, name: "Fixed Income", pct: 0.15, returnRate: 0.05, horizon: "long",  returnPeriod: "yearly",  returnInput: 0.05,  platform: "Vanguard"   },
  ],
};

const PRESET_INVESTMENTS = [
  { name: "Stocks",       returnRate: 0.10, horizon: "long",  returnPeriod: "yearly",  platform: "Fidelity"   },
  { name: "Real Estate",  returnRate: 0.07, horizon: "long",  returnPeriod: "yearly",  platform: "Other"      },
  { name: "Fixed Income", returnRate: 0.05, horizon: "long",  returnPeriod: "yearly",  platform: "Vanguard"   },
  { name: "Bonds",        returnRate: 0.04, horizon: "long",  returnPeriod: "yearly",  platform: "Vanguard"   },
  { name: "Crypto",       returnRate: 0.15, horizon: "short", returnPeriod: "monthly", platform: "Coinbase"   },
  { name: "Index Fund",   returnRate: 0.09, horizon: "long",  returnPeriod: "yearly",  platform: "Vanguard"   },
  { name: "401k",         returnRate: 0.08, horizon: "long",  returnPeriod: "yearly",  platform: "Fidelity"   },
  { name: "Roth IRA",     returnRate: 0.08, horizon: "long",  returnPeriod: "yearly",  platform: "Schwab"     },
  { name: "Gold",         returnRate: 0.05, horizon: "long",  returnPeriod: "yearly",  platform: "Other"      },
  { name: "REITs",        returnRate: 0.08, horizon: "long",  returnPeriod: "yearly",  platform: "Schwab"     },
  { name: "Money market", returnRate: 0.045, horizon: "short", returnPeriod: "monthly", platform: "Fidelity"  },
  { name: "T-bills",      returnRate: 0.05, horizon: "short", returnPeriod: "3mo",     platform: "Schwab"     },
];

// Migrate an old investment shape (just {id,name,pct,returnRate}) into the new one with defaults.
function migrateInvestment(inv) {
  if (inv.horizon) return inv; // already migrated
  return {
    ...inv,
    horizon:      "long",
    returnPeriod: "yearly",
    returnInput:  inv.returnRate || 0,
    platform:     inv.platform || "Other",
  };
}

function portfolioTotal(p) {
  return p.emergency + p.reserve + p.investments.reduce((a, b) => a + b.pct, 0);
}

// Compute year-by-year projection. Auto-normalizes allocations if total ≠ 100%.
// `overrideAnnualSavings` — if provided, use this each year instead of y.leftover
// (lets the user invest a fixed custom amount instead of their Budget surplus).
function computeInvestmentProjection(years, portfolio, overrideAnnualSavings) {
  const total = portfolioTotal(portfolio);
  const factor = total > 0 ? 1 / total : 0;
  let emergencyBal = 0, reserveBal = 0;
  const invBals = portfolio.investments.map(() => 0);
  const rows = [];
  for (const y of years) {
    const savings = overrideAnnualSavings != null
      ? overrideAnnualSavings * (y.months / 12)
      : Math.max(0, y.leftover);
    emergencyBal += savings * portfolio.emergency * factor;
    reserveBal   += savings * portfolio.reserve   * factor;
    portfolio.investments.forEach((inv, i) => {
      invBals[i] = invBals[i] * (1 + inv.returnRate) + savings * inv.pct * factor;
    });
    rows.push({
      year: y.year,
      savings,
      cash: { emergency: emergencyBal, reserve: reserveBal },
      investments: portfolio.investments.map((inv, i) => ({
        name: inv.name,
        balance: invBals[i],
      })),
      netWorth: emergencyBal + reserveBal + invBals.reduce((a, b) => a + b, 0),
    });
  }
  return rows;
}

function computeMonthlyInvestmentProjection(years, portfolio, overrideMonthlySavings) {
  const total = portfolioTotal(portfolio);
  const factor = total > 0 ? 1 / total : 0;
  const monthlyRates = portfolio.investments.map((inv) => Math.pow(1 + inv.returnRate, 1/12) - 1);
  let emergencyBal = 0, reserveBal = 0;
  const invBals = portfolio.investments.map(() => 0);
  const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const rows = [];
  for (const y of years) {
    const startMo = y.startMonthIdx;
    const monthlySavings = overrideMonthlySavings != null
      ? overrideMonthlySavings
      : Math.max(0, y.leftover) / y.months;
    const mEm = monthlySavings * portfolio.emergency * factor;
    const mRe = monthlySavings * portfolio.reserve * factor;
    const mInv = portfolio.investments.map((inv) => monthlySavings * inv.pct * factor);
    for (let m = startMo; m < 12; m++) {
      emergencyBal += mEm;
      reserveBal   += mRe;
      portfolio.investments.forEach((inv, i) => {
        invBals[i] = invBals[i] * (1 + monthlyRates[i]) + mInv[i];
      });
      rows.push({
        key: `${y.year}-${m}`,
        label: `${MONTHS[m]} ${y.year}`,
        savings: monthlySavings,
        cash: { emergency: emergencyBal, reserve: reserveBal },
        investments: portfolio.investments.map((inv, i) => ({
          name: inv.name,
          balance: invBals[i],
        })),
        netWorth: emergencyBal + reserveBal + invBals.reduce((a, b) => a + b, 0),
        isYearStart: m === startMo,
      });
    }
  }
  return rows;
}

function PortfolioEditor({ portfolio, setPortfolio, rateMode = "annual", totalMonthly = 0 }) {
  // Convert internal annual rate <-> displayed value depending on user's preferred entry mode
  const annualToDisplay = (annual) => rateMode === "monthly"
    ? ((Math.pow(1 + annual, 1/12) - 1) * 100).toFixed(2)
    : (annual * 100).toFixed(1);
  const displayToAnnual = (v) => rateMode === "monthly"
    ? Math.pow(1 + v / 100, 12) - 1
    : v / 100;
  const rateLabel = rateMode === "monthly" ? "Return / mo" : "Return / yr";
  // Sum of all investment dollar amounts (helpful for the user to see vs total)
  const investSum = totalMonthly * portfolio.investments.reduce((a, b) => a + b.pct, 0);
  const total = portfolioTotal(portfolio);
  const totalPct = total * 100;
  const totalOk = Math.abs(totalPct - 100) < 0.5;

  const updateCash = (key, value) => setPortfolio((p) => ({ ...p, [key]: value / 100 }));
  const updateInvestment = (id, patch) => setPortfolio((p) => ({
    ...p,
    investments: p.investments.map((inv) => inv.id === id ? { ...inv, ...patch } : inv),
  }));
  const removeInvestment = (id) => setPortfolio((p) => ({
    ...p,
    investments: p.investments.filter((inv) => inv.id !== id),
  }));
  const addInvestment = (preset) => {
    const id = Math.max(0, ...portfolio.investments.map((i) => i.id)) + 1;
    const horizon      = preset?.horizon      || "long";
    const returnPeriod = preset?.returnPeriod || (horizon === "short" ? "monthly" : "yearly");
    const annualRate   = preset?.returnRate   || 0.06;
    setPortfolio((p) => ({
      ...p,
      investments: [...p.investments, {
        id,
        name: preset?.name || "New investment",
        pct: 0.05,
        returnRate: annualRate,                        // canonical annual rate (for math)
        returnPeriod,
        returnInput: annualToPeriod(annualRate, returnPeriod), // displayed value for that period
        horizon,
        platform: preset?.platform || "Other",
      }],
    }));
  };
  // Per-investment expand/collapse state (UI-only, not persisted)
  const [expandedInv, setExpandedInv] = useStateInvest({});
  const isInvExpanded = (id) => expandedInv[id] === true; // default: collapsed (compact view)
  const toggleInv = (id) => setExpandedInv((m) => ({ ...m, [id]: !isInvExpanded(id) }));
  const normalize = () => {
    if (total === 0) return;
    const factor = 1 / total;
    setPortfolio((p) => ({
      ...p,
      emergency: p.emergency * factor,
      reserve:   p.reserve * factor,
      investments: p.investments.map((inv) => ({ ...inv, pct: inv.pct * factor })),
    }));
  };

  // Smart-optimize: apply a textbook split (Bogleheads-style).
  // 20% emergency fund, 10% short-term reserve, 70% across investments.
  // Investment split weights long-horizon types higher than short-horizon ones.
  const optimize = () => {
    setPortfolio((p) => {
      // If there are no investments, seed a default diversified index fund
      if (p.investments.length === 0) {
        return {
          ...p,
          emergency: 0.20,
          reserve:   0.10,
          investments: [{
            id: 1, name: "Index Fund", pct: 0.70, returnRate: 0.09,
            horizon: "long", returnPeriod: "yearly", returnInput: 0.09, platform: "Vanguard",
          }],
        };
      }
      // Weight long-term twice as heavy as short-term to encourage diversification
      const weights = p.investments.map((inv) => {
        const m = migrateInvestment(inv);
        return m.horizon === "long" ? 2 : 1;
      });
      const totalW = weights.reduce((a, b) => a + b, 0) || 1;
      return {
        ...p,
        emergency: 0.20,
        reserve:   0.10,
        investments: p.investments.map((inv, i) => ({ ...inv, pct: 0.70 * weights[i] / totalW })),
      };
    });
  };

  const cashColor1 = "#C9A96E";
  const cashColor2 = "#5A8FA3";

  return (
    <section className="card">
      <header className="card-head">
        <h2>Portfolio allocation</h2>
        <span className={"card-tag " + (totalOk ? "" : "card-tag-warn")}>
          total: {totalPct.toFixed(1)}%
          {!totalOk && <button className="btn-link" style={{ marginLeft: 8 }} onClick={normalize}>normalize →</button>}
        </span>
      </header>
      <div className="card-body">

        <div className="port-bar">
          <div style={{ width: `${portfolio.emergency * 100}%`, background: cashColor1 }} title={`Emergency ${(portfolio.emergency*100).toFixed(0)}%`} />
          <div style={{ width: `${portfolio.reserve * 100}%`,   background: cashColor2 }} title={`Reserve ${(portfolio.reserve*100).toFixed(0)}%`} />
          {portfolio.investments.map((inv, i) => (
            <div key={inv.id}
                 style={{ width: `${inv.pct * 100}%`, background: INVEST_COLORS[i % INVEST_COLORS.length] }}
                 title={`${inv.name} ${(inv.pct*100).toFixed(0)}%`} />
          ))}
        </div>

        <h3 className="sub-head">Cash reserves</h3>
        <div className="port-row port-row-head">
          <span></span>
          <span>Name</span>
          <span className="num">Allocation</span>
          <span className="num">Return</span>
          <span></span>
        </div>
        <div className="port-row">
          <span className="port-dot" style={{ background: cashColor1 }} />
          <span className="port-name port-name-fixed">Emergency fund</span>
          <NumberInput value={(portfolio.emergency * 100).toFixed(1)} onChange={(v) => updateCash("emergency", v)} suffix="%" />
          <span className="port-fixed">cash</span>
          <span></span>
        </div>
        <div className="port-row">
          <span className="port-dot" style={{ background: cashColor2 }} />
          <span className="port-name port-name-fixed">Reserve</span>
          <NumberInput value={(portfolio.reserve * 100).toFixed(1)} onChange={(v) => updateCash("reserve", v)} suffix="%" />
          <span className="port-fixed">cash</span>
          <span></span>
        </div>

        <h3 className="sub-head" style={{ marginTop: 18, display: "flex", alignItems: "center", gap: 10 }}>
          <span>Investments</span>
          {totalMonthly > 0 && (
            <span style={{
              fontSize: 12,
              fontWeight: 400,
              color: investSum > totalMonthly * 1.001 ? "var(--negative)" : "var(--ink-3)",
              fontFamily: "var(--display)",
              fontStyle: "italic",
            }}>
              {fmtUSD0(investSum)} / {fmtUSD0(totalMonthly)} committed
              {investSum > totalMonthly * 1.001 && " (over)"}
            </span>
          )}
        </h3>
        {portfolio.investments.length === 0 && (
          <div className="port-empty">No investment types yet. Add one below ↓</div>
        )}
        {portfolio.investments.map((inv, i) => {
          const m = migrateInvestment(inv);
          const open = isInvExpanded(m.id);
          const periodInfo = RETURN_PERIODS[m.returnPeriod] || RETURN_PERIODS.yearly;
          // Display the per-period return value as a %
          const periodPct = ((m.returnInput || 0) * 100).toFixed(2);
          // Always show annual equivalent for context
          const annualPct = (m.returnRate * 100).toFixed(1);
          return (
            <div key={m.id} className={"inv-card" + (open ? "" : " is-collapsed")}>
              <div className="inv-card-head">
                <button
                  type="button"
                  className={"debt-card-chevron" + (open ? " is-open" : "")}
                  onClick={() => toggleInv(m.id)}
                  title={open ? "Collapse" : "Expand"}
                >▾</button>
                <span className="port-dot" style={{ background: INVEST_COLORS[i % INVEST_COLORS.length] }} />
                <input
                  type="text"
                  className="text-input inv-card-name"
                  value={m.name}
                  onChange={(e) => updateInvestment(m.id, { name: e.target.value })}
                  placeholder="Investment name"
                />
                <span className={"inv-horizon-pill " + (m.horizon === "short" ? "is-short" : "is-long")}>
                  {m.horizon === "short" ? "Short term" : "Long term"}
                </span>
                <button className="icon-btn" onClick={() => removeInvestment(m.id)} title="Remove">×</button>
              </div>
              {!open && (
                <button type="button" className="debt-card-summary" onClick={() => toggleInv(m.id)}>
                  <span>
                    <strong>{(m.pct * 100).toFixed(1)}%</strong>
                    {totalMonthly > 0 && <span style={{ color: "var(--accent-2)" }}> · {fmtUSD0(m.pct * totalMonthly)}/mo</span>}
                  </span>
                  <span className="debt-card-summary-sep">·</span>
                  <span>{periodPct}% {periodInfo.label.toLowerCase()}</span>
                  <span className="debt-card-summary-sep">·</span>
                  <span>{annualPct}%/yr equiv</span>
                  <span className="debt-card-summary-sep">·</span>
                  <span>{m.platform}</span>
                </button>
              )}
              {open && (
                <div className="inv-card-grid">
                  <Field
                    label="Allocation"
                    hint={totalMonthly > 0 ? `${fmtUSD0(m.pct * totalMonthly)}/mo` : "% of savings"}
                  >
                    <div style={{ display: "flex", gap: 6 }}>
                      <NumberInput
                        value={(m.pct * 100).toFixed(1)}
                        onChange={(v) => updateInvestment(m.id, { pct: v / 100 })}
                        suffix="%"
                      />
                      {totalMonthly > 0 && (
                        <Money
                          value={Math.round(m.pct * totalMonthly)}
                          onChange={(v) => updateInvestment(m.id, { pct: totalMonthly > 0 ? (v / totalMonthly) : 0 })}
                          placeholder="0"
                        />
                      )}
                    </div>
                  </Field>
                  <Field label="Time horizon" hint="how long you'll hold">
                    <Segment
                      value={m.horizon}
                      onChange={(v) => {
                        // Auto-pick a sensible default return period when toggling horizon
                        const nextPeriod = v === "short" ? "monthly" : "yearly";
                        const annual = m.returnRate;
                        updateInvestment(m.id, {
                          horizon: v,
                          returnPeriod: nextPeriod,
                          returnInput: annualToPeriod(annual, nextPeriod),
                        });
                      }}
                      options={[
                        { value: "short", label: "Short" },
                        { value: "long",  label: "Long"  },
                      ]}
                    />
                  </Field>
                  <Field label="Return period" hint="how you enter %">
                    <select
                      className="select"
                      value={m.returnPeriod}
                      onChange={(e) => {
                        const nextPeriod = e.target.value;
                        // Preserve the annual rate, recompute the per-period display value
                        updateInvestment(m.id, {
                          returnPeriod: nextPeriod,
                          returnInput: annualToPeriod(m.returnRate, nextPeriod),
                        });
                      }}
                    >
                      {Object.entries(RETURN_PERIODS).map(([k, v]) => (
                        <option key={k} value={k}>{v.label}</option>
                      ))}
                    </select>
                  </Field>
                  <Field
                    label={`Expected return (${periodInfo.label.toLowerCase()})`}
                    hint={`≈ ${annualPct}%/yr`}
                  >
                    <NumberInput
                      value={periodPct}
                      onChange={(v) => {
                        const perInput = (v || 0) / 100;
                        updateInvestment(m.id, {
                          returnInput: perInput,
                          returnRate: periodToAnnual(perInput, m.returnPeriod),
                        });
                      }}
                      suffix="%"
                    />
                  </Field>
                  <Field label="Platform" hint="brokerage / exchange">
                    <select
                      className="select"
                      value={m.platform || "Other"}
                      onChange={(e) => updateInvestment(m.id, { platform: e.target.value })}
                    >
                      {INVEST_PLATFORMS.map((p) => <option key={p} value={p}>{p}</option>)}
                    </select>
                  </Field>
                </div>
              )}
            </div>
          );
        })}

        <div className="port-add">
          <button className="btn-ghost" onClick={() => addInvestment()}>+ Add investment</button>
          <span className="port-add-or">or quick-add:</span>
          <div className="port-presets">
            {PRESET_INVESTMENTS
              .filter((preset) => !portfolio.investments.some((inv) => inv.name.toLowerCase() === preset.name.toLowerCase()))
              .slice(0, 6)
              .map((preset) => (
                <button key={preset.name} className="port-preset-btn" onClick={() => addInvestment(preset)}>
                  + {preset.name}
                </button>
              ))}
          </div>
        </div>

      </div>
    </section>
  );
}

function InvestingCalculator({ profile, getBudgetData }) {
  const [portfolio, setPortfolio] = useStateInvest(DEFAULT_PORTFOLIO);
  const [years, setYears] = useStateInvest(10);
  const [horizonUnit, setHorizonUnit] = useStateInvest("years");
  const [view, setView] = useStateInvest("yearly");
  const [tick, setTick] = useStateInvest(0);
  // Funding source: "budget" = use leftover from Budget tab, "custom" = use a fixed monthly amount
  const [fundingMode, setFundingMode] = useStateInvest("budget");
  const [customMonthly, setCustomMonthly] = useStateInvest(0);
  // Return rate input: "annual" or "monthly" — how the user wants to enter return percentages
  const [rateMode, setRateMode] = useStateInvest("annual");

  useEffectInvest(() => {
    try {
      const saved = JSON.parse(localStorage.getItem("ledger:invest-v2") || "null");
      if (saved) {
        saved.portfolio && setPortfolio(saved.portfolio);
        saved.years     && setYears(saved.years);
        saved.unit      && setHorizonUnit(saved.unit);
        saved.fundingMode    && setFundingMode(saved.fundingMode);
        saved.customMonthly != null && setCustomMonthly(saved.customMonthly);
        saved.rateMode       && setRateMode(saved.rateMode);
      }
    } catch {}
  }, []);
  useEffectInvest(() => {
    localStorage.setItem("ledger:invest-v2", JSON.stringify({
      portfolio, years, unit: horizonUnit, fundingMode, customMonthly, rateMode
    }));
  }, [portfolio, years, horizonUnit, fundingMode, customMonthly, rateMode]);

  useEffectInvest(() => {
    const id = setInterval(() => setTick((t) => t + 1), 1000);
    return () => clearInterval(id);
  }, []);

  const budget = getBudgetData();
  const yearCountForProj = Math.max(1, Math.ceil(years));
  const projYears = useMemoInvest(() => {
    // Custom funding doesn't need a Budget — synthesize plain year buckets
    if (fundingMode === "custom") {
      const startYear = new Date().getFullYear();
      const synth = [];
      for (let i = 0; i < yearCountForProj; i++) {
        synth.push({ year: startYear + i, leftover: 0, months: 12, startMonthIdx: 0 });
      }
      return synth;
    }
    if (!budget?.expenses || !budget?.growth) return [];
    return buildProjectionYears(profile, budget.expenses, budget.growth, yearCountForProj);
  }, [fundingMode, profile, budget?.expenses, budget?.growth, yearCountForProj, tick]);

  // If user picked "Custom amount", override projection savings with their fixed monthly contribution
  const overrideAnnual  = fundingMode === "custom" ? (customMonthly * 12) : undefined;
  const overrideMonthly = fundingMode === "custom" ? customMonthly        : undefined;

  const rows = useMemoInvest(
    () => computeInvestmentProjection(projYears, portfolio, overrideAnnual),
    [projYears, portfolio, overrideAnnual]
  );
  const monthRows = useMemoInvest(
    () => view === "monthly" ? computeMonthlyInvestmentProjection(projYears, portfolio, overrideMonthly) : [],
    [projYears, portfolio, view, overrideMonthly]
  );

  const targetMonths = Math.max(1, Math.round(years * 12));
  const targetYears  = Math.max(1, Math.ceil(years));
  const displayedMonthRows = monthRows.slice(0, targetMonths);
  const displayedRows = rows.slice(0, targetYears);

  const displayedFinal = view === "monthly"
    ? displayedMonthRows[displayedMonthRows.length - 1]
    : displayedRows[displayedRows.length - 1];
  const totalContributed = (view === "monthly" ? displayedMonthRows : displayedRows)
    .reduce((a, r) => a + r.savings, 0);
  const growthAmount = (displayedFinal?.netWorth || 0) - totalContributed;

  const needsBudget = fundingMode === "budget" && (!budget?.expenses || projYears.length === 0);

  // Summary by category
  const cashTotal = (displayedFinal?.cash?.emergency || 0) + (displayedFinal?.cash?.reserve || 0);
  const investmentsTotal = (displayedFinal?.investments || []).reduce((a, b) => a + b.balance, 0);

  return (
    <>
      <header className="page-head">
        <div>
          <h1 className="page-title">Savings <em>&amp;</em> investing</h1>
        </div>
        <div className="page-head-right">
          <div className="page-head-actions">
            <div className="view-toggle">
              <Segment
                value={view}
                onChange={setView}
                options={[
                  { value: "yearly",  label: "Yearly" },
                  { value: "monthly", label: "Monthly" },
                ]}
              />
            </div>
            <ExportButton calculatorName="Savings & investing" />
          </div>
          <div className="page-sub">Build a multi-asset portfolio · live-linked to Budget</div>
        </div>
      </header>

      {/* Top hero: investment source + monthly amount + return rate at a glance.
          Pulled to the very top so the two most important inputs are right there. */}
      <section className="invest-top-hero">
        <div className="invest-top-row">
          <div className="invest-top-block">
            <div className="invest-top-eyebrow">Investment source</div>
            <Segment
              value={fundingMode}

              <div className="hero-block">
                <div className="hero-eyebrow">Growth multiple</div>
                <div className="hero-num">
                  {totalContributed > 0 ? ((displayedFinal?.netWorth || 0) / totalContributed).toFixed(2) : "—"}
                  <span className="hero-num-sm">×</span>
                </div>

          <div className="kpi-grid">
            <div className="kpi">
              <div className="kpi-eyebrow">Cash reserves</div>
              <div className="kpi-num"><CountUp value={cashTotal} /></div>

            </div>
            <div className="kpi">
              <div className="kpi-eyebrow">Investments total</div>
              <div className="kpi-num pos"><CountUp value={investmentsTotal} /></div>
              <div className="kpi-sub">{portfolio.investments.length} asset{portfolio.investments.length !== 1 ? "s" : ""}</div>
            </div>
          </div>

          {(displayedFinal?.investments || []).length > 0 && (
            <section className="card">
              <header className="card-head">
                <h2>By investment type</h2>
                <span className="card-tag">value over time · {view}</span>
              </header>
              <div className="card-body">
                <InvestmentGrowthAreaChart
                  rows={view === "monthly" ? displayedMonthRows : displayedRows}
                  portfolio={portfolio}
                  view={view}
                />
                {/* Compact summary strip below the chart with final-period totals */}
                <div className="invest-chart-legend">
                  {displayedFinal.investments.map((inv, i) => {
                    const meta = portfolio.investments[i];
                    return (
                      <div key={i} className="invest-chart-legend-item">

          <section className="card">

                    <tr key={r.key || r.year} className={r.isYearStart ? "ptable-year-start" : ""}>

}

function GrowthChart({ rows, portfolio }) {
  if (!rows || rows.length === 0) return null;
  const max = Math.max(...rows.map((r) => r.netWorth)) || 1;
  return (
    <div style={{ height: 220, display: "grid", gridTemplateColumns: `repeat(${rows.length}, 1fr)`, gap: rows.length > 15 ? 2 : 6, alignItems: "end", paddingBottom: 8, borderBottom: "1px solid var(--border)" }}>
      {rows.map((r, idx) => {
        const total = r.netWorth || 0.0001;
        const totH = (total / max) * 100;
        // Stack: emergency, reserve, then each investment
        const segs = [
          { val: r.cash.emergency, color: "#C9A96E" },
          { val: r.cash.reserve,   color: "#5A8FA3" },
          ...r.investments.map((inv, i) => ({
            val: inv.balance,
            color: INVEST_COLORS[i % INVEST_COLORS.length],
          })),
        ];
        return (
          <div key={idx} style={{ display: "flex", flexDirection: "column", justifyContent: "flex-end", height: "100%" }} title={`${r.year || r.label}: ${fmtUSD0(r.netWorth)}`}>
            {segs.map((s, i) => (
              <div key={i} style={{
                background: s.color,
                height: ((s.val / total) * totH) + "%",
                borderRadius: i === segs.length - 1 ? "3px 3px 0 0" : 0,
              }} />
            ))}
          </div>
        );
      })}
    </div>
  );
}

// Recharts-powered animated stacked area chart of each investment + cash bucket
// over time. Draws in on mount/data change, with a hover tooltip showing every
// series value at the hovered period.
function InvestmentGrowthAreaChart({ rows, portfolio, view }) {
  const R = window.Recharts;
  if (!R || !rows || rows.length === 0) return null;
  const { ResponsiveContainer, AreaChart, Area, XAxis, YAxis, CartesianGrid, Tooltip } = R;

  // Flatten rows into Recharts-friendly format. Each datum has one key per series.
  const data = rows.map((r) => {
    const obj = {
      label: r.label || String(r.year),
      Emergency: r.cash.emergency,
      Reserve: r.cash.reserve,
    };
    r.investments.forEach((inv) => { obj[inv.name] = inv.balance; });
    return obj;
  });

  const series = [
    { name: "Emergency", color: "#C9A96E" },
    { name: "Reserve",   color: "#5A8FA3" },
    ...portfolio.investments.map((inv, i) => ({
      name: inv.name,
      color: INVEST_COLORS[i % INVEST_COLORS.length],
    })),
  ].filter((s) => data.some((d) => (d[s.name] || 0) > 0));

  // Tighter X-axis label density for long monthly views
  const tickInterval = data.length > 24 ? Math.ceil(data.length / 12) : 0;
  const yTickFmt = (v) => {
    if (v >= 1_000_000) return "$" + (v / 1_000_000).toFixed(1) + "M";
    if (v >= 1_000)     return "$" + Math.round(v / 1000) + "k";
    return "$" + Math.round(v);
  };

  // Custom tooltip — dark themed, ordered by descending value at that point.
  function ChartTooltip({ active, payload, label }) {
    if (!active || !payload || payload.length === 0) return null;
    const total = payload.reduce((a, b) => a + (b.value || 0), 0);
    const sorted = [...payload].sort((a, b) => (b.value || 0) - (a.value || 0));
    return (
      <div style={{
        background: "rgba(19, 26, 23, 0.95)",
        border: "1px solid #2A3530",
        borderRadius: 8,
        padding: "10px 12px",
        fontSize: 12,
        minWidth: 200,
        boxShadow: "0 6px 20px rgba(0,0,0,0.4)",
        fontFamily: "var(--display)",
      }}>
        <div style={{ color: "#B8C4BC", marginBottom: 6, fontWeight: 500 }}>{label}</div>
        {sorted.map((p) => (
          <div key={p.dataKey} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, padding: "2px 0" }}>
            <span style={{ display: "inline-flex", alignItems: "center", gap: 6, color: "#E8EFE9" }}>
              <span style={{ width: 8, height: 8, borderRadius: 2, background: p.color, display: "inline-block" }} />
              {p.dataKey}
            </span>
            <span style={{ color: "#E8EFE9", fontFeatureSettings: '"tnum"' }}>{fmtUSD0(p.value || 0)}</span>
          </div>
        ))}
        <div style={{ marginTop: 6, paddingTop: 6, borderTop: "1px solid #2A3530", display: "flex", justifyContent: "space-between", color: "#4DA77A", fontWeight: 500 }}>
          <span>Total</span><span>{fmtUSD0(total)}</span>
        </div>
      </div>
    );
  }

  return (
    <div className="invest-chart-wrap">
      <ResponsiveContainer width="100%" height={320}>
        <AreaChart data={data} margin={{ top: 16, right: 20, left: 4, bottom: 4 }}>
          <defs>
            {series.map((s, i) => (
              <linearGradient key={s.name} id={`igrad-${i}`} x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%"   stopColor={s.color} stopOpacity={0.75} />
                <stop offset="100%" stopColor={s.color} stopOpacity={0.15} />
              </linearGradient>
            ))}
          </defs>
          <CartesianGrid strokeDasharray="2 4" stroke="#2A3530" vertical={false} />
          <XAxis
            dataKey="label"
            stroke="#7A8881"
            tick={{ fontSize: 10.5, fill: "#7A8881" }}
            tickLine={false}
            axisLine={{ stroke: "#2A3530" }}
            interval={tickInterval}
          />
          <YAxis
            stroke="#7A8881"
            tick={{ fontSize: 10.5, fill: "#7A8881" }}
            tickLine={false}
            axisLine={{ stroke: "#2A3530" }}
            tickFormatter={yTickFmt}
            width={56}
          />
          <Tooltip
            content={<ChartTooltip />}
            cursor={{ stroke: "#4DA77A", strokeWidth: 1, strokeDasharray: "3 3" }}
          />
          {series.map((s, i) => (
            <Area
              key={s.name}
              type="monotone"
              dataKey={s.name}
              stackId="1"
              stroke={s.color}
              strokeWidth={1.5}
              fill={`url(#igrad-${i})`}
              fillOpacity={1}
              isAnimationActive={true}
              animationDuration={1200}
              animationEasing="ease-out"
            />
          ))}
        </AreaChart>
      </ResponsiveContainer>
    </div>
  );
}

window.InvestingCalculator = InvestingCalculator;
window.InvestmentGrowthAreaChart = InvestmentGrowthAreaChart;

</script>

<script type="text/babel" data-presets="react">
// Quick tax estimator — salary + state + filing -> federal/state/FICA breakdown.
const { useState: useStateTax, useMemo: useMemoTax, useEffect: useEffectTax } = React;

function TaxEstimator({ profile, setProfile }) {
  const inputs = profile;
  const setInputs = (updater) => setProfile((p) => typeof updater === "function" ? updater(p) : { ...p, ...updater });
  const upd = (k, v) => setInputs((s) => ({ ...s, [k]: v }));
  const updMulti = (patch) => setInputs((s) => ({ ...s, ...patch }));
  const tax = useMemoTax(() => computeTaxes(inputs), [inputs]);
  React.useEffect(() => {
    window.__ledgerData = { ...(window.__ledgerData || {}), profile: inputs, tax };
  });
  const monthlyTakeHome = tax.takeHome / 12;
  const biweekly = tax.takeHome / 26;
  const [incomeOpen, setIncomeOpen] = useStateTax(true);

  // Marginal bracket
  const brackets = FEDERAL_BRACKETS_2025[inputs.filing];
  const marginal = useMemoTax(() => {
    let prev = 0;
    for (const [cap, rate] of brackets) {
      if (tax.taxable <= cap) return { rate, cap, prev };
      prev = cap;
    }
    return { rate: brackets[brackets.length - 1][1], cap: Infinity, prev: brackets[brackets.length - 2][0] };
  }, [tax.taxable, inputs.filing]);

  return (
    <>
      <header className="page-head">
        <div>
          <h1 className="page-title">Tax <em>estimator</em></h1>
        </div>
        <div className="page-head-right">
          <div className="page-head-actions">
            <ExportButton calculatorName="Tax estimator" />
          </div>
          <div className="page-sub">2025 federal brackets + state + FICA</div>
        </div>
      </header>

      <div className="layout">
        <aside className="col-inputs">
          <section className={"card" + (incomeOpen ? "" : " is-collapsed")}>
            <header
              className="card-head"
              style={{ cursor: "pointer" }}
              onClick={() => setIncomeOpen((v) => !v)}
            >
              <h2 style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <span className={"debt-card-chevron" + (incomeOpen ? " is-open" : "")} style={{ pointerEvents: "none" }} aria-hidden="true">▾</span>
                Income & location
              </h2>
              {!incomeOpen && (
                <span className="card-tag">
                  ${(inputs.salary || 0).toLocaleString()}/yr · {inputs.city || inputs.state}
                </span>
              )}
            </header>
            {incomeOpen && <div className="card-body stack">
              <Field label="Annual salary" hint="gross, pre-tax">
                <Money value={inputs.salary} onChange={(v) => upd("salary", v)} placeholder="85,000" />
              </Field>
              <Field label="Annual bonus" hint="optional, gross">
                <Money value={inputs.bonus || 0} onChange={(v) => upd("bonus", v)} placeholder="0" />
              </Field>
              <Field label="Additional income" hint={inputs.additionalIncomeLabel ? inputs.additionalIncomeLabel : "freelance, side gig, rental, etc."}>
                <Money value={inputs.additionalIncome || 0} onChange={(v) => upd("additionalIncome", v)} placeholder="0" />
              </Field>
              <Field label="Filing status">
                <Segment
                  value={inputs.filing}
                  onChange={(v) => upd("filing", v)}
                  options={[
                    { value: "single",  label: "Single" },
                    { value: "married", label: "Married, joint" },
                  ]}
                />
              </Field>
              <Field label="City" hint="type to search">
                <CityAutocomplete
                  city={inputs.city}
                  state={inputs.state}
                  onChange={updMulti}
                />
              </Field>
              <Field label="State">
                <select className="select" value={inputs.state} onChange={(e) => upd("state", e.target.value)}>
                  {Object.entries(STATE_NAMES)
                    .sort((a, b) => a[1].localeCompare(b[1]))
                    .map(([code, name]) => <option key={code} value={code}>{name}</option>)}
                </select>
              </Field>
              <Toggle
                value={!!inputs.ficaExempt}
                onChange={(v) => upd("ficaExempt", v)}
                label="FICA exempt"
                hint="F-1 / J-1 non-resident students & scholars"
              />
            </div>}
          </section>
        </aside>

        <section className="col-results">
          <section className="hero-card">
            <div className="hero-grid">
              <div className="hero-block">
                <div className="hero-eyebrow">Annual take-home</div>
                <div className="hero-num">{fmtUSD0(tax.takeHome)}</div>
                <div className="hero-sub">{fmtPct(tax.effectiveRate)} effective rate</div>
              </div>
              <div className="hero-divider" />
              <div className="hero-block">
                <div className="hero-eyebrow">Per paycheck (bi-weekly)</div>
                <div className="hero-num">{fmtUSD0(biweekly)}</div>
                <div className="hero-sub">{fmtUSD0(monthlyTakeHome)} monthly · {fmtPct(marginal.rate, 0)} top marginal</div>
              </div>
            </div>
          </section>

          <div className="kpi-grid">
            <div className="kpi">
              <div className="kpi-eyebrow">Federal</div>
              <div className="kpi-num">{fmtUSD0(tax.federal)}</div>
              <div className="kpi-sub">{fmtPct(tax.federal / tax.gross)} of gross</div>
            </div>
            <div className="kpi">
              <div className="kpi-eyebrow">State{tax.stateRate ? ` · ${fmtPct(tax.stateRate)}` : ""}</div>
              <div className="kpi-num">{fmtUSD0(tax.stateTax + tax.cityTax)}</div>
              <div className="kpi-sub">
                {tax.cityTax > 0 ? `incl. ${fmtUSD0(tax.cityTax)} local` : (tax.stateRate ? "state only" : "no state income tax")}
              </div>
            </div>
            <div className="kpi">
              <div className="kpi-eyebrow">FICA</div>
              <div className="kpi-num">{fmtUSD0(tax.fica)}</div>
              <div className="kpi-sub">{fmtUSD0(tax.ss)} SS · {fmtUSD0(tax.medicare + tax.addlMedicare)} Medicare</div>
            </div>
          </div>

          <section className="card">
            <header className="card-head">
              <h2>Federal bracket walk</h2>
              <span className="card-tag">
                Taxable: {fmtUSD0(tax.taxable)}
              </span>
            </header>
            <div className="card-body">
              <BracketWalk taxable={tax.taxable} brackets={brackets} />
              <p className="footnote">
                Standard deduction of {fmtUSD0(tax.standardDeduction)} is subtracted from your gross before brackets are applied.
                Each row shows how much income falls in that bracket and what it owes.
              </p>
            </div>
          </section>

          <section className="card">
            <header className="card-head"><h2>Where every dollar goes</h2></header>
            <div className="card-body">
              <DollarBar tax={tax} />
            </div>
          </section>
        </section>
      </div>
    </>
  );
}

function BracketWalk({ taxable, brackets }) {
  let prev = 0;
  const rows = [];
  for (const [cap, rate] of brackets) {
    const inThisBracket = Math.max(0, Math.min(taxable, cap) - prev);
    rows.push({
      from: prev, to: cap, rate,
      inBracket: inThisBracket,
      owed: inThisBracket * rate,
      active: taxable > prev,
    });
    prev = cap;
    if (taxable <= cap) break;
  }
  return (
    <table className="ptable">
      <thead>
        <tr>
          <th>Bracket</th>
          <th className="num">Rate</th>
          <th className="num">Your income here</th>
          <th className="num">Tax owed</th>
        </tr>
      </thead>
      <tbody>
        {rows.map((r, i) => (
          <tr key={i} style={{ opacity: r.active ? 1 : 0.4 }}>
            <td>
              {fmtUSD0(r.from)} – {r.to === Infinity ? "∞" : fmtUSD0(r.to)}
            </td>
            <td className="num">{fmtPct(r.rate, 0)}</td>
            <td className="num">{fmtUSD0(r.inBracket)}</td>
            <td className="num">{fmtUSD0(r.owed)}</td>
          </tr>
        ))}
      </tbody>
    </table>
  );
}

function DollarBar({ tax }) {
  const total = tax.gross || 1;
  const parts = [
    { label: "Take-home", value: tax.takeHome, color: "var(--accent-2)" },
    { label: "Federal",   value: tax.federal,  color: "#C9A96E" },
    { label: "State + local", value: tax.stateTax + tax.cityTax, color: "#7B6E55" },
    { label: "FICA",      value: tax.fica,     color: "#5A8FA3" },
  ];
  return (
    <>
      <div className="stack-bar" style={{ height: 18 }}>
        {parts.map((p, i) => (
          <div key={i} style={{ width: (p.value / total * 100) + "%", background: p.color }} title={`${p.label}: ${fmtUSD0(p.value)}`} />
        ))}
      </div>
      <ul className="legend" style={{ marginTop: 14 }}>
        {parts.map((p, i) => (
          <li key={i}>
            <span className="legend-dot" style={{ background: p.color }} />
            <span className="legend-label">{p.label}</span>
            <span className="legend-val">
              {fmtUSD0(p.value)}
              <span className="legend-pct"> · {fmtPct(p.value / total, 1)}</span>
            </span>
          </li>
        ))}
      </ul>
    </>
  );
}

window.TaxEstimator = TaxEstimator;

</script>
