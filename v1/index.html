// ─── Timeline list ───────────────────────────────────────────────────────
// Compute YYYY-MM-DD for N days ago in local time — used by the date filter presets.
function isoMinusDays_(n) {
  const d = new Date();
  d.setDate(d.getDate() - n);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

const DATE_RANGE_PRESETS = [
  { id: "month",   label: "This month" },
  { id: "30d",     label: "Last 30 days" },
  { id: "90d",     label: "Last 90 days" },
  { id: "all",     label: "All time" },
];

function RecordTimeline({ transactions, onEdit, onDelete, executiveStyle }) {
  const [query, setQuery] = useStateRec("");
  const [categoryFilter, setCategoryFilter] = useStateRec("");
  const [rangeId, setRangeId] = useStateRec("month");

  const allEmpty = !transactions || transactions.length === 0;

  // ── Category dropdown options: union of preset categories + any custom
  // categories the user has actually used. Sorted, deduped. ───────────
  const categoryOptions = useMemoRec(() => {
    const seen = new Set(RECORD_CATEGORIES);
    for (const t of transactions || []) {
      if (t.category) seen.add(t.category);
    }
    return Array.from(seen).sort((a, b) => a.localeCompare(b));
  }, [transactions]);

  // ── Apply filters ─────────────────────────────────────────────────────
  const filtered = useMemoRec(() => {
    if (allEmpty) return [];
    const today = new Date();
    const yyyyMm = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, "0")}`;
    let cutoff = null;
    if (rangeId === "month")     cutoff = `${yyyyMm}-01`;
    else if (rangeId === "30d")  cutoff = isoMinusDays_(29);
    else if (rangeId === "90d")  cutoff = isoMinusDays_(89);
    // "all" leaves cutoff null

    const q = query.trim().toLowerCase();
    return transactions.filter((t) => {
      if (cutoff && (t.date || "") < cutoff) return false;
      if (categoryFilter && t.category !== categoryFilter) return false;
      if (q) {
        // Match note, category, or dollar amount (as plain digits + as $X format)
        const dollars = window.toDollars(Number(t.amount_cents) || 0).toFixed(2);
        const haystack = `${t.note || ""} ${t.category || ""} ${dollars}`.toLowerCase();
        if (!haystack.includes(q)) return false;
      }
      return true;
    });
  }, [transactions, query, categoryFilter, rangeId, allEmpty]);

  const hasFilter = query.trim() !== "" || categoryFilter !== "" || rangeId !== "all";
  const resetFilters = () => { setQuery(""); setCategoryFilter(""); setRangeId("all"); };

  // ── Empty state for the whole tab (no entries at all) ─────────────────
  if (allEmpty) {
    if (executiveStyle) {
      return (
        <div style={{ padding: "16px 8px" }}>
          <div style={{
            fontSize: 11, letterSpacing: "0.16em", textTransform: "uppercase",
            color: "var(--ink-4)", marginBottom: 14, fontWeight: 500,
          }}>Timeline</div>
          <div style={{ padding: "24px 0", color: "var(--ink-3)", fontSize: 14 }}>
            No entries yet. Add your first expense above ↑
          </div>
        </div>
      );
    }
    return (
      <section className="card">
        <header className="card-head"><h2>Timeline</h2></header>
        <div className="card-body">
          <div className="port-empty">
            No entries yet. Add your first expense above ↑
          </div>
        </div>
      </section>
    );
  }

  const filteredTotal = window.Transactions.totalCents(filtered);
  const days = window.Transactions.byDay(filtered);

  const v1Header = (
    <header className="card-head">
      <h2>Timeline</h2>
      <span className="card-tag">
        {hasFilter ? (
          <>{filtered.length} of {transactions.length} entr{transactions.length === 1 ? "y" : "ies"} · {fmtUSD0(window.toDollars(filteredTotal))}</>
        ) : (
          <>{transactions.length} entr{transactions.length === 1 ? "y" : "ies"} · {fmtUSD0(window.toDollars(window.Transactions.totalCents(transactions)))} total</>
        )}
      </span>
    </header>
  );
  const execHeader = (
    <div style={{
      display: "flex", justifyContent: "space-between", alignItems: "baseline",
      marginBottom: 14,
    }}>
      <div style={{
        fontSize: 11, letterSpacing: "0.16em", textTransform: "uppercase",
        color: "var(--ink-4)", fontWeight: 500,
      }}>Timeline</div>
      <div style={{ fontSize: 11, color: "var(--ink-4)" }}>
        {hasFilter
          ? <>{filtered.length} of {transactions.length} · {fmtUSD0(window.toDollars(filteredTotal))}</>
          : <>{transactions.length} entr{transactions.length === 1 ? "y" : "ies"} · {fmtUSD0(window.toDollars(window.Transactions.totalCents(transactions)))}</>
        }
      </div>
    </div>
  );

  // Shared inner content (filter strip + day list). Same UX in both shells —
  // only the outer wrapper changes between executive and v1 layouts.
  const filterStrip = (
    <div style={{
      padding: executiveStyle ? "12px 0" : "12px 16px",
      display: "flex", flexWrap: "wrap", gap: 10, alignItems: "center",
      borderBottom: "1px solid var(--border)",
      background: executiveStyle ? "transparent" : "var(--surface-2)",
    }}>
      <input
        type="search"
        value={query}
        onChange={(e) => setQuery(e.target.value)}
        placeholder="Search notes, category, amount…"
        style={{
          flex: "1 1 220px", minWidth: 0, padding: "6px 10px", fontSize: 13,
          border: "1px solid var(--border)", borderRadius: 4,
          background: "var(--surface)", color: "var(--ink-2)",
        }}
      />
      <select
        value={categoryFilter}
        onChange={(e) => setCategoryFilter(e.target.value)}
        style={{
          padding: "6px 10px", fontSize: 13,
          border: "1px solid var(--border)", borderRadius: 4,
          background: "var(--surface)", color: "var(--ink-2)",
        }}
        title="Filter by category"
      >
        <option value="">All categories</option>
        {categoryOptions.map((c) => (<option key={c} value={c}>{c}</option>))}
      </select>
      <div style={{ display: "inline-flex", border: "1px solid var(--border)", borderRadius: 4, overflow: "hidden" }}>
        {DATE_RANGE_PRESETS.map((p) => (
          <button
            key={p.id}
            type="button"
            onClick={() => setRangeId(p.id)}
            style={{
              padding: "6px 10px", fontSize: 12,
              border: "none", borderLeft: p.id === "month" ? "none" : "1px solid var(--border)",
              background: rangeId === p.id ? "var(--accent-bg)" : "var(--surface)",
              color: rangeId === p.id ? "var(--accent)" : "var(--ink-3)",
              fontWeight: rangeId === p.id ? 600 : 400,
              cursor: "pointer",
            }}
            title={p.label}
          >
            {p.label}
          </button>
        ))}
      </div>
      {hasFilter && (
        <button
          type="button"
          onClick={resetFilters}
          style={{
            padding: "6px 10px", fontSize: 12,
            border: "1px solid var(--border)", borderRadius: 4,
            background: "transparent", color: "var(--ink-3)", cursor: "pointer",
          }}
          title="Clear all filters"
        >
          Reset
        </button>
      )}
    </div>
  );

  const dayList = (
    <div className={executiveStyle ? "" : "card-body"} style={executiveStyle ? { padding: 0 } : { padding: 0 }}>
      {filtered.length === 0 ? (
        <div className="port-empty" style={{ padding: 24 }}>
          No entries match these filters.{" "}
          <button className="btn-link" onClick={resetFilters} style={{ background: "none", border: "none", color: "var(--accent)", cursor: "pointer", padding: 0, font: "inherit", textDecoration: "underline" }}>
            Reset filters
          </button>{" "}
          to see all {transactions.length} entr{transactions.length === 1 ? "y" : "ies"}.
        </div>
      ) : days.map((day) => (
        <div key={day.date} className="record-day">
          <div className="record-day-head">
            <div className="record-day-date">{formatDayHeader(day.date)}</div>
            <div className="record-day-total">{fmtUSD0(window.toDollars(day.total_cents))}</div>
          </div>
          {day.items.map((tx) => (
            <div key={tx.id} className="record-item">
              <div className="record-item-main">
                <span className="record-item-category">{tx.category}</span>
                {tx.note && <span className="record-item-note"> · {tx.note}</span>}
              </div>
              <div className="record-item-amount">
                {fmtUSD0(window.toDollars(tx.amount_cents))}
              </div>
              <div className="record-item-actions">
                <button className="btn-link" onClick={() => onEdit(tx)} title="Edit">edit</button>
                <button className="btn-link record-item-delete"
                  onClick={() => {
                    if (window.confirm(`Delete this $${window.toDollars(tx.amount_cents).toFixed(2)} ${tx.category} entry?`)) {
                      onDelete(tx.id);
                    }
                  }}
                  title="Delete">delete</button>
              </div>
            </div>
          ))}
        </div>
      ))}
    </div>
  );

  if (executiveStyle) {
    return (
      <div style={{ padding: "16px 8px 24px" }}>
        {execHeader}
        {filterStrip}
        {dayList}
      </div>
    );
  }

  return (
    <section className="card">
      {v1Header}
      {filterStrip}
      {dayList}
    </section>
  );
}

// ─── Current Summary (Step 3) — read-only month overview ─────────────────
// Lives INSIDE the Record tab, above the entry form. Pure read from the
// transactions module — no data entry, no storage writes. Recomputes
// automatically when useTransactions re-fires.
function CurrentSummary({ transactions }) {
  const today = new Date();
  const yyyyMm = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, "0")}`;
  const prevMonth = new Date(today.getFullYear(), today.getMonth() - 1, 1);
  const prevYyyyMm = `${prevMonth.getFullYear()}-${String(prevMonth.getMonth() + 1).padStart(2, "0")}`;
  const MONTHS_LONG = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const monthLabel = MONTHS_LONG[today.getMonth()];
  const prevMonthLabel = MONTHS_LONG[prevMonth.getMonth()];

  // This-month entries
  const thisMonthTxs = useMemoRec(
    () => (transactions || []).filter((t) => (t.date || "").startsWith(yyyyMm)),
    [transactions, yyyyMm]
  );
  const thisMonthCents = window.Transactions.totalCents(thisMonthTxs);
  const lastMonthCents = window.Transactions.monthTotalCents(transactions, prevYyyyMm);

  // Per-day total of this month for the chart
  const daysInMonth = new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate();
  const dailyData = useMemoRec(() => {
    const buckets = new Array(daysInMonth).fill(0);
    thisMonthTxs.forEach((t) => {
      const day = parseInt((t.date || "").slice(8, 10), 10);
      if (day >= 1 && day <= daysInMonth) buckets[day - 1] += (Number(t.amount_cents) || 0);
    });
    let cum = 0;
    return buckets.map((cents, i) => {
      cum += cents;
      return {
        day: i + 1,
        spent: window.toDollars(cents),
        cumulative: window.toDollars(cum),
      };
    });
  }, [thisMonthTxs, daysInMonth]);

  // Categories sorted by spend desc
  const categoryData = useMemoRec(() => {
    const byCat = window.Transactions.byCategory(thisMonthTxs);
    return Object.entries(byCat)
      .map(([category, cents]) => ({
        category,
        cents,
        dollars: window.toDollars(cents),
        pct: thisMonthCents > 0 ? (cents / thisMonthCents) * 100 : 0,
      }))
      .sort((a, b) => b.cents - a.cents);
  }, [thisMonthTxs, thisMonthCents]);

  // Day-of-month + average so far
  const dayOfMonth = today.getDate();
  const avgPerDay = dayOfMonth > 0 ? thisMonthCents / dayOfMonth : 0;
  const projectedMonth = avgPerDay * daysInMonth;

  // Comparison vs last month — only meaningful if last month had data
  const deltaCents = thisMonthCents - lastMonthCents;
  const deltaPct = lastMonthCents > 0 ? (deltaCents / lastMonthCents) * 100 : null;

  const Recharts = window.Recharts;
  const CAT_COLORS = ["#4DA77A", "#C9A96E", "#5A8FA3", "#B85450", "#7B6E55", "#A07ABE", "#4FB5B0", "#D77662", "#9C7C4B", "#6BC295", "#8B5A3C", "#7A8881"];

  return (
    <section className="card">
      <header className="card-head">
        <h2>This month so far</h2>
        <span className="card-tag">
          {monthLabel} {today.getFullYear()} · day {dayOfMonth} of {daysInMonth}
        </span>
      </header>
      <div className="card-body">
        {/* Empty state */}
        {thisMonthTxs.length === 0 ? (
          <div className="port-empty">
            No entries this month yet. Log your first expense below ↓
            {lastMonthCents > 0 && (
              <div style={{ marginTop: 8, fontSize: 12, color: "var(--ink-3)" }}>
                For reference: you spent <strong>{fmtUSD0(window.toDollars(lastMonthCents))}</strong> last {prevMonthLabel}.
              </div>
            )}
          </div>
        ) : (
          <>
            {/* Four-cell KPI strip */}
            <div className="invest-breakdown-grid" style={{ marginBottom: 16 }}>
              <div className="invest-breakdown-cell invest-breakdown-cell-final">
                <div className="invest-breakdown-label">Spent this month</div>
                <div className="invest-breakdown-value">{fmtUSD0(window.toDollars(thisMonthCents))}</div>
                <div className="invest-breakdown-sub">
                  {thisMonthTxs.length} {thisMonthTxs.length === 1 ? "entry" : "entries"}
                </div>
              </div>
              <div className="invest-breakdown-cell">
                <div className="invest-breakdown-label">Daily avg</div>
                <div className="invest-breakdown-value">{fmtUSD0(window.toDollars(avgPerDay))}</div>
                <div className="invest-breakdown-sub">over {dayOfMonth} day{dayOfMonth === 1 ? "" : "s"}</div>
              </div>
              <div className="invest-breakdown-cell">
                <div className="invest-breakdown-label">Projected month-end</div>
                <div className="invest-breakdown-value">{fmtUSD0(window.toDollars(projectedMonth))}</div>
                <div className="invest-breakdown-sub">if pace continues</div>
              </div>
              <div className="invest-breakdown-cell">
                <div className="invest-breakdown-label">vs. last {prevMonthLabel}</div>
                {lastMonthCents > 0 ? (
                  <>
                    <div className={"invest-breakdown-value " + (deltaCents <= 0 ? "pos" : "neg")}>
                      {deltaCents >= 0 ? "+" : ""}{fmtUSD0(window.toDollars(deltaCents))}
                    </div>
                    <div className="invest-breakdown-sub">
                      {deltaPct !== null && (
                        <>{deltaPct >= 0 ? "+" : ""}{deltaPct.toFixed(0)}% · last month {fmtUSD0(window.toDollars(lastMonthCents))}</>
                      )}
                    </div>
                  </>
                ) : (
                  <>
                    <div className="invest-breakdown-value" style={{ color: "var(--ink-3)" }}>—</div>
                    <div className="invest-breakdown-sub">no entries last month</div>
                  </>
                )}
              </div>
            </div>

            {/* Daily-spend chart */}
            {Recharts && (
              <div style={{ height: 200, marginBottom: 20 }}>
                <Recharts.ResponsiveContainer width="100%" height="100%">
                  <Recharts.ComposedChart data={dailyData} margin={{ top: 10, right: 16, left: 4, bottom: 8 }}>
                    <Recharts.CartesianGrid stroke="var(--border)" strokeDasharray="3 3" vertical={false} />
                    <Recharts.XAxis
                      dataKey="day"
                      tick={{ fill: "var(--ink-3)", fontSize: 11 }}
                      ticks={[1, 5, 10, 15, 20, 25, daysInMonth].filter((d) => d <= daysInMonth)}
                    />
                    <Recharts.YAxis
                      yAxisId="bars"
                      tick={{ fill: "var(--ink-3)", fontSize: 11 }}
                      tickFormatter={(v) => v >= 1000 ? `$${(v/1000).toFixed(1)}k` : `$${Math.round(v)}`}
                      width={50}
                    />
                    <Recharts.YAxis
                      yAxisId="cum"
                      orientation="right"
                      tick={{ fill: "var(--ink-3)", fontSize: 11 }}
                      tickFormatter={(v) => v >= 1000 ? `$${(v/1000).toFixed(1)}k` : `$${Math.round(v)}`}
                      width={50}
                    />
                    <Recharts.Tooltip
                      contentStyle={{ background: "var(--surface)", border: "1px solid var(--border)", borderRadius: 6, fontSize: 12 }}
                      formatter={(value, name) => [fmtUSD0(value), name === "spent" ? "Day total" : "Cumulative"]}
                      labelFormatter={(d) => `${monthLabel} ${d}`}
                    />
                    <Recharts.Bar yAxisId="bars" dataKey="spent" fill="var(--accent)" radius={[2, 2, 0, 0]} />
                    <Recharts.Line yAxisId="cum" type="monotone" dataKey="cumulative" stroke="var(--gold)" strokeWidth={2} dot={false} />
                  </Recharts.ComposedChart>
                </Recharts.ResponsiveContainer>
              </div>
            )}

            {/* Category breakdown — horizontal bars */}
            <h3 className="sub-head" style={{ marginTop: 0, marginBottom: 10 }}>By category</h3>
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {categoryData.map((c, i) => (
                <div key={c.category} className="record-cat-row">
                  <div className="record-cat-label">
                    <span className="record-cat-dot" style={{ background: CAT_COLORS[i % CAT_COLORS.length] }} />
                    {c.category}
                  </div>
                  <div className="record-cat-bar-wrap">
                    <div
                      className="record-cat-bar"
                      style={{ width: `${c.pct.toFixed(1)}%`, background: CAT_COLORS[i % CAT_COLORS.length] }}
                    />
                  </div>
                  <div className="record-cat-amount">{fmtUSD0(c.dollars)}</div>
                  <div className="record-cat-pct">{c.pct.toFixed(0)}%</div>
                </div>
              ))}
            </div>
          </>
        )}
      </div>
    </section>
  );
}

// ─── Top-level tab component ─────────────────────────────────────────────
// CSV export — pure client-side; uses Blob + ObjectURL so no server roundtrip.
// Quoting follows RFC 4180: wrap any field that contains commas, quotes, or
// newlines in double quotes, and double up any embedded quotes inside.
function exportTransactionsCSV(transactions) {
  const csvEscape = (val) => {
    const s = val == null ? "" : String(val);
    if (/[",\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  };
  const header = ["date", "category", "amount_dollars", "note"].join(",");
  // Sort newest-first for readability when opened in Excel/Sheets
  const rows = [...(transactions || [])]
    .sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0))
    .map((t) => [
      csvEscape(t.date || ""),
      csvEscape(t.category || ""),
      // Dollar amount with 2dp — converted from amount_cents to keep precision
      (window.toDollars(Number(t.amount_cents) || 0)).toFixed(2),
      csvEscape(t.note || ""),
    ].join(","));
  const csv = [header, ...rows].join("\r\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const today = new Date();
  const stamp = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, "0")}-${String(today.getDate()).padStart(2, "0")}`;
  a.href = url;
  a.download = `ledger-transactions-${stamp}.csv`;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 0);
}

function RecordTab({ hideSummary, hideHeader, executiveStyle } = {}) {
  const transactions = window.useTransactions();
  const [editing, setEditing] = useStateRec(null);
  const canExport = (transactions || []).length > 0;

  return (
    <>
      {!hideHeader && (
        <header className="page-head">
          <div>
            <h1 className="page-title">Record</h1>
          </div>
          <div className="page-head-right">
            <div className="page-sub">
              Log actual spending · the only data-entry surface for transactions · auto-saves
            </div>
            <div style={{ marginTop: 8 }}>
              <button
                type="button"
                onClick={() => exportTransactionsCSV(transactions)}
                disabled={!canExport}
                title={canExport ? "Download all logged transactions as CSV" : "No transactions to export yet"}
                style={{
                  fontSize: 12,
                  padding: "6px 12px",
                  border: "1px solid var(--border)",
                  background: canExport ? "var(--surface)" : "var(--surface-2)",
                  color: canExport ? "var(--ink-2)" : "var(--ink-4)",
                  borderRadius: 4,
                  cursor: canExport ? "pointer" : "not-allowed",
                }}
              >
                Export CSV ({(transactions || []).length})
              </button>
            </div>
          </div>
        </header>
      )}
      {hideHeader && canExport && (
        // v2 hides the page header; surface the export as a small toolbar above the form.
        <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: 8 }}>
          <button
            type="button"
            onClick={() => exportTransactionsCSV(transactions)}
            title="Download all logged transactions as CSV"
            style={{
              fontSize: 12,
              padding: "6px 12px",
              border: "1px solid var(--border)",
              background: "var(--surface)",
              color: "var(--ink-2)",
              borderRadius: 4,
              cursor: "pointer",
            }}
          >
            Export CSV ({transactions.length})
          </button>
        </div>
      )}

      {!hideSummary && <CurrentSummary transactions={transactions} />}

      <RecordEntryForm
        editing={editing}
        onCancelEdit={() => setEditing(null)}
        executiveStyle={executiveStyle}
      />

      <RecordTimeline
        transactions={transactions}
        onEdit={(tx) => { setEditing(tx); window.scrollTo({ top: 0, behavior: "smooth" }); }}
        onDelete={(id) => {
          if (editing && editing.id === id) setEditing(null);
          window.Transactions.remove(id);
        }}
        executiveStyle={executiveStyle}
      />
    </>
  );
}

window.RecordTab = RecordTab;
window.CurrentSummary = CurrentSummary;

</script>

<script type="text/babel" data-presets="react">
// Overview — consolidated summary pulling from Budget, Auto, Debt, Investing, Household.
const { useState: useStateOv, useMemo: useMemoOv, useEffect: useEffectOv } = React;

function readLS(key, fallback = null) {
  try {
    const v = localStorage.getItem(key);
    return v ? JSON.parse(v) : fallback;
  } catch { return fallback; }
}

function OverviewCalculator({ profile, getBudgetData }) {
  const [view, setView] = useStateOv("monthly");
  const [, setTick] = useStateOv(0);

  // Re-poll periodically so this stays live with other calculators
  useEffectOv(() => {
    const id = setInterval(() => setTick((t) => t + 1), 1500);
    return () => clearInterval(id);
  }, []);

  const data = useMemoOv(() => {
    const budget = getBudgetData() || {};
    const budgetSaved = readLS("ledger:budget") || {};
    const expenses = budget.expenses || budgetSaved.expenses || {};
    const tax = budget.tax || (profile ? computeTaxes(profile) : null);

    const auto = readLS("ledger:auto") || {};
    const debt = readLS("ledger:debt") || {};
    const invest = readLS("ledger:invest-v2") || {};
    const household = readLS("ledger:household") || null;

    // Monthly numbers
    const monthlyTakeHome = tax ? tax.takeHome / 12 : 0;
    const monthlyTax = tax ? tax.totalTax / 12 : 0;

    // Vehicle (Auto tab) — full ownership cost
    let autoMonthly = 0;
    if (auto && auto.price > 0) {
      const principal = Math.max(0, (auto.price || 0) + (auto.price - (auto.tradeIn || 0)) * (auto.salesTaxRate || 0) + (auto.fees || 0) - (auto.down || 0) - (auto.tradeIn || 0));
      const r = (auto.apr || 0) / 12;
      const n = auto.termMonths || 60;
      const payment = (principal > 0 && r > 0)
        ? principal * (r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1)
        : (principal > 0 ? principal / n : 0);
      autoMonthly = payment
        + (auto.insurance || 0)
        + (auto.gas || 0)
        + (auto.maintenance || 0)
        + (auto.parking || 0)
        + (auto.regAnnual || 0) / 12;
    }

    // Debt monthly outflow
    const debtTotal = (debt.debts || []).reduce((a, b) => a + (b.minPayment || 0), 0);
    // Honor the user's "Exact amount toward debt" override from the Debt tab if set,
    // otherwise fall back to spareCash * debtPct. Without this, the Overview was
    // showing the old slider math and ignoring the user's manual override.
    const useCustomDebt = debt.customDebtAmount != null && debt.customDebtAmount >= 0;
    const extraToDebt = useCustomDebt
      ? Math.min(debt.customDebtAmount || 0, debt.spareCash || 0)
      : (debt.spareCash || 0) * (debt.debtPct || 0);

    // Savings = whatever's left after the debt portion is taken from spareCash
    const savingsTarget = Math.max(0, (debt.spareCash || 0) - extraToDebt);

    // Categorize budget expenses (use share for splittable fields)
    const share = window.expenseShare || ((e, k) => Number(e[k]) || 0);
    const rent = share(expenses, "rent");
    const groceriesVal = expenses.groceries != null ? (Number(expenses.groceries) || 0) : (Number(expenses.expenses) || 0);
    const utilitiesVal = share(expenses, "utilities");
    const otherMonthly = groceriesVal + utilitiesVal;
    const carInsBudget = expenses.carIns || 0;
    const gasBudget    = expenses.gas || 0;
    const otherLoan    = expenses.otherLoan || 0;

    // Consolidate the previously-confusing debt rows:
    // - Budget "Other loan" + Debt tab "minimums" used to show as TWO separate lines
    //   even though the otherLoan field is meant to be synced from the Debt tab.
    // - Now: if Debt tab has tracked debts, use that single source.
    //        Otherwise, fall back to Budget's otherLoan.
    // This eliminates the double-counting and the confusing 3-debt-row layout.
    const hasTrackedDebts = (debt.debts || []).length > 0;
    const debtMinimums = hasTrackedDebts ? debtTotal : otherLoan;

    // Build categories with explicit segments.
    // IMPORTANT: Tax is NOT included as an outflow here — monthlyTakeHome is
    // already net of tax, so subtracting it again would double-count.
    // Tax is shown in the breakdown table as a "Tax" group label only.
    const categories = [
      // If user has enabled manual debt mode on the Debt tab, label the debt
      // minimums line as "Manual debt commitment" so the Overview reflects
      // the user's stated framing (fixed/locked).
      ...[],
      { label: "Rent / housing",   value: rent,            color: "#5A8FA3", group: "Out" },
      { label: "Living expenses",  value: otherMonthly,    color: "#7B6E55", group: "Out" },
      { label: "Vehicle costs",    value: autoMonthly || (carInsBudget + gasBudget), color: "#C9A96E", group: "Out" },
      { label: debt.manualMode ? "Manual debt commitment" : "Debt minimums",
                                  value: debtMinimums,    color: "#9C7C4B", group: "Out",
        from: hasTrackedDebts ? "DEBT" : "BUDGET" },
      { label: "Extra debt paydown", value: extraToDebt,   color: "#8B5A3C", group: "Save", from: "DEBT" },
      { label: "Going to savings", value: savingsTarget,   color: "#4DA77A", group: "Save", from: "SAVINGS" },
    ].filter((c) => c.value > 0);

    // True outflows = everything in the "Out" group (real bills + debt minimums).
    // Savings + extra debt paydown are ALLOCATIONS of leftover, not outflows —
    // they're still your money, just earmarked. So leftover = take-home − Out only.
    const totalOut = categories.reduce((a, c) => a + c.value, 0);            // includes Save (for backward compat with the chart)
    const realOutflows = categories.filter((c) => c.group === "Out").reduce((a, c) => a + c.value, 0);
    const earmarked    = categories.filter((c) => c.group === "Save").reduce((a, c) => a + c.value, 0);
    const leftover = monthlyTakeHome - realOutflows; // POSITIVE leftover includes savings (which is part of earmarked)
    // Discretionary = leftover after earmarking savings + extra debt
    const discretionary = leftover - earmarked;

    return {
      tax, monthlyTakeHome, monthlyTax,
      categories, totalOut, realOutflows, earmarked, leftover, discretionary,
      autoMonthly, debtTotal, savingsTarget, extraToDebt,
      auto, debt, invest, household,
      expenses,
    };
  }, [getBudgetData, profile, setTick]); // eslint-disable-line

  const mult = view === "monthly" ? 1 : 12;
  const periodLabel = view === "monthly" ? "/mo" : "/yr";

  return (
    <>
      <header className="page-head">
        <div>
          <h1 className="page-title">Overview <em>&amp; totals</em></h1>
        </div>
        <div className="page-head-right">
          <div className="page-head-actions">
            <div className="view-toggle">
              <Segment
                value={view}
                onChange={setView}
                options={[
                  { value: "monthly",  label: "Monthly" },
                  { value: "annually", label: "Annually" },
                ]}
              />
            </div>
            <ExportButton calculatorName="Overview" />
          </div>
          <div className="page-sub">Everything in one place — where every dollar goes</div>
        </div>
      </header>

      <div className="col-results" style={{ display: "flex", flexDirection: "column", gap: 16 }}>
        {/* Consistent across pages: leftover/after-expenses on LEFT, take-home on RIGHT,
            with a "going to savings" block in the middle so the user sees all three at a glance. */}
        <section className="hero-card v1-enter v1-enter-0">
          <div className="hero-grid" style={{ gridTemplateColumns: data.earmarked > 0 ? "1fr auto 1fr auto 1fr auto 1fr" : "1fr auto 1fr" }}>
            <div className="hero-block">
              <div className="hero-eyebrow">{view === "monthly" ? "Monthly" : "Annual"} after bills</div>
              <div className={"hero-num " + (data.leftover >= 0 ? "surplus" : "deficit")}>
                {data.leftover >= 0 ? "+" : ""}
                <window.CountUp value={data.leftover * mult} duration={0.3} format={fmtUSD0} />
              </div>
              <div className="hero-sub">
                {data.leftover >= 0
                  ? "left after rent, food, vehicle, debt mins"
                  : "shortfall — bills exceed take-home"}
              </div>
            </div>

            {data.earmarked > 0 && (
              <>
                <div className="hero-divider" />
                <div className="hero-block">
                  <div className="hero-eyebrow">{view === "monthly" ? "Monthly" : "Annual"} earmarked</div>
                  <div className="hero-num pos">
                    <window.CountUp value={data.earmarked * mult} duration={0.3} format={fmtUSD0} />
                  </div>
                  <div className="hero-sub">
                    {data.savingsTarget > 0 && `${fmtUSD0(data.savingsTarget * mult)} savings`}
                    {data.savingsTarget > 0 && data.extraToDebt > 0 && " · "}
                    {data.extraToDebt > 0 && `${fmtUSD0(data.extraToDebt * mult)} extra debt`}
                  </div>
                </div>
                <div className="hero-divider" />
                {/* Discretionary = leftover − earmarked. RED if negative (over-committed). */}
                <div className="hero-block">
                  <div className="hero-eyebrow">{view === "monthly" ? "Monthly" : "Annual"} discretionary</div>
                  <div className={"hero-num " + (data.discretionary >= 0 ? "surplus" : "deficit")}>
                    {data.discretionary >= 0 ? "+" : ""}
                    <window.CountUp value={data.discretionary * mult} duration={0.3} format={fmtUSD0} />
                  </div>
                  <div className="hero-sub">
                    {data.discretionary >= 0
                      ? "free to spend after earmarks"
                      : <span style={{ color: "var(--negative)", fontWeight: 500 }}>
                          over-committed by {fmtUSD0(Math.abs(data.discretionary) * mult)} — reduce savings/debt extras
                        </span>}
                  </div>
                </div>
              </>
            )}

            <div className="hero-divider" />
            <div className="hero-block">
              <div className="hero-eyebrow">{view === "monthly" ? "Monthly" : "Annual"} take-home</div>
              <div className="hero-num">
                <window.CountUp value={data.monthlyTakeHome * mult} duration={0.3} format={fmtUSD0} />
              </div>
              <div className="hero-sub">{fmtPct(data.tax?.effectiveRate || 0)} effective tax rate</div>
            </div>
          </div>
        </section>

        {/* Net Worth integration: Cash accounts + investment projection − debt balance
            over the next 5 years. Built from existing debt simulation + investment
            projection, plus a new Accounts list owned by Overview. */}
        <div className="v1-enter v1-enter-1"><NetWorthCard data={data} profile={profile} /></div>

        {/* Monte Carlo — stochastic risk model. Samples each expense category
            from a normal distribution N times and plots the distribution of
            next-month leftover outcomes. */}
        {window.MonteCarloCard && <div className="v1-enter v1-enter-2"><window.MonteCarloCard data={data} /></div>}

        {/* ✦ Optimize — only shows when leftover < 0. Suggests specific cuts to flip the
            shortfall into a surplus, ranked by impact + ease (savings rate first, etc.) */}
        <div className="v1-enter v1-enter-3"><OptimizePanel data={data} view={view} mult={mult} /></div>

        {/* Monthly / yearly breakdown — collapsible card showing each line item
            side-by-side in both periods. Same idea as the Budget tab's breakdown. */}
        <div className="v1-enter v1-enter-4"><MonthlyYearlyBreakdown data={data} /></div>

        {/* 1-5 year projection — applies salary/rent/expense growth assumptions
            from Budget tab and shows year-by-year take-home, expenses, savings,
            debt remaining, investment value, net worth. */}
        <div className="v1-enter v1-enter-5"><FiveYearProjection data={data} profile={profile} /></div>

        {/* Investment projections — lists every investment that has
            "Track in Overview" turned on, with its goal and projected balance. */}
        <div className="v1-enter v1-enter-6"><TrackedInvestmentsCard data={data} /></div>

        <section className="card">
          <header className="card-head">
            <h2>Where every dollar goes</h2>
            <span className="card-tag">
              {fmtUSD0(data.totalOut * mult)}{periodLabel} tracked
            </span>
          </header>
          <div className="card-body">
            <div className="stack-bar" style={{ height: 18, marginBottom: 16 }}>
              {data.categories.map((c, i) => (
                <div
                  key={i}
                  style={{
                    width: ((c.value / data.monthlyTakeHome) * 100) + "%",
                    background: c.color,
                  }}
                  title={`${c.label}: ${fmtUSD0(c.value * mult)}${periodLabel}`}
                />
              ))}
              {data.leftover > 0 && (
                <div
                  style={{
                    width: ((data.leftover / data.monthlyTakeHome) * 100) + "%",
                    background: "var(--accent-dim)",
                    opacity: 0.4,
                  }}
                  title={`Leftover: ${fmtUSD0(data.leftover * mult)}${periodLabel}`}
                />
              )}
            </div>
            <ul className="legend">
              {data.categories.map((c, i) => (
                <li key={i}>
                  <span className="legend-dot" style={{ background: c.color }} />
                  <span className="legend-label">{c.label}</span>
                  <span className="legend-val">
                    {fmtUSD0(c.value * mult)}
                    <span className="legend-pct"> · {fmtPct(c.value / data.monthlyTakeHome, 0)}</span>
                  </span>
                </li>
              ))}
              {data.leftover > 0 && (
                <li>
                  <span className="legend-dot" style={{ background: "var(--accent-dim)", opacity: 0.5 }} />
                  <span className="legend-label" style={{ fontStyle: "italic", fontFamily: "var(--display)", color: "var(--ink-3)" }}>
                    Untracked / discretionary
                  </span>
                  <span className="legend-val">
                    {fmtUSD0(data.leftover * mult)}
                    <span className="legend-pct"> · {fmtPct(data.leftover / data.monthlyTakeHome, 0)}</span>
                  </span>
                </li>
              )}
            </ul>
          </div>
        </section>

        <FullBreakdownBySource data={data} view={view} mult={mult} profile={profile} />

        <div className="grid-2">
          <section className="card">
            <header className="card-head"><h2>Health checks</h2></header>
            <div className="card-body">
              <HealthCheck data={data} />
            </div>
          </section>

          <section className="card">
            <header className="card-head"><h2>Quick stats</h2></header>
            <div className="card-body">
              <div className="quick-stats">
                <div className="quick-stat">
                  <div className="quick-stat-label">Savings rate</div>
                  <div className="quick-stat-val">{fmtPct(data.savingsTarget / data.monthlyTakeHome, 1)}</div>
                </div>
                <div className="quick-stat">
                  <div className="quick-stat-label">Vehicle share of income</div>
                  <div className="quick-stat-val">{fmtPct(data.autoMonthly / data.monthlyTakeHome, 1)}</div>
                </div>
                <div className="quick-stat">
                  <div className="quick-stat-label">Rent share of income</div>
                  <div className="quick-stat-val">{fmtPct((window.expenseShare ? window.expenseShare(data.expenses, "rent") : (data.expenses.rent || 0)) / data.monthlyTakeHome, 1)}</div>
                </div>
                <div className="quick-stat">
                  <div className="quick-stat-label">Debt-to-income ratio</div>
                  <div className="quick-stat-val">{fmtPct((data.debtTotal + data.extraToDebt + (data.expenses.otherLoan || 0)) / data.monthlyTakeHome, 1)}</div>
                </div>
              </div>
            </div>
          </section>
        </div>

        <p className="footnote" style={{ textAlign: "center" }}>
          All numbers pulled live from your Budget, Auto, Debt, and Investing tabs. Edit any of them — this view updates automatically.
        </p>
      </div>
    </>
  );
}

function HealthCheck({ data }) {
  const checks = [];
  const rentPct = (window.expenseShare ? window.expenseShare(data.expenses, "rent") : (data.expenses.rent || 0)) / data.monthlyTakeHome;
  if (rentPct > 0) {
    if (rentPct < 0.30) checks.push({ kind: "ok",   label: "Rent under 30% of take-home",      detail: `${fmtPct(rentPct)} — healthy` });
    else if (rentPct < 0.40) checks.push({ kind: "warn", label: "Rent is 30–40% of take-home", detail: `${fmtPct(rentPct)} — on the high side` });
    else checks.push({ kind: "bad", label: "Rent over 40% of take-home", detail: `${fmtPct(rentPct)} — consider a cheaper option` });
  }
  const carPct = data.autoMonthly / data.monthlyTakeHome;
  if (carPct > 0) {
    if (carPct < 0.15) checks.push({ kind: "ok",   label: "Vehicle costs under 15%", detail: `${fmtPct(carPct)} — reasonable` });
    else if (carPct < 0.25) checks.push({ kind: "warn", label: "Vehicle 15–25% of income", detail: `${fmtPct(carPct)} — borderline` });
    else checks.push({ kind: "bad", label: "Vehicle over 25% of income", detail: `${fmtPct(carPct)} — significant burden` });
  }
  const savingsRate = data.savingsTarget / data.monthlyTakeHome;
  if (savingsRate >= 0.20) checks.push({ kind: "ok",   label: "Saving 20%+", detail: "great rate" });
  else if (savingsRate >= 0.10) checks.push({ kind: "warn", label: "Saving 10–20%", detail: "OK, consider increasing" });
  else checks.push({ kind: "bad", label: "Saving less than 10%", detail: "increase if possible" });
  if (data.leftover < 0) {
    checks.push({ kind: "bad", label: "Monthly deficit", detail: `${fmtUSD0(data.leftover)} short` });
  }
  return (
    <ul className="health-list">
      {checks.map((c, i) => (
        <li key={i} className={"health-item health-" + c.kind}>
          <span className="health-icon">{c.kind === "ok" ? "✓" : c.kind === "warn" ? "!" : "×"}</span>
          <span>
            <div className="health-label">{c.label}</div>
            <div className="health-detail">{c.detail}</div>
          </span>
        </li>
      ))}
    </ul>
  );
}

// ─── Optimize panel ────────────────────────────────────────────────────
// Shows up only when monthly leftover < 0 (i.e. user is overspending allocations).
// Lists 3-4 specific cut suggestions ranked by impact, each with a one-click apply.
function OptimizePanel({ data, view, mult }) {
  if (!data || data.leftover >= 0) {
    // Already in surplus
    const trulyUntracked = data.discretionary;
    // OVER-COMMITTED case: leftover after bills is positive, but earmarked > leftover
    // (user planned to save/pay-down more than they have left). Render a yellow warning.
    if (trulyUntracked < 0) {
      const overBy = Math.abs(trulyUntracked);
      return (
        <section className="optimize-panel optimize-panel-bad">
          <div className="optimize-icon">⚠</div>
          <div className="optimize-body">
            <div className="optimize-title">
              Over-committed by {fmtUSD0(overBy * mult)}{view === "monthly" ? "/mo" : "/yr"}
            </div>
            <div className="optimize-sub">
              After bills you have <strong>{fmtUSD0(data.leftover * mult)}</strong> left, but you've earmarked <strong>{fmtUSD0(data.earmarked * mult)}</strong> for savings + extra debt paydown.
              That's <strong>{fmtUSD0(overBy * mult)}</strong> more than you actually have. Reduce one of the earmarks on the Debt tab — your plan won't fit your take-home.
            </div>
          </div>
        </section>
      );
    }
    return (
      <section className="optimize-panel optimize-panel-good">
        <div className="optimize-icon">✓</div>
        <div className="optimize-body">
          <div className="optimize-title">
            You're in the green — {fmtUSD0(data.leftover * mult)}{view === "monthly" ? "/mo" : "/yr"} after bills
          </div>
          <div className="optimize-sub">
            {data.earmarked > 0 ? (
              <>You've earmarked <strong>{fmtUSD0(data.earmarked * mult)}</strong> for savings & extra debt paydown.
              {trulyUntracked > 0
                ? <> The remaining <strong>{fmtUSD0(trulyUntracked * mult)}</strong> is discretionary — route it toward investments or your emergency fund.</>
                : <> Every dollar has a job — well done.</>}
              </>
            ) : (
              <>That money isn't going anywhere tracked. Consider routing it to <strong>investments</strong> or your <strong>emergency fund</strong>.</>
            )}
          </div>
        </div>
      </section>
    );
  }

  const deficit = -data.leftover; // positive number = how much we need to free up

  // Build the list of levers, with the biggest opportunities ranked first
  const levers = [];

  if (data.extraToDebt > 0) {
    const cut = Math.min(data.extraToDebt, deficit);
    levers.push({
      key: "extraDebt",
      icon: "⚖",
      title: `Pause extra debt paydown — save ${fmtUSD0(cut)}/mo`,
      detail: `You're paying ${fmtUSD0(data.extraToDebt)}/mo above minimums. Pausing the extra closes ${Math.round((cut/deficit)*100)}% of your gap. Minimums still get paid.`,
      apply: () => {
        const cur = readLS("ledger:debt") || {};
        cur.debtPct = 0; cur.autoSpare = false;
        localStorage.setItem("ledger:debt", JSON.stringify(cur));
        window.location.reload();
      },
    });
  }

  if (data.savingsTarget > 0) {
    const cut = Math.min(data.savingsTarget, deficit);
    levers.push({
      key: "savings",
      icon: "💼",
      title: `Trim savings rate — save ${fmtUSD0(cut)}/mo`,
      detail: `You're routing ${fmtUSD0(data.savingsTarget)}/mo to savings. Trimming this could close ${Math.round((cut/deficit)*100)}% of the gap, but slows your investing.`,
      apply: () => {
        const cur = readLS("ledger:debt") || {};
        cur.debtPct = 1; cur.autoSpare = false;
        localStorage.setItem("ledger:debt", JSON.stringify(cur));
        window.location.reload();
      },
    });
  }

  // Subscriptions — gather from expenses
  const subs = (data.expenses?.subscriptions || []);
  const subsTotal = subs.reduce((a, s) => a + (Number(s.amount) || 0), 0);
  if (subsTotal > 0) {
    levers.push({
      key: "subs",
      icon: "💳",
      title: `Audit subscriptions — up to ${fmtUSD0(subsTotal)}/mo`,
      detail: `You have ${subs.length} subscription${subs.length !== 1 ? "s" : ""} totaling ${fmtUSD0(subsTotal)}/mo: ${subs.slice(0, 4).map(s => s.name).join(", ")}${subs.length > 4 ? "…" : ""}. Cancel any you don't use.`,
      apply: null, // user-driven on Expenses tab
    });
  }

  // Vehicle — if monthly auto cost is high
  if (data.autoMonthly > 400) {
    levers.push({
      key: "auto",
      icon: "🚗",
      title: `Vehicle costs are ${fmtUSD0(data.autoMonthly)}/mo`,
      detail: `Insurance + gas + maintenance + loan together. Shopping insurance, refinancing the loan, or carpooling could trim 10-30%.`,
      apply: null,
    });
  }

  // Secondary spending
  const secondary = (data.expenses?.secondary || []);
  const secTotal = secondary.reduce((a, s) => a + (Number(s.amount) || 0), 0);
  if (secTotal > 0) {
    levers.push({
      key: "sec",
      icon: "✂",
      title: `Secondary "wants" spend — ${fmtUSD0(secTotal)}/mo`,
      detail: `Dining, clothes, entertainment, etc. Often the easiest to trim without hurting your life.`,
      apply: null,
    });
  }

  return (
    <section className="optimize-panel optimize-panel-bad">
      <div className="optimize-head">
        <div className="optimize-icon">✦</div>
        <div className="optimize-body">
          <div className="optimize-title">
            You're {fmtUSD0(deficit)}/mo short ({fmtUSD0(deficit * 12)}/yr)
          </div>
          <div className="optimize-sub">
            Your allocations add up to more than your take-home. Here are the biggest levers to flip back into the green:
          </div>
        </div>
      </div>
      <ul className="optimize-list">
        {levers.slice(0, 4).map((l) => (
          <li key={l.key} className="optimize-item">
            <span className="optimize-item-icon">{l.icon}</span>
            <div className="optimize-item-body">
              <div className="optimize-item-title">{l.title}</div>
              <div className="optimize-item-detail">{l.detail}</div>
            </div>
            {l.apply && (
              <button className="btn-link" onClick={l.apply}>Apply →</button>
            )}
          </li>
        ))}
      </ul>
    </section>
  );
}
