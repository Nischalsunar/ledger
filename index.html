      await window.__hydrateFromFirestore(u.uid, cleanEmail);
      onLoggedIn(cleanEmail, map[cleanEmail]);
    } catch (err) {
      setError("Google sign-in failed: " + (err.message || err.code || "unknown"));
    }
    setBusy(false);
  };

  const continueAsGuest = () => {
    setCurrentUser("_guest");
    onLoggedIn("_guest", { name: "Guest" });
  };

  const quickSignIn = (em) => {
    setEmail(em);
    setMode("signin");
    setPassword("");
    setTimeout(() => document.querySelector("input[type=password]")?.focus(), 50);
  };

  return (
    <div className="login-overlay">
      <div className="login-bg" aria-hidden="true">
        {["💰","📊","🚗","🏠","💳","📈","✦","💵","🎯","💼","🪙","🏦"].map((g, i) => (
          <span key={i} className="login-bg-icon" style={{
            left: `${(i * 73) % 100}%`, top: `${(i * 41) % 100}%`,
            animationDelay: `${i * 0.4}s`, fontSize: `${20 + (i % 4) * 8}px`,
          }}>{g}</span>
        ))}
      </div>
      <div className="login-card">
        <div className="login-logo">
          <span className="login-logo-mark">$</span>
          <span className="login-logo-name">Ledger</span>
        </div>
        <h1 className="login-title">{mode === "signin" ? "Welcome back" : "Create your account"}</h1>
        <p className="login-sub">
          {mode === "signin"
            ? "Sign in to load your saved finances."
            : "All data is stored only in this browser — nothing is sent anywhere."}
        </p>

        {/* Quick sign-in chips for accounts that exist on this browser */}
        {mode === "signin" && existingEmails.length > 0 && (
          <div className="login-quick">
            <div className="login-quick-label">Accounts on this browser:</div>
            <div className="login-quick-chips">
              {existingEmails.map((em) => (
                <button key={em} type="button" className="login-quick-chip" onClick={() => quickSignIn(em)}>
                  {accounts[em]?.name || em}
                </button>
              ))}
            </div>
          </div>
        )}

        <form className="login-form" onSubmit={submit}>
          {mode === "signup" && (
            <div className="login-name-row">
              <label className="login-field">
                <span>First name</span>
                <input type="text" className="text-input" value={firstName}
                  onChange={(e) => setFirstName(e.target.value)} placeholder="Nischal" autoComplete="given-name" />
              </label>
              <label className="login-field">
                <span>Last name</span>
                <input type="text" className="text-input" value={lastName}
                  onChange={(e) => setLastName(e.target.value)} placeholder="Sunar" autoComplete="family-name" />
              </label>
            </div>
          )}
          <label className="login-field">
            <span>Email</span>
            <input type="email" className="text-input" value={email}
              onChange={(e) => setEmail(e.target.value)} placeholder="you@example.com" required />
          </label>
          <label className="login-field">
            <span>
              Password <em>{mode === "signup" ? "(6+ chars to sync across devices, or blank for local-only)" : "(use your cloud password, or blank for local-only)"}</em>
            </span>
            <input type="password" className="text-input" value={password}
              onChange={(e) => setPassword(e.target.value)} placeholder="optional" />
          </label>

          {error && <div className="login-error">{error}</div>}

          <button type="submit" className="btn-primary login-btn" disabled={busy}>
            {busy ? "..." : (mode === "signin" ? "Sign in →" : "Create account →")}
          </button>
        </form>

        <div className="login-toggle">
          {mode === "signin" ? (
            <>New here? <button type="button" className="btn-link" onClick={() => { setMode("signup"); setError(""); }}>Create an account</button></>
          ) : (
            <>Already have an account? <button type="button" className="btn-link" onClick={() => { setMode("signin"); setError(""); }}>Sign in</button></>
          )}
        </div>

        <div className="login-divider">or</div>
        <button type="button" className="btn-ghost login-google" onClick={signInWithGoogle} disabled={busy}>
          <svg width="18" height="18" viewBox="0 0 48 48" style={{verticalAlign:"middle",marginRight:8}}>
            <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20c11 0 19.7-8 19.7-20 0-1.3-.1-2.3-.4-3.5z"/>
            <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 16 19 13 24 13c3 0 5.8 1.1 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
            <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.6 39.6 16.3 44 24 44z"/>
            <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.1 5.6l6.2 5.2C41.3 35.2 44 30 44 24c0-1.3-.1-2.3-.4-3.5z"/>
          </svg>
          Continue with Google
        </button>
        <button type="button" className="btn-ghost login-guest" onClick={continueAsGuest}>
          Continue as guest
        </button>
        <p className="login-disclaimer">
          🔒 With a password (6+ chars) or Google, your data syncs across devices via Firebase.
          Without a password, accounts are local to this browser only.
        </p>
      </div>
    </div>
  );
}

// ─── Top-level Auth wrapper ──────────────────────────────────────────────
function AuthGate({ children }) {
  const [user, setUser] = useStateAuth(() => {
    const em = getCurrentUser();
    if (!em) return null;
    const map = loadAccounts();
    return em === "_guest" ? { email: "_guest", name: "Guest" } : (map[em] ? { email: em, ...map[em] } : null);
  });

  useEffectAuth(() => {
    // Expose globally so the sidebar can read it + sign-out works
    window.__currentUser = user;
    window.__signOut = async () => {
      try { await window.__firebaseSync?.signOut?.(); } catch {}
      setCurrentUser(null);
      window.__currentUser = null;
      // Force full reload so all components re-init under no namespace
      window.location.reload();
    };
    window.__switchAccount = async () => {
      try { await window.__firebaseSync?.signOut?.(); } catch {}
      setCurrentUser(null);
      window.location.reload();
    };
  }, [user]);

  // On first mount, if we have a Firebase session but no local currentUser,
  // pull the cloud data down so the user lands in their dashboard automatically.
  useEffectAuth(() => {
    const sync = window.__firebaseSync;
    if (!sync || !sync.enabled) return;
    const unsub = sync.onAuth(async (fbUser) => {
      if (!fbUser) return;
      const email = (fbUser.email || "").toLowerCase();
      const local = getCurrentUser();
      if (local && local !== "_guest") return; // already signed in locally
      const map = loadAccounts();
      if (!map[email]) {
        map[email] = {
          name: fbUser.displayName || email.split("@")[0],
          role: isAdminEmail(email) ? "admin" : "user",
          createdAt: new Date().toISOString(),
          lastSignIn: new Date().toISOString(),
          cloudUid: fbUser.uid,
          provider: fbUser.providerData?.[0]?.providerId || "firebase",
        };
        saveAccounts(map);
      }
      setCurrentUser(email);
      await sync.writeProfile(fbUser.uid, {
        email, name: map[email].name, role: map[email].role,
        provider: fbUser.providerData?.[0]?.providerId || "firebase",
        lastSignIn: new Date().toISOString(),
        photoURL: fbUser.photoURL || null,
      });
      await window.__hydrateFromFirestore(fbUser.uid, email);
      setUser({ email, ...map[email] });
    });
    return () => unsub && unsub();
  }, []);

  if (!user) {
    // Brand new visitor (no auth + never onboarded) → let the wizard run as the
    // entry experience. The wizard's AccountPhase handles sign-in/sign-up itself
    // and writes the currentUser key, so on completion the gate flips automatically.
    const onboarded = window.__rawStorage?.get?.("ledger:onboarded");
    if (!onboarded && window.OnboardingWizard) {
      return <window.OnboardingWizard onClose={() => {
        // After the wizard saves the account + clicks "Open my dashboard"
        const em = getCurrentUser();
        if (em) {
          const map = loadAccounts();
          setUser(em === "_guest" ? { email: "_guest", name: "Guest" } : { email: em, ...map[em] });
          setTimeout(() => window.location.reload(), 100);
        }
      }} />;
    }
    // Returning visitor who signed out → traditional login screen
    return <LoginScreen onLoggedIn={(email, account) => {
      setUser({ email, ...account });
      setTimeout(() => window.location.reload(), 100);
    }} />;
  }
  return children;
}

window.AuthGate = AuthGate;
window.LoginScreen = LoginScreen;

</script>

<script type="text/babel" data-presets="react">
// Shared UI atoms (depend on React being loaded globally).
const { useState: useStateShared } = React;

const fmtUSD0 = (n) => {
  if (!isFinite(n)) return "—";
  const s = n < 0 ? "-" : "";
  return s + "$" + Math.abs(Math.round(n)).toLocaleString();
};
const fmtUSD2 = (n) => {
  if (!isFinite(n)) return "—";
  const s = n < 0 ? "-" : "";
  return s + "$" + Math.abs(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
};
const fmtPct = (n, d = 1) => (n * 100).toFixed(d) + "%";
// Expose for the math test suite + any cross-tab consumers
window.fmtUSD0 = fmtUSD0;
window.fmtUSD2 = fmtUSD2;
window.fmtPct = fmtPct;

// ── AutoSaveIndicator ─────────────────────────────────────────────────
// Watches a value via deep equality; shows "Saving…" briefly when it changes
// and "✓ Saved · Xs ago" otherwise. Drop this anywhere — pass any object/array.
function AutoSaveIndicator({ value, label = "Saved" }) {
  const [lastEditAt, setLastEditAt] = useStateShared(null);
  const [showSaving, setShowSaving] = useStateShared(false);
  const isFirst = React.useRef(true);
  const [, forceTick] = useStateShared(0);

  React.useEffect(() => {
    // First run after mount is the initial load — don't show "Saving"
    if (isFirst.current) { isFirst.current = false; return; }
    setShowSaving(true);
    setLastEditAt(Date.now());
    const t = setTimeout(() => setShowSaving(false), 700);
    return () => clearTimeout(t);
  }, [JSON.stringify(value)]);

  // Update the "X ago" label every 5s
  React.useEffect(() => {
    const id = setInterval(() => forceTick((n) => n + 1), 5000);
    return () => clearInterval(id);
  }, []);

  if (lastEditAt == null) {
    // No edits this session yet — show a neutral indicator so user knows it's wired
    return (
      <span className="autosave-pill autosave-idle" title="Edits auto-save to your browser + cloud as you type">
        Auto-save on
      </span>
    );
  }
  if (showSaving) {
    return <span className="autosave-pill autosave-saving">Saving…</span>;
  }
  const ago = Math.floor((Date.now() - lastEditAt) / 1000);
  const agoText = ago < 5 ? "just now" : ago < 60 ? `${ago}s ago` : `${Math.floor(ago/60)}m ago`;
  return (
    <span className="autosave-pill autosave-saved" title={`Last save: ${new Date(lastEditAt).toLocaleTimeString()}`}>
      ✓ {label} · {agoText}
    </span>
  );
}
window.AutoSaveIndicator = AutoSaveIndicator;

// ── Integer-cents money helpers (Section B) ────────────────────────────
// Use these inside long iterative loops (compound projection, debt sim) to
// avoid float drift. `toCents` is round-half-away-from-zero so $0.005 → 1¢.
// `toDollars` returns dollars as a float for the UI (display rounds via fmtUSD0).
function toCents(dollars) {
  if (!isFinite(dollars)) return 0;
  // Symmetric rounding: 0.005 → 1, -0.005 → -1
  return dollars < 0
    ? -Math.round(-dollars * 100)
    :  Math.round( dollars * 100);
}
function toDollars(cents) {
  if (!isFinite(cents)) return 0;
  return cents / 100;
}
window.toCents = toCents;
window.toDollars = toDollars;

const Field = ({ label, hint, children }) => (
  <label className="field">
    <div className="field-label">
      <span>{label}</span>
      {hint && <span className="field-hint">{hint}</span>}
    </div>
    {children}
  </label>
);

const Money = ({ value, onChange, placeholder, prefix = "$" }) => {
  const [focused, setFocused] = useStateShared(false);
  // While focused, keep the raw text the user is typing so partial values
  // like "5." or "5.0" don't get rewritten by Number() round-trips.
  const [localText, setLocalText] = useStateShared("");
  const display = focused
    ? localText
    : (value ? Number(value).toLocaleString() : "");
  return (
    <div className={"money-input" + (focused ? " is-focused" : "")}>
      <span className="money-prefix">{prefix}</span>
      <input
        type="text"
        inputMode="decimal"
        value={display}
        placeholder={placeholder}
        onFocus={() => { setFocused(true); setLocalText(value === 0 || value == null ? "" : String(value)); }}
        onBlur={() => setFocused(false)}
        onChange={(e) => {
          const raw = e.target.value.replace(/[^0-9.]/g, "");
          setLocalText(raw);
          // Only commit when the string is a parseable number; allow trailing "." while typing
          if (raw === "" || raw === ".") {
            onChange(0);
          } else {
            const n = Number(raw);
            if (isFinite(n)) onChange(n);
          }
        }}
      />
    </div>
  );
};

// CountUp — animates a number from its previous value to the new value over ~duration seconds.
// Uses framer-motion's animate() to drive smooth easing. Falls back to the static value
// if FM hasn't loaded yet.
const CountUp = ({ value, duration = 1, format = fmtUSD0, className, style }) => {
  const fm = (typeof window !== "undefined") && window.FramerMotion;
  const [display, setDisplay] = useStateShared(value || 0);
  const prevRef = React.useRef(0);
  React.useEffect(() => {
    if (!fm || !fm.animate) { setDisplay(value); prevRef.current = value; return; }
    const from = prevRef.current;
    const to = Number(value) || 0;
    if (from === to) { setDisplay(to); return; }
    const controls = fm.animate(from, to, {
      duration,
      ease: "easeOut",
      onUpdate: (v) => setDisplay(v),
    });
    return () => { controls.stop(); prevRef.current = to; };
  }, [value, duration]);
  return <span className={className} style={style}>{format(display)}</span>;
};

const NumberInput = ({ value, onChange, suffix, placeholder, step = 0.1 }) => {
  const [focused, setFocused] = useStateShared(false);
  const [localText, setLocalText] = useStateShared("");
  // Strip floating-point noise (e.g. 0.07 * 100 = 7.000000000000001 → "7")
  const cleanNum = (n) => {
    if (n === null || n === undefined || n === "" || !isFinite(n)) return "";
    const rounded = Math.round(Number(n) * 1e10) / 1e10;
    return String(rounded);
  };
  const display = focused
    ? localText
    : (value || value === 0 ? cleanNum(value) : "");
  return (
    <div className={"money-input" + (focused ? " is-focused" : "")}>
      <input
        type="text"
        inputMode="decimal"
        value={display}
        placeholder={placeholder}
        onFocus={() => { setFocused(true); setLocalText(value === 0 || value == null ? "" : cleanNum(value)); }}
        onBlur={() => setFocused(false)}
        onChange={(e) => {
          const raw = e.target.value.replace(/[^0-9.\-]/g, "");
          setLocalText(raw);
          // Allow partial values like "5.", ".", "-" while typing without losing the decimal
          if (raw === "" || raw === "." || raw === "-" || raw === "-.") {
            onChange(0);
          } else {
            const n = Number(raw);
            if (isFinite(n)) onChange(n);
          }
        }}
      />
      {suffix && <span className="money-prefix" style={{marginRight: 0, marginLeft: 6}}>{suffix}</span>}
    </div>
  );
};

const Segment = ({ value, onChange, options }) => (
  <div className="segment">
    {options.map((o) => (
      <button
        key={o.value}
        className={"segment-btn" + (value === o.value ? " is-active" : "")}
        onClick={() => onChange(o.value)}
        type="button"
      >
        {o.label}
      </button>
    ))}
  </div>
);

// City autocomplete — typing filters US_CITIES, selecting fills city + state.
const CityAutocomplete = ({ city, state, onChange }) => {
  const [open, setOpen] = useStateShared(false);
  const [active, setActive] = useStateShared(0);
  const matches = React.useMemo(() => {
    const q = (city || "").trim().toLowerCase();
    if (!q) return [];
    const list = (typeof US_CITIES !== "undefined" ? US_CITIES : []);
    // Prefer prefix matches over substring matches
    const prefix = [], substr = [];
    for (const [name, st] of list) {
      const lc = name.toLowerCase();
      if (lc.startsWith(q))      prefix.push([name, st]);
      else if (lc.includes(q))   substr.push([name, st]);
      if (prefix.length >= 8) break;
    }
    return prefix.concat(substr).slice(0, 8);
  }, [city]);

  const pick = (name, st) => {
    onChange({ city: name, state: st });
    setOpen(false);
  };

  return (
    <div style={{ position: "relative" }}>
      <input
        type="text"
        className="text-input"
        placeholder="e.g. New York City"
        value={city}
        onChange={(e) => { onChange({ city: e.target.value }); setOpen(true); setActive(0); }}
        onFocus={() => setOpen(true)}
        onBlur={() => setTimeout(() => setOpen(false), 120)}
        onKeyDown={(e) => {
          if (!open || matches.length === 0) return;
          if (e.key === "ArrowDown") { e.preventDefault(); setActive((a) => Math.min(a + 1, matches.length - 1)); }
          else if (e.key === "ArrowUp")   { e.preventDefault(); setActive((a) => Math.max(a - 1, 0)); }
          else if (e.key === "Enter")     { e.preventDefault(); const m = matches[active]; if (m) pick(m[0], m[1]); }
          else if (e.key === "Escape")    { setOpen(false); }
        }}
        autoComplete="off"
      />
      {open && matches.length > 0 && (
        <ul className="ac-list">
          {matches.map(([name, st], i) => (
            <li
              key={name + st}
              className={"ac-item" + (i === active ? " is-active" : "")}
              onMouseDown={(e) => { e.preventDefault(); pick(name, st); }}
              onMouseEnter={() => setActive(i)}
            >
              <span className="ac-name">{name}</span>
              <span className="ac-state">{st}</span>
            </li>
          ))}
        </ul>
      )}
    </div>
  );
};

const Toggle = ({ value, onChange, label, hint }) => (
  <button
    type="button"
    className={"toggle-row" + (value ? " is-on" : "")}
    onClick={() => onChange(!value)}
  >
    <div className="toggle-text">
      <div className="toggle-label">{label}</div>
      {hint && <div className="toggle-hint">{hint}</div>}
    </div>
    <div className={"toggle-switch" + (value ? " is-on" : "")}>
      <div className="toggle-knob" />
    </div>
  </button>
);

// Address autocomplete — debounced Nominatim search. US-only by default.
// onChange receives (value, coords?) — coords is { lat, lon, display } when picked from list.
// biasCoords optionally biases results toward a location (e.g. home for work field).
const AddressAutocomplete = ({ value, onChange, placeholder, biasCoords }) => {
  const [matches, setMatches] = useStateShared([]);
  const [open, setOpen] = useStateShared(false);
  const [active, setActive] = useStateShared(0);
  const [loading, setLoading] = useStateShared(false);
  const abortRef = React.useRef(null);
  const timerRef = React.useRef(null);
  const lastQueryRef = React.useRef("");

  const fetchSuggestions = (q) => {
    if (abortRef.current) abortRef.current.abort();
    if (!q || q.trim().length < 3) {
      setMatches([]);
      setLoading(false);
      return;
    }
    const ctrl = new AbortController();
    abortRef.current = ctrl;
    lastQueryRef.current = q;
    setLoading(true);
    // Updated to pull more results, include extra tags, and prefer importance ranking.
    let url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=8&countrycodes=us&addressdetails=1&extratags=1&namedetails=1&dedupe=1`;
    if (biasCoords && Number.isFinite(biasCoords.lat)) {
      const r = 0.75; // roughly ~50 mi in latitude degrees
      const bb = `${biasCoords.lon - r},${biasCoords.lat + r},${biasCoords.lon + r},${biasCoords.lat - r}`;
      url += `&viewbox=${bb}&bounded=0`;
    }
    fetch(url, { signal: ctrl.signal, headers: { "Accept-Language": "en" } })
      .then((r) => r.json())
      .then((data) => {
        if (lastQueryRef.current !== q) return; // stale
        // Rank: prefer addresses with house number, then named places, then admin areas
        const ranked = (data || []).slice().sort((a, b) => {
          const ax = (a.address?.house_number ? 3 : 0) + (a.address?.road ? 1 : 0) + Number(a.importance || 0);
          const bx = (b.address?.house_number ? 3 : 0) + (b.address?.road ? 1 : 0) + Number(b.importance || 0);
          return bx - ax;
        });
        setMatches(ranked.slice(0, 6));
        setLoading(false);
      })
      .catch((e) => {
        if (e.name !== "AbortError") setLoading(false);
      });
  };

  const onInput = (val) => {
    onChange(val, null); // clear coords when user types
    setOpen(true);
    setActive(0);
    clearTimeout(timerRef.current);
    // Snappier search — was 420ms, now 250ms
    timerRef.current = setTimeout(() => fetchSuggestions(val), 250);
  };

  const pick = (m) => {
    onChange(m.display_name, {
      lat: parseFloat(m.lat),
      lon: parseFloat(m.lon),
      display: m.display_name,
    });
    setMatches([]);
    setOpen(false);
  };

  const fmtMatch = (m) => {
    const a = m.address || {};
    const place = a.city || a.town || a.village || a.hamlet || a.county || "";
    const st    = a.state || "";
    const label = m.display_name;
    // First two segments are the most specific (name + street), last two are city/state.
    const parts = label.split(",").map((s) => s.trim());
    const primary = parts.slice(0, 2).join(", ");
    return { primary, place, st, parts };
  };

  // Show a horizontal-scrolling preview of the full selected address below the input
  // (so long lines like "University at Buffalo, 12, Town of Amherst, Erie County..." stay readable).
  const hasFull = value && value.length > 0;
  return (
    <div style={{ position: "relative" }}>
      <input
        type="text"
        className="text-input addr-input"
        placeholder={placeholder}
        value={value || ""}
        onChange={(e) => onInput(e.target.value)}
        onFocus={() => { if (matches.length > 0) setOpen(true); }}
        onBlur={() => setTimeout(() => setOpen(false), 150)}
        onKeyDown={(e) => {
          if (!open || matches.length === 0) return;
          if (e.key === "ArrowDown")      { e.preventDefault(); setActive((a) => Math.min(a + 1, matches.length - 1)); }
          else if (e.key === "ArrowUp")   { e.preventDefault(); setActive((a) => Math.max(a - 1, 0)); }
          else if (e.key === "Enter")     { e.preventDefault(); if (matches[active]) pick(matches[active]); }
          else if (e.key === "Escape")    { setOpen(false); }
        }}
        autoComplete="off"
        title={value || ""}
      />
      {hasFull && value.length > 32 && (
        <div className="addr-full" title={value}>
          <span className="addr-full-label">Selected:</span>
          <span className="addr-full-text">{value}</span>
        </div>
      )}
      {open && (matches.length > 0 || loading) && (
        <ul className="ac-list ac-list-addr">
          {loading && matches.length === 0 && (
            <li className="ac-item" style={{ color: "var(--ink-3)", fontStyle: "italic" }}>Searching…</li>
          )}
          {matches.map((m, i) => {
            const f = fmtMatch(m);
            return (
              <li
                key={m.place_id}
                className={"ac-item ac-item-addr" + (i === active ? " is-active" : "")}
                onMouseDown={(e) => { e.preventDefault(); pick(m); }}
                onMouseEnter={() => setActive(i)}
                title={m.display_name}
              >
                <div className="ac-primary">{f.primary}</div>
                {(f.place || f.st) && (
                  <div className="ac-secondary">{[f.place, f.st].filter(Boolean).join(", ")}</div>
                )}
              </li>
            );
          })}
        </ul>
      )}
    </div>
  );
};

Object.assign(window, {
  fmtUSD0, fmtUSD2, fmtPct,
  Field, Money, NumberInput, Segment, CityAutocomplete, Toggle, AddressAutocomplete,
  CountUp,
});

</script>

<script type="text/babel" data-presets="react">
// Transactions data module.
//
// THE ONLY code in the app that touches the `ledger:transactions` key.
// Other tabs (Record, Current summary) consume via getAll() and mutate via
// add() / edit() / remove(). The persistent format is an array of:
//   { id, amount_cents, category, date, note }
//     id            — stable unique integer (timestamp-derived)
//     amount_cents  — INTEGER cents (use window.toCents to convert from dollars)
//     category      — short string ("Groceries", "Gas", …)
//     date          — ISO "YYYY-MM-DD"
//     note          — optional string
//
// Persistence: localStorage. The auth.jsx namespace shim transparently
// rewrites the key to ledger:u:{email}:transactions, and the Firestore
// mirror in firebase-sync.jsx pushes it to users/{uid}/data/transactions
// on every write — so cross-device sync via Google sign-in is automatic.
//
// Reactivity: every write dispatches a `ledger:transactions:changed`
// CustomEvent on window. Consumers subscribe via the React hook below
// (useTransactions) so they re-render when the data changes — including
// when a different browser tab in the same session writes.

(function buildTransactionsModule() {
  const KEY = "ledger:transactions";
  const EVT = "ledger:transactions:changed";

  // ── Internal read/write — only these two touch localStorage ──
  function _readRaw() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return [];
      const parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : [];
    } catch { return []; }
  }
  function _writeRaw(list) {
    try {
      localStorage.setItem(KEY, JSON.stringify(list));
      // Fire on next tick so React state update completes first
      setTimeout(() => window.dispatchEvent(new CustomEvent(EVT, { detail: list })), 0);
    } catch (e) {
      console.warn("[transactions] write failed:", e.message);
    }
  }

  // ── Validation ──
  function _normalize(rec) {
    const id = (rec && rec.id) || Date.now() + Math.floor(Math.random() * 1000);
    const amount_cents = Math.max(0, Math.round(Number(rec?.amount_cents) || 0));
    const category = String(rec?.category || "Uncategorized").trim() || "Uncategorized";
    const date = (() => {
      const d = rec?.date;
      if (typeof d === "string" && /^\d{4}-\d{2}-\d{2}$/.test(d)) return d;
      // Default to today (local timezone — matches Auto/Debt date defaults)
      const t = new Date();
      return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, "0")}-${String(t.getDate()).padStart(2, "0")}`;
    })();
    const note = rec?.note ? String(rec.note).slice(0, 500) : "";
    return { id, amount_cents, category, date, note };
  }

  // ── Public API ──
  const Transactions = {
    /** Returns the full transaction list (a fresh array — safe to mutate the copy). */
    getAll() {
      return _readRaw().slice();
    },

    /** Add one transaction. Returns the normalized record (with generated id). */
    add(rec) {
      const list = _readRaw();
      const next = _normalize(rec);
      list.push(next);
      _writeRaw(list);
      return next;
    },

    /** Patch an existing transaction by id. Returns updated record or null if not found. */
    edit(id, patch) {
      const list = _readRaw();
      const idx = list.findIndex((t) => t.id === id);
      if (idx === -1) return null;
      const merged = _normalize({ ...list[idx], ...patch, id: list[idx].id });
      list[idx] = merged;
      _writeRaw(list);
      return merged;
    },

    /** Delete by id. Returns true if anything was removed. */
    remove(id) {
      const list = _readRaw();
      const next = list.filter((t) => t.id !== id);
      if (next.length === list.length) return false;
      _writeRaw(next);
      return true;
    },

    /** Replace the entire list (used by tests + future bulk-import). */
    _setAll(list) {
      _writeRaw(Array.isArray(list) ? list.map(_normalize) : []);
    },

    EVT_CHANGED: EVT,
  };

  window.Transactions = Transactions;

  // ── Pure analytics helpers (read-only) ──
  // Not part of the storage API — these compute derived views from a list.
  // Keeping them on the module so Current/Projection consume one canonical source.
  Transactions.totalCents = function (list) {
    if (!Array.isArray(list)) return 0;
    return list.reduce((a, t) => a + (Number(t?.amount_cents) || 0), 0);
  };

  Transactions.byCategory = function (list) {
    const out = {};
    if (!Array.isArray(list)) return out;
    for (const t of list) {
      const cat = t?.category || "Uncategorized";
      out[cat] = (out[cat] || 0) + (Number(t?.amount_cents) || 0);
    }
    return out;
  };

  Transactions.byDay = function (list) {
    const map = new Map();
    if (!Array.isArray(list)) return [];
    for (const t of list) {
      const day = t?.date || "0000-00-00";
      if (!map.has(day)) map.set(day, { date: day, total_cents: 0, items: [] });
      const bucket = map.get(day);
      bucket.items.push(t);
      bucket.total_cents += Number(t?.amount_cents) || 0;
    }
    // Newest day first
    return Array.from(map.values()).sort((a, b) => (a.date < b.date ? 1 : -1));
  };

  Transactions.monthTotalCents = function (list, yyyyMm) {
    if (!Array.isArray(list) || !yyyyMm) return 0;
    return list.reduce((a, t) =>
      (t?.date || "").startsWith(yyyyMm) ? a + (Number(t?.amount_cents) || 0) : a, 0);
  };
})();

// ── React hook ───────────────────────────────────────────────────────────
// Subscribes a component to transaction-list changes. Returns the current
// list and re-renders whenever any add/edit/remove fires.
const { useState: useStateTx, useEffect: useEffectTx, useCallback: useCallbackTx } = React;

function useTransactions() {
  const [list, setList] = useStateTx(() => window.Transactions.getAll());
  useEffectTx(() => {
    const handler = () => setList(window.Transactions.getAll());
    window.addEventListener(window.Transactions.EVT_CHANGED, handler);
    // Also re-read on storage events (other tabs in the same browser)
    const storageHandler = (e) => {
      if (e.key && e.key.endsWith(":transactions")) setList(window.Transactions.getAll());
    };
    window.addEventListener("storage", storageHandler);
    return () => {
      window.removeEventListener(window.Transactions.EVT_CHANGED, handler);
      window.removeEventListener("storage", storageHandler);
    };
  }, []);
  return list;
}

window.useTransactions = useTransactions;

</script>

<script type="text/babel" data-presets="react">
// Record tab — dated expense transaction log.
//
// The ONLY data-entry surface for window.Transactions. Other tabs (the
// existing 9 calculator tabs) are untouched. The Current Summary inside
// this tab (read-only) lives below in Step 3.
//
// Architecture:
//   • Reads via the useTransactions React hook (exposed by calc-transactions.jsx).
//   • Mutates via window.Transactions.add/edit/remove.
//   • Never touches localStorage directly.
//   • Money math: dollars typed in the form → toCents on submit, stored as
//     amount_cents. Display via fmtUSD0(toDollars(cents)).
//
// UI patterns: matches the existing app — uses Field, NumberInput from
// shared.jsx, card / card-head / card-body / port-empty classes.

const { useState: useStateRec, useMemo: useMemoRec, useEffect: useEffectRec, useRef: useRefRec } = React;

// Common categories — quick-pick chips beneath the amount input.
const RECORD_CATEGORIES = [
  "Groceries", "Dining", "Gas", "Coffee", "Subscriptions",
  "Shopping", "Entertainment", "Transit", "Bills", "Health",
  "Travel", "Other",
];

function todayISO_() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

// Tiny pretty-print "May 24, 2026" / "Today" / "Yesterday" / "May 22 (Sun)"
function formatDayHeader(iso) {
  if (!iso) return "—";
  const [y, m, d] = iso.split("-").map(Number);
  const dt = new Date(y, m - 1, d);
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const yesterday = new Date(today); yesterday.setDate(today.getDate() - 1);
  const isToday = dt.getTime() === today.getTime();
  const isYesterday = dt.getTime() === yesterday.getTime();
  const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const stamp = `${MONTHS[dt.getMonth()]} ${dt.getDate()}` + (dt.getFullYear() !== today.getFullYear() ? `, ${dt.getFullYear()}` : "");
  if (isToday) return `Today — ${stamp}`;
  if (isYesterday) return `Yesterday — ${stamp}`;
  return `${stamp} (${DAYS[dt.getDay()]})`;
}

// ─── Entry form ──────────────────────────────────────────────────────────
function RecordEntryForm({ editing, onCancelEdit }) {
  // Local string state for the amount field so we can validate before parsing.
  const [amountStr, setAmountStr] = useStateRec("");
  const [category, setCategory] = useStateRec("Groceries");
  const [date, setDate] = useStateRec(todayISO_);
  const [note, setNote] = useStateRec("");
  const [error, setError] = useStateRec("");
  const amountRef = useRefRec(null);

  // Hydrate the form when "editing" target changes
  useEffectRec(() => {
    if (editing) {
      setAmountStr(window.toDollars(editing.amount_cents).toFixed(2));
      setCategory(editing.category || "Groceries");
      setDate(editing.date || todayISO_());
      setNote(editing.note || "");
      setError("");
    }
  }, [editing && editing.id]);

  const reset = () => {
    setAmountStr("");
    setCategory("Groceries");
    setDate(todayISO_());
    setNote("");
    setError("");
  };

  const submit = (e) => {
    e?.preventDefault?.();
    // Validate amount: must be a positive number > 0
    const trimmed = String(amountStr).trim();
    if (trimmed === "") {
      setError("Amount is required.");
      amountRef.current?.focus();
      return;
    }
    // Strip any non-numeric (allow leading $, commas, decimal)
    const cleaned = trimmed.replace(/[^0-9.\-]/g, "");
    const n = Number(cleaned);
    if (!isFinite(n) || isNaN(n)) {
      setError("Amount must be a number.");
      amountRef.current?.focus();
      return;
    }
    if (n < 0) {
      setError("Amount can't be negative.");
      amountRef.current?.focus();
      return;
    }
    if (n === 0) {
      setError("Amount must be greater than $0.");
      amountRef.current?.focus();
      return;
    }
    const cents = window.toCents(n);
    if (cents <= 0 || !isFinite(cents)) {
      setError("Amount is invalid.");
      return;
    }

    if (editing) {
      window.Transactions.edit(editing.id, {
        amount_cents: cents,
        category: (category || "Other").trim(),
        date,
        note: note.trim(),
      });
      onCancelEdit && onCancelEdit();
    } else {
      window.Transactions.add({
        amount_cents: cents,
        category: (category || "Other").trim(),
        date,
        note: note.trim(),
      });
    }
    reset();
  };

  const showCancel = !!editing;

  return (
    <section className="card">
      <header className="card-head">
        <h2>{editing ? "Edit entry" : "New entry"}</h2>
        {window.AutoSaveIndicator && (
          <window.AutoSaveIndicator value={[amountStr, category, date, note]} />
        )}
      </header>
      <div className="card-body">
        <form onSubmit={submit} noValidate>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 12 }}>
            <Field label="Amount" hint={error ? <span style={{color:"var(--negative)"}}>{error}</span> : "what did you spend?"}>
              <div className="money-input">
                <span className="money-prefix">$</span>
                <input
                  ref={amountRef}
                  type="text"
                  inputMode="decimal"
                  value={amountStr}
                  onChange={(e) => { setAmountStr(e.target.value); if (error) setError(""); }}
                  placeholder="0.00"
                  aria-invalid={!!error}
                />
              </div>
            </Field>
            <Field label="Category" hint="what was it for?">
              <input
                type="text"
                className="text-input"
                value={category}
                onChange={(e) => setCategory(e.target.value)}
                list="record-cat-list"
                placeholder="Groceries"
              />
              <datalist id="record-cat-list">
                {RECORD_CATEGORIES.map((c) => <option key={c} value={c} />)}
              </datalist>
            </Field>
            <Field label="Date" hint="when?">
              <input
                type="date"
                className="text-input"
                value={date}
                onChange={(e) => setDate(e.target.value || todayISO_())}
                max={todayISO_()}
              />
            </Field>
          </div>

          <Field label="Note" hint="optional · 500 chars max">
            <input
              type="text"
              className="text-input"
              value={note}
              onChange={(e) => setNote(e.target.value.slice(0, 500))}
              placeholder="e.g. weekly Whole Foods run"
            />
          </Field>

          {/* Quick-add category chips */}
          <div className="port-presets" style={{ marginTop: 10, marginBottom: 14 }}>
            {RECORD_CATEGORIES.map((c) => (
              <button
                key={c}
                type="button"
                className={"port-preset-btn" + (category === c ? " is-active" : "")}
                style={category === c ? { background: "var(--accent-bg)", borderColor: "var(--accent)" } : {}}
                onClick={() => setCategory(c)}
              >{c}</button>
            ))}
          </div>

          <div style={{ display: "flex", gap: 10 }}>
            <button type="submit" className="btn-primary">
              {editing ? "Save changes" : "Add entry"}
            </button>
            {showCancel && (
              <button type="button" className="btn-ghost" onClick={() => { onCancelEdit && onCancelEdit(); reset(); }}>
                Cancel
              </button>
            )}
          </div>
        </form>
      </div>
    </section>
  );
}

// ─── Timeline list ───────────────────────────────────────────────────────
function RecordTimeline({ transactions, onEdit, onDelete }) {
  if (!transactions || transactions.length === 0) {
    return (
      <section className="card">
        <header className="card-head"><h2>Timeline</h2></header>
        <div className="card-body">
          <div className="port-empty">
            No entries yet. Add your first expense above ↑
          </div>
        </div>
      </section>
    );
  }
  const days = window.Transactions.byDay(transactions);
  return (
    <section className="card">
      <header className="card-head">
        <h2>Timeline</h2>
        <span className="card-tag">
          {transactions.length} entr{transactions.length === 1 ? "y" : "ies"} · {fmtUSD0(window.toDollars(window.Transactions.totalCents(transactions)))} total
        </span>
      </header>
      <div className="card-body" style={{ padding: 0 }}>
        {days.map((day) => (
          <div key={day.date} className="record-day">
            <div className="record-day-head">
              <div className="record-day-date">{formatDayHeader(day.date)}</div>
              <div className="record-day-total">{fmtUSD0(window.toDollars(day.total_cents))}</div>
            </div>
            {day.items.map((tx) => (
              <div key={tx.id} className="record-item">
                <div className="record-item-main">
                  <span className="record-item-category">{tx.category}</span>
                  {tx.note && <span className="record-item-note"> · {tx.note}</span>}
                </div>
                <div className="record-item-amount">
                  {fmtUSD0(window.toDollars(tx.amount_cents))}
                </div>
                <div className="record-item-actions">
                  <button className="btn-link" onClick={() => onEdit(tx)} title="Edit">edit</button>
                  <button className="btn-link record-item-delete"
                    onClick={() => {
                      if (window.confirm(`Delete this $${window.toDollars(tx.amount_cents).toFixed(2)} ${tx.category} entry?`)) {
                        onDelete(tx.id);
                      }
                    }}
                    title="Delete">delete</button>
                </div>
              </div>
            ))}
          </div>
        ))}
      </div>
    </section>
  );
}

// ─── Current Summary (Step 3) — read-only month overview ─────────────────
// Lives INSIDE the Record tab, above the entry form. Pure read from the
// transactions module — no data entry, no storage writes. Recomputes
// automatically when useTransactions re-fires.
function CurrentSummary({ transactions }) {
  const today = new Date();
  const yyyyMm = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, "0")}`;
  const prevMonth = new Date(today.getFullYear(), today.getMonth() - 1, 1);
  const prevYyyyMm = `${prevMonth.getFullYear()}-${String(prevMonth.getMonth() + 1).padStart(2, "0")}`;
  const MONTHS_LONG = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const monthLabel = MONTHS_LONG[today.getMonth()];
  const prevMonthLabel = MONTHS_LONG[prevMonth.getMonth()];

  // This-month entries
  const thisMonthTxs = useMemoRec(
    () => (transactions || []).filter((t) => (t.date || "").startsWith(yyyyMm)),
    [transactions, yyyyMm]
  );
  const thisMonthCents = window.Transactions.totalCents(thisMonthTxs);
  const lastMonthCents = window.Transactions.monthTotalCents(transactions, prevYyyyMm);

  // Per-day total of this month for the chart
  const daysInMonth = new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate();
  const dailyData = useMemoRec(() => {
    const buckets = new Array(daysInMonth).fill(0);
    thisMonthTxs.forEach((t) => {
      const day = parseInt((t.date || "").slice(8, 10), 10);
      if (day >= 1 && day <= daysInMonth) buckets[day - 1] += (Number(t.amount_cents) || 0);
    });
    let cum = 0;
    return buckets.map((cents, i) => {
      cum += cents;
      return {
        day: i + 1,
        spent: window.toDollars(cents),
        cumulative: window.toDollars(cum),
      };
    });
  }, [thisMonthTxs, daysInMonth]);

  // Categories sorted by spend desc
  const categoryData = useMemoRec(() => {
    const byCat = window.Transactions.byCategory(thisMonthTxs);
    return Object.entries(byCat)
      .map(([category, cents]) => ({
        category,
        cents,
        dollars: window.toDollars(cents),
        pct: thisMonthCents > 0 ? (cents / thisMonthCents) * 100 : 0,
      }))
      .sort((a, b) => b.cents - a.cents);
  }, [thisMonthTxs, thisMonthCents]);

  // Day-of-month + average so far
  const dayOfMonth = today.getDate();
  const avgPerDay = dayOfMonth > 0 ? thisMonthCents / dayOfMonth : 0;
  const projectedMonth = avgPerDay * daysInMonth;

  // Comparison vs last month — only meaningful if last month had data
  const deltaCents = thisMonthCents - lastMonthCents;
  const deltaPct = lastMonthCents > 0 ? (deltaCents / lastMonthCents) * 100 : null;

  const Recharts = window.Recharts;
  const CAT_COLORS = ["#4DA77A", "#C9A96E", "#5A8FA3", "#B85450", "#7B6E55", "#A07ABE", "#4FB5B0", "#D77662", "#9C7C4B", "#6BC295", "#8B5A3C", "#7A8881"];

  return (
    <section className="card">
      <header className="card-head">
        <h2>This month so far</h2>
        <span className="card-tag">
          {monthLabel} {today.getFullYear()} · day {dayOfMonth} of {daysInMonth}
        </span>
      </header>
      <div className="card-body">
        {/* Empty state */}
        {thisMonthTxs.length === 0 ? (
          <div className="port-empty">
            No entries this month yet. Log your first expense below ↓
            {lastMonthCents > 0 && (
              <div style={{ marginTop: 8, fontSize: 12, color: "var(--ink-3)" }}>
                For reference: you spent <strong>{fmtUSD0(window.toDollars(lastMonthCents))}</strong> last {prevMonthLabel}.
              </div>
            )}
          </div>
        ) : (
          <>
            {/* Four-cell KPI strip */}
            <div className="invest-breakdown-grid" style={{ marginBottom: 16 }}>
              <div className="invest-breakdown-cell invest-breakdown-cell-final">
                <div className="invest-breakdown-label">Spent this month</div>
                <div className="invest-breakdown-value">{fmtUSD0(window.toDollars(thisMonthCents))}</div>
                <div className="invest-breakdown-sub">
                  {thisMonthTxs.length} {thisMonthTxs.length === 1 ? "entry" : "entries"}
                </div>
              </div>
              <div className="invest-breakdown-cell">
                <div className="invest-breakdown-label">Daily avg</div>
                <div className="invest-breakdown-value">{fmtUSD0(window.toDollars(avgPerDay))}</div>
                <div className="invest-breakdown-sub">over {dayOfMonth} day{dayOfMonth === 1 ? "" : "s"}</div>
              </div>
              <div className="invest-breakdown-cell">
                <div className="invest-breakdown-label">Projected month-end</div>
                <div className="invest-breakdown-value">{fmtUSD0(window.toDollars(projectedMonth))}</div>
                <div className="invest-breakdown-sub">if pace continues</div>
              </div>
              <div className="invest-breakdown-cell">
                <div className="invest-breakdown-label">vs. last {prevMonthLabel}</div>
                {lastMonthCents > 0 ? (
                  <>
                    <div className={"invest-breakdown-value " + (deltaCents <= 0 ? "pos" : "neg")}>
                      {deltaCents >= 0 ? "+" : ""}{fmtUSD0(window.toDollars(deltaCents))}
                    </div>
                    <div className="invest-breakdown-sub">
                      {deltaPct !== null && (
                        <>{deltaPct >= 0 ? "+" : ""}{deltaPct.toFixed(0)}% · last month {fmtUSD0(window.toDollars(lastMonthCents))}</>
                      )}
                    </div>
                  </>
                ) : (
                  <>
                    <div className="invest-breakdown-value" style={{ color: "var(--ink-3)" }}>—</div>
                    <div className="invest-breakdown-sub">no entries last month</div>
                  </>
                )}
              </div>
            </div>

            {/* Daily-spend chart */}
            {Recharts && (
              <div style={{ height: 200, marginBottom: 20 }}>
                <Recharts.ResponsiveContainer width="100%" height="100%">
                  <Recharts.ComposedChart data={dailyData} margin={{ top: 10, right: 16, left: 4, bottom: 8 }}>
                    <Recharts.CartesianGrid stroke="var(--border)" strokeDasharray="3 3" vertical={false} />
                    <Recharts.XAxis
                      dataKey="day"
                      tick={{ fill: "var(--ink-3)", fontSize: 11 }}
                      ticks={[1, 5, 10, 15, 20, 25, daysInMonth].filter((d) => d <= daysInMonth)}
                    />
                    <Recharts.YAxis
                      yAxisId="bars"
                      tick={{ fill: "var(--ink-3)", fontSize: 11 }}
                      tickFormatter={(v) => v >= 1000 ? `$${(v/1000).toFixed(1)}k` : `$${Math.round(v)}`}
                      width={50}
                    />
                    <Recharts.YAxis
                      yAxisId="cum"
                      orientation="right"
                      tick={{ fill: "var(--ink-3)", fontSize: 11 }}
                      tickFormatter={(v) => v >= 1000 ? `$${(v/1000).toFixed(1)}k` : `$${Math.round(v)}`}
                      width={50}
                    />
                    <Recharts.Tooltip
                      contentStyle={{ background: "var(--surface)", border: "1px solid var(--border)", borderRadius: 6, fontSize: 12 }}
                      formatter={(value, name) => [fmtUSD0(value), name === "spent" ? "Day total" : "Cumulative"]}
                      labelFormatter={(d) => `${monthLabel} ${d}`}
                    />
                    <Recharts.Bar yAxisId="bars" dataKey="spent" fill="var(--accent)" radius={[2, 2, 0, 0]} />
                    <Recharts.Line yAxisId="cum" type="monotone" dataKey="cumulative" stroke="var(--gold)" strokeWidth={2} dot={false} />
                  </Recharts.ComposedChart>
                </Recharts.ResponsiveContainer>
              </div>
            )}

            {/* Category breakdown — horizontal bars */}
            <h3 className="sub-head" style={{ marginTop: 0, marginBottom: 10 }}>By category</h3>
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {categoryData.map((c, i) => (
                <div key={c.category} className="record-cat-row">
                  <div className="record-cat-label">
                    <span className="record-cat-dot" style={{ background: CAT_COLORS[i % CAT_COLORS.length] }} />
                    {c.category}
                  </div>
                  <div className="record-cat-bar-wrap">
                    <div
                      className="record-cat-bar"
                      style={{ width: `${c.pct.toFixed(1)}%`, background: CAT_COLORS[i % CAT_COLORS.length] }}
                    />
                  </div>
                  <div className="record-cat-amount">{fmtUSD0(c.dollars)}</div>
                  <div className="record-cat-pct">{c.pct.toFixed(0)}%</div>
                </div>
              ))}
            </div>
          </>
        )}
      </div>
    </section>
  );
}

// ─── Top-level tab component ─────────────────────────────────────────────
// CSV export — pure client-side; uses Blob + ObjectURL so no server roundtrip.
// Quoting follows RFC 4180: wrap any field that contains commas, quotes, or
// newlines in double quotes, and double up any embedded quotes inside.
function exportTransactionsCSV(transactions) {
  const csvEscape = (val) => {
    const s = val == null ? "" : String(val);
    if (/[",\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  };
  const header = ["date", "category", "amount_dollars", "note"].join(",");
  // Sort newest-first for readability when opened in Excel/Sheets
  const rows = [...(transactions || [])]
    .sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0))
    .map((t) => [
      csvEscape(t.date || ""),
      csvEscape(t.category || ""),
      // Dollar amount with 2dp — converted from amount_cents to keep precision
      (window.toDollars(Number(t.amount_cents) || 0)).toFixed(2),
      csvEscape(t.note || ""),
    ].join(","));
  const csv = [header, ...rows].join("\r\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const today = new Date();
  const stamp = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, "0")}-${String(today.getDate()).padStart(2, "0")}`;
  a.href = url;
  a.download = `ledger-transactions-${stamp}.csv`;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 0);
}

function RecordTab({ hideSummary, hideHeader } = {}) {

  const [editing, setEditing] = useStateRec(null);

                style={{

                  color: canExport ? "var(--ink-2)" : "var(--ink-4)",

                Export CSV ({(transactions || []).length})

      {hideHeader && canExport && (

        <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: 8 }}>
          <button
            type="button"
            onClick={() => exportTransactionsCSV(transactions)}

            style={{
              fontSize: 12,

      {!hideSummary && <CurrentSummary transactions={transactions} />}

}
