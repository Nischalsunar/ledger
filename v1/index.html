<script type="text/babel" data-presets="react">
// Shared UI atoms (depend on React being loaded globally).
const { useState: useStateShared } = React;

const fmtUSD0 = (n) => {
  if (!isFinite(n)) return "—";
  const s = n < 0 ? "-" : "";
  return s + "$" + Math.abs(Math.round(n)).toLocaleString();
};
const fmtUSD2 = (n) => {
  if (!isFinite(n)) return "—";
  const s = n < 0 ? "-" : "";
  return s + "$" + Math.abs(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
};
const fmtPct = (n, d = 1) => (n * 100).toFixed(d) + "%";
// Expose for the math test suite + any cross-tab consumers
window.fmtUSD0 = fmtUSD0;
window.fmtUSD2 = fmtUSD2;
window.fmtPct = fmtPct;

// ── AutoSaveIndicator ─────────────────────────────────────────────────
// Watches a value via deep equality; shows "Saving…" briefly when it changes
// and "✓ Saved · Xs ago" otherwise. Drop this anywhere — pass any object/array.
function AutoSaveIndicator({ value, label = "Saved" }) {
  const [lastEditAt, setLastEditAt] = useStateShared(null);
  const [showSaving, setShowSaving] = useStateShared(false);
  const isFirst = React.useRef(true);
  const [, forceTick] = useStateShared(0);

  React.useEffect(() => {
    // First run after mount is the initial load — don't show "Saving"
    if (isFirst.current) { isFirst.current = false; return; }
    setShowSaving(true);
    setLastEditAt(Date.now());
    const t = setTimeout(() => setShowSaving(false), 700);
    return () => clearTimeout(t);
  }, [JSON.stringify(value)]);

  // Update the "X ago" label every 5s
  React.useEffect(() => {
    const id = setInterval(() => forceTick((n) => n + 1), 5000);
    return () => clearInterval(id);
  }, []);

  if (lastEditAt == null) {
    // No edits this session yet — show a neutral indicator so user knows it's wired
    return (
      <span className="autosave-pill autosave-idle" title="Edits auto-save to your browser + cloud as you type">
        Auto-save on
      </span>
    );
  }
  if (showSaving) {
    return <span className="autosave-pill autosave-saving">Saving…</span>;
  }
  const ago = Math.floor((Date.now() - lastEditAt) / 1000);
  const agoText = ago < 5 ? "just now" : ago < 60 ? `${ago}s ago` : `${Math.floor(ago/60)}m ago`;
  return (
    <span className="autosave-pill autosave-saved" title={`Last save: ${new Date(lastEditAt).toLocaleTimeString()}`}>
      ✓ {label} · {agoText}
    </span>
  );
}
window.AutoSaveIndicator = AutoSaveIndicator;

// ── Integer-cents money helpers (Section B) ────────────────────────────
// Use these inside long iterative loops (compound projection, debt sim) to
// avoid float drift. `toCents` is round-half-away-from-zero so $0.005 → 1¢.
// `toDollars` returns dollars as a float for the UI (display rounds via fmtUSD0).
function toCents(dollars) {
  if (!isFinite(dollars)) return 0;
  // Symmetric rounding: 0.005 → 1, -0.005 → -1
  return dollars < 0
    ? -Math.round(-dollars * 100)
    :  Math.round( dollars * 100);
}
function toDollars(cents) {
  if (!isFinite(cents)) return 0;
  return cents / 100;
}
window.toCents = toCents;
window.toDollars = toDollars;

const Field = ({ label, hint, children }) => (
  <label className="field">
    <div className="field-label">
      <span>{label}</span>
      {hint && <span className="field-hint">{hint}</span>}
    </div>
    {children}
  </label>
);

const Money = ({ value, onChange, placeholder, prefix = "$" }) => {
  const [focused, setFocused] = useStateShared(false);
  // While focused, keep the raw text the user is typing so partial values
  // like "5." or "5.0" don't get rewritten by Number() round-trips.
  const [localText, setLocalText] = useStateShared("");
  const display = focused
    ? localText
    : (value ? Number(value).toLocaleString() : "");
  return (
    <div className={"money-input" + (focused ? " is-focused" : "")}>
      <span className="money-prefix">{prefix}</span>
      <input
        type="text"
        inputMode="decimal"
        value={display}
        placeholder={placeholder}
        onFocus={() => { setFocused(true); setLocalText(value === 0 || value == null ? "" : String(value)); }}
        onBlur={() => setFocused(false)}
        onChange={(e) => {
          const raw = e.target.value.replace(/[^0-9.]/g, "");
          setLocalText(raw);
          // Only commit when the string is a parseable number; allow trailing "." while typing
          if (raw === "" || raw === ".") {
            onChange(0);
          } else {
            const n = Number(raw);
            if (isFinite(n)) onChange(n);
          }
        }}
      />
    </div>
  );
};

// CountUp — animates a number from its previous value to the new value over ~duration seconds.
// Uses framer-motion's animate() to drive smooth easing. Falls back to the static value
// if FM hasn't loaded yet.
const CountUp = ({ value, duration = 1, format = fmtUSD0, className, style }) => {
  const fm = (typeof window !== "undefined") && window.FramerMotion;
  const [display, setDisplay] = useStateShared(value || 0);
  const prevRef = React.useRef(0);
  React.useEffect(() => {
    if (!fm || !fm.animate) { setDisplay(value); prevRef.current = value; return; }
    const from = prevRef.current;
    const to = Number(value) || 0;
    if (from === to) { setDisplay(to); return; }
    const controls = fm.animate(from, to, {
      duration,
      ease: "easeOut",
      onUpdate: (v) => setDisplay(v),
    });
    return () => { controls.stop(); prevRef.current = to; };
  }, [value, duration]);
  return <span className={className} style={style}>{format(display)}</span>;
};

// NumberInput accepts an optional `min` prop. When set, any committed value
// is clamped to >= min. The negative-sign character is also stripped from
// the input regex when min >= 0, so the user can't even *type* a minus —
// the field rejects negatives both on input and on commit. Used to guard
// rate fields (APR, savings APY, growth assumptions) where a negative is
// physically meaningless and would silently break compound math downstream.
const NumberInput = ({ value, onChange, suffix, placeholder, step = 0.1, min }) => {
  const [focused, setFocused] = useStateShared(false);
  const [localText, setLocalText] = useStateShared("");
  const allowNegative = min == null || min < 0;
  // Strip floating-point noise (e.g. 0.07 * 100 = 7.000000000000001 → "7")
  const cleanNum = (n) => {
    if (n === null || n === undefined || n === "" || !isFinite(n)) return "";
    const rounded = Math.round(Number(n) * 1e10) / 1e10;
    return String(rounded);
  };
  const display = focused
    ? localText
    : (value || value === 0 ? cleanNum(value) : "");
  // Pick the regex based on whether negatives are allowed.
  const stripPattern = allowNegative ? /[^0-9.\-]/g : /[^0-9.]/g;
  return (
    <div className={"money-input" + (focused ? " is-focused" : "")}>
      <input
        type="text"
        inputMode="decimal"
        value={display}
        placeholder={placeholder}
        onFocus={() => { setFocused(true); setLocalText(value === 0 || value == null ? "" : cleanNum(value)); }}
        onBlur={() => setFocused(false)}
        onChange={(e) => {
          const raw = e.target.value.replace(stripPattern, "");
          setLocalText(raw);
          // Allow partial values like "5.", ".", "-" while typing without losing the decimal
          if (raw === "" || raw === "." || raw === "-" || raw === "-.") {
            onChange(min != null ? Math.max(min, 0) : 0);
          } else {
            const n = Number(raw);
            if (isFinite(n)) {
              onChange(min != null ? Math.max(min, n) : n);
            }
          }
        }}
      />
      {suffix && <span className="money-prefix" style={{marginRight: 0, marginLeft: 6}}>{suffix}</span>}
    </div>
  );
};

const Segment = ({ value, onChange, options }) => (
  <div className="segment">
    {options.map((o) => (
      <button
        key={o.value}
        className={"segment-btn" + (value === o.value ? " is-active" : "")}
        onClick={() => onChange(o.value)}
        type="button"
      >
        {o.label}
      </button>
    ))}
  </div>
);

// City autocomplete — typing filters US_CITIES, selecting fills city + state.
const CityAutocomplete = ({ city, state, onChange }) => {
  const [open, setOpen] = useStateShared(false);
  const [active, setActive] = useStateShared(0);
  const matches = React.useMemo(() => {
    const q = (city || "").trim().toLowerCase();
    if (!q) return [];
    const list = (typeof US_CITIES !== "undefined" ? US_CITIES : []);
    // Prefer prefix matches over substring matches
    const prefix = [], substr = [];
    for (const [name, st] of list) {
      const lc = name.toLowerCase();
      if (lc.startsWith(q))      prefix.push([name, st]);
      else if (lc.includes(q))   substr.push([name, st]);
      if (prefix.length >= 8) break;
    }
    return prefix.concat(substr).slice(0, 8);
  }, [city]);

  const pick = (name, st) => {
    onChange({ city: name, state: st });
    setOpen(false);
  };

  return (
    <div style={{ position: "relative" }}>
      <input
        type="text"
        className="text-input"
        placeholder="e.g. New York City"
        value={city}
        onChange={(e) => { onChange({ city: e.target.value }); setOpen(true); setActive(0); }}
        onFocus={() => setOpen(true)}
        onBlur={() => setTimeout(() => setOpen(false), 120)}
        onKeyDown={(e) => {
          if (!open || matches.length === 0) return;
          if (e.key === "ArrowDown") { e.preventDefault(); setActive((a) => Math.min(a + 1, matches.length - 1)); }
          else if (e.key === "ArrowUp")   { e.preventDefault(); setActive((a) => Math.max(a - 1, 0)); }
          else if (e.key === "Enter")     { e.preventDefault(); const m = matches[active]; if (m) pick(m[0], m[1]); }
          else if (e.key === "Escape")    { setOpen(false); }
        }}
        autoComplete="off"
      />
      {open && matches.length > 0 && (
        <ul className="ac-list">
          {matches.map(([name, st], i) => (
            <li
              key={name + st}
              className={"ac-item" + (i === active ? " is-active" : "")}
              onMouseDown={(e) => { e.preventDefault(); pick(name, st); }}
              onMouseEnter={() => setActive(i)}
            >
              <span className="ac-name">{name}</span>
              <span className="ac-state">{st}</span>
            </li>
          ))}
        </ul>
      )}
    </div>
  );
};

const Toggle = ({ value, onChange, label, hint }) => (

// Address autocomplete — debounced Nominatim search. US-only by default.
// onChange receives (value, coords?) — coords is { lat, lon, display } when picked from list.
// biasCoords optionally biases results toward a location (e.g. home for work field).
const AddressAutocomplete = ({ value, onChange, placeholder, biasCoords }) => {
  const [matches, setMatches] = useStateShared([]);
  const [open, setOpen] = useStateShared(false);
  const [active, setActive] = useStateShared(0);
  const [loading, setLoading] = useStateShared(false);
  const abortRef = React.useRef(null);
  const timerRef = React.useRef(null);
  const lastQueryRef = React.useRef("");

  const fetchSuggestions = (q) => {
    if (abortRef.current) abortRef.current.abort();
    if (!q || q.trim().length < 3) {
      setMatches([]);
      setLoading(false);
      return;
    }
    const ctrl = new AbortController();
    abortRef.current = ctrl;
    lastQueryRef.current = q;
    setLoading(true);
    // Updated to pull more results, include extra tags, and prefer importance ranking.
    let url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=8&countrycodes=us&addressdetails=1&extratags=1&namedetails=1&dedupe=1`;
    if (biasCoords && Number.isFinite(biasCoords.lat)) {
      const r = 0.75; // roughly ~50 mi in latitude degrees
      const bb = `${biasCoords.lon - r},${biasCoords.lat + r},${biasCoords.lon + r},${biasCoords.lat - r}`;
      url += `&viewbox=${bb}&bounded=0`;
    }
    fetch(url, { signal: ctrl.signal, headers: { "Accept-Language": "en" } })
      .then((r) => r.json())
      .then((data) => {
        if (lastQueryRef.current !== q) return; // stale
        // Rank: prefer addresses with house number, then named places, then admin areas
        const ranked = (data || []).slice().sort((a, b) => {
          const ax = (a.address?.house_number ? 3 : 0) + (a.address?.road ? 1 : 0) + Number(a.importance || 0);
          const bx = (b.address?.house_number ? 3 : 0) + (b.address?.road ? 1 : 0) + Number(b.importance || 0);
          return bx - ax;
        });
        setMatches(ranked.slice(0, 6));
        setLoading(false);
      })
      .catch((e) => {
        if (e.name !== "AbortError") setLoading(false);
      });
  };

  const onInput = (val) => {
    onChange(val, null); // clear coords when user types
    setOpen(true);
    setActive(0);
    clearTimeout(timerRef.current);
    // Snappier search — was 420ms, now 250ms
    timerRef.current = setTimeout(() => fetchSuggestions(val), 250);
  };

  const pick = (m) => {
    onChange(m.display_name, {
      lat: parseFloat(m.lat),
      lon: parseFloat(m.lon),
      display: m.display_name,
    });
    setMatches([]);
    setOpen(false);
  };

  const fmtMatch = (m) => {
    const a = m.address || {};
    const place = a.city || a.town || a.village || a.hamlet || a.county || "";
    const st    = a.state || "";
    const label = m.display_name;
    // First two segments are the most specific (name + street), last two are city/state.
    const parts = label.split(",").map((s) => s.trim());
    const primary = parts.slice(0, 2).join(", ");
    return { primary, place, st, parts };
  };

  // Show a horizontal-scrolling preview of the full selected address below the input
  // (so long lines like "University at Buffalo, 12, Town of Amherst, Erie County..." stay readable).
  const hasFull = value && value.length > 0;
  return (
    <div style={{ position: "relative" }}>
      <input
        type="text"
        className="text-input addr-input"
        placeholder={placeholder}
        value={value || ""}
        onChange={(e) => onInput(e.target.value)}
        onFocus={() => { if (matches.length > 0) setOpen(true); }}
        onBlur={() => setTimeout(() => setOpen(false), 150)}
        onKeyDown={(e) => {
          if (!open || matches.length === 0) return;
          if (e.key === "ArrowDown")      { e.preventDefault(); setActive((a) => Math.min(a + 1, matches.length - 1)); }
          else if (e.key === "ArrowUp")   { e.preventDefault(); setActive((a) => Math.max(a - 1, 0)); }
          else if (e.key === "Enter")     { e.preventDefault(); if (matches[active]) pick(matches[active]); }
          else if (e.key === "Escape")    { setOpen(false); }
        }}
        autoComplete="off"
        title={value || ""}
      />
      {hasFull && value.length > 32 && (
        <div className="addr-full" title={value}>
          <span className="addr-full-label">Selected:</span>
          <span className="addr-full-text">{value}</span>
        </div>
      )}
      {open && (matches.length > 0 || loading) && (
        <ul className="ac-list ac-list-addr">
          {loading && matches.length === 0 && (
            <li className="ac-item" style={{ color: "var(--ink-3)", fontStyle: "italic" }}>Searching…</li>
          )}
          {matches.map((m, i) => {
            const f = fmtMatch(m);
            return (
              <li
                key={m.place_id}
                className={"ac-item ac-item-addr" + (i === active ? " is-active" : "")}
                onMouseDown={(e) => { e.preventDefault(); pick(m); }}
                onMouseEnter={() => setActive(i)}
                title={m.display_name}
              >
                <div className="ac-primary">{f.primary}</div>
                {(f.place || f.st) && (
                  <div className="ac-secondary">{[f.place, f.st].filter(Boolean).join(", ")}</div>
                )}
              </li>
            );
          })}
        </ul>
      )}
    </div>
  );
};

Object.assign(window, {
  fmtUSD0, fmtUSD2, fmtPct,
  Field, Money, NumberInput, Segment, CityAutocomplete, Toggle, AddressAutocomplete,
  CountUp,
});

<script type="text/babel" data-presets="react">
// Transactions data module.
//
// THE ONLY code in the app that touches the `ledger:transactions` key.
// Other tabs (Record, Current summary) consume via getAll() and mutate via
// add() / edit() / remove(). The persistent format is an array of:
//   { id, amount_cents, category, date, note }
//     id            — stable unique integer (timestamp-derived)
//     amount_cents  — INTEGER cents (use window.toCents to convert from dollars)
//     category      — short string ("Groceries", "Gas", …)
//     date          — ISO "YYYY-MM-DD"
//     note          — optional string
//
// Persistence: localStorage. The auth.jsx namespace shim transparently
// rewrites the key to ledger:u:{email}:transactions, and the Firestore
// mirror in firebase-sync.jsx pushes it to users/{uid}/data/transactions
// on every write — so cross-device sync via Google sign-in is automatic.
//
// Reactivity: every write dispatches a `ledger:transactions:changed`
// CustomEvent on window. Consumers subscribe via the React hook below
// (useTransactions) so they re-render when the data changes — including
// when a different browser tab in the same session writes.

(function buildTransactionsModule() {
  const KEY = "ledger:transactions";
  const EVT = "ledger:transactions:changed";

  // ── Internal read/write — only these two touch localStorage ──
  function _readRaw() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return [];
      const parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : [];
    } catch { return []; }
  }
  function _writeRaw(list) {
    try {
      localStorage.setItem(KEY, JSON.stringify(list));
      // Fire on next tick so React state update completes first
      setTimeout(() => window.dispatchEvent(new CustomEvent(EVT, { detail: list })), 0);
    } catch (e) {
      console.warn("[transactions] write failed:", e.message);
    }
  }

  // ── Validation ──
  function _normalize(rec) {
    const id = (rec && rec.id) || Date.now() + Math.floor(Math.random() * 1000);
    const amount_cents = Math.max(0, Math.round(Number(rec?.amount_cents) || 0));
    const category = String(rec?.category || "Uncategorized").trim() || "Uncategorized";
    const date = (() => {
      const d = rec?.date;
      if (typeof d === "string" && /^\d{4}-\d{2}-\d{2}$/.test(d)) return d;
      // Default to today (local timezone — matches Auto/Debt date defaults)
      const t = new Date();
      return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, "0")}-${String(t.getDate()).padStart(2, "0")}`;
    })();
    const note = rec?.note ? String(rec.note).slice(0, 500) : "";
    return { id, amount_cents, category, date, note };
  }

  // ── Public API ──
  const Transactions = {
    /** Returns the full transaction list (a fresh array — safe to mutate the copy). */
    getAll() {
      return _readRaw().slice();
    },

    /** Add one transaction. Returns the normalized record (with generated id). */
    add(rec) {
      const list = _readRaw();
      const next = _normalize(rec);
      list.push(next);
      _writeRaw(list);
      return next;
    },

    /** Patch an existing transaction by id. Returns updated record or null if not found. */
    edit(id, patch) {
      const list = _readRaw();
      const idx = list.findIndex((t) => t.id === id);
      if (idx === -1) return null;
      const merged = _normalize({ ...list[idx], ...patch, id: list[idx].id });
      list[idx] = merged;
      _writeRaw(list);
      return merged;
    },

    /** Delete by id. Returns true if anything was removed. */
    remove(id) {
      const list = _readRaw();
      const next = list.filter((t) => t.id !== id);
      if (next.length === list.length) return false;
      _writeRaw(next);
      return true;
    },

    /** Replace the entire list (used by tests + future bulk-import). */
    _setAll(list) {
      _writeRaw(Array.isArray(list) ? list.map(_normalize) : []);
    },

    EVT_CHANGED: EVT,
  };

  window.Transactions = Transactions;

  // ── Pure analytics helpers (read-only) ──
  // Not part of the storage API — these compute derived views from a list.
  // Keeping them on the module so Current/Projection consume one canonical source.
  Transactions.totalCents = function (list) {
    if (!Array.isArray(list)) return 0;
    return list.reduce((a, t) => a + (Number(t?.amount_cents) || 0), 0);
  };

  Transactions.byCategory = function (list) {
    const out = {};
    if (!Array.isArray(list)) return out;
    for (const t of list) {
      const cat = t?.category || "Uncategorized";
      out[cat] = (out[cat] || 0) + (Number(t?.amount_cents) || 0);
    }
    return out;
  };

  Transactions.byDay = function (list) {
    const map = new Map();
    if (!Array.isArray(list)) return [];
    for (const t of list) {
      const day = t?.date || "0000-00-00";
      if (!map.has(day)) map.set(day, { date: day, total_cents: 0, items: [] });
      const bucket = map.get(day);
      bucket.items.push(t);
      bucket.total_cents += Number(t?.amount_cents) || 0;
    }
    // Newest day first
    return Array.from(map.values()).sort((a, b) => (a.date < b.date ? 1 : -1));
  };

  Transactions.monthTotalCents = function (list, yyyyMm) {
    if (!Array.isArray(list) || !yyyyMm) return 0;
    return list.reduce((a, t) =>
      (t?.date || "").startsWith(yyyyMm) ? a + (Number(t?.amount_cents) || 0) : a, 0);
  };
})();

// ── React hook ───────────────────────────────────────────────────────────
// Subscribes a component to transaction-list changes. Returns the current
// list and re-renders whenever any add/edit/remove fires.
const { useState: useStateTx, useEffect: useEffectTx, useCallback: useCallbackTx } = React;

function useTransactions() {
  const [list, setList] = useStateTx(() => window.Transactions.getAll());
  useEffectTx(() => {
    const handler = () => setList(window.Transactions.getAll());
    window.addEventListener(window.Transactions.EVT_CHANGED, handler);
    // Also re-read on storage events (other tabs in the same browser)
    const storageHandler = (e) => {
      if (e.key && e.key.endsWith(":transactions")) setList(window.Transactions.getAll());
    };
    window.addEventListener("storage", storageHandler);
    return () => {
      window.removeEventListener(window.Transactions.EVT_CHANGED, handler);
      window.removeEventListener("storage", storageHandler);
    };
  }, []);
  return list;
}

window.useTransactions = useTransactions;

</script>

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

</script>

};

const THEME_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "forest",
  "displayFont": "serif",
  "accentOverride": ""
}/*EDITMODE-END*/;

function applyTheme(themeKey, accentOverride, fontKey) {
  const t = THEMES[themeKey] || THEMES.forest;
  const root = document.documentElement;
  for (const [k, v] of Object.entries(t.vars)) {
    root.style.setProperty(k, v);
  }
  if (accentOverride && /^#[0-9A-Fa-f]{6}$/.test(accentOverride)) {
    root.style.setProperty("--accent", accentOverride);
    // derive lighter/darker variants
    root.style.setProperty("--accent-2", lighten(accentOverride, 18));
    root.style.setProperty("--accent-dim", darken(accentOverride, 30));
    root.style.setProperty("--accent-bg", darken(accentOverride, 60) + "33");
  }
  const font = FONT_OPTIONS[fontKey] || FONT_OPTIONS.serif;
  root.style.setProperty("--display", font.display);
}

function lighten(hex, pct) { return shiftHex(hex, pct); }
function darken(hex, pct)  { return shiftHex(hex, -pct); }
function shiftHex(hex, pct) {
  const num = parseInt(hex.slice(1), 16);
  let r = (num >> 16) & 0xff;
  let g = (num >> 8)  & 0xff;
  let b = num & 0xff;
  const amt = (pct / 100) * 255;
  r = Math.max(0, Math.min(255, Math.round(r + amt)));
  g = Math.max(0, Math.min(255, Math.round(g + amt)));
  b = Math.max(0, Math.min(255, Math.round(b + amt)));
  return "#" + ((r << 16) | (g << 8) | b).toString(16).padStart(6, "0");
}

<script type="text/babel" data-presets="react">
// Commute & vehicle card: addresses -> driving distance -> monthly gas cost.
// Uses Nominatim + Photon (free, no key) with smart fallbacks. Manual override available.
const { useState: useStateCommute, useMemo: useMemoCommute } = React;

const M_PER_MILE = 1609.344;

// Expand common US street abbreviations so the geocoder finds more matches.
function expandAbbrev(s) {
  return s
    .replace(/\bvlg\b\.?/gi,  "village")
    .replace(/\bblvd\b\.?/gi, "boulevard")
    .replace(/\bst\b\.?/gi,   "street")
    .replace(/\bave\b\.?/gi,  "avenue")
    .replace(/\bdr\b\.?/gi,   "drive")
    .replace(/\bln\b\.?/gi,   "lane")
    .replace(/\brd\b\.?/gi,   "road")
    .replace(/\bct\b\.?/gi,   "court")
    .replace(/\bpl\b\.?/gi,   "place")
    .replace(/\bpkwy\b\.?/gi, "parkway")
    .replace(/\bhwy\b\.?/gi,  "highway")
    .replace(/\bapt\b\.?\s*[\w-]*/gi, "")
    .replace(/\bste\b\.?\s*[\w-]*/gi, "")
    .replace(/\bunit\b\.?\s*[\w-]*/gi, "")
    .replace(/#\s*[\w-]+/g, "")
    .replace(/\s+/g, " ")
    .trim();
}

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

async function nominatimSearch(q) {
  const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=1&countrycodes=us&addressdetails=0`;
  const r = await fetch(url, { headers: { "Accept-Language": "en" } });
  if (!r.ok) return null;
  const data = await r.json();
  if (!data || data.length === 0) return null;
  return { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon), display: data[0].display_name, source: "OSM" };
}

async function photonSearch(q) {
  const url = `https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&limit=1&lang=en`;
  const r = await fetch(url);
  if (!r.ok) return null;
  const data = await r.json();
  const f = data?.features?.[0];
  if (!f) return null;
  const [lon, lat] = f.geometry.coordinates;
  const p = f.properties || {};
  const parts = [p.name, p.street, p.city, p.state, p.postcode].filter(Boolean);
  return { lat, lon, display: parts.join(", ") || (p.name || q), source: "Photon" };
}

// Try a query through multiple geocoders + simplification fallbacks.
async function geocodeWithFallbacks(query) {
  const tried = new Set();
  const candidates = [];

  const add = (q) => {
    const k = q.trim().toLowerCase();
    if (k && !tried.has(k)) { tried.add(k); candidates.push(q.trim()); }
  };

  add(query);
  add(expandAbbrev(query));
  // strip leading unit/door number ("210 Southlake..." -> "Southlake...")
  const noLeadingNum = query.replace(/^\s*\d+[a-z]?\s+/i, "");
  add(noLeadingNum);
  add(expandAbbrev(noLeadingNum));

  for (const q of candidates) {
    const hit = await nominatimSearch(q);
    if (hit) return hit;
    await sleep(1100); // Nominatim usage policy
  }
  // Photon fallback for the strongest candidate
  for (const q of [query, expandAbbrev(query), noLeadingNum].filter(Boolean)) {
    const hit = await photonSearch(q);
    if (hit) return hit;
  }
  throw new Error(`Could not find: "${query}". Try a simpler form, or use "Enter distance manually" below.`);
}

async function osrmRoute(a, b) {
  const url = `https://router.project-osrm.org/route/v1/driving/${a.lon},${a.lat};${b.lon},${b.lat}?overview=false`;
  const r = await fetch(url);
  if (!r.ok) throw new Error(`Routing error (${r.status})`);
  const data = await r.json();
  const route = data?.routes?.[0];
  if (!route) throw new Error("No driving route between those addresses.");
  return { meters: route.distance, seconds: route.duration };
}

async function lookupCommute(home, work, homeCoords, workCoords) {
  const a = homeCoords && Number.isFinite(homeCoords.lat) ? homeCoords : await geocodeWithFallbacks(home);
  if (!homeCoords) await sleep(300);
  const b = workCoords && Number.isFinite(workCoords.lat) ? workCoords : await geocodeWithFallbacks(work);
  const route = await osrmRoute(a, b);
  return {
    oneWayMiles: route.meters / M_PER_MILE,
    driveMinutes: route.seconds / 60,
    homeResolved: a.display || home,
    workResolved: b.display || work,
  };
}

};

async function fetchLiveGasPrice(state, grade) {
  if (!window.claude || typeof window.claude.complete !== "function") {
    return { price: (GAS_PRICES_BY_STATE[state] || 3.10) + GRADE_OFFSETS[grade], source: "estimate" };
  }
  try {
    const stateName = (window.STATE_NAMES || {})[state] || state;
    const gradeLabel = grade === "regular" ? "regular unleaded (87 octane)"
                     : grade === "midgrade" ? "mid-grade unleaded (89 octane)"
                     : "premium unleaded (91-93 octane)";
    const reply = await window.claude.complete(
      `What's the current average retail price per gallon for ${gradeLabel} gasoline in the US state of ${stateName}? Respond with ONLY the number in US dollars, like "3.45". No dollar sign, no words, no explanation.`
    );
    const m = String(reply).match(/(\d+\.\d+|\d+)/);
    if (m) {
      const n = parseFloat(m[1]);
      if (n > 1.5 && n < 8) return { price: n, source: "AI lookup" };
    }
  } catch (e) { /* ignore, use fallback */ }
  return { price: (GAS_PRICES_BY_STATE[state] || 3.10) + GRADE_OFFSETS[grade], source: "estimate" };
}

function computeMonthlyGas(commute) {
  // Daily round-trip distance — user can override the auto-computed value from route.
  const dailyRoundTrip = commute.dailyRoundTrip != null && commute.dailyRoundTrip > 0
    ? commute.dailyRoundTrip
    : (commute.oneWayMiles || 0) * 2;
  const dailyTotal = dailyRoundTrip + (commute.extraMilesPerDay || 0);
  const workdays = commute.workdaysPerMonth || 22;
  const mpg = commute.mpg || 1;
  const gasPrice = commute.gasPrice || 0;

  // Core formula:  cost = workdays × (distance / mpg) × gasPrice
  const monthlyMiles = dailyTotal * workdays;
  const gallons = monthlyMiles / mpg;
  const cost = gallons * gasPrice;

  const dailyGallons = dailyTotal / mpg;
  const dailyCost = dailyGallons * gasPrice;
  const dailyMinutes = (commute.driveMinutes || 0) * 2;
  const weekdaysPerWeek = workdays / 4.33;
  const weekly = {
    miles:   dailyTotal * weekdaysPerWeek,
    minutes: dailyMinutes * weekdaysPerWeek,
    cost:    dailyCost * weekdaysPerWeek,
    gallons: (dailyTotal * weekdaysPerWeek) / mpg,
  };
  const monthly = {
    miles:   monthlyMiles,
    minutes: dailyMinutes * workdays,
    cost,
    gallons,
  };
  const yearly = {
    miles:   monthlyMiles * 12,
    minutes: dailyMinutes * workdays * 12,
    cost:    cost * 12,
    gallons: gallons * 12,
  };
  const daily = {
    miles:   dailyTotal,
    minutes: dailyMinutes,
    cost:    dailyCost,
    gallons: dailyGallons,
  };
  return {
    dailyRoundTrip, dailyTotal, dailyGallons, dailyCost, dailyMinutes,
    monthlyMiles, gallons, cost,
    daily, weekly, monthly, yearly,
  };
}

const fmtMins = (m) => {
  if (!m || m <= 0) return "0 min";
  if (m < 60) return Math.round(m) + " min";
  const h = Math.floor(m / 60);
  const rem = Math.round(m % 60);
  return rem === 0 ? `${h}h` : `${h}h ${rem}m`;
};

        gasLoading: false,

    })();

      const res = await lookupCommute(
        commute.homeAddr, commute.workAddr,
        commute.homeCoords, commute.workCoords,

        status: "ok",
        oneWayMiles: res.oneWayMiles,
        driveMinutes: res.driveMinutes,
        homeResolved: res.homeResolved,
        workResolved: res.workResolved,

  return (

        </h2>
        {calc.cost > 0 && <span className="card-tag">{fmtUSD0(calc.cost)}/mo gas</span>}
      </header>
      {open && <div className="card-body stack">
        {!manualMode && (
          <>
            <Field label="Home address">
              <AddressAutocomplete
                value={commute.homeAddr}
                onChange={(v, coords) => upd({ homeAddr: v, homeCoords: coords, status: "idle" })}
                placeholder="123 Main St, Buffalo, NY"
              />
            </Field>
            <Field label="Work address">
              <AddressAutocomplete
                value={commute.workAddr}
                onChange={(v, coords) => upd({ workAddr: v, workCoords: coords, status: "idle" })}

                biasCoords={commute.homeCoords}
              />
            </Field>

            <button
              className="btn-primary"
              onClick={doLookup}
              disabled={commute.status === "loading"}
            >
              {commute.status === "loading" ? "Looking up route…" : "Calculate commute distance"}
            </button>

            {commute.status === "error" && (
              <div className="alert alert-error">{commute.error}</div>
            )}

            {commute.status === "ok" && commute.oneWayMiles > 0 && (
              <>
                <div className="period-toggle">
                  {[["daily","Daily"], ["weekly","Weekly"], ["monthly","Monthly"], ["yearly","Yearly"]].map(([k, label]) => (
                    <button

                          <div className="route-stat-num">{fmtMins(p.minutes)}</div>

                        <div className="route-stat">
                          <div className="route-stat-num">{fmtUSD0(p.cost)}</div>

                {commute.oneWayMiles > 100 && (
                  <div className="alert alert-warn">

                    location far away (check the resolved addresses below). Try one of these:
                    <div style={{ display: "flex", gap: 8, marginTop: 10, flexWrap: "wrap" }}>
                      <button

                          workAddr: "", workCoords: null,

                          homeResolved: "", workResolved: "",

                        })}
                      >↻ Clear & re-pick work address</button>
                      <button
                        className="btn-link"
                        style={{ color: "var(--accent-2)" }}
                        onClick={() => upd({ manual: true })}

                    </div>
                  </div>
                )}

                <div className="route-resolved">
                  <div className="route-resolved-row">
                    <span className="route-resolved-label">FROM</span>
                    <span className="route-resolved-val">{commute.homeResolved || commute.homeAddr}</span>
                  </div>
                  <div className="route-resolved-row">
                    <span className="route-resolved-label">TO</span>
                    <span className="route-resolved-val">{commute.workResolved || commute.workAddr}</span>
                  </div>
                </div>
              </>
            )}

            <button
              className="btn-link"
              onClick={() => upd({ manual: true, status: "idle", error: "" })}
            >
              Can't find your address? → Enter distance manually
            </button>
          </>
        )}

        {manualMode && (
          <>
            <div className="alert alert-info">
              Look up the distance on <a href={`https://www.google.com/maps/dir/${encodeURIComponent(commute.homeAddr || "")}/${encodeURIComponent(commute.workAddr || "")}`} target="_blank" rel="noopener">Google Maps</a> and paste the numbers below.
            </div>
            <div className="row-2">
              <Field label="One-way miles">
                <NumberInput
                  value={commute.oneWayMiles}

                  suffix="mi"
                />
              </Field>
              <Field label="Drive time">
                <NumberInput
                  value={commute.driveMinutes}
                  onChange={(v) => upd({ driveMinutes: v, status: "ok" })}
                  suffix="min"
                />
              </Field>
            </div>
            <button
              className="btn-link"
              onClick={() => upd({ manual: false, status: "idle" })}
            >
              ← Back to address lookup
            </button>
          </>
        )}

        <div className="divider" />

        <Field label="Daily round-trip distance" hint={commute.status === "ok" && commute.oneWayMiles > 0 ? "auto-filled · editable" : "miles you drive to work each day, round trip"}>
          <NumberInput
            value={commute.dailyRoundTrip || 0}
            onChange={(v) => upd({ dailyRoundTrip: v })}
            suffix="mi"
          />
        </Field>

        <Field label="Gas grade">
          <Segment
            value={commute.gasGrade || "regular"}
            onChange={(g) => upd({ gasGrade: g, gasSource: null })}
            options={[
              { value: "regular", label: "Regular" },
              { value: "premium", label: "Premium" },
            ]}
          />
        </Field>

        <div className="row-2">
          <Field
            label="Gas price"
            hint={
              commute.gasLoading ? "looking up…"
              : commute.gasSource === "manual" ? "manual"
              : commute.gasSource === "AI lookup" ? `today · ${commute.gasFetchedAt || ""}`
              : commute.gasSource === "estimate" ? `est. · ${commute.gasFetchedAt || ""}`
              : "$/gal"
            }
          >
            <div style={{ display: "flex", gap: 6 }}>
              <NumberInput value={commute.gasPrice} onChange={(v) => upd({ gasPrice: v, gasSource: "manual" })} suffix="$" />

                  upd({ gasLoading: true });

                  upd({
                    gasPrice: parseFloat(res.price.toFixed(2)),
                    gasSource: res.source,
                    gasFetchedAt: new Date().toLocaleDateString("en-US", { month: "short", day: "numeric" }),
                    gasLoading: false,
                  });
                }}

                {commute.gasLoading ? "…" : "↻"}

          </Field>

              </div>
              <div className="formula-line subtle">
                <span>+ Other miles per day</span>
                <span className="num">{(commute.extraMilesPerDay || 0).toFixed(1)} mi</span>
              </div>
              <div className="formula-line formula-eq">
                <span>Total distance / day</span>

            </div>

            <div className="formula-step">
              <div className="formula-line">
                <span>Gallons / day</span>
                <span className="num">{calc.dailyGallons.toFixed(2)} gal</span>

              </div>

            <div className="formula-step">
              <div className="formula-line">
                <span>Gas cost / day</span>
                <span className="num">{fmtUSD2(calc.dailyCost)}</span>
              </div>
              <div className="formula-hint">
                = {calc.dailyGallons.toFixed(2)} gal × ${commute.gasPrice}/gal
              </div>
            </div>

            <div className="formula-step formula-total-step">
              <div className="formula-line">
                <span>Monthly gas cost</span>
                <span className="num formula-total">{fmtUSD0(calc.cost)}</span>
              </div>
              <div className="formula-hint">
                = {fmtUSD2(calc.dailyCost)}/day × {commute.workdaysPerMonth} workdays
              </div>
            </div>
          </div>
        )}

        {calc.cost > 0 && (
          <div className="sync-status">
            <span className="sync-check">✓</span>
            <span>Gas expense auto-synced to <strong>{fmtUSD0(calc.cost)}/mo</strong></span>
          </div>
        )}
      </div>}
    </section>
  );
}

Object.assign(window, { CommuteCard, computeMonthlyGas, lookupCommute });

<script type="text/babel" data-presets="react">
// Floating AI assistant.
// Calls the Anthropic Messages API directly from the browser using a user-supplied API key
// (no backend required). Falls back to a host-provided `window.claude.complete` bridge if
// one exists (e.g. in the Anthropic design tool that originally hosted this prototype).
const { useState: useStateAI, useEffect: useEffectAI, useRef: useRefAI } = React;

const ANTHROPIC_URL = "https://api.anthropic.com/v1/messages";
const KEY_STORAGE   = "ledger:anthropicKey";
const MODEL_STORAGE = "ledger:anthropicModel";

const SYSTEM_PROMPT = (ctx) => `You are Ledger's built-in finance assistant. The user is exploring a personal finance calculator. Be warm, concise (2–4 sentences max unless they ask for detail), and use plain language — no jargon. Give specific, actionable answers grounded in the data below. Do NOT recite the data back unless asked. If asked something outside personal finance, briefly redirect.

USER'S CURRENT DATA:
${ctx}`;

function buildContext({ profile, expenses, growth, commute, tax }) {
  const lines = [];
  lines.push(`• Salary: $${profile.salary.toLocaleString()}/yr, ${profile.filing === "married" ? "married filing jointly" : "single"}, in ${profile.city ? profile.city + ", " : ""}${profile.state}`);
  if (tax) {
    lines.push(`• Estimated take-home: $${Math.round(tax.takeHome).toLocaleString()}/yr ($${Math.round(tax.takeHome/12).toLocaleString()}/mo) at ${(tax.effectiveRate*100).toFixed(1)}% effective tax rate`);
    lines.push(`  - Federal $${Math.round(tax.federal).toLocaleString()}, State $${Math.round(tax.stateTax+tax.cityTax).toLocaleString()}, FICA $${Math.round(tax.fica).toLocaleString()}`);
  }
  const totalMo = (window.sumExpenses ? window.sumExpenses(expenses) : Object.values(expenses).filter(v => typeof v === "number").reduce((a,b)=>a+b,0));
  lines.push(`• Monthly expenses ($${Math.round(totalMo).toLocaleString()}/mo total):`);
  const rentShare = window.expenseShare ? window.expenseShare(expenses, "rent") : (expenses.rent || 0);
  const utilShare = window.expenseShare ? window.expenseShare(expenses, "utilities") : (expenses.utilities || 0);
  const groceries = expenses.groceries != null ? expenses.groceries : (expenses.expenses || 0);
  const rentNote = (Number(expenses.rentSplit) || 1) > 1 ? ` (your share, ${expenses.rentSplit}-way split of $${expenses.rent})` : "";
  const utilNote = (Number(expenses.utilitiesSplit) || 1) > 1 ? ` (your share, ${expenses.utilitiesSplit}-way split of $${expenses.utilities})` : "";
  lines.push(`  - Rent $${rentShare}${rentNote}, Groceries $${groceries}, Utilities $${utilShare}${utilNote}, Insurance $${expenses.carIns}, Transportation $${expenses.gas}, Loans $${expenses.otherLoan}`);
  const sec = expenses.secondary || [];
  const subs = expenses.subscriptions || [];
  if (sec.length)  lines.push(`  - Secondary (wants): ${sec.map(i => `${i.name} $${i.amount}`).join(", ")}`);
  if (subs.length) lines.push(`  - Subscriptions: ${subs.map(i => `${i.name} $${i.amount}`).join(", ")}`);
  if (commute && commute.oneWayMiles > 0) {
    lines.push(`• Commute: ${commute.oneWayMiles.toFixed(1)} mi one-way (${Math.round(commute.driveMinutes)} min), ${commute.mpg} mpg, $${commute.gasPrice}/gal, ${commute.workdaysPerMonth} workdays/mo`);
  }
  if (growth) {
    lines.push(`• Growth assumptions: salary +${(growth.salary*100).toFixed(1)}%/yr, rent +${(growth.rent*100).toFixed(1)}%, expenses +${(growth.expenses*100).toFixed(1)}%`);
  }
  if (tax) {
    const leftover = tax.takeHome - totalMo*12;
    lines.push(`• Annual leftover after expenses: $${Math.round(leftover).toLocaleString()} (${leftover>=0?"surplus":"deficit"})`);
  }
  return lines.join("\n");
}

const SUGGESTED = [
  "Am I spending too much on rent?",
  "How much should I save each month?",
  "Can I afford a $30k car?",
  "What's a good emergency fund for me?",
];

// Direct browser call to Anthropic Messages API.
// Requires `anthropic-dangerous-direct-browser-access: true` header — that's the Anthropic-sanctioned
// way to call the API from a browser when you can't run a backend proxy.
async function callAnthropic({ apiKey, model, system, messages }) {
  const r = await fetch(ANTHROPIC_URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({
      model: model || DEFAULT_MODEL,
      max_tokens: 1024,
      system,
      messages,
    }),
  });
  if (!r.ok) {
    let detail = "";
    try { const j = await r.json(); detail = j.error?.message || JSON.stringify(j); } catch {}
    throw new Error(`API ${r.status}: ${detail || r.statusText}`);
  }
  const data = await r.json();
  // content is an array of blocks; pull the first text block
  const textBlock = (data.content || []).find((c) => c.type === "text");
  return textBlock?.text || "(no response)";
}

function AISettings({ open, apiKey, model, onSave, onClose }) {
  const [draftKey, setDraftKey] = useStateAI(apiKey || "");
  const [draftModel, setDraftModel] = useStateAI(model || DEFAULT_MODEL);

  if (!open) return null;
  return (
    <div className="ai-settings-overlay" onClick={onClose}>
      <div className="ai-settings" onClick={(e) => e.stopPropagation()}>
        <div className="ai-settings-head">
          <h3>Connect to Claude</h3>
          <button className="ai-close" onClick={onClose}>×</button>
        </div>
        <div className="ai-settings-body">

            Paste your Anthropic API key below. The key is stored only in your browser (localStorage)

          </p>

            <li>Go to <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noreferrer">console.anthropic.com → API Keys</a></li>
            <li>Create a key (starts with <code>sk-ant-</code>)</li>

            ))}

          <div className="ai-settings-warn">

          </div>

              <button className="btn-ghost" onClick={() => { onSave({ apiKey: "", model: draftModel }); onClose(); }}>

            <button className="btn-primary" onClick={() => { onSave({ apiKey: draftKey, model: draftModel }); onClose(); }}>

}

function AIAssistant({ getData }) {
  const [open, setOpen] = useStateAI(false);
  const [messages, setMessages] = useStateAI([]);
  const [input, setInput] = useStateAI("");
  const [loading, setLoading] = useStateAI(false);
  const [settingsOpen, setSettingsOpen] = useStateAI(false);
  const [apiKey, setApiKey] = useStateAI(() => { try { return localStorage.getItem(KEY_STORAGE) || ""; } catch { return ""; } });
  const [model, setModel] = useStateAI(() => { try { return localStorage.getItem(MODEL_STORAGE) || DEFAULT_MODEL; } catch { return DEFAULT_MODEL; } });
  const scrollRef = useRefAI(null);
  const inputRef = useRefAI(null);

  useEffectAI(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [messages, loading]);

  useEffectAI(() => {
    if (open && inputRef.current) inputRef.current.focus();
  }, [open]);

  const saveSettings = ({ apiKey: k, model: m }) => {
    setApiKey(k); setModel(m);
    try {
      if (k) localStorage.setItem(KEY_STORAGE, k); else localStorage.removeItem(KEY_STORAGE);
      localStorage.setItem(MODEL_STORAGE, m);
    } catch {}
  };

  // Prefer the host-provided bridge if available (legacy/design-tool mode), otherwise direct API
  const haveHostBridge = typeof window !== "undefined" && window.claude && typeof window.claude.complete === "function";
  const haveKey = !!apiKey;
  const canChat = haveHostBridge || haveKey;

  const send = async (text) => {
    const userText = (text ?? input).trim();
    if (!userText || loading) return;

    if (!canChat) {
      setSettingsOpen(true);
      return;
    }

    const newHistory = [...messages, { role: "user", content: userText }];
    setMessages(newHistory);
    setInput("");
    setLoading(true);

    const ctx = buildContext(getData());

    try {
      let reply;
      if (haveHostBridge) {
        // Legacy bridge format
        const conv = [
          { role: "user",      content: SYSTEM_PROMPT(ctx) },
          { role: "assistant", content: "Got it — what would you like to know?" },
          ...newHistory.map((m) => ({ role: m.role, content: m.content })),
        ];
        reply = await window.claude.complete({ messages: conv });
      } else {
        // Direct Anthropic API call from the browser
        reply = await callAnthropic({
          apiKey,
          model,
          system: SYSTEM_PROMPT(ctx),
          messages: newHistory.map((m) => ({ role: m.role, content: m.content })),
        });
      }
      setMessages([...newHistory, { role: "assistant", content: reply }]);
    } catch (e) {
      const msg = e.message || "unknown error";
      let helpful = msg;
      if (msg.includes("401")) helpful = "API key was rejected (401). Check that you copied the whole key from console.anthropic.com.";
      else if (msg.includes("429")) helpful = "Rate-limited (429). Wait a minute, or you may have hit your monthly spending limit on the console.";
      else if (msg.includes("Failed to fetch")) helpful = "Couldn't reach api.anthropic.com — check your network connection and any blockers (uBlock, corporate proxy, etc.).";
      setMessages([
        ...newHistory,
        { role: "assistant", content: "⚠ " + helpful },
      ]);
    }
    setLoading(false);
  };

  const onKeyDown = (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  };

  return (
    <>
      <button
        className={"ai-fab" + (open ? " is-open" : "")}
        onClick={() => setOpen((o) => !o)}
        title={open ? "Close assistant" : "Ask the assistant"}
      >
        {open ? (
          <span style={{ fontSize: 22, fontWeight: 300, lineHeight: 1 }}>×</span>
        ) : (
          <>
            <span className="ai-fab-glyph">✦</span>
            <span className="ai-fab-label">Ask AI</span>
          </>
        )}
      </button>

      <aside className={"ai-panel" + (open ? " is-open" : "")} aria-hidden={!open}>
        <header className="ai-head">
          <div>
            <div className="ai-title">Finance assistant</div>
            <div className="ai-sub">
              {haveHostBridge ? "Knows your current numbers · powered by Claude" :
                haveKey ? `Knows your numbers · ${MODEL_OPTIONS.find((m) => m.value === model)?.label.split(" ")[0] || "Claude"} · your key` :
                "Knows your numbers · API key needed"}
            </div>
          </div>
          <div style={{ display: "flex", gap: 4 }}>
            <button className="ai-close" onClick={() => setSettingsOpen(true)} title="Settings / API key">⚙</button>
            <button className="ai-close" onClick={() => setOpen(false)} title="Close">×</button>
          </div>
        </header>

        <div className="ai-scroll" ref={scrollRef}>
          {!canChat && (
            <div className="ai-empty">
              <div className="ai-empty-glyph">🔑</div>
              <p className="ai-empty-text">
                <strong>Connect your Anthropic API key</strong> to chat with Claude about your finances.
                The key stays in your browser — calls go directly to api.anthropic.com.
              </p>
              <button className="btn-primary" onClick={() => setSettingsOpen(true)}>
                Add API key
              </button>
              <p className="ai-empty-text" style={{ marginTop: 16, fontSize: 12, color: "var(--ink-3)" }}>
                Don't have one? <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noreferrer">Get one from console.anthropic.com</a> — usually under $1 for many conversations.
              </p>
            </div>
          )}

          {canChat && messages.length === 0 && (
            <div className="ai-empty">
              <div className="ai-empty-glyph">✦</div>
              <p className="ai-empty-text">
                Ask me anything about your budget, taxes, or 5-year plan.
                I can see your current Ledger numbers.
              </p>
              <div className="ai-suggested">
                {SUGGESTED.map((s) => (
                  <button key={s} className="ai-chip" onClick={() => send(s)}>{s}</button>
                ))}
              </div>
            </div>
          )}

          {messages.map((m, i) => (
            <div key={i} className={"ai-msg " + m.role}>
              <div className="ai-msg-bubble">{m.content}</div>
            </div>
          ))}

          {loading && (
            <div className="ai-msg assistant">
              <div className="ai-msg-bubble ai-typing">
                <span /><span /><span />
              </div>
            </div>
          )}
        </div>

        <div className="ai-input-wrap">
          <textarea
            ref={inputRef}
            className="ai-input"
            placeholder={canChat ? "Ask about your finances…" : "Add an API key to start chatting"}
            value={input}
            onChange={(e) => setInput(e.target.value)}
            onKeyDown={onKeyDown}
            rows={1}
            disabled={!canChat}
          />
          <button
            className="ai-send"
            onClick={() => send()}
            disabled={!input.trim() || loading || !canChat}
            title="Send"
          >
            →
          </button>
        </div>
      </aside>

      <AISettings
        open={settingsOpen}
        apiKey={apiKey}
        model={model}
        onSave={saveSettings}
        onClose={() => setSettingsOpen(false)}
      />
    </>
  );
}

window.AIAssistant = AIAssistant;

</script>

<script type="text/babel" data-presets="react">
// PDF export — uses browser's native print-to-PDF. Cleanest, most reliable approach.
// Hides input panels, AI button, tweaks panel; expands tables; applies print stylesheet.

function exportToPDF(calculatorName) {
  // Add a class to the body that print.css targets
  document.body.classList.add("printing");

  // Set the document title so the saved PDF gets a sensible filename
  const originalTitle = document.title;
  const date = new Date().toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" });
  document.title = `Ledger · ${calculatorName} · ${date}`;

  // Give the browser a tick to apply styles, then trigger print dialog
  setTimeout(() => {
    window.print();
    // Restore after dialog closes
    setTimeout(() => {
      document.body.classList.remove("printing");
      document.title = originalTitle;
    }, 500);
  }, 100);
}

function ExportButton({ calculatorName }) {
  return (

      className="export-btn"

    >

}
