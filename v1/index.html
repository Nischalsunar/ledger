<script type="text/babel" data-presets="react">
// Export / import all calculator data as a JSON file.
// Acts as "save my data" without needing a backend.
const { useState: useStateExp, useRef: useRefExp } = React;

const STORAGE_KEYS = [
  "ledger:profile",
  "ledger:budget",
  "ledger:tax",
  "ledger:auto",
  "ledger:debt",
  "ledger:invest-v2",
  "ledger:household",
];

function collectAllData() {
  const data = { exportedAt: new Date().toISOString(), version: 1, data: {} };
  for (const k of STORAGE_KEYS) {
    const v = localStorage.getItem(k);
    if (v) data.data[k] = JSON.parse(v);
  }
  return data;
}

function downloadData() {
  const data = collectAllData();
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const date = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `ledger-backup-${date}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ── URL snapshot share ──────────────────────────────────────────────────
// Encode a minimal, *shareable* slice of state into the URL hash. We deliberately
// share only inputs (salary, expenses, debts, investments) — not Firestore UIDs,
// admin flags, or local-account credentials. Decode runs on every page load.
const SHARE_KEYS = ["ledger:profile", "ledger:budget", "ledger:debt", "ledger:invest-v2", "ledger:auto"];

function buildSnapshotURL() {
  const snap = { v: 1, data: {} };
  for (const k of SHARE_KEYS) {
    const v = localStorage.getItem(k);
    if (v) snap.data[k] = JSON.parse(v);
  }
  // Strip authentication and provider fields if they slipped into profile
  if (snap.data["ledger:profile"]) {
    delete snap.data["ledger:profile"].photoURL;
    delete snap.data["ledger:profile"].cloudUid;
  }
  // base64-url encode (no '+' '/' '=' to keep URLs clean)
  const json = JSON.stringify(snap);
  const b64 = btoa(unescape(encodeURIComponent(json)))
    .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  const base = window.location.origin + window.location.pathname;
  return `${base}#s=${b64}`;
}

function tryHydrateFromHash() {
  const hash = window.location.hash;
  const m = hash.match(/[#&]s=([A-Za-z0-9_-]+)/);
  if (!m) return null;
  try {
    const b64 = m[1].replace(/-/g, "+").replace(/_/g, "/");
    const padded = b64 + "===".slice((b64.length + 3) % 4);
    const json = decodeURIComponent(escape(atob(padded)));
    const snap = JSON.parse(json);
    if (snap?.v !== 1 || !snap.data) return null;
    for (const k of SHARE_KEYS) {
      if (snap.data[k]) localStorage.setItem(k, JSON.stringify(snap.data[k]));
    }
    return Object.keys(snap.data);
  } catch { return null; }
}

// Run hydration ONCE at module load — before React mounts components that
// read from localStorage. Strip the s= param after consuming so refreshes
// don't keep re-applying a stale snapshot.
(function consumeSnapshotHashOnBoot() {
  if (typeof window === "undefined") return;
  const loaded = tryHydrateFromHash();
  if (loaded && loaded.length) {
    const cleanHash = window.location.hash.replace(/[#&]s=[A-Za-z0-9_-]+/, "");
    window.history.replaceState(null, "", window.location.pathname + (cleanHash || "#overview"));
    // Signal the user that a snapshot was applied
    window.__ledgerSnapshotApplied = loaded;
  }
})();

async function copySnapshotURL() {
  const url = buildSnapshotURL();
  try {
    await navigator.clipboard.writeText(url);
    return { ok: true, url };
  } catch {
    return { ok: false, url };
  }
}

// ── CSV export ──────────────────────────────────────────────────────────
// Flattens the entire ledger state into a tidy CSV: one row per key/value pair.
// Each storage namespace gets a "section" column so the file is filterable in
// Excel/Sheets. Nested objects are expanded with dot-paths.
function flattenObject(obj, prefix = "") {
  const out = {};
  if (obj == null || typeof obj !== "object") {
    out[prefix || "value"] = obj;
    return out;
  }
  for (const [k, v] of Object.entries(obj)) {
    const key = prefix ? `${prefix}.${k}` : k;
    if (Array.isArray(v)) {
      v.forEach((item, i) => Object.assign(out, flattenObject(item, `${key}[${i}]`)));
    } else if (v && typeof v === "object") {
      Object.assign(out, flattenObject(v, key));
    } else {
      out[key] = v;
    }
  }
  return out;
}

function csvEscape(v) {
  if (v == null) return "";
  const s = String(v);
  // Quote if it contains a comma, quote, or newline; escape internal quotes.
  return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}

function downloadCSV() {
  const data = collectAllData();
  const rows = [["section", "key", "value"]];
  for (const [section, payload] of Object.entries(data.data)) {
    const flat = flattenObject(payload);
    for (const [key, value] of Object.entries(flat)) {
      rows.push([section, key, value]);
    }
  }
  // Prepend a UTF-8 BOM so Excel opens the file with the right encoding.
  const csv = "﻿" + rows.map((r) => r.map(csvEscape).join(",")).join("\r\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const date = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `ledger-${date}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importData(file, onComplete) {
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const parsed = JSON.parse(e.target.result);
      if (!parsed.data) throw new Error("Not a valid Ledger backup file.");
      for (const [k, v] of Object.entries(parsed.data)) {
        if (STORAGE_KEYS.includes(k)) {
          localStorage.setItem(k, JSON.stringify(v));
        }
      }
      onComplete({ ok: true, when: parsed.exportedAt });
    } catch (err) {
      onComplete({ ok: false, error: err.message });
    }
  };
  reader.readAsText(file);
}

function DataButton() {
  const [open, setOpen] = useStateExp(false);
  const [status, setStatus] = useStateExp(null);
  const fileRef = useRefExp(null);

  const handleImport = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    importData(file, (res) => {
      if (res.ok) {
        setStatus({ kind: "ok", message: `Loaded backup from ${new Date(res.when).toLocaleDateString()}. Reloading…` });
        setTimeout(() => window.location.reload(), 1000);
      } else {
        setStatus({ kind: "err", message: res.error });
      }
    });
    e.target.value = ""; // allow re-importing same file
  };

  return (
    <>
      <button
        className="data-btn"
        onClick={() => setOpen((o) => !o)}
        title="Save or load your data"
      >
        <span className="data-btn-icon">⛁</span>
        <span className="data-btn-label">My data</span>
      </button>

      {open && (
        <div className="data-menu" onClick={(e) => e.stopPropagation()}>
          <div className="data-menu-head">
            <div className="data-menu-title">Your data</div>
            <div className="data-menu-sub">All numbers are saved in this browser. Use these to back up or move between devices.</div>
          </div>

          <button className="data-menu-item" onClick={() => { downloadData(); setStatus({ kind: "ok", message: "Backup downloaded." }); }}>
            <span className="data-menu-glyph">↓</span>
            <span>
              <div className="data-menu-item-title">Download backup (JSON)</div>
              <div className="data-menu-item-sub">Save all your numbers to a .json file</div>
            </span>
          </button>

          <button className="data-menu-item" onClick={() => { downloadCSV(); setStatus({ kind: "ok", message: "CSV exported." }); }}>
            <span className="data-menu-glyph">📊</span>
            <span>
              <div className="data-menu-item-title">Export as CSV</div>
              <div className="data-menu-item-sub">Open in Excel / Google Sheets — one row per field</div>
            </span>
          </button>

          <button className="data-menu-item" onClick={async () => {
            const res = await copySnapshotURL();
            setStatus(res.ok
              ? { kind: "ok", message: "Snapshot URL copied — paste anywhere to share this scenario." }
              : { kind: "err", message: "Copy failed. URL: " + res.url }
            );
          }}>
            <span className="data-menu-glyph">🔗</span>
            <span>
              <div className="data-menu-item-title">Copy share link</div>
              <div className="data-menu-item-sub">Anyone opening it sees your salary, expenses, debts, and investments — read-only</div>
            </span>
          </button>

          <button className="data-menu-item" onClick={() => {
            if (!window.runMathTests) {
              setStatus({ kind: "err", message: "Test suite not loaded." });
              return;
            }
            const r = window.runMathTests();
            const passed = r.passed, total = r.total;
            if (passed === total) {
              setStatus({ kind: "ok", message: `✓ All ${total} math tests passed. (See console for details.)` });
            } else {
              const failed = r.results.filter((x) => !x.pass);
              const first = failed[0];
              setStatus({
                kind: "err",
                message: `${total - passed}/${total} tests failed. First: ${first.name} — ${first.error}. See console for full list.`,
              });
            }
          }}>
            <span className="data-menu-glyph">🧪</span>
            <span>
              <div className="data-menu-item-title">Run math tests</div>
              <div className="data-menu-item-sub">Verifies optimizer, projections, expense shares, payoff math — results in console + here</div>
            </span>
          </button>

          <button className="data-menu-item" onClick={() => fileRef.current.click()}>
            <span className="data-menu-glyph">↑</span>
            <span>
              <div className="data-menu-item-title">Load backup</div>
              <div className="data-menu-item-sub">Restore from a previously downloaded file</div>
            </span>
          </button>

          <button
            className="data-menu-item data-menu-item-danger"
            onClick={() => {
              if (confirm("Clear all saved data? This can't be undone.")) {
                STORAGE_KEYS.forEach((k) => localStorage.removeItem(k));
                setStatus({ kind: "ok", message: "All data cleared. Reloading…" });
                setTimeout(() => window.location.reload(), 800);
              }
            }}
          >
            <span className="data-menu-glyph">×</span>
            <span>
              <div className="data-menu-item-title">Clear all data</div>
              <div className="data-menu-item-sub">Reset everything to defaults</div>
            </span>
          </button>

          {status && (
            <div className={"data-status data-status-" + status.kind}>
              {status.message}
            </div>
          )}

          <div className="data-menu-foot">
            Looking for cloud sync / login? That needs a server we don't have. Download + Load gets you the same result across devices.
          </div>

          <input
            ref={fileRef}
            type="file"
            accept="application/json,.json"
            onChange={handleImport}
            style={{ display: "none" }}
          />
        </div>
      )}
    </>
  );
}

window.DataButton = DataButton;
window.downloadData = downloadData;

</script>

<script type="text/babel" data-presets="react">
// Budget calculator: salary -> tax -> monthly expenses -> 5-year projection.
const { useState: useStateBudget, useMemo: useMemoBudget, useEffect: useEffectBudget } = React;

// PRIMARY NEEDS — essentials you can't skip without consequences
// `splitKey` means "this field is splittable" — the value is the FULL amount the
// household pays, and we divide by expenses[splitKey] to get the user's share.
const PRIMARY_FIELDS = [
  { key: "rent",      label: "Rent / mortgage",  placeholder: "1,500", splitKey: "rentSplit", splitLabel: "roommates" },
  { key: "groceries", label: "Groceries",        placeholder: "400",   hint: "food at home" },
  { key: "utilities", label: "Utilities",        placeholder: "200",   hint: "power, water, internet, gas", splitKey: "utilitiesSplit", splitLabel: "splitting with" },
  { key: "carIns",    label: "Insurance",        placeholder: "150",   hint: "car, health, renters" },
  { key: "gas",       label: "Transportation",   placeholder: "200",   hint: "gas, transit, parking" },
  { key: "otherLoan", label: "Loan payments",    placeholder: "0",     hint: "student, credit, family" },
];
// Keep the old name for back-compat references
const EXPENSE_FIELDS = PRIMARY_FIELDS;

// Presets for the user to one-click into Secondary / Subscriptions sections
const SECONDARY_PRESETS = [
  { name: "Dining out",     amount: 200 },
  { name: "Clothes",        amount: 100 },
  { name: "Entertainment",  amount: 80 },
  { name: "Personal care",  amount: 60 },
  { name: "Hobbies",        amount: 80 },
  { name: "Gifts",          amount: 50 },
  { name: "Travel fund",    amount: 200 },
  { name: "Coffee / treats", amount: 60 },
];
// Subscription presets — just names. User enters their own price after clicking.
const SUBSCRIPTION_PRESETS = [
  { name: "Netflix",         amount: 0 },
  { name: "Spotify",         amount: 0 },
  { name: "Gym",             amount: 0 },
  { name: "iCloud / Drive",  amount: 0 },
  { name: "YouTube Premium", amount: 0 },
  { name: "Amazon Prime",    amount: 0 },
  { name: "ChatGPT / AI",    amount: 0 },
  { name: "News / magazine", amount: 0 },
  { name: "Disney+",         amount: 0 },
  { name: "Hulu",            amount: 0 },
];

// Compute the user's *share* of a splittable field. Example: rent is the
// total household rent, rentSplit is the number of roommates; share = rent / split.
function expenseShare(expenses, key) {
  const splitKey = key === "rent" ? "rentSplit"
                  : key === "utilities" ? "utilitiesSplit"
                  : null;
  const split = splitKey ? Math.max(1, Number(expenses[splitKey]) || 1) : 1;
  return (Number(expenses[key]) || 0) / split;
}
window.expenseShare = expenseShare;

// Compute the full monthly total: primary fields + secondary list + subscriptions list.
// Used everywhere the expenses object is summed (so back-compat with old data is preserved).
// Back-compat: if data was saved before the groceries/utilities split, the combined
// `expenses` field is treated as `groceries` so the total stays the same.
function sumExpenses(expenses) {
  if (!expenses) return 0;
  const groceries = expenses.groceries != null
    ? (Number(expenses.groceries) || 0)
    : (Number(expenses.expenses) || 0); // back-compat fallback
  const primary = expenseShare(expenses, "rent")
                + groceries
                + expenseShare(expenses, "utilities")
                + (Number(expenses.carIns)    || 0)
                + (Number(expenses.gas)       || 0)
                + (Number(expenses.otherLoan) || 0);
  const secondary = (expenses.secondary || []).reduce((a, it) => a + (Number(it.amount) || 0), 0);
  const subs      = (expenses.subscriptions || []).reduce((a, it) => a + (Number(it.amount) || 0), 0);
  return primary + secondary + subs;
}
// Expose so other tabs (ai-chat, debt) can read it
window.sumExpenses = sumExpenses;

// A sub-section card (Secondary or Subscriptions) — list of items + presets + custom add.
// Collapsible header — click the chevron / heading to fold the body.
function ExpenseSection({ title, hint, items, onChange, presets, accentColor }) {
  const [open, setOpen] = useStateBudget(true);
  const subtotal = items.reduce((a, it) => a + (Number(it.amount) || 0), 0);
  const updateItem = (id, next) => onChange(items.map((it) => it.id === id ? next : it));
  const removeItem = (id) => onChange(items.filter((it) => it.id !== id));
  const addItem = (preset) => {
    const id = Math.max(0, ...items.map((i) => i.id || 0)) + 1;
    onChange([...items, preset
      ? { id, name: preset.name, amount: preset.amount }
      : { id, name: "New expense", amount: 0 }
    ]);
  };
  return (
    <section className={"card expense-section" + (open ? "" : " is-collapsed")} style={accentColor ? { borderLeftColor: accentColor } : {}}>
      <header
        className="card-head"
        style={{ cursor: "pointer" }}
        onClick={() => setOpen((v) => !v)}
      >
        <h2 style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <span className={"debt-card-chevron" + (open ? " is-open" : "")} style={{ pointerEvents: "none" }} aria-hidden="true">▾</span>
          {title}
        </h2>
        <span className="card-tag">
          {fmtUSD0(subtotal)}/mo
          {!open && items.length > 0 && <span style={{ marginLeft: 8, color: "var(--ink-3)" }}>· {items.length} item{items.length !== 1 ? "s" : ""}</span>}
        </span>
      </header>
      {open && <div className="card-body">
        {hint && <p className="expense-section-hint">{hint}</p>}
        {items.length === 0 && (
          <div className="port-empty">No items yet — pick a preset below or add your own.</div>
        )}
        {items.length > 0 && (
          <div className="expense-item-list">
            {items.map((it) => (
              <ExpenseItemRow
                key={it.id}
                item={it}
                onChange={(next) => updateItem(it.id, next)}
                onRemove={() => removeItem(it.id)}
              />
            ))}

        )}

          <button className="btn-ghost" onClick={() => addItem()}>+ Add custom</button>

          <div className="port-presets">

                  + {p.name}
                </button>
              ))}
          </div>
        </div>
      </div>}
    </section>
  );
}

function BudgetExpenses({ expenses, setExpenses }) {
  const upd = (k, v) => setExpenses((s) => ({ ...s, [k]: v }));

  // Auto-sync "Other loan" from the Debt tab. Re-reads localStorage on a tick
  // so when you edit debts on the Debt tab, this updates live.
  const [tick, setTick] = useStateBudget(0);
  useEffectBudget(() => {
    const id = setInterval(() => setTick((t) => t + 1), 1500);
    return () => clearInterval(id);
  }, []);
  const debtMinTotal = React.useMemo(() => {
    try {
      const debtState = JSON.parse(localStorage.getItem("ledger:debt") || "null");
      const debts = debtState?.debts || [];
      return Math.round(debts.reduce((a, d) => a + (Number(d.minPayment) || 0), 0));
    } catch { return 0; }
  }, [tick]);

  // When sync is on, force the otherLoan value to match the debt sum
  React.useEffect(() => {
    if (expenses.otherLoanAutoSync && debtMinTotal !== expenses.otherLoan) {
      upd("otherLoan", debtMinTotal);
    }
  }, [expenses.otherLoanAutoSync, debtMinTotal]);

  // Auto-sync car Insurance from the Auto tab
  const autoInsurance = React.useMemo(() => {
    try {
      const autoState = JSON.parse(localStorage.getItem("ledger:auto") || "null");
      return Math.round(Number(autoState?.insurance) || 0);
    } catch { return 0; }
  }, [tick]);
  React.useEffect(() => {
    if (expenses.carInsAutoSync && autoInsurance > 0 && autoInsurance !== expenses.carIns) {
      upd("carIns", autoInsurance);
    }
  }, [expenses.carInsAutoSync, autoInsurance]);

  // Auto-sync car Gas from the Auto/Commute calculation (lives in window.__ledgerData.commute.cost
  // OR expenses.gas which the commute card writes into automatically).
  const autoGasFromCommute = React.useMemo(() => {
    try {
      const budget = JSON.parse(localStorage.getItem("ledger:budget") || "null");
      const c = budget?.commute?.cost;
      if (c != null && c > 0) return Math.round(c);
    } catch {}
    try {
      const autoState = JSON.parse(localStorage.getItem("ledger:auto") || "null");
      return Math.round(Number(autoState?.gas) || 0);
    } catch { return 0; }
  }, [tick]);
  React.useEffect(() => {
    if (expenses.gasAutoSync && autoGasFromCommute > 0 && autoGasFromCommute !== expenses.gas) {
      upd("gas", autoGasFromCommute);
    }
  }, [expenses.gasAutoSync, autoGasFromCommute]);

  // Use share for splittable fields so the "$X/mo" header reflects what the
  // user actually pays, not the household total.
  const primarySubtotal = PRIMARY_FIELDS.reduce((a, f) => {
    if (f.splitKey) return a + expenseShare(expenses, f.key);
    if (f.key === "groceries" && expenses.groceries == null) return a + (Number(expenses.expenses) || 0);
    return a + (Number(expenses[f.key]) || 0);
  }, 0);

  const [primaryOpen, setPrimaryOpen] = useStateBudget(true);

  return (
    <>
    <section className={"card expense-section" + (primaryOpen ? "" : " is-collapsed")} style={{ borderLeftColor: "#4DA77A" }}>
      <header
        className="card-head"
        style={{ cursor: "pointer" }}
        onClick={() => setPrimaryOpen((v) => !v)}
      >
        <h2 style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <span className={"debt-card-chevron" + (primaryOpen ? " is-open" : "")} style={{ pointerEvents: "none" }} aria-hidden="true">▾</span>
          Primary needs <span className="card-tag-inline" style={{ marginLeft: 8 }}>essentials</span>
        </h2>
        <span className="card-tag">{fmtUSD0(primarySubtotal)}/mo</span>
      </header>
      {primaryOpen && <div className="card-body stack">
        <p className="expense-section-hint">Things you must pay every month — rent, food, utilities, insurance, loans.</p>
        {PRIMARY_FIELDS.map((f) => {
          // Each syncable field — Insurance (from Auto), Transportation (gas, from Auto/Commute),
          // Loan payments (from Debt) — shares a ↻ button pattern.
          const syncConfig = {
            carIns:    { syncKey: "carInsAutoSync",    source: autoInsurance,       sourceLabel: "Auto" },
            gas:       { syncKey: "gasAutoSync",       source: autoGasFromCommute,  sourceLabel: "Auto / Commute" },
            otherLoan: { syncKey: "otherLoanAutoSync", source: debtMinTotal,        sourceLabel: "Debt" },
          }[f.key];
          if (syncConfig) {
            const synced = !!expenses[syncConfig.syncKey];
            const hint = synced && syncConfig.source > 0
              ? `synced from ${syncConfig.sourceLabel} · ${fmtUSD0(syncConfig.source)}/mo`
              : f.hint
                ? `${f.hint} · sync from ${syncConfig.sourceLabel}`
                : `sync from ${syncConfig.sourceLabel} tab`;
            return (
              <Field key={f.key} label={f.label} hint={hint}>
                <div style={{ display: "flex", gap: 6 }}>
                  <Money
                    value={expenses[f.key]}
                    onChange={(v) => { upd(f.key, v); upd(syncConfig.syncKey, false); }}
                    placeholder={f.placeholder}
                  />
                  {syncConfig.source > 0 && (
                    <button
                      type="button"
                      className="icon-btn-square"
                      title={synced ? `Unlink from ${syncConfig.sourceLabel}` : `Sync from ${syncConfig.sourceLabel} tab`}
                      onClick={() => {
                        if (synced) {
                          upd(syncConfig.syncKey, false);
                        } else {
                          upd(syncConfig.syncKey, true);
                          upd(f.key, syncConfig.source);
                        }
                      }}
                      style={synced ? { borderColor: "var(--accent)", color: "var(--accent-2)", background: "var(--accent-bg)" } : {}}
                    >
                      {synced ? "✓" : "↻"}
                    </button>
                  )}
                </div>
              </Field>
            );
          }
          // Splittable field (rent, utilities) — full amount + ÷ N people splitter
          if (f.splitKey) {
            const splitN = Math.max(1, Number(expenses[f.splitKey]) || 1);
            const full = Number(expenses[f.key]) || 0;
            const share = full / splitN;
            const hint = splitN > 1
              ? `${f.hint || ""}${f.hint ? " · " : ""}your share ${fmtUSD0(share)}/mo`
              : f.hint;
            return (
              <Field key={f.key} label={f.label} hint={hint}>
                <div style={{ display: "flex", gap: 6, alignItems: "stretch", flexWrap: "wrap" }}>
                  <div style={{ flex: "1 1 160px", minWidth: 140 }}>
                    <Money value={expenses[f.key]} onChange={(v) => upd(f.key, v)} placeholder={f.placeholder} />
                  </div>
                  <div className="split-control" title={`Divide ${f.label.toLowerCase()} by this many people`}>
                    <span className="split-control-prefix">÷</span>
                    <button type="button" className="split-control-step" onClick={() => upd(f.splitKey, Math.max(1, splitN - 1))} disabled={splitN <= 1}>−</button>
                    <input
                      type="number" min={1} max={20} step={1}
                      className="split-control-num"
                      value={splitN}
                      onChange={(e) => upd(f.splitKey, Math.max(1, Math.min(20, parseInt(e.target.value) || 1)))}
                    />
                    <button type="button" className="split-control-step" onClick={() => upd(f.splitKey, Math.min(20, splitN + 1))}>+</button>
                    <span className="split-control-suffix">{f.splitLabel}</span>
                  </div>
                </div>
                {splitN > 1 && (
                  <div className="split-share-line">
                    Your share: <strong>{fmtUSD0(share)}/mo</strong>
                    <span className="split-share-sep">·</span>
                    full {fmtUSD0(full)} ÷ {splitN}
                  </div>
                )}
              </Field>
            );
          }
          return (
            <Field key={f.key} label={f.label} hint={f.hint}>
              <Money value={expenses[f.key]} onChange={(v) => upd(f.key, v)} placeholder={f.placeholder} />
            </Field>
          );
        })}
      </div>}
    </section>

    <ExpenseSection
      title={<>Secondary <span className="card-tag-inline" style={{ marginLeft: 8 }}>wants</span></>}
      hint="Nice-to-have spending — dining out, clothes, entertainment, hobbies."
      items={expenses.secondary || []}
      onChange={(arr) => upd("secondary", arr)}
      presets={SECONDARY_PRESETS}
      accentColor="#C9A96E"
    />

    <ExpenseSection
      title={<>Subscriptions <span className="card-tag-inline" style={{ marginLeft: 8 }}>recurring</span></>}
      hint="Anything that auto-charges every month — streaming, gym, software, cloud."
      items={expenses.subscriptions || []}
      onChange={(arr) => upd("subscriptions", arr)}
      presets={SUBSCRIPTION_PRESETS}
      accentColor="#7B6E55"
    />
    </>
  );
}

function ResultsHero({ tax, monthlyExpenses, view }) {
  const monthlyTakeHome = tax.takeHome / 12;
  const monthlyLeftover = monthlyTakeHome - monthlyExpenses;
  const annualLeftover  = monthlyLeftover * 12;
  const status = monthlyLeftover >= 0 ? "surplus" : "deficit";
  const isMonthly = view === "monthly";
  const leftover = isMonthly ? monthlyLeftover : annualLeftover;
  const takeHome = isMonthly ? monthlyTakeHome : tax.takeHome;
  const leftSub  = isMonthly ? `${fmtUSD0(annualLeftover)} per year`   : `${fmtUSD0(monthlyLeftover)} per month`;
  const takeSub  = isMonthly ? `${fmtUSD0(tax.takeHome)} annually`     : `${fmtUSD0(monthlyTakeHome)} per month`;
  return (
    <section className="hero-card">
      <div className="hero-grid">
        <div className="hero-block">
          <div className="hero-eyebrow">{isMonthly ? "Monthly" : "Annual"} after expenses</div>
          <div className={"hero-num " + status}>{fmtUSD0(leftover)}</div>
          <div className="hero-sub">{leftSub}</div>
        </div>
        <div className="hero-divider" />
        <div className="hero-block">
          <div className="hero-eyebrow">After tax</div>
          <div className="hero-num">
            {fmtUSD0(takeHome)}
            <span className="hero-num-sm">{isMonthly ? "/mo" : "/yr"}</span>
          </div>
          <div className="hero-sub">{takeSub}</div>
        </div>
      </div>
    </section>
  );
}

function ExpenseBreakdown({ takeHome, expenses, view }) {
  const isMonthly = view === "monthly";
  const mult = isMonthly ? 1 : 12;
  const period = isMonthly ? "/mo" : "/yr";
  const totalMonthly = sumExpenses(expenses);
  const totalShown = totalMonthly * mult;
  const takeHomeShown = isMonthly ? takeHome / 12 : takeHome;
  const leftover = takeHomeShown - totalShown;

  const segs = PRIMARY_FIELDS
    .map((f) => ({ label: f.label, value: (expenses[f.key] || 0) * mult }))
    .filter((s) => s.value > 0);
  const secondaryTotal = (expenses.secondary || []).reduce((a, it) => a + (Number(it.amount) || 0), 0);
  const subsTotal      = (expenses.subscriptions || []).reduce((a, it) => a + (Number(it.amount) || 0), 0);
  if (secondaryTotal > 0) segs.push({ label: "Secondary (wants)", value: secondaryTotal * mult });
  if (subsTotal      > 0) segs.push({ label: "Subscriptions",     value: subsTotal      * mult });
  segs.push({
    label: leftover >= 0 ? "Savings / surplus" : "Shortfall",
    value: Math.abs(leftover),
    isLeftover: true,
    deficit: leftover < 0,
  });
  const total = segs.reduce((a, b) => a + b.value, 0) || 1;

  return (
    <section className="card">
      <header className="card-head">
        <h2>Where your take-home goes <span className="card-tag-inline">({isMonthly ? "monthly" : "annual"})</span></h2>
        <span className="card-tag">{fmtUSD0(totalShown)}{period}</span>
      </header>
      <div className="card-body">

// Reusable projection logic so SavingsInvestingCard + Overview can consume the same years.
function buildProjectionYears(inputs, expenses, growth, yearCount) {
  const out = [];
  let salary = inputs.salary;
  let rent = expenseShare(expenses, "rent");
  // Sum primary "other" fields PLUS secondary items PLUS subscription items
  const secondaryTotal = (expenses.secondary || []).reduce((a, it) => a + (Number(it.amount) || 0), 0);
  const subsTotal      = (expenses.subscriptions || []).reduce((a, it) => a + (Number(it.amount) || 0), 0);
  const groceries = expenses.groceries != null ? (Number(expenses.groceries) || 0) : (Number(expenses.expenses) || 0);
  let other = groceries + expenseShare(expenses, "utilities") + (Number(expenses.carIns) || 0) + (Number(expenses.gas) || 0) + (Number(expenses.otherLoan) || 0) + secondaryTotal + subsTotal;
  let cumulative = 0;

  const today = new Date();
  const startStr = inputs.jobStartDate || `${today.getFullYear()}-01-01`;
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(startStr);
  const startYear  = m ? parseInt(m[1], 10) : today.getFullYear();
  const startMonth = m ? parseInt(m[2], 10) - 1 : 0;
  const year1MonthsWorked = 12 - startMonth;
  const year1Fraction = year1MonthsWorked / 12;

  for (let i = 0; i < yearCount; i++) {
    const isYear1 = i === 0;
    const fraction = isYear1 ? year1Fraction : 1;
    const monthsWorked = isYear1 ? year1MonthsWorked : 12;
    const t = computeTaxes({ ...inputs, salary });
    const takeHome = t.takeHome * fraction;
    const taxPaid  = t.totalTax * fraction;
    const annualExp = (rent + other) * monthsWorked;
    const leftover = takeHome - annualExp;
    cumulative += leftover;
    out.push({
      year: startYear + i,
      startMonthIdx: isYear1 ? startMonth : 0,
      salary: salary * fraction,
      fullSalary: salary,
      takeHome, taxPaid, expenses: annualExp,
      leftover, cumulative,
      partial: isYear1 && year1Fraction < 1,
      months: monthsWorked,
    });
    salary *= 1 + growth.salary;
    rent   *= 1 + growth.rent;
    other  *= 1 + growth.expenses;
  }
  return out;
}
// Expose globally so Overview tab can reuse the same projection logic without
// re-implementing salary/rent/expense growth math.
window.buildProjectionYears = buildProjectionYears;

function BudgetCalculator({ profile, setProfile }) {
  // Shared inputs come from profile; everything else is local.
  const inputs = profile;
  const setInputs = (updater) => setProfile((p) => typeof updater === "function" ? updater(p) : { ...p, ...updater });

  const [view, setView] = useStateBudget("monthly"); // monthly | annually (page-level)
  const [projView, setProjView] = useStateBudget("monthly"); // monthly | annually (projection-only)
  const [projectionYears, setProjectionYears] = useStateBudget(5);
  const [expenses, setExpenses] = useStateBudget({
    rent: 1500, expenses: 600, carIns: 150, gas: 200, otherLoan: 0,
  });
  const [growth, setGrowth] = useStateBudget({
    salary: 0.03, rent: 0.05, expenses: 0.03,
  });
  const [commute, setCommute] = useStateBudget({
    homeAddr: "", workAddr: "",
    oneWayMiles: 0, driveMinutes: 0,
    homeResolved: "", workResolved: "",
    mpg: 30, gasPrice: 3.50,
    workdaysPerMonth: 22, extraMilesPerDay: 0,
    status: "idle", error: "",
  });

  useEffectBudget(() => {
    try {
      const saved = JSON.parse(localStorage.getItem("ledger:budget") || "null");
      if (saved) {
        saved.expenses && setExpenses(saved.expenses);
        saved.growth   && setGrowth(saved.growth);
        saved.commute  && setCommute((c) => ({ ...c, ...saved.commute, status: "idle", error: "" }));
      }
    } catch {}
  }, []);
  useEffectBudget(() => {
    localStorage.setItem("ledger:budget", JSON.stringify({ expenses, growth, commute }));
  }, [expenses, growth, commute]);

  const tax = useMemoBudget(() => computeTaxes(inputs), [inputs]);

  // Shared projection data — fed to both Projection and SavingsInvestingCard.
  const projYears = useMemoBudget(
    () => buildProjectionYears(inputs, expenses, growth, projectionYears),
    [inputs, expenses, growth, projectionYears]
  );
  const projMonthRows = useMemoBudget(() => {
    if (projView !== "monthly") return [];
    const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    const rows = [];
    let cumulative = 0;
    for (const y of projYears) {
      const startMo = y.startMonthIdx;
      const monthlySalary    = y.fullSalary / 12;
      const monthlyTakeHome  = y.takeHome / y.months;
      const monthlyTax       = y.taxPaid / y.months;
      const monthlyExpenses  = y.expenses / y.months;
      const monthlyLeftover  = monthlyTakeHome - monthlyExpenses;
      for (let m = startMo; m < 12; m++) {
        cumulative += monthlyLeftover;
        rows.push({
          key: `${y.year}-${m}`,
          label: `${MONTHS[m]} ${y.year}`,
          salary: monthlySalary,
          takeHome: monthlyTakeHome,
          tax: monthlyTax,
          expenses: monthlyExpenses,
          leftover: monthlyLeftover,
          cumulative,
          isYearStart: m === startMo,
        });
      }
    }
    return rows;
  }, [projYears, projView]);
  const projMax = Math.max(...projYears.map((y) => Math.max(y.takeHome, y.expenses)), 1);
  useEffectBudget(() => {
    // Expose latest data so the Investing tab + AI assistant can read context.
    window.__ledgerData = { profile: inputs, expenses, growth, commute, tax };
  });

  const monthlyExp = useMemoBudget(
    () => sumExpenses(expenses),
    [expenses]
  );

  return (
    <>
      <header className="page-head">
        <div>
          <h1 className="page-title">Budget <em>&amp;</em> cashflow</h1>
        </div>
        <div className="page-head-right">
          <div className="page-head-actions">
            {window.AutoSaveIndicator && <window.AutoSaveIndicator value={{ inputs, expenses, growth }} />}
            <div className="view-toggle">
              <Segment
                value={view}
                onChange={setView}
                options={[
                  { value: "monthly",  label: "Monthly" },
                  { value: "annually", label: "Annually" },
                ]}
              />
            </div>
            <ExportButton calculatorName="Budget & cashflow" />
          </div>
          <div className="page-sub">Salary → take-home → what's left after expenses</div>
        </div>
      </header>

      <div className="layout">
        <aside className="col-inputs">
          <BudgetInputs inputs={inputs} setInputs={setInputs} />
          <CommuteCard
            commute={commute}
            setCommute={setCommute}
            userState={inputs.state}
            onApplyToGas={(amt) => setExpenses((s) => ({ ...s, gas: amt }))}
          />
          <section className="card">
            <header className="card-head">
              <h2>Monthly expenses</h2>
              <span className="card-tag">{fmtUSD0(sumExpenses(expenses))}/mo</span>
            </header>
            <div className="card-body">
              <p className="expense-section-hint" style={{ marginBottom: 12 }}>
                Edit the full Primary / Secondary / Subscriptions breakdown in the dedicated
                <strong> Expenses </strong> tab.
              </p>
              <button
                className="btn-primary"
                onClick={() => { window.location.hash = "expenses"; }}
                style={{ width: "100%" }}
              >
                Open Expenses tab →
              </button>
            </div>
          </section>
          <GrowthCard growth={growth} setGrowth={setGrowth} />
        </aside>
        <section className="col-results">
          <div className="v1-enter v1-enter-0"><ResultsHero tax={tax} monthlyExpenses={monthlyExp} view={view} /></div>
          <div className="grid-2 v1-enter v1-enter-1">
            <TaxBreakdown tax={tax} view={view} />
            <ExpenseBreakdown takeHome={tax.takeHome} expenses={expenses} view={view} />
          </div>
          <div className="v1-enter v1-enter-2">
            <Projection
              years={projYears}
              yearCount={projectionYears}
              isMonthly={projView === "monthly"}
              monthRows={projMonthRows}
              max={projMax}
              growth={growth}
              onYearsChange={setProjectionYears}
              onViewChange={setProjView}
            />
          </div>
        </section>
      </div>
    </>
  );
}

    } catch {}

      localStorage.setItem("ledger:budget", JSON.stringify(cur));

    } catch {}
  }, [expenses]);

  // Live tick to re-read Debt-tab sum for the Other Loan sync
  const [, setTickExp] = useStateBudget(0);
  useEffectBudget(() => {
    const id = setInterval(() => setTickExp((t) => t + 1), 1500);
    return () => clearInterval(id);
  }, []);

  // Poll localStorage so changes from OTHER tabs (Household → shared expenses
  // sync) flow into this tab's expense state while the user is here.
  useEffectBudget(() => {
    const id = setInterval(() => {
      try {
        const saved = JSON.parse(localStorage.getItem("ledger:budget") || "null");
        const exp = saved?.expenses;
        if (!exp) return;
        setExpenses((cur) => {
          const keys = ["rent", "rentSplit", "utilities", "utilitiesSplit", "groceries"];
          const diff = keys.some((k) => Number(cur[k] || 0) !== Number(exp[k] || 0));
          if (!diff) return cur;
          return { ...cur, ...Object.fromEntries(keys.map((k) => [k, exp[k]])) };
        });
      } catch {}
    }, 1200);
    return () => clearInterval(id);
  }, []);

  const monthlyTotal = useMemoBudget(
    () => (window.sumExpenses ? window.sumExpenses(expenses) : 0),
    [expenses]
  );
  const periodMult = view === "monthly" ? 1 : 12;
  const periodLabel = view === "monthly" ? "/mo" : "/yr";

  const groceriesAmt = expenses.groceries != null
    ? (Number(expenses.groceries) || 0)
    : (Number(expenses.expenses) || 0);
  const primarySubtotal = expenseShare(expenses, "rent")
                       + groceriesAmt
                       + expenseShare(expenses, "utilities")
                       + (Number(expenses.carIns) || 0) + (Number(expenses.gas) || 0)
                       + (Number(expenses.otherLoan) || 0);
  const secondarySubtotal = (expenses.secondary || []).reduce((a, it) => a + (Number(it.amount) || 0), 0);
  const subsSubtotal      = (expenses.subscriptions || []).reduce((a, it) => a + (Number(it.amount) || 0), 0);

  const budgetData = window.__ledgerData;
  const monthlyTakeHome = budgetData?.tax ? budgetData.tax.takeHome / 12 : null;
  const pctOfIncome = monthlyTakeHome && monthlyTakeHome > 0 ? (monthlyTotal / monthlyTakeHome) : null;

  return (
    <>
      <header className="page-head">
        <div><h1 className="page-title">Monthly <em>expenses</em></h1></div>
        <div className="page-head-right">
          <div className="page-head-actions">
            {window.AutoSaveIndicator && <window.AutoSaveIndicator value={expenses} />}
            <div className="view-toggle">
              <Segment
                value={view}
                onChange={setView}
                options={[
                  { value: "monthly", label: "Monthly" },
                  { value: "annually", label: "Annually" },
                ]}
              />
            </div>
            <ExportButton calculatorName="Monthly expenses" />
          </div>
          <div className="page-sub">Primary needs · Secondary wants · Subscriptions · auto-saves as you type</div>
        </div>
      </header>

      <section className="hero-card">
        <div className="hero-grid">
          <div className="hero-block">
            <div className="hero-eyebrow">{view === "monthly" ? "Monthly" : "Annual"} expenses</div>
            <div className="hero-num">{fmtUSD0(monthlyTotal * periodMult)}</div>
            <div className="hero-sub">
              {pctOfIncome != null
                ? `${(pctOfIncome * 100).toFixed(0)}% of your take-home`
                : "open Budget tab to see % of income"}
            </div>
          </div>
          <div className="hero-divider" />
          <div className="hero-block">
            <div className="hero-eyebrow">Breakdown</div>
            <div className="expense-tier-summary">
              <div className="expense-tier-line">
                <span className="expense-tier-dot" style={{ background: "#4DA77A" }} />
                <span className="expense-tier-label">Primary</span>
                <span className="expense-tier-val">{fmtUSD0(primarySubtotal * periodMult)}{periodLabel}</span>
              </div>
              <div className="expense-tier-line">
                <span className="expense-tier-dot" style={{ background: "#C9A96E" }} />
                <span className="expense-tier-label">Secondary</span>
                <span className="expense-tier-val">{fmtUSD0(secondarySubtotal * periodMult)}{periodLabel}</span>
              </div>
              <div className="expense-tier-line">
                <span className="expense-tier-dot" style={{ background: "#7B6E55" }} />
                <span className="expense-tier-label">Subscriptions</span>
                <span className="expense-tier-val">{fmtUSD0(subsSubtotal * periodMult)}{periodLabel}</span>
              </div>
            </div>
          </div>
        </div>
      </section>

      <div className="expense-tiers-stack">
        <BudgetExpenses expenses={expenses} setExpenses={setExpenses} />
      </div>
    </>
  );
}

window.BudgetCalculator = BudgetCalculator;
window.BudgetExpenses = BudgetExpenses;
window.ExpensesCalculator = ExpensesCalculator;
window.PRIMARY_FIELDS = PRIMARY_FIELDS;
window.SECONDARY_PRESETS = SECONDARY_PRESETS;
window.SUBSCRIPTION_PRESETS = SUBSCRIPTION_PRESETS;
window.__budgetState = (BudgetCalculator); // legacy export, ignored

</script>

<script type="text/babel" data-presets="react">
// Household calculator — multiple earners share housing, keep personal savings separate.
const { useState: useStateHH, useMemo: useMemoHH, useEffect: useEffectHH } = React;

// Build the default household with member 0 = "Me" pre-filled from the Budget profile.
// Single member by default; user adds others via "Add household member".
function buildDefaultHousehold(profile) {
  return {
    members: [
      {
        id: 1, name: "Me", color: "#4DA77A",
        syncFromProfile: true,  // keep this member in sync with the Budget profile
        salary: profile?.salary ?? 65000,
        bonus:  profile?.bonus ?? 0,
        filing: profile?.filing ?? "single",
        state:  profile?.state ?? "NY",
        city:   profile?.city ?? "Buffalo",
        ficaExempt: profile?.ficaExempt ?? false,
        personalExpenses: { carIns: 130, gas: 180, otherLoan: 0, personal: 200 },
      },
    ],
    shared: {
    rent:      1800,
    utilities: 250,
    groceries: 500,
    internet:  60,
    other:     0,
  },
    splitMode: "equal", // equal | income | custom
    customSplits: {}, // { memberId: percentage 0-1 }
  };
}
const DEFAULT_HOUSEHOLD = buildDefaultHousehold(null);

const MEMBER_COLORS = ["#4DA77A", "#C9A96E", "#5A8FA3", "#B85450", "#7B6E55", "#A07ABE"];

const PERSONAL_FIELDS = [
  { key: "carIns",    label: "Car insurance" },
  { key: "gas",       label: "Gas" },
  { key: "otherLoan", label: "Other loan",  hint: "student, credit" },
  { key: "personal",  label: "Personal",    hint: "subs, fun" },
];

const SHARED_FIELDS = [
  { key: "rent",      label: "Rent" },
  { key: "utilities", label: "Utilities" },
  { key: "groceries", label: "Groceries" },
  { key: "internet",  label: "Internet" },
  { key: "other",     label: "Other shared" },
];

function computeMemberSplit(household, memberId) {
  const { members, splitMode, customSplits } = household;
  if (splitMode === "equal") return 1 / members.length;
  if (splitMode === "custom") {
    return customSplits[memberId] ?? (1 / members.length);
  }
  // income-proportional
  const incomes = members.map((m) => computeTaxes(m).takeHome);
  const total = incomes.reduce((a, b) => a + b, 0) || 1;
  const idx = members.findIndex((m) => m.id === memberId);
  return incomes[idx] / total;
}

function HouseholdCalculator({ profile, getBudgetData }) {
  const [household, setHousehold] = useStateHH(() => buildDefaultHousehold(profile));
  const [view, setView] = useStateHH("monthly");
  // Re-read Budget data periodically so the "Me" member stays live-synced
  const [tickHH, setTickHH] = useStateHH(0);
  useEffectHH(() => {
    const id = setInterval(() => setTickHH((t) => t + 1), 1500);
    return () => clearInterval(id);
  }, []);
  const budgetData = getBudgetData && getBudgetData();
  const budgetExpenses = budgetData?.expenses;

  useEffectHH(() => {
    try {
      const saved = JSON.parse(localStorage.getItem("ledger:household") || "null");
      if (saved) {
        // Migrate older saves: ensure first member is "Me" and flagged for profile sync
        if (saved.members && saved.members.length > 0 && !saved.members[0].syncFromProfile) {
          saved.members[0] = { ...saved.members[0], name: "Me", syncFromProfile: true };
        }
        setHousehold(saved);
      }
    } catch {}
  }, []);

  // ── Budget → Household pull (reverse direction of the existing Household → Budget sync) ──
  // On every tick, if Budget tab has rent / utilities / groceries values that Household
  // doesn't yet reflect, pull them in. Combined with the existing forward sync this gives
  // bidirectional sync without infinite loops (both directions converge on the same value
  // and React skips re-renders when state is unchanged).
  useEffectHH(() => {
    try {
      const budget = JSON.parse(localStorage.getItem("ledger:budget") || "null");
      const exp = budget?.expenses;
      if (!exp) return;
      setHousehold((h) => {
        const cur = h.shared || {};
        // Budget stores rent + groceries as FULL amounts (rentSplit, etc. for the divide).
        // Household.shared also stores full amounts. So they should match directly.
        const next = { ...cur };
        let changed = false;
        const setIfDifferent = (key, val) => {
          const v = Number(val) || 0;
          if (v > 0 && (Number(cur[key]) || 0) !== v) {
            next[key] = v;
            changed = true;
          }
        };
        setIfDifferent("rent", exp.rent);
        // INTENTIONALLY DO NOT pull utilities back from Budget. The forward
        // sync writes a SUM (Household.utilities + internet + other) into
        // Budget.utilities. If we then pull Budget.utilities back into
        // Household.utilities alone, the next forward tick re-aggregates,
        // adding internet+other AGAIN — runaway inflation that grew the
        // utilities field by $60 (internet) every 1.5s tick until the user
        // saw $1,270 in a slot that started as $300. Household is the
        // authoritative source for the utilities/internet/other breakdown;
        // Budget's combined utilities field is downstream-only.
        // Budget's groceries (post-split) vs Household's full groceries —
        // when rentSplit > 1 or splitMode != equal, Budget already stores the share,
        // not the full. Only pull groceries when there's no member split (1 member).
        if ((h.members?.length || 1) === 1) {
          setIfDifferent("groceries", exp.groceries);
        }
        return changed ? { ...h, shared: next } : h;
      });
    } catch {}
  }, [tickHH]);
  useEffectHH(() => {
    localStorage.setItem("ledger:household", JSON.stringify(household));
  }, [household]);

  // Live-sync the "Me" member's profile + personal expenses from the Budget tab.
  // Income: salary + bonus + additionalIncome. Personal expenses: carIns + gas +
  // otherLoan + (secondary + subscriptions rolled up as "personal" discretionary).
  // Read live debt minimums directly so Household's "Other loan" always matches
  // the Debt tab — no intermediate sync click needed on the Budget tab.
  const debtMinLive = useMemoHH(() => {
    try {
      const debt = JSON.parse(localStorage.getItem("ledger:debt") || "null");
      return (debt?.debts || []).reduce((a, d) => a + (Number(d.minPayment) || 0), 0);
    } catch { return 0; }
  // Recompute every tick to catch debt-tab edits
  }, [tickHH]);

  useEffectHH(() => {
    setHousehold((h) => {
      if (!h.members.length) return h;
      const me = h.members[0];
      if (!me.syncFromProfile) return h;
      const secondaryTotal = (budgetExpenses?.secondary || []).reduce((a, it) => a + (Number(it.amount) || 0), 0);
      const subsTotal      = (budgetExpenses?.subscriptions || []).reduce((a, it) => a + (Number(it.amount) || 0), 0);
      const personalDiscretionary = Math.round(secondaryTotal + subsTotal);
      // For otherLoan: prefer live debt minimums (the truest source). Fall back to
      // Budget's value only if user has actively typed a non-default override.
      const otherLoanFromDebt = debtMinLive > 0 ? Math.round(debtMinLive) : (budgetExpenses?.otherLoan ?? me.personalExpenses.otherLoan);
      const next = {
        ...me,
        salary: profile.salary,
        bonus:  profile.bonus,
        additionalIncome: profile.additionalIncome || 0,
        additionalIncomeLabel: profile.additionalIncomeLabel || "",
        filing: profile.filing,
        state:  profile.state,
        city:   profile.city,
        ficaExempt: profile.ficaExempt,
        personalExpenses: {
          ...me.personalExpenses,
          carIns:    budgetExpenses?.carIns    ?? me.personalExpenses.carIns,
          gas:       budgetExpenses?.gas       ?? me.personalExpenses.gas,
          otherLoan: otherLoanFromDebt,
          personal:  budgetExpenses ? personalDiscretionary : me.personalExpenses.personal,
        },
      };
      // Skip update if nothing changed (avoid render loops)
      const profileKeys = ["salary","bonus","additionalIncome","additionalIncomeLabel","filing","state","city","ficaExempt"];
      const expKeys = ["carIns","gas","otherLoan","personal"];
      const sameProfile = profileKeys.every((k) => next[k] === me[k]);
      const sameExp = expKeys.every((k) => next.personalExpenses[k] === me.personalExpenses[k]);
      if (sameProfile && sameExp) return h;
      return { ...h, members: [next, ...h.members.slice(1)] };
    });
  }, [
    profile.salary, profile.bonus, profile.additionalIncome, profile.additionalIncomeLabel,
    profile.filing, profile.state, profile.city, profile.ficaExempt,
    budgetExpenses?.carIns, budgetExpenses?.gas, budgetExpenses?.otherLoan,
    debtMinLive,
    JSON.stringify(budgetExpenses?.secondary || []),
    JSON.stringify(budgetExpenses?.subscriptions || []),
  ]);

  // ─── Sync Household → Budget Primary needs ─────────────────────────────
  // Whenever the shared expenses or split mode changes, push the "Me" member's
  // share back into the Budget tab so the Monthly Expenses → Primary needs
  // section stays in sync. One-way: Household is treated as the authoritative
  // source for shared housing expenses; Budget mirrors it.
  useEffectHH(() => {
    if (!household.members || household.members.length === 0) return;
    const me = household.members[0];
    if (!me?.syncFromProfile) return; // user opted Me out — don't overwrite their Budget

    const N = Math.max(1, household.members.length);
    const isEqual = household.splitMode === "equal";
    const meShare = computeMemberSplit(household, me.id); // 0..1
    const sh = household.shared || {};

    // Treat utilities + internet + other as a single Utilities bucket
    const utilitiesTotal = (Number(sh.utilities) || 0) + (Number(sh.internet) || 0) + (Number(sh.other) || 0);

    let nextRent, nextRentSplit, nextUtil, nextUtilSplit, nextGroc;
    if (isEqual) {
      // Equal split: store the FULL amount + N-people split so the Budget
      // UI shows the same "Your share" math the Household tab shows.
      nextRent      = Number(sh.rent) || 0;
      nextRentSplit = N;
      nextUtil      = utilitiesTotal;
      nextUtilSplit = N;
      nextGroc      = (Number(sh.groceries) || 0) / N; // groceries has no split field in Budget
    } else {
      // Income or custom split: divide-by-N doesn't represent the share
      // (it's an income-weighted or custom %). Store the user's exact share
      // directly with split=1 so Budget shows the right amount.
      nextRent      = (Number(sh.rent) || 0) * meShare;
      nextRentSplit = 1;
      nextUtil      = utilitiesTotal * meShare;
      nextUtilSplit = 1;
      nextGroc      = (Number(sh.groceries) || 0) * meShare;
    }

    try {
      const budget = JSON.parse(localStorage.getItem("ledger:budget") || "{}");
      const exp = { ...(budget.expenses || {}) };
      const changed =
        exp.rent           !== nextRent      ||
        exp.rentSplit      !== nextRentSplit ||
        exp.utilities      !== nextUtil      ||
        exp.utilitiesSplit !== nextUtilSplit ||
        exp.groceries      !== nextGroc;
      if (!changed) return;
      exp.rent           = nextRent;
      exp.rentSplit      = nextRentSplit;
      exp.utilities      = nextUtil;
      exp.utilitiesSplit = nextUtilSplit;
      exp.groceries      = nextGroc;
      // Clear the legacy combined "expenses" field so it doesn't double-count
      exp.expenses       = 0;
      budget.expenses = exp;
      localStorage.setItem("ledger:budget", JSON.stringify(budget));
      window.__ledgerData = { ...(window.__ledgerData || {}), expenses: exp };
    } catch {}
  }, [
    JSON.stringify(household.shared || {}),
    household.splitMode,
    household.members.length,
    JSON.stringify(household.customSplits || {}),
    JSON.stringify(household.members.map((m) => ({ salary: m.salary, bonus: m.bonus, additionalIncome: m.additionalIncome, filing: m.filing, state: m.state }))),
  ]);

  const updMember = (id, patch) => setHousehold((h) => ({
    ...h,
    members: h.members.map((m) => m.id === id ? { ...m, ...patch } : m),
  }));
  const updMemberExpense = (id, key, value) => {
    setHousehold((h) => ({
      ...h,
      members: h.members.map((m) => m.id === id
        ? { ...m, personalExpenses: { ...m.personalExpenses, [key]: value } }
        : m),
    }));
    // If editing the "Me" member's personal expenses AND it's profile-synced,
    // push the change back to the Budget tab so the link is bidirectional.
    // Maps household keys → budget expense keys.
    const member = household.members.find((m) => m.id === id);
    if (member?.syncFromProfile) {
      const budgetKeyMap = { carIns: "carIns", gas: "gas", otherLoan: "otherLoan" };
      const budgetKey = budgetKeyMap[key];
      if (budgetKey) {
        try {
          const budget = JSON.parse(localStorage.getItem("ledger:budget") || "{}");
          budget.expenses = { ...(budget.expenses || {}), [budgetKey]: value };
          // Edits on Household tab break the auto-sync from other sources
          if (budgetKey === "carIns") budget.expenses.carInsAutoSync = false;
          if (budgetKey === "gas") budget.expenses.gasAutoSync = false;
          if (budgetKey === "otherLoan") budget.expenses.otherLoanAutoSync = false;
          localStorage.setItem("ledger:budget", JSON.stringify(budget));
          window.__ledgerData = { ...(window.__ledgerData || {}), expenses: budget.expenses };
        } catch {}
      }
    }
  };
  const updShared = (key, value) => setHousehold((h) => ({
    ...h,
    shared: { ...h.shared, [key]: value },
  }));
  const addMember = () => {
    const newId = Math.max(0, ...household.members.map((m) => m.id)) + 1;
    const color = MEMBER_COLORS[household.members.length % MEMBER_COLORS.length];
    setHousehold((h) => ({
      ...h,
      members: [...h.members, {
        id: newId, name: `Person ${newId}`, color,
        salary: 50000, filing: "single", state: profile.state, city: profile.city, ficaExempt: false,
        personalExpenses: { carIns: 130, gas: 180, otherLoan: 0, personal: 200 },
      }],
    }));
  };
  const removeMember = (id) => {
    if (household.members.length <= 1) return;
    setHousehold((h) => ({ ...h, members: h.members.filter((m) => m.id !== id) }));
  };

  // Per-member calculations
  const memberStats = useMemoHH(() => {
    return household.members.map((m) => {
      const tax = computeTaxes(m);
      const split = computeMemberSplit(household, m.id);
      const sharedTotal = Object.values(household.shared).reduce((a, b) => a + b, 0);
      const personalTotal = Object.values(m.personalExpenses).reduce((a, b) => a + b, 0);
      const sharedShare = sharedTotal * split;
      const monthlyTakeHome = tax.takeHome / 12;
      const monthlyLeftover = monthlyTakeHome - sharedShare - personalTotal;
      return {
        ...m,
        tax,
        split,
        sharedShare,
        personalTotal,
        monthlyTakeHome,
        monthlyLeftover,
        annualLeftover: monthlyLeftover * 12,
      };
    });
  }, [household]);

  const totalSharedMonthly = Object.values(household.shared).reduce((a, b) => a + b, 0);
  const totalHouseholdIncome = memberStats.reduce((a, m) => a + m.monthlyTakeHome, 0);
  const totalHouseholdLeftover = memberStats.reduce((a, m) => a + m.monthlyLeftover, 0);

  const isMonthly = view === "monthly";
  const periodMult = isMonthly ? 1 : 12;
  const periodLabel = isMonthly ? "/mo" : "/yr";

  return (
    <>
      <header className="page-head">
        <div>
          <h1 className="page-title">Household <em>&amp;</em> roommates</h1>
        </div>
        <div className="page-head-right">
          <div className="page-head-actions">
            {window.AutoSaveIndicator && <window.AutoSaveIndicator value={household} />}
            <div className="view-toggle">
              <Segment
                value={view}
                onChange={setView}
                options={[
                  { value: "monthly",  label: "Monthly" },
                  { value: "annually", label: "Annually" },
                ]}
              />
            </div>
            <ExportButton calculatorName="Household" />
          </div>
          <div className="page-sub">
            Multiple earners · shared housing · independent savings
          </div>
        </div>
      </header>

      <div className="layout">
        <aside className="col-inputs">
          {/* Members */}
          {household.members.map((m, idx) => (
            <MemberCard
              key={m.id}
              member={m}
              index={idx}
              isOnly={household.members.length === 1}
              onUpdate={(patch) => updMember(m.id, patch)}
              onUpdateExpense={(k, v) => updMemberExpense(m.id, k, v)}
              onRemove={() => removeMember(m.id)}
            />
          ))}
          <button
            className="btn-add-member"
            onClick={addMember}
            title="Add a roommate / partner / family member"
          >
            <span className="btn-add-member-plus">+</span>
            <span className="btn-add-member-text">
              <span className="btn-add-member-title">Add another person</span>
              <span className="btn-add-member-sub">roommate, partner, family member</span>
            </span>
          </button>

          {/* Shared expenses */}
          <section className="card">
            <header className="card-head">
              <h2>Shared expenses</h2>
              <span className="card-tag">${Math.round(totalSharedMonthly).toLocaleString()}/mo</span>
            </header>
            <div className="card-body stack">
              {SHARED_FIELDS.map((f) => (
                <Field key={f.key} label={f.label}>
                  <Money
                    value={household.shared[f.key]}
                    onChange={(v) => updShared(f.key, v)}
                    placeholder="0"
                  />
                </Field>
              ))}
            </div>
          </section>

          {/* Split method */}
          <section className="card">
            <header className="card-head"><h2>Split method</h2></header>
            <div className="card-body stack">
              <Segment
                value={household.splitMode}
                onChange={(v) => setHousehold((h) => ({ ...h, splitMode: v }))}
                options={[
                  { value: "equal",  label: "Equal" },
                  { value: "income", label: "By income" },
                  { value: "custom", label: "Custom %" },
                ]}
              />
              {household.splitMode === "custom" && (
                <div className="stack" style={{ gap: 10, marginTop: 8 }}>
                  {household.members.map((m) => {
                    const pct = household.customSplits[m.id] ?? (1 / household.members.length);
                    return (
                      <div key={m.id} className="slider-row">
                        <div className="slider-label">
                          <span className="member-dot" style={{ background: m.color }} />
                          {m.name}
                        </div>
                        <input
                          type="range" min={0} max={1} step={0.05}
                          value={pct}
                          onChange={(e) => setHousehold((h) => ({
                            ...h,
                            customSplits: { ...h.customSplits, [m.id]: Number(e.target.value) },
                          }))}
                        />
                        <div className="slider-val">{(pct * 100).toFixed(0)}%</div>
                      </div>
                    );
                  })}
                </div>
              )}
              <p className="footnote" style={{ marginTop: 4 }}>
                {household.splitMode === "equal" && "Each person pays an equal share of all shared expenses."}
                {household.splitMode === "income" && "Higher earners pay proportionally more — split by take-home pay."}
                {household.splitMode === "custom" && "Set each person's share manually. They don't need to sum to 100%."}
              </p>
            </div>
          </section>
        </aside>

        <section className="col-results">
          {/* Hero: combined household */}
          {/* Order matches the Budget tab: leftover on LEFT (headline result),
              take-home on RIGHT (source) — so the same metric sits in the same place
              across pages. */}
          <section className="hero-card">
            <div className="hero-grid">
