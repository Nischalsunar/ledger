<script type="text/babel" data-presets="react">
// v2 Current tab — read-only month-to-date summary.
//
// Built on the same data + analytics as the v1 Record tab's CurrentSummary,
// just wrapped in the v2 page chrome. Pulls window.useTransactions and
// window.CurrentSummary (both exposed from calc-record.jsx). No data entry,
// no writes — Record is the only entry surface.
//
// Also displays a "Fixed monthly load" card derived from the v1 Debt tab's
// ledger:debt data when it exists. Per the original v2 spec, debt minimums
// should be visible as a rigid, high-priority fixed cost line so the user
// sees what cash flow remains for savings. Reading happens through the same
// auth.jsx namespace shim that both apps use, so the per-user :debt key is
// resolved transparently — no extra plumbing.

const { useState: useStateV2C, useEffect: useEffectV2C } = React;

// Shared snapshot reader for the v1 Debt tab's ledger:debt data.
// Exposed on window so v2-projection.jsx can roll monthly minimums into
// the recurring overhead forecast without duplicating the read logic.
function readDebtSnapshot() {
  try {
    const raw = localStorage.getItem("ledger:debt");
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    const debts = Array.isArray(parsed?.debts) ? parsed.debts : [];
    if (debts.length === 0) return null;
    const minTotal = debts.reduce((a, d) => a + (Number(d?.minPayment) || 0), 0);
    const principalTotal = debts.reduce((a, d) => a + (Number(d?.balance) || 0), 0);
    return {
      debts: debts.map((d) => ({
        name: String(d?.name || "Debt").trim() || "Debt",
        balance: Number(d?.balance) || 0,
        apr: Number(d?.apr) || 0,
        minPayment: Number(d?.minPayment) || 0,
      })),
      minTotal,
      principalTotal,
    };
  } catch { return null; }
}
window.readDebtSnapshot = readDebtSnapshot;

function useDebtSnapshot() {
  const [snapshot, setSnapshot] = useStateV2C(readDebtSnapshot);

  useEffectV2C(() => {
    // Re-read on cross-tab storage changes (when v1 updates debts in another tab)
    // and poll at 2s so same-tab v1 changes also propagate (there's no fine-grained
    // event for ledger:debt; the poll is cheap and stops re-rendering when the
    // snapshot is structurally identical because React bails on referential equality).
    const onChange = () => setSnapshot(readDebtSnapshot());
    window.addEventListener("storage", onChange);
    const id = setInterval(() => {
      const next = readDebtSnapshot();
      setSnapshot((prev) => {
        // Bail if functionally identical to avoid useless re-renders.
        if (prev === next) return prev;
        if (!prev && !next) return prev;
        if (prev && next && prev.minTotal === next.minTotal && prev.principalTotal === next.principalTotal && prev.debts.length === next.debts.length) {
          return prev;
        }
        return next;
      });
    }, 2000);
    return () => {
      window.removeEventListener("storage", onChange);
      clearInterval(id);
    };
  }, []);

  return snapshot;
}
window.useDebtSnapshot = useDebtSnapshot;

function V2FixedLoadCard({ debt }) {
  const fmt = (n) => window.fmtUSD0(n);
  return (
    <section className="card">
      <header className="card-head">
        <h2>Fixed monthly load</h2>
        <span className="card-tag">contractual minimums · synced from /v1/#debt</span>
      </header>
      <div className="card-body">
        <div className="kpi-grid">
          <div className="kpi">
            <div className="kpi-label">Monthly minimums</div>
            <div className="kpi-value" style={{ color: "var(--negative)" }}>{fmt(debt.minTotal)}</div>
            <div className="kpi-sub">{debt.debts.length} debt{debt.debts.length === 1 ? "" : "s"}</div>
          </div>
          <div className="kpi">
            <div className="kpi-label">Principal owed</div>
            <div className="kpi-value">{fmt(debt.principalTotal)}</div>
            <div className="kpi-sub">across all balances</div>
          </div>
        </div>

        <div style={{ marginTop: 14, overflowX: "auto" }}>
          <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
            <thead>
              <tr>
                <th style={{ textAlign: "left", padding: "6px 10px", borderBottom: "1px solid var(--border)", color: "var(--ink-3)", fontWeight: 500 }}>Debt</th>
                <th style={{ textAlign: "right", padding: "6px 10px", borderBottom: "1px solid var(--border)", color: "var(--ink-3)", fontWeight: 500 }}>APR</th>
                <th style={{ textAlign: "right", padding: "6px 10px", borderBottom: "1px solid var(--border)", color: "var(--ink-3)", fontWeight: 500 }}>Balance</th>
                <th style={{ textAlign: "right", padding: "6px 10px", borderBottom: "1px solid var(--border)", color: "var(--ink-3)", fontWeight: 500 }}>Min / mo</th>
              </tr>
            </thead>
            <tbody>
              {debt.debts.map((d, i) => (
                <tr key={i}>
                  <td style={{ padding: "8px 10px", borderBottom: "1px solid var(--border)" }}>{d.name}</td>
                  <td style={{ padding: "8px 10px", borderBottom: "1px solid var(--border)", textAlign: "right" }}>{(d.apr * 100).toFixed(2)}%</td>
                  <td style={{ padding: "8px 10px", borderBottom: "1px solid var(--border)", textAlign: "right" }}>{fmt(d.balance)}</td>
                  <td style={{ padding: "8px 10px", borderBottom: "1px solid var(--border)", textAlign: "right", color: "var(--negative)", fontWeight: 600 }}>{fmt(d.minPayment)}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>

        <p style={{ marginTop: 12, fontSize: 12, color: "var(--ink-4)" }}>
          Edit balances and minimums in the{" "}
          <a href="v1/#debt" style={{ color: "var(--accent)" }}>full calculator's Debt tab</a>.
          Changes appear here automatically.
        </p>
      </div>
    </section>
  );
}

function V2Current() {
  const transactions = window.useTransactions();
  const CS = window.CurrentSummary;
  const debt = useDebtSnapshot();

  // Tiny "tip strip" so a brand-new user lands here and knows where to go.
  const isEmpty = !transactions || transactions.length === 0;

  return (
    <>
      <header className="page-head">
        <div>
          <h1 className="page-title">Current</h1>
        </div>
        <div className="page-head-right">
          <div className="page-sub">
            Where your money went this month · live as you add entries on Record
          </div>
        </div>
      </header>

      {isEmpty && (
        <section className="card">
          <div className="card-body">
            <p style={{ margin: 0, color: "var(--ink-3)" }}>
              No transactions yet. Open the{" "}
              <a href="#record" style={{ color: "var(--accent)" }}>Record</a>{" "}
              tab to log your first expense — this page will fill in
              automatically.
            </p>
          </div>
        </section>
      )}

      {debt ? <V2FixedLoadCard debt={debt} /> : null}

      {CS ? <CS transactions={transactions} /> : null}
    </>
  );
}

window.V2Current = V2Current;

</script>

<script type="text/babel" data-presets="react">
// v2 Projection tab — calendar-anchored 12-month forecast.
//
// What it does:
//   • Looks at the last N completed days of spend (default 30, configurable;
//     auto-widens to all data if you have less than 30 days).
//   • Splits spend into "recurring" (Subscriptions, Bills, Rent, Mortgage,
//     Insurance, Internet, Phone, Utilities) vs "variable" (everything else).
//   • Projects 12 monthly buckets starting next calendar month, each labeled
//     with its real month-year ("Jun 2026", "Jul 2026", ...).
//   • Recurring is projected at its observed monthly cadence (fixed).
//   • Variable is projected as a per-day rate × days-in-month, with a ±25%
//     band on variable to render an upper/lower range.
//   • Renders a Recharts ComposedChart with the variable range as a shaded
//     area and the mid total as a line, plus a calendar-anchored table
//     beneath it.
//   • Plain-text methodology line under the chart states the lookback window.
//
// No data → friendly empty state pointing user to Record. No salary / no
// budget targets — this tab is purely "if I keep spending like this, here's
// where I'm headed." That keeps v2 self-contained: it never reads from the
// v1 calculator state (which lives only at /v1/).

const { useMemo: useMemoV2P } = React;

const RECURRING_CATEGORIES_V2 = new Set([
  "Subscriptions", "Bills", "Rent", "Mortgage", "Insurance",
  "Internet", "Phone", "Utilities",
]);

const MONTHS_SHORT_V2 = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

function V2Projection() {
  const transactions = window.useTransactions();
  // Debt minimums are contractual recurring overhead — fold them into the
  // recurring forecast alongside Subscriptions/Bills per v2 spec Step 6.
  const debtSnap = window.useDebtSnapshot ? window.useDebtSnapshot() : null;
  const debtMinPerMonth = debtSnap ? debtSnap.minTotal : 0;

  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const todayISO = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, "0")}-${String(today.getDate()).padStart(2, "0")}`;

  // ── Pick a lookback window. 30 days is the default; if fewer than 7
  // days of data exist, we widen to "all data" so a brand-new user still
  // gets some signal. ───────────────────────────────────────────────────
  const stats = useMemoV2P(() => {
    // Even with zero transactions, we still have meaningful data if v1 has
    // debts set up — show a debt-only projection in that case rather than the
    // generic empty state.
    if ((!transactions || transactions.length === 0) && debtMinPerMonth <= 0) {
      return { hasData: false, days: 0, recurringPerMonth: 0, variablePerDay: 0, dailyAvg: 0 };
    }
    if (!transactions || transactions.length === 0) {
      // Debt-only case — no transaction history, but contractual debt load exists.
      return {
        hasData: true,
        days: 0,
        totalDaysOfData: 0,
        recurringPerMonth: debtMinPerMonth,
        variablePerDay: 0,
        dailyAvg: debtMinPerMonth / 30,
        windowRecurring: 0,
        windowVariable: 0,
        debtFromV1: debtMinPerMonth,
        recurringFromTx: 0,
        debtOnly: true,
      };
    }

    // Find earliest date with data
    let earliest = todayISO;
    for (const t of transactions) {
      if (t.date && t.date < earliest) earliest = t.date;
    }
    const earliestD = new Date(earliest + "T00:00:00");
    const totalDaysOfData = Math.max(
      1,
      Math.round((today.getTime() - earliestD.getTime()) / 86400000) + 1
    );

    // Use 30d window if user has 30+ days of data, otherwise use all data.
    const windowDays = Math.min(30, Math.max(7, totalDaysOfData));
    const cutoff = new Date(today);
    cutoff.setDate(cutoff.getDate() - windowDays + 1);
    const cutoffISO = `${cutoff.getFullYear()}-${String(cutoff.getMonth() + 1).padStart(2, "0")}-${String(cutoff.getDate()).padStart(2, "0")}`;

    let recurringCents = 0;
    let variableCents = 0;
    for (const t of transactions) {
      if (!t.date || t.date < cutoffISO || t.date > todayISO) continue;
      const cents = Number(t.amount_cents) || 0;
      if (RECURRING_CATEGORIES_V2.has(t.category)) recurringCents += cents;
      else variableCents += cents;
    }

    // Recurring scaled to a 30-day month (best estimate from the window),
    // plus the v1 Debt tab's contractual monthly minimums layered on top —
    // those are fixed cash outflows the user is committed to, even if no
    // transaction has been logged for them yet on Record.
    const recurringFromTx = (recurringCents / windowDays) * 30;
    const recurringPerMonth = recurringFromTx + debtMinPerMonth;
    const variablePerDay = variableCents / windowDays;
    // Daily average still uses observed cash flow — the debt minimum is
    // counted via recurringPerMonth and would double-count if we added cents
    // to dailyAvg directly. Surface it separately in the methodology line.
    const dailyAvg = (recurringCents + variableCents) / windowDays;

    return {
      hasData: true,
      days: windowDays,
      totalDaysOfData,
      recurringPerMonth,
      recurringFromTx,
      debtFromV1: debtMinPerMonth,
      variablePerDay,
      dailyAvg,
      windowRecurring: recurringCents,
      windowVariable: variableCents,
      debtOnly: false,
    };
  }, [transactions, todayISO, debtMinPerMonth]);

  // ── Calendar-anchored monthly buckets ─────────────────────────────────
  // Start with NEXT calendar month (so the chart projects forward only) and
  // walk forward 12 months. Each bucket carries its real month-year label
  // and uses days-in-that-month for variable spend so a 28-day Feb projects
  // less variable than a 31-day Jan.
  const monthlyBuckets = useMemoV2P(() => {
    if (!stats.hasData) return [];
    const out = [];
    const start = new Date(today.getFullYear(), today.getMonth() + 1, 1);
    for (let i = 0; i < 12; i++) {
      const d = new Date(start.getFullYear(), start.getMonth() + i, 1);
      const year = d.getFullYear();
      const monthIdx = d.getMonth();
      const daysInMonth = new Date(year, monthIdx + 1, 0).getDate();
      const label = `${MONTHS_SHORT_V2[monthIdx]} ${year}`;
      const recurring = stats.recurringPerMonth;
      const variableMid = stats.variablePerDay * daysInMonth;
      const low = recurring + variableMid * 0.75;
      const mid = recurring + variableMid;
      const high = recurring + variableMid * 1.25;
      out.push({
        key: `${year}-${String(monthIdx + 1).padStart(2, "0")}`,
        label,
        year,
        monthIdx,
        daysInMonth,
        recurring,
        variableMid,
        low,
        mid,
        high,
        // For Recharts area "band" trick: render low + (high-low) stacked,
        // hide the bottom area so the visible band sits between low and high.
        lowDollars: window.toDollars(Math.round(low)),
        midDollars: window.toDollars(Math.round(mid)),
        highDollars: window.toDollars(Math.round(high)),
        bandSpan: window.toDollars(Math.round(high - low)),
      });
    }
    return out;
  }, [stats, today.getFullYear(), today.getMonth()]);

  // Cumulative 12-month totals for the summary KPI strip.
  const annualTotal = useMemoV2P(() => {
    if (!monthlyBuckets.length) return { low: 0, mid: 0, high: 0 };
    return monthlyBuckets.reduce(
      (acc, b) => ({ low: acc.low + b.low, mid: acc.mid + b.mid, high: acc.high + b.high }),
      { low: 0, mid: 0, high: 0 }
    );
  }, [monthlyBuckets]);

  const fmt = (cents) => window.fmtUSD0(window.toDollars(Math.round(cents)));

  // ── Empty state ────────────────────────────────────────────────────────
  if (!stats.hasData) {
    return (
      <>
        <header className="page-head">
          <div>
            <h1 className="page-title">Projection</h1>
          </div>
          <div className="page-head-right">
            <div className="page-sub">
              Forward forecast based on your recorded spending
            </div>
          </div>
        </header>
        <section className="card">
          <div className="card-body">
            <p style={{ margin: 0, color: "var(--ink-3)" }}>
              Add a few transactions on the{" "}
              <a href="#record" style={{ color: "var(--accent)" }}>Record</a>{" "}
              tab — or set up debts in the{" "}
              <a href="v1/#debt" style={{ color: "var(--accent)" }}>full calculator's Debt tab</a>{" "}
              — and this page will start projecting where your spending is
              headed. A week of recorded spend gives the most useful forecast.
            </p>
          </div>
        </section>
      </>
    );
  }

  const Recharts = window.Recharts;
  const startLabel = monthlyBuckets[0]?.label;
  const endLabel = monthlyBuckets[monthlyBuckets.length - 1]?.label;

  return (
    <>
      <header className="page-head">
        <div>
          <h1 className="page-title">Projection</h1>
        </div>
        <div className="page-head-right">
          <div className="page-sub">
            {startLabel} to {endLabel} · based on the last {stats.days} day{stats.days === 1 ? "" : "s"} of recorded spending
          </div>
        </div>
      </header>

      <section className="card">
        <header className="card-head">
          <h2>Burn rate</h2>
          <span className="card-tag">{stats.days}-day rolling window</span>
        </header>
        <div className="card-body">
          <div className="kpi-grid">
            <div className="kpi">
              <div className="kpi-label">Daily average</div>
              <div className="kpi-value">{fmt(stats.dailyAvg)}</div>
              <div className="kpi-sub">across all categories</div>
            </div>
            <div className="kpi">
              <div className="kpi-label">Recurring / month</div>
              <div className="kpi-value">{fmt(stats.recurringPerMonth)}</div>
              <div className="kpi-sub">
                {stats.debtFromV1 > 0
                  ? `incl. ${fmt(stats.debtFromV1)} debt minimums from v1`
                  : "subscriptions, bills, rent"}
              </div>
            </div>
            <div className="kpi">
              <div className="kpi-label">Variable / day</div>
              <div className="kpi-value">{fmt(stats.variablePerDay)}</div>
              <div className="kpi-sub">groceries, dining, gas, etc.</div>
            </div>
            <div className="kpi">
              <div className="kpi-label">Next 12 months (mid)</div>
              <div className="kpi-value">{fmt(annualTotal.mid)}</div>
              <div className="kpi-sub">range {fmt(annualTotal.low)} to {fmt(annualTotal.high)}</div>
            </div>
          </div>
        </div>
      </section>

      <section className="card">
        <header className="card-head">
          <h2>Forecast by month</h2>
          <span className="card-tag">{startLabel} – {endLabel}</span>
        </header>
        <div className="card-body">
          {Recharts ? (
            <div style={{ width: "100%", height: 340 }}>
              <Recharts.ResponsiveContainer width="100%" height="100%">
                <Recharts.ComposedChart
                  data={monthlyBuckets.map((b) => ({
                    label: b.label,
                    low: b.lowDollars,
                    band: b.bandSpan,
                    mid: b.midDollars,
                    recurring: window.toDollars(Math.round(b.recurring)),
                  }))}
                  margin={{ top: 16, right: 24, left: 8, bottom: 8 }}
                >
                  <Recharts.CartesianGrid strokeDasharray="3 3" stroke="var(--border)" />
                  <Recharts.XAxis
                    dataKey="label"
                    tick={{ fontSize: 11, fill: "var(--ink-3)" }}
                    interval={0}
                    angle={-30}
                    textAnchor="end"
                    height={56}
                  />
                  <Recharts.YAxis
                    tick={{ fontSize: 11, fill: "var(--ink-3)" }}
                    tickFormatter={(v) => `$${Math.round(v / 1000)}k`}
                  />
                  <Recharts.Tooltip
                    formatter={(value, name) => {
                      if (name === "Low bound") return [window.fmtUSD0(value), name];
                      if (name === "Range") return null; // hide stacked-helper band from tooltip
                      return [window.fmtUSD0(value), name];
                    }}
                    labelStyle={{ fontWeight: 600 }}
                    contentStyle={{ background: "var(--surface)", border: "1px solid var(--border)", borderRadius: 4 }}
                  />
                  {/* Stacked-area band trick: invisible "low" sets the floor, visible "band" fills low→high */}
                  <Recharts.Area
                    type="monotone"
                    dataKey="low"
                    stackId="band"
                    stroke="none"
                    fill="transparent"
                    name="Low bound"
                    isAnimationActive={false}
                  />
                  <Recharts.Area
                    type="monotone"
                    dataKey="band"
                    stackId="band"
                    stroke="none"
                    fill="var(--accent-dim)"
                    fillOpacity={0.45}
                    name="Range"
                    isAnimationActive={false}
                  />
                  <Recharts.Line
                    type="monotone"
                    dataKey="mid"
                    stroke="var(--accent)"
                    strokeWidth={2}
                    dot={{ r: 3, fill: "var(--accent)" }}
                    name="Projected total"
                    isAnimationActive={false}
                  />
                  <Recharts.Line
                    type="monotone"
                    dataKey="recurring"
                    stroke="var(--gold)"
                    strokeWidth={1.5}
                    strokeDasharray="4 4"
                    dot={false}
                    name="Recurring floor"
                    isAnimationActive={false}
                  />
                  <Recharts.Legend wrapperStyle={{ fontSize: 12, paddingTop: 8 }} />
                </Recharts.ComposedChart>
              </Recharts.ResponsiveContainer>
            </div>
          ) : null}

          <p style={{ marginTop: 12, fontSize: 13, color: "var(--ink-3)" }}>
            Methodology: recurring costs are held flat at{" "}
            {fmt(stats.recurringPerMonth)}/mo
            {stats.debtFromV1 > 0 && stats.recurringFromTx > 0 && (
              <> (
                {fmt(stats.recurringFromTx)} from your last {stats.days}{" "}
                day{stats.days === 1 ? "" : "s"} of recorded recurring spend +{" "}
                {fmt(stats.debtFromV1)} debt minimums from the v1 Debt tab
              )</>
            )}
            {stats.debtFromV1 > 0 && stats.recurringFromTx === 0 && (
              <> (entirely from {fmt(stats.debtFromV1)} debt minimums in the v1 Debt tab — no recurring tags on your Record entries yet)</>
            )}
            {stats.debtFromV1 === 0 && stats.days > 0 && (
              <> (from the last {stats.days} day{stats.days === 1 ? "" : "s"} of recorded spend)</>
            )}
            . Variable spend is projected at {fmt(stats.variablePerDay)}/day
            with a ±25% band to reflect week-to-week swings (groceries, gas,
            dining). Each month's variable total scales with its actual
            number of days, so short months like February forecast lower
            than 31-day months.
          </p>

          <div style={{ overflowX: "auto", marginTop: 16 }}>
            <table className="results-table" style={{ width: "100%", borderCollapse: "collapse" }}>
              <thead>
                <tr>
                  <th style={{ textAlign: "left", padding: "8px 12px", borderBottom: "1px solid var(--border)" }}>Month</th>
                  <th style={{ textAlign: "right", padding: "8px 12px", borderBottom: "1px solid var(--border)" }}>Recurring</th>
                  <th style={{ textAlign: "right", padding: "8px 12px", borderBottom: "1px solid var(--border)" }}>Variable (mid)</th>
                  <th style={{ textAlign: "right", padding: "8px 12px", borderBottom: "1px solid var(--border)", color: "var(--ink-3)" }}>Low</th>
                  <th style={{ textAlign: "right", padding: "8px 12px", borderBottom: "1px solid var(--border)", fontWeight: 600 }}>Mid</th>
                  <th style={{ textAlign: "right", padding: "8px 12px", borderBottom: "1px solid var(--border)", color: "var(--ink-3)" }}>High</th>
                </tr>
              </thead>
              <tbody>
                {monthlyBuckets.map((b) => (
                  <tr key={b.key}>
                    <td style={{ padding: "10px 12px", borderBottom: "1px solid var(--border)" }}>{b.label}</td>
                    <td style={{ padding: "10px 12px", borderBottom: "1px solid var(--border)", textAlign: "right" }}>{fmt(b.recurring)}</td>
                    <td style={{ padding: "10px 12px", borderBottom: "1px solid var(--border)", textAlign: "right" }}>{fmt(b.variableMid)}</td>
                    <td style={{ padding: "10px 12px", borderBottom: "1px solid var(--border)", textAlign: "right", color: "var(--ink-3)" }}>{fmt(b.low)}</td>
                    <td style={{ padding: "10px 12px", borderBottom: "1px solid var(--border)", textAlign: "right", fontWeight: 600 }}>{fmt(b.mid)}</td>
                    <td style={{ padding: "10px 12px", borderBottom: "1px solid var(--border)", textAlign: "right", color: "var(--ink-3)" }}>{fmt(b.high)}</td>
                  </tr>
                ))}
                <tr>
                  <td style={{ padding: "12px", borderTop: "2px solid var(--border-2)", fontWeight: 600 }}>12-month total</td>
                  <td style={{ padding: "12px", borderTop: "2px solid var(--border-2)", textAlign: "right", fontWeight: 600 }}>{fmt(stats.recurringPerMonth * 12)}</td>
                  <td style={{ padding: "12px", borderTop: "2px solid var(--border-2)", textAlign: "right", fontWeight: 600 }}>{fmt(annualTotal.mid - stats.recurringPerMonth * 12)}</td>
                  <td style={{ padding: "12px", borderTop: "2px solid var(--border-2)", textAlign: "right", color: "var(--ink-3)" }}>{fmt(annualTotal.low)}</td>
                  <td style={{ padding: "12px", borderTop: "2px solid var(--border-2)", textAlign: "right", fontWeight: 700 }}>{fmt(annualTotal.mid)}</td>
                  <td style={{ padding: "12px", borderTop: "2px solid var(--border-2)", textAlign: "right", color: "var(--ink-3)" }}>{fmt(annualTotal.high)}</td>
                </tr>
              </tbody>
            </table>
          </div>

          <p style={{ marginTop: 12, fontSize: 12, color: "var(--ink-4)" }}>
            Recurring categories: Subscriptions, Bills, Rent, Mortgage,
            Insurance, Internet, Phone, Utilities. Tag entries with these
            categories on Record so they're treated as fixed costs.
          </p>
        </div>
      </section>
    </>
  );
}

window.V2Projection = V2Projection;

</script>

<script type="text/babel" data-presets="react">
// v2 app shell — lean 3-tab ledger.
//
// Tabs: Current · Projection · Record. Hash-routed (#current / #projection /
// #record). Wraps the existing window.AuthGate so sign-in + per-user
// localStorage namespacing + Firestore sync are identical to v1. That's
// why both URLs share data automatically — same Google login = same keys.
//
// A small banner at the top of the sidebar links to /v1/ for users who want
// the full calculator (budget, debt, investing, taxes, etc.). v1 stays at
// /v1/index.html and is unchanged.

const { useState: useStateV2, useEffect: useEffectV2 } = React;

const V2_TABS = [
  { id: "current",    label: "Current",    glyph: "C" },
  { id: "projection", label: "Projection", glyph: "P" },
  { id: "record",     label: "Record",     glyph: "R" },
];

// Signed-in user info + sign-out at the bottom of the sidebar. v1 has a
// ProfileCorner widget in the top-right of every page; v2 keeps things
// minimal by tucking the same affordances into the sidebar footer.
function V2ProfileBlock() {
  const [user, setUser] = useStateV2(() => window.__currentUser || null);
  useEffectV2(() => {
    // Poll for auth changes — there's no fine-grained event on __currentUser
    // and the cost of a 1.5s interval is negligible.
    const id = setInterval(() => {
      const next = window.__currentUser || null;
      setUser((prev) => {
        if (prev === next) return prev;
        if (prev && next && prev.email === next.email && prev.uid === next.uid) return prev;
        return next;
      });
    }, 1500);
    return () => clearInterval(id);
  }, []);

  if (!user) return null;

  const email = user.email || "Signed in";
  const initial = (email[0] || "?").toUpperCase();
  const handleSignOut = async () => {
    const ok = window.confirm("Sign out of Ledger? Your local data stays on this device.");
    if (!ok) return;
    try { await window.__signOut?.(); } catch (e) { console.warn(e); }
  };

  return (
    <div style={{ marginTop: "auto", padding: "16px 12px 12px", borderTop: "1px solid var(--border)" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 8 }}>
        <span
          style={{
            width: 32, height: 32, borderRadius: "50%",
            background: "var(--accent)", color: "var(--ai-fab-fg, #fff)",
            display: "inline-flex", alignItems: "center", justifyContent: "center",
            fontWeight: 600, fontSize: 14, flexShrink: 0,
          }}
          title={email}
          aria-hidden="true"
        >
          {initial}
        </span>
        <span style={{
          fontSize: 12, color: "var(--ink-2)",
          overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap",
        }} title={email}>
          {email}
        </span>
      </div>
      <button
        type="button"
        onClick={handleSignOut}
        style={{
          width: "100%", padding: "6px 10px", fontSize: 12,
          border: "1px solid var(--border)", background: "transparent",
          color: "var(--ink-3)", borderRadius: 4, cursor: "pointer",
        }}
        title="Sign out of Ledger"
      >
        Sign out
      </button>
    </div>
  );
}

function V2Shell() {
  const [active, setActive] = useStateV2(() => {
    const hash = window.location.hash.slice(1);
    return V2_TABS.find((t) => t.id === hash)?.id || "current";
  });

  useEffectV2(() => { window.location.hash = active; }, [active]);

  useEffectV2(() => {
    const onHash = () => {
      const id = window.location.hash.slice(1);
      if (V2_TABS.find((t) => t.id === id)) setActive(id);
    };
    window.addEventListener("hashchange", onHash);
    return () => window.removeEventListener("hashchange", onHash);
  }, []);

  const [sidebarHidden, setSidebarHidden] = useStateV2(() => {
    const saved = localStorage.getItem("ledger:sidebarHidden");
    if (saved === "1") return true;
    if (saved === "0") return false;
    return typeof window !== "undefined" && window.innerWidth < 1024;
  });
  useEffectV2(() => {
    localStorage.setItem("ledger:sidebarHidden", sidebarHidden ? "1" : "0");
  }, [sidebarHidden]);

  const renderTab = () => {
    switch (active) {
      case "current":    return window.V2Current ? <window.V2Current /> : null;
      case "projection": return window.V2Projection ? <window.V2Projection /> : null;
      case "record":
        // hideSummary because the v2 Current tab already shows the summary.
        return window.RecordTab ? <window.RecordTab hideSummary={true} /> : null;
      default:           return null;
    }
  };

  return (
    <div className={"app" + (sidebarHidden ? " app-sidebar-hidden" : "")}>
      <aside className="sidebar">
        <div className="brand">
          <span className="brand-logo-btn" style={{ cursor: "default" }}>
            <span className="brand-mark">$</span>
            <span className="brand-name">Ledger</span>
          </span>
          <button
            type="button"
            className="brand-logo-btn"
            onClick={() => {
              const cur = document.documentElement.dataset.colorMode === "dark" ? "dark" : "light";
              const next = cur === "dark" ? "light" : "dark";
              try { localStorage.setItem("ledger:colorMode", next); } catch {}
              // Reload to re-run the color bootstrap script — simpler than re-applying every CSS variable here.
              window.location.reload();
            }}
            title="Toggle light / dark mode"
            aria-label="Toggle color mode"
            style={{ marginLeft: 8, padding: "4px 10px", fontSize: 14, border: "1px solid var(--border)", background: "transparent", color: "var(--ink-2)", borderRadius: 4, cursor: "pointer" }}
          >
            ☼
          </button>
          <button
            className="sidebar-toggle"
            onClick={() => setSidebarHidden(true)}
            title="Hide sidebar"
            aria-label="Hide sidebar"
          >
            ‹
          </button>
        </div>

        <div className="nav-section">Ledger</div>
        <nav className="nav">
          {V2_TABS.map((t) => (
            <button
              key={t.id}
              className={"nav-item" + (active === t.id ? " is-active" : "")}
              onClick={() => setActive(t.id)}
            >
              <span className="nav-glyph">{t.glyph}</span>
              <span>{t.label}</span>
            </button>
          ))}
        </nav>

        <div className="nav-section" style={{ marginTop: 24 }}>More</div>
        <nav className="nav">
          <a
            className="nav-item"
            href="v1/"
            title="Open the full calculator (budget, debt, investing, taxes, household)"
            style={{ textDecoration: "none" }}
          >
            <span className="nav-glyph">→</span>
            <span>Full calculator</span>
          </a>
        </nav>

        <V2ProfileBlock />
      </aside>

      {sidebarHidden && (
        <button
          className="sidebar-show"
          onClick={() => setSidebarHidden(false)}
          title="Show sidebar"
          aria-label="Show sidebar"
        >
          ›
        </button>
      )}

      <main className="main">
        {renderTab()}
        <footer className="page-foot">
          <span style={{ color: "var(--ink-3)", fontSize: 12 }}>
            Ledger v2 · data syncs across devices when signed in ·{" "}
            <a href="v1/" style={{ color: "var(--accent)" }}>v1 calculator →</a>
          </span>
        </footer>
      </main>
    </div>
  );
}

function startV2App() {
  const root = ReactDOM.createRoot(document.getElementById("root"));
  const AuthGateC = window.AuthGate;
  root.render(AuthGateC ? <AuthGateC><V2Shell /></AuthGateC> : <V2Shell />);
}

if (window.FramerMotion) startV2App();
else window.addEventListener("framer-motion-ready", startV2App, { once: true });

</script>
</body></html>
