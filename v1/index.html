function amortize(principal, annualRate, months) {
  const r = annualRate / 12;
  if (principal <= 0 || months <= 0) return { payment: 0, schedule: [] };
  const payment = r === 0
    ? principal / months
    : principal * (r * Math.pow(1 + r, months)) / (Math.pow(1 + r, months) - 1);
  const schedule = [];
  let balance = principal;
  for (let m = 1; m <= months; m++) {
    const interest = balance * r;
    const principalPaid = payment - interest;
    balance = Math.max(0, balance - principalPaid);
    schedule.push({ m, payment, interest, principal: principalPaid, balance });
  }
  return { payment, schedule };
}

// Typeable combobox: shows a dropdown of options, but you can also type freely.
// Filters as you type. Hitting Enter or clicking commits the value.
function ComboInput({ value, onChange, options, placeholder, disabled }) {
  const [open, setOpen] = useStateAuto(false);
  const [active, setActive] = useStateAuto(0);
  const inputRef = React.useRef(null);

  const filtered = React.useMemo(() => {
    const q = (value || "").trim().toLowerCase();
    if (!q) return options.slice(0, 200); // show all on focus when empty
    const prefix = [], substr = [];
    for (const o of options) {
      const lc = o.toLowerCase();
      if (lc.startsWith(q))    prefix.push(o);
      else if (lc.includes(q)) substr.push(o);
    }
    return [...prefix, ...substr].slice(0, 12);
  }, [value, options]);

  const pick = (v) => { onChange(v); setOpen(false); };

  return (
    <div className="combo-wrap">
      <input
        ref={inputRef}
        type="text"
        className="text-input combo-input"
        placeholder={placeholder}
        value={value || ""}
        disabled={disabled}
        onFocus={() => setOpen(true)}
        onBlur={() => setTimeout(() => setOpen(false), 150)}
        onChange={(e) => { onChange(e.target.value); setOpen(true); setActive(0); }}
        onKeyDown={(e) => {
          if (!open && (e.key === "ArrowDown" || e.key === "Enter")) {
            setOpen(true);
            return;
          }
          if (!open) return;
          if (e.key === "ArrowDown") { e.preventDefault(); setActive((a) => Math.min(a + 1, filtered.length - 1)); }
          else if (e.key === "ArrowUp")   { e.preventDefault(); setActive((a) => Math.max(a - 1, 0)); }
          else if (e.key === "Enter")     { e.preventDefault(); if (filtered[active]) pick(filtered[active]); }
          else if (e.key === "Escape")    { setOpen(false); }
        }}
        autoComplete="off"
        spellCheck={false}
      />
      <button
        type="button"
        className="combo-toggle"
        disabled={disabled}
        onMouseDown={(e) => {
          e.preventDefault(); // prevent input blur
          if (open) setOpen(false);
          else {
            setOpen(true);
            inputRef.current && inputRef.current.focus();
          }
        }}
        title="Show all options"
        aria-label="Toggle options"
      >
        ▾
      </button>
      {open && filtered.length > 0 && (
        <ul className="ac-list combo-list">
          {filtered.map((o, i) => (
            <li
              key={o}
              className={"ac-item" + (i === active ? " is-active" : "") + (o === value ? " is-current" : "")}
              onMouseDown={(e) => { e.preventDefault(); pick(o); }}
              onMouseEnter={() => setActive(i)}
            >
              {o}
              {o === value && <span style={{ marginLeft: "auto", color: "var(--accent)" }}>✓</span>}
            </li>
          ))}
        </ul>
      )}
    </div>
  );
}

function AutoLoan({ getBudgetData }) {
  const [v, setV] = useStateAuto({
    type: "sedan", year: CURRENT_YEAR, make: "", model: "",
    introComplete: false,
    price: 32000, down: 4000, tradeIn: 0,
    salesTaxRate: 0.07, fees: 600,
    apr: 0.069, termMonths: 60,
    insurance: 130,
    gas: 200,
    autoGas: true,
    maintenance: 0,        // user must enter — no default guess
    maintenanceItems: [],  // start empty — user adds their own items
    regAnnual: 200,
    parking: 0,
  });

  // Live re-read of Budget commute data so gas auto-syncs.
  const [, setTick] = useStateAuto(0);
  useEffectAuto(() => {
    const id = setInterval(() => setTick((t) => t + 1), 1500);
    return () => clearInterval(id);
  }, []);

  useEffectAuto(() => {
    try {
      const saved = JSON.parse(localStorage.getItem("ledger:auto") || "null");
      if (saved) {
        // Defensive: any user with a saved `maintenance: 80` (or other legacy
        // default) from before the auto-fill removal gets it wiped to 0 here.
        // The field is no longer used by the math but kept zeroed for clarity.
        saved.maintenance = 0;
        setV((cur) => ({ ...cur, ...saved }));
      }
    } catch {}
  }, []);
  useEffectAuto(() => {
    localStorage.setItem("ledger:auto", JSON.stringify(v));
  }, [v]);

  const upd = (k, val) => setV((s) => ({ ...s, [k]: val }));

  // When user picks a vehicle type, pull in smart defaults for MPG-relevant fields.
  // Maintenance items are NOT auto-filled — user enters their own numbers.
  const applyTypeDefaults = (typeId) => {
    const type = VEHICLE_TYPES.find((t) => t.id === typeId);
    if (!type) return;
    setV((s) => ({
      ...s,
      type: typeId,
      insurance: s.introComplete ? s.insurance : type.defaults.insurance,
      price:     s.introComplete ? s.price     : type.defaults.basePrice,
    }));
  };

  // Auto-sync gas from Budget. We prefer the Budget commute calculation (if the user
  // has typed addresses + mpg + gas-price), and fall back to expenses.gas (which Budget's
  // commute card writes into automatically) so the value is always current either way.
  const budgetData = getBudgetData && getBudgetData();
  const budgetGas = (() => {
    // 1. Direct commute calc cost
    const c = budgetData?.commute?.cost;
    if (c != null && c > 0) return Math.round(c);
    // 2. Recompute from raw commute fields if available
    const cm = budgetData?.commute;
    if (cm && cm.oneWayMiles > 0 && cm.mpg > 0 && cm.gasPrice > 0 && cm.workdaysPerMonth > 0) {
      const totalMilesPerDay = (cm.oneWayMiles * 2) + (cm.extraMilesPerDay || 0);
      const gallonsPerDay = totalMilesPerDay / cm.mpg;
      return Math.round(gallonsPerDay * cm.gasPrice * cm.workdaysPerMonth);
    }
    // 3. Fallback: expenses.gas (which Budget keeps in sync with the commute calc)
    const ex = budgetData?.expenses?.gas;
    return ex != null && ex > 0 ? Math.round(ex) : null;
  })();
  useEffectAuto(() => {
    if (v.autoGas && budgetGas != null && Math.abs(budgetGas - v.gas) > 0.5) {
      setV((s) => ({ ...s, gas: budgetGas }));
    }
  }, [v.autoGas, budgetGas]);

  const calc = useMemoAuto(() => {
    const taxable = Math.max(0, v.price - v.tradeIn);
    const tax = taxable * v.salesTaxRate;
    const principal = Math.max(0, v.price + tax + v.fees - v.down - v.tradeIn);
    const { payment, schedule } = amortize(principal, v.apr, v.termMonths);
    const totalPaid = payment * v.termMonths;
    const totalInterest = Math.max(0, totalPaid - principal);

    // Itemized maintenance → monthly. No fallback default — empty list = $0.
    const items = v.maintenanceItems || [];
    const maintMonthly = items.reduce((a, it) => a + (it.cost || 0) * (it.perYear || 0) / 12, 0);
    const maintAnnual = maintMonthly * 12;

    const monthlyOwnership = (v.insurance || 0) + (v.gas || 0) + maintMonthly
                           + (v.parking || 0) + (v.regAnnual || 0) / 12;
    const monthlyTotal  = payment + monthlyOwnership;
    const annualTotal   = monthlyTotal * 12;
    const fiveYearTotal = monthlyTotal * 60 + v.down + v.tradeIn;

    return {
      taxable, tax, principal, payment, schedule,
      totalPaid, totalInterest,
      maintMonthly, maintAnnual,
      monthlyOwnership, monthlyTotal, annualTotal, fiveYearTotal,
    };
  }, [v]);

  // If user has never completed intro and there's no saved breakdown yet, show flow.
  const showIntro = !v.introComplete;
  if (showIntro) {
    return (
      <VehicleIntro
        v={v}
        onTypeSelect={applyTypeDefaults}
        onUpdate={upd}
        onContinue={() => upd("introComplete", true)}
      />
    );
  }

  return (

        <div>
          <h1 className="page-title">Auto <em>&amp; vehicle costs</em></h1>
        </div>
        <div className="page-head-right">
          <div className="page-head-actions">
            {window.AutoSaveIndicator && <window.AutoSaveIndicator value={v} />}
            <button
              className="export-btn"
              onClick={() => upd("introComplete", false)}
              title="Edit vehicle profile"
            >
              <span className="export-btn-icon">✎</span>
              <span className="export-btn-label">Edit vehicle</span>
            </button>
            <ExportButton calculatorName="Auto & vehicle costs" />
          </div>
          <div className="page-sub">
            {(() => {
              const t = VEHICLE_TYPES.find((x) => x.id === v.type);
              const parts = [];
              if (v.year)  parts.push(v.year);
              if (v.make)  parts.push(v.make);
              if (v.model) parts.push(v.model);
              if (parts.length === 0 && t) parts.push(t.label);
              return `${t?.glyph || "—"} ${parts.join(" ") || "Your vehicle"}`;
            })()}
          </div>
        </div>
      </header>

      <CarHero v={v} />

      <div className="layout">
        <aside className="col-inputs">
          <section className="card">
            <header className="card-head"><h2>Vehicle & price</h2></header>
            <div className="card-body stack">
              <Field label="Vehicle price">
                <Money value={v.price} onChange={(x) => upd("price", x)} placeholder="32,000" />
              </Field>
              <Field label="Down payment">
                <Money value={v.down} onChange={(x) => upd("down", x)} placeholder="4,000" />
              </Field>
              <Field label="Trade-in value" hint="optional">
                <Money value={v.tradeIn} onChange={(x) => upd("tradeIn", x)} placeholder="0" />
              </Field>
              <div className="row-2">
                <Field label="Sales tax">
                  <NumberInput
                    value={Math.round((v.salesTaxRate || 0) * 1e6) / 1e4}
                    onChange={(x) => upd("salesTaxRate", Math.round((x || 0) * 1e4) / 1e6)}
                    suffix="%"
                  />
                </Field>
                <Field label="Fees" hint="title, doc">
                  <Money value={v.fees} onChange={(x) => upd("fees", x)} placeholder="600" />
                </Field>
              </div>

function CarHero({ v }) {
  // Guard: FM might not be loaded yet — never crash, just degrade gracefully.
  const fm = (typeof window !== "undefined") && window.FramerMotion;
  const type = VEHICLE_TYPES.find((t) => t.id === v.type) || VEHICLE_TYPES[0];
  const name = [v.year, v.make, v.model].filter(Boolean).join(" ") || type.label;
  // animKey changes on: vehicle type switch, make switch, or picking a real model
  const committedModel = (v.make && CAR_DATA[v.make] && CAR_DATA[v.make].includes(v.model)) ? v.model : "";
  const animKey = `${v.type}|${v.make || ""}|${committedModel}`;

  const bgLayer = (
    <div className="car-hero-bg">
      <div className="car-hero-road" />
      <div className="car-hero-cloud car-hero-cloud-1" />
      <div className="car-hero-cloud car-hero-cloud-2" />
      <div className="car-hero-cloud car-hero-cloud-3" />
      {/* CSS effects keyed by animKey so they replay on each swap */}
      <div key={"sl-" + animKey} className="car-hero-speedlines" aria-hidden="true">
        <span /><span /><span /><span /><span />
      </div>
      <div key={"flash-" + animKey} className="car-hero-flash" aria-hidden="true" />
    </div>
  );

  // Fallback: static display while FM is still loading
  if (!fm || !fm.motion) {
    return (
      <section className="car-hero">
        {bgLayer}
        <div className="car-hero-art" dangerouslySetInnerHTML={{ __html: type.svg }} />
        <div className="car-hero-meta">
          <div className="car-hero-name">{name}</div>
          <div className="car-hero-tags">
            <span className="car-hero-tag">{type.label}</span>
            <span className="car-hero-tag">{type.defaults.mpg} mpg avg</span>
            <span className="car-hero-tag">${(type.defaults.basePrice / 1000).toFixed(0)}k typical</span>
          </div>
        </div>
      </section>
    );
  }

  const { motion, AnimatePresence } = fm;

  // Cartoon drive-in: slide in from off-screen left, settle with a bouncy spring.
  const driveIn = {
    initial: { x: -360, opacity: 0, rotate: -5, scale: 0.85 },
    animate: {
      x: 0, opacity: 1, rotate: 0, scale: 1,
      transition: { type: "spring", stiffness: 220, damping: 11, mass: 0.9 },
    },
    exit: {
      x: 360, opacity: 0, rotate: 6, scale: 0.9,
      transition: { duration: 0.28, ease: [0.4, 0, 1, 1] },
    },
  };

  return (
    <section className="car-hero">
      {bgLayer}

      <AnimatePresence mode="wait" initial={false}>
        <motion.div
          key={"car-" + animKey}
          className="car-hero-art"
          initial={driveIn.initial}
          animate={driveIn.animate}
          exit={driveIn.exit}
        >
          {/* SVG must live in a plain inner div — motion.div + dangerouslySetInnerHTML throws */}
          <div className="car-hero-svg-inner" dangerouslySetInnerHTML={{ __html: type.svg }} />
        </motion.div>
      </AnimatePresence>

      <AnimatePresence mode="wait" initial={false}>
        <motion.div
          key={"meta-" + animKey}
          className="car-hero-meta"
          initial={{ opacity: 0, y: 14 }}
          animate={{
            opacity: 1, y: 0,
            transition: { delay: 0.35, type: "spring", stiffness: 240, damping: 22 },
          }}
          exit={{ opacity: 0, transition: { duration: 0.12 } }}
        >
          <div className="car-hero-name">{name}</div>
          <div className="car-hero-tags">
            <span className="car-hero-tag">{type.label}</span>
            <span className="car-hero-tag">{type.defaults.mpg} mpg avg</span>
            <span className="car-hero-tag">${(type.defaults.basePrice / 1000).toFixed(0)}k typical</span>
          </div>
        </motion.div>
      </AnimatePresence>
    </section>
  );
}

function PiBarChart({ schedule }) {
  if (!schedule.length) return null;
  const buckets = 12;
  const size = Math.ceil(schedule.length / buckets);
  const groups = [];
  for (let i = 0; i < schedule.length; i += size) {
    const slice = schedule.slice(i, i + size);
    groups.push({
      from: slice[0].m,
      to: slice[slice.length - 1].m,
      principal: slice.reduce((a, b) => a + b.principal, 0),
      interest:  slice.reduce((a, b) => a + b.interest, 0),
    });
  }
  const max = Math.max(...groups.map((g) => g.principal + g.interest)) || 1;

  return (
    <>
      <div style={{ display: "grid", gridTemplateColumns: `repeat(${groups.length}, 1fr)`, gap: 8, height: 180, alignItems: "end", marginBottom: 12 }}>
        {groups.map((g, i) => {
          const totH = ((g.principal + g.interest) / max) * 100;
          const pH = (g.principal / (g.principal + g.interest)) * totH;
          const iH = totH - pH;
          return (
            <div key={i} style={{ display: "flex", flexDirection: "column", justifyContent: "flex-end", height: "100%" }}>
              <div style={{ background: "var(--gold-dim)", height: iH + "%" }} title={`Interest ${fmtUSD0(g.interest)}`} />
              <div style={{ background: "var(--accent)", height: pH + "%", borderRadius: "3px 3px 0 0" }} title={`Principal ${fmtUSD0(g.principal)}`} />
            </div>
          );
        })}
      </div>
      <div style={{ display: "grid", gridTemplateColumns: `repeat(${groups.length}, 1fr)`, gap: 8 }}>
        {groups.map((g, i) => (
          <div key={i} style={{ fontFamily: "var(--display)", fontSize: 11, color: "var(--ink-3)", textAlign: "center", fontFeatureSettings: '"tnum"' }}>
            {g.from}–{g.to}
          </div>
        ))}
      </div>
      <div className="proj-legend" style={{ marginTop: 14 }}>
        <span><i className="dot" style={{ background: "var(--accent)" }} /> Principal</span>
        <span><i className="dot" style={{ background: "var(--gold-dim)" }} /> Interest</span>
      </div>
    </>
  );
}

<script type="text/babel" data-presets="react">
// Debt payoff — snowball vs avalanche. List debts, set extra monthly, see months saved.
const { useState: useStateDebt, useMemo: useMemoDebt, useEffect: useEffectDebt } = React;

// Debt types — each has a sensible APR default + a way to estimate minimum monthly payment.
const DEBT_TYPES = {
  credit_card:   { label: "Credit card",   icon: "💳", apr: 0.219, termYears: 0,  estimateMethod: "percent" },
  personal_loan: { label: "Personal loan", icon: "💵", apr: 0.115, termYears: 5,  estimateMethod: "amortize" },
  student_loan:  { label: "Student loan",  icon: "🎓", apr: 0.058, termYears: 10, estimateMethod: "amortize" },
  car_loan:      { label: "Car loan",      icon: "🚗", apr: 0.069, termYears: 5,  estimateMethod: "amortize" },
  mortgage:      { label: "Mortgage",      icon: "🏠", apr: 0.070, termYears: 30, estimateMethod: "amortize" },
  medical:       { label: "Medical",       icon: "🏥", apr: 0.000, termYears: 2,  estimateMethod: "amortize" },
  family:        { label: "Family / friend", icon: "👥", apr: 0.000, termYears: 3,  estimateMethod: "amortize" },
  other:         { label: "Other",         icon: "•",  apr: 0.090, termYears: 5,  estimateMethod: "amortize" },
};

// Compute a recommended minimum monthly payment for the given debt type & balance.
// - credit_card: 2% of balance OR $25, whichever is larger (industry-standard minimum formula)
// - amortize: standard mortgage-style payment over the type's typical term
function estimateMinPayment(type, balance, apr) {
  const t = DEBT_TYPES[type] || DEBT_TYPES.other;
  if (!balance || balance <= 0) return 0;
  if (t.estimateMethod === "percent") {
    return Math.max(25, Math.round(balance * 0.02));
  }
  const r = (apr || t.apr) / 12;
  const n = t.termYears * 12;
  if (n <= 0) return Math.round(balance);
  if (r === 0) return Math.round(balance / n);
  const pmt = balance * (r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
  return Math.round(pmt);
}

// Simulate debt payoff, optionally tracking a parallel savings bucket.
// paymentFreqMonths: how often the accumulated 'extra' is applied to debt (1, 3, 6, 12).
// Between payments, unspent extra sits in the debt fund earning the savings APY.
function simulatePayoffWithSavings(debts, monthlyExtra, strategy, monthlySavings, savingsAPY, paymentFreqMonths = 1) {
  const list = debts.map((d, i) => ({
    id: i, name: d.name, balance: d.balance, apr: d.apr, minPayment: d.minPayment,
    paidInterest: 0, paidoffMonth: null,
  })).filter((d) => d.balance > 0);

  const monthlySavingsRate = Math.pow(1 + (savingsAPY || 0), 1/12) - 1;
  let savingsBalance = 0;
  let pendingExtra = 0; // accumulated extra waiting to be applied at next payment interval
  let runningExtra = 0; // freed-up minimums from paid-off debts (roll forward)

  // Per-month sum of remaining debt balance — used by the Overview net-worth chart.
  // Index 0 = starting total (before any payment), index k = balance after month k.
  const monthlyDebtTotal = [list.reduce((a, d) => a + d.balance, 0)];

  let month = 0;
  const MAX = 600;

  while (list.some((d) => d.balance > 0) && month < MAX) {
    month++;
    // Grow savings + contribute monthly savings
    savingsBalance = savingsBalance * (1 + monthlySavingsRate) + (monthlySavings || 0);
    // Pending extra also earns APY (sitting in same savings account between payments)
    pendingExtra = pendingExtra * (1 + monthlySavingsRate) + (monthlyExtra || 0);

    // Charge interest on each debt
    for (const d of list) {
      if (d.balance <= 0) continue;
      const i = d.balance * (d.apr / 12);
      d.balance += i;
      d.paidInterest += i;
    }

    // Apply minimums every month
    for (const d of list) {
      if (d.balance <= 0) continue;
      const pay = Math.min(d.minPayment, d.balance);
      d.balance -= pay;
      if (d.balance <= 0.005) {
        d.balance = 0;
        if (d.paidoffMonth === null) d.paidoffMonth = month;
      }
    }

    // Apply the lump sum (pendingExtra + rolled minimums) ONLY at payment intervals
    const isPaymentMonth = (month % paymentFreqMonths === 0);
    if (isPaymentMonth) {
      let leftover = pendingExtra + runningExtra;
      pendingExtra = 0;
      const targets = list
        .filter((d) => d.balance > 0)
        .sort((a, b) => strategy === "snowball" ? a.balance - b.balance : b.apr - a.apr);
      let i = 0;
      while (leftover > 0 && targets[i]) {
        const t = targets[i];
        const pay = Math.min(leftover, t.balance);
        t.balance -= pay;
        leftover -= pay;
        if (t.balance <= 0.005) {
          t.balance = 0;
          if (t.paidoffMonth === null) t.paidoffMonth = month;
        }
        i++;
      }
      // Any leftover after all debts cleared goes into savings
      if (leftover > 0) savingsBalance += leftover;
    }

    // Roll freed minimums forward for next payment interval
    runningExtra += list
      .filter((d) => d.balance === 0 && d.paidoffMonth === month)
      .reduce((a, b) => a + b.minPayment, 0);

    // Snapshot end-of-month total remaining debt for the Overview trend chart
    monthlyDebtTotal.push(list.reduce((a, d) => a + d.balance, 0));
  }

  // Add any leftover pending extra to savings when done
  savingsBalance += pendingExtra;

  return {
    months: month,
    totalInterest: list.reduce((a, b) => a + b.paidInterest, 0),
    perDebt: list,
    savingsBalance,
    monthlyDebtTotal,
  };
}
window.simulatePayoffWithSavings = simulatePayoffWithSavings;

function simulatePayoff(debts, extra, strategy) {
  // Clone debts with running balances.
  const list = debts.map((d, i) => ({
    id: i, name: d.name, balance: d.balance, apr: d.apr, minPayment: d.minPayment,
    paidInterest: 0, paidoffMonth: null,
  })).filter((d) => d.balance > 0);

  const events = [];
  let month = 0;
  const MAX = 600; // 50 years cap

  while (list.some((d) => d.balance > 0) && month < MAX) {
    month++;
    // 1. Charge interest
    for (const d of list) {
      if (d.balance <= 0) continue;
      const i = d.balance * (d.apr / 12);
      d.balance += i;
      d.paidInterest += i;
    }
    // 2. Apply minimums
    let leftover = extra;
    for (const d of list) {
      if (d.balance <= 0) continue;
      const pay = Math.min(d.minPayment, d.balance);
      d.balance -= pay;
      // capture freed-up minimums to roll
      if (d.balance <= 0.005) {
        d.balance = 0;
        if (d.paidoffMonth === null) d.paidoffMonth = month;
      }
    }
    // 3. Apply extra to the chosen target
    const targets = list
      .filter((d) => d.balance > 0)
      .sort((a, b) => strategy === "snowball" ? a.balance - b.balance : b.apr - a.apr);
    let i = 0;
    while (leftover > 0 && targets[i]) {
      const t = targets[i];
      const pay = Math.min(leftover, t.balance);
      t.balance -= pay;
      leftover -= pay;
      if (t.balance <= 0.005) {
        t.balance = 0;
        if (t.paidoffMonth === null) t.paidoffMonth = month;
      }
      i++;
    }
    // Also: roll freed minimums forward (debt snowball / avalanche cascading)
    // Already handled implicitly because remaining extra cascades next month
    // through unchanged minimums; but a stricter implementation rolls minimums of
    // paid-off debts into extra. Add that:
    extra += list
      .filter((d) => d.balance === 0 && d.paidoffMonth === month)
      .reduce((a, b) => a + b.minPayment, 0);
  }

  const totalInterest = list.reduce((a, b) => a + b.paidInterest, 0);
  return { months: month, totalInterest, perDebt: list };
}

// ─── Pure optimizer ──────────────────────────────────────────────────────
// Computes the optimal debt/savings split AND returns a rationale object
// that the UI displays. Pure: no React, no side effects, easy to test.
//
// Inputs:
//   debts       — array of { balance, apr, minPayment }
//   cash        — monthly $ available above minimums
//   savingsAPY  — decimal (0.04 = 4%)
//   constraints — { minEmergencyFund, clearSmallDebtsFirst, smallDebtThreshold, maxDebtPctForcedSavings }
//   currentLiquid — current liquid cash (for emergency-fund check); 0 by default
//
// Returns:
//   { pct, priority, reason, constraintHit }
//
function optimizeAllocation({ debts, cash, savingsAPY, constraints, currentLiquid = 0 }) {
  const con = constraints || {};
  const active = (debts || []).filter((d) => (Number(d.balance) || 0) > 0);

  // Weighted-average APR across all live debts
  const totalBal = active.reduce((a, d) => a + (Number(d.balance) || 0), 0);
  const avgApr = totalBal > 0
    ? active.reduce((a, d) => a + (Number(d.apr) || 0) * (Number(d.balance) || 0), 0) / totalBal
    : 0;
  const gap = avgApr - (Number(savingsAPY) || 0);
  const gapPct = gap * 100;

  // Default no constraint was hit
  let constraintHit = null;

  // CONSTRAINT 1: build emergency fund first
  if ((con.minEmergencyFund || 0) > 0 && currentLiquid < con.minEmergencyFund) {
    return {
      pct: 0.05,
      priority: "Savings",
      reason: `Build emergency fund first ($${currentLiquid.toLocaleString()} of $${con.minEmergencyFund.toLocaleString()} target)`,
      constraintHit: "emergency",
    };
  }

  // CONSTRAINT 2: clear small debts first (snowball-style)
  if (con.clearSmallDebtsFirst) {
    const smallDebts = active.filter((d) => (Number(d.balance) || 0) > 0 && (Number(d.balance) || 0) < (con.smallDebtThreshold || 0));
    if (smallDebts.length > 0) {
      return {
        pct: 0.9,
        priority: "Debt",
        reason: `${smallDebts.length} small debt${smallDebts.length !== 1 ? "s" : ""} under $${con.smallDebtThreshold} — clearing those first for the psychological win`,
        constraintHit: "smallDebt",
      };
    }
  }

  // Default math: bucket by gap
  let pct = 0.5;
  let priority = "Balanced";
  if (gap > 0.05)        { pct = 0.9;  priority = "Debt"; }
  else if (gap > 0.02)   { pct = 0.75; priority = "Debt"; }
  else if (gap > -0.01)  { pct = 0.5;  priority = "Balanced"; }
  else                   { pct = 0.25; priority = "Savings"; }

  // CONSTRAINT 3: cap max debt share so user always builds some liquidity
  const cap = con.maxDebtPctForcedSavings != null ? con.maxDebtPctForcedSavings : 0.95;
  if (pct > cap) {
    pct = cap;
    constraintHit = "maxDebtShare";
  }

  const reason = totalBal === 0
    ? "No active debts — everything goes to savings"
    : `Avg debt APR ${(avgApr * 100).toFixed(1)}% vs HYSA ${((Number(savingsAPY) || 0) * 100).toFixed(1)}% = ${gapPct.toFixed(1)}% gap`;

  return { pct, priority, reason, constraintHit };
}
window.optimizeAllocation = optimizeAllocation;

function DebtPayoff({ getBudgetData }) {
  const todayISO = (() => {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  })();
  const [debts, setDebts] = useStateDebt([
    { name: "Credit card",  type: "credit_card",  balance: 5400,  apr: 0.234, minPayment: 150, dueDay: 1,  takenDate: todayISO },
    { name: "Student loan", type: "student_loan", balance: 18500, apr: 0.058, minPayment: 220, dueDay: 15, takenDate: todayISO },
    { name: "Car loan",     type: "car_loan",     balance: 9200,  apr: 0.069, minPayment: 295, dueDay: 10, takenDate: todayISO },
  ]);
  const [spareCash, setSpareCash] = useStateDebt(500);
  const [autoSpare, setAutoSpare] = useStateDebt(true);
  const [debtPct, setDebtPct] = useStateDebt(0.5);
  const [savingsAPY, setSavingsAPY] = useStateDebt(0.04);
  const [paymentFreq, setPaymentFreq] = useStateDebt(1); // months
  const [strategy, setStrategy] = useStateDebt("avalanche");
  // Manual-mode + constraint configuration. Both persist via the existing
  // ledger:debt localStorage save effect; both have sensible defaults so the
  // optimizer can run unchanged when the user doesn't touch these.
  const [manualMode, setManualMode] = useStateDebt(false);
  const [constraints, setConstraints] = useStateDebt({
    minEmergencyFund: 1000,         // floor: don't touch debt extras until this much liquid
    clearSmallDebtsFirst: true,     // snowball-style psychological win
    smallDebtThreshold: 500,        // a "small" debt = under this balance
    maxDebtPctForcedSavings: 0.95,  // never put 100% to debt — always keep some liquid
  });
  const updConstraint = (k, v) => setConstraints((c) => ({ ...c, [k]: v }));
  const [showRules, setShowRules] = useStateDebt(false);
  // Per-debt expand/collapse state (not persisted — just a UI preference for the session)
  const [expandedDebts, setExpandedDebts] = useStateDebt({}); // { [idx]: bool }
  const isExpanded = (i) => expandedDebts[i] !== false; // default: expanded
  const toggleExpanded = (i) => setExpandedDebts((m) => ({ ...m, [i]: !isExpanded(i) }));
  const collapseAll = () => setExpandedDebts(Object.fromEntries(debts.map((_, i) => [i, false])));
  const expandAll   = () => setExpandedDebts({});
  // Whole "Your debts" section open/closed
  const [debtsListOpen, setDebtsListOpen] = useStateDebt(true);
  // Custom $ amount to pay toward debt (overrides the % slider when set)
  const [customDebtAmount, setCustomDebtAmount] = useStateDebt(null);

  // Periodic tick used by currentLiquid + budgetLeftover to re-read external state.
  // Declared HERE (before the memos that depend on it) to avoid temporal-dead-zone errors.
  const [tick, setTick] = useStateDebt(0);
  useEffectDebt(() => {
    const id = setInterval(() => setTick((t) => t + 1), 1500);
    return () => clearInterval(id);
  }, []);

  // Auto-link spare cash to Budget's monthly leftover when autoSpare is on.
  const budgetData = getBudgetData && getBudgetData();
  const budgetLeftover = useMemoDebt(() => {
    if (!budgetData || !budgetData.tax || !budgetData.expenses) return null;
    const monthlyTakeHome = budgetData.tax.takeHome / 12;
    const monthlyExp = window.sumExpenses ? window.sumExpenses(budgetData.expenses) : Object.values(budgetData.expenses).filter(v => typeof v === "number").reduce((a, b) => a + b, 0);
    return Math.max(0, Math.round(monthlyTakeHome - monthlyExp));
  }, [budgetData?.tax?.takeHome, JSON.stringify(budgetData?.expenses || {})]);

  // Read user's current liquid cash (sum of accounts) for the emergency-fund constraint.
  const currentLiquid = useMemoDebt(() => {
    try {
      const accounts = JSON.parse(localStorage.getItem("ledger:accounts") || "[]");
      return accounts.reduce((a, x) => a + (Number(x.balance) || 0), 0);
    } catch { return 0; }
  }, [tick]);

  // Live optimization result — always computed so rationale + what-if can be
  // displayed without clicking Optimize.
  const optimization = useMemoDebt(() => {
    if (manualMode) return null;
    return optimizeAllocation({
      debts, cash: spareCash, savingsAPY, constraints, currentLiquid,
    });
  }, [debts, spareCash, savingsAPY, constraints, currentLiquid, manualMode]);

  // What-if scenarios: re-run the optimizer with shifted rates.
  const whatIfScenarios = useMemoDebt(() => {
    if (manualMode) return [];
    const baseline = optimization?.pct;
    const scenarios = [
      { key: "apy-down", label: "HYSA drops 1%", apy: Math.max(0, savingsAPY - 0.01), aprDelta: 0 },
      { key: "apy-up",   label: "HYSA rises 1%", apy: savingsAPY + 0.01,               aprDelta: 0 },
      { key: "apr-up",   label: "Debt APR +5%",  apy: savingsAPY,                       aprDelta: 0.05 },
      { key: "refi",     label: "Refi highest debt −2%", apy: savingsAPY,               aprDelta: 0, refiTopApr: -0.02 },
    ];
    return scenarios.map((s) => {
      let scenarioDebts = debts.map((d) => ({ ...d, apr: (Number(d.apr) || 0) + s.aprDelta }));
      if (s.refiTopApr) {
        // Find highest-APR debt and reduce
        const idx = scenarioDebts.reduce((bestIdx, d, i, arr) =>
          (Number(d.apr) || 0) > (Number(arr[bestIdx].apr) || 0) ? i : bestIdx, 0);
        if (scenarioDebts[idx]) scenarioDebts[idx] = {
          ...scenarioDebts[idx],
          apr: Math.max(0, (Number(scenarioDebts[idx].apr) || 0) + s.refiTopApr),
        };
      }
      const r = optimizeAllocation({
        debts: scenarioDebts, cash: spareCash, savingsAPY: s.apy, constraints, currentLiquid,
      });
      return {
        ...s,
        result: r,
        changed: baseline != null && Math.abs((r.pct || 0) - baseline) > 0.001,
      };
    });
  }, [debts, spareCash, savingsAPY, constraints, currentLiquid, optimization?.pct, manualMode]);


  useEffectDebt(() => {
    if (autoSpare && budgetLeftover != null) setSpareCash(budgetLeftover);
  }, [autoSpare, budgetLeftover]);

  useEffectDebt(() => {
    try {
      const saved = JSON.parse(localStorage.getItem("ledger:debt") || "null");
      if (saved) {
        saved.debts && setDebts(saved.debts);
        typeof saved.spareCash === "number" && setSpareCash(saved.spareCash);
        typeof saved.autoSpare === "boolean" && setAutoSpare(saved.autoSpare);
        typeof saved.debtPct === "number" && setDebtPct(saved.debtPct);
        typeof saved.savingsAPY === "number" && setSavingsAPY(saved.savingsAPY);
        typeof saved.paymentFreq === "number" && setPaymentFreq(saved.paymentFreq);
        saved.strategy && setStrategy(saved.strategy);
        if (typeof saved.manualMode === "boolean") setManualMode(saved.manualMode);
        if (saved.constraints && typeof saved.constraints === "object") {
          setConstraints((c) => ({ ...c, ...saved.constraints }));
        }
        if (typeof saved.customDebtAmount === "number") {
          // ── Migration ──
          // Old semantic: customDebtAmount = extra above minimums (smaller number).
          // New semantic: customDebtAmount = total going to debt (incl. minimums).
          // A boolean flag `customDebtIsTotal` marks already-migrated saves.
          if (saved.customDebtIsTotal) {
            setCustomDebtAmount(saved.customDebtAmount);
          } else {
            const m = (saved.debts || []).reduce((a, d) => a + (Number(d.minPayment) || 0), 0);
            setCustomDebtAmount(saved.customDebtAmount + m);
          }
        }
      }
    } catch {}
  }, []);
  useEffectDebt(() => {
    // Persist customDebtAmount too so the Overview tab can read it (was the missing piece —
    // user's exact override on Debt page wasn't flowing to Overview before).
    localStorage.setItem("ledger:debt", JSON.stringify({
      debts, spareCash, autoSpare, debtPct, savingsAPY, paymentFreq, strategy,
      customDebtAmount,
      customDebtIsTotal: true, // mark new-semantic save so migration runs once
      manualMode, constraints,
    }));
  }, [debts, spareCash, autoSpare, debtPct, savingsAPY, paymentFreq, strategy, customDebtAmount, manualMode, constraints]);

  // Compute total of monthly minimums up-front — used both to derive "extra"
  // from a user-entered TOTAL and to display the consistent breakdown.
  const minTotal = useMemoDebt(
    () => debts.reduce((a, d) => a + (Number(d.minPayment) || 0), 0),
    [debts]
  );

  // Derive extra-toward-debt and to-savings from EITHER the % slider OR a custom $ amount.
  // The custom field now represents the TOTAL going to debt each month (minimums + extra)
  // so it matches the "Minimums + extra" total shown in the sidebar. We subtract
  // minimums internally to get the extra portion that actually rolls to the strategy target.
  const useCustom = customDebtAmount != null && customDebtAmount >= 0;
  const customTotalTowardDebt = useCustom
    ? Math.max(0, Math.round(customDebtAmount))
    : null;
  // "extra" is what's available ABOVE the minimums. Floored at 0 if user typed less than minimums.
  const extra     = useCustom
    ? Math.max(0, Math.min(customTotalTowardDebt - minTotal, Math.round(spareCash)))
    : Math.round(spareCash * debtPct);
  const toSavings = Math.max(0, Math.round(spareCash) - extra);
  const effectivePct = spareCash > 0 ? extra / spareCash : 0;

  // Sanity check — does (bills + minimums + extra + savings) exceed take-home?
  // Warns the user if their commitments don't fit their take-home.
  const sanityCheck = useMemoDebt(() => {
    if (!budgetData?.tax?.takeHome) return null;
    const monthlyTakeHome = budgetData.tax.takeHome / 12;
    const monthlyBills = window.sumExpenses ? window.sumExpenses(budgetData.expenses) : 0;
    const minTotalNow = debts.reduce((a, d) => a + (Number(d.minPayment) || 0), 0);
    const otherLoanInBudget = Number(budgetData.expenses?.otherLoan) || 0;
    // If user has tracked debts AND budget already counts an "Other loan", strip
    // the budget copy so we don't double-count.
    const adjustedBills = debts.length > 0 ? monthlyBills - otherLoanInBudget : monthlyBills;
    const totalOut = adjustedBills + minTotalNow + extra + toSavings;
    const gap = totalOut - monthlyTakeHome;
    return {
      takeHome: monthlyTakeHome,
      bills: adjustedBills,
      debtMins: minTotalNow,
      extraToDebt: extra,
      savings: toSavings,
      totalOut,
      gap,
      overspent: gap > 1, // float tolerance
    };
  }, [budgetData?.tax?.takeHome, JSON.stringify(budgetData?.expenses || {}), debts, extra, toSavings]);

  const updDebt = (i, k, v) => setDebts((d) => d.map((x, j) => j === i ? { ...x, [k]: v } : x));
  const removeDebt = (i) => setDebts((d) => d.filter((_, j) => j !== i));
  const addDebt = () => setDebts((d) => [...d, {
    name: "New debt", type: "other", balance: 1000, apr: 0.10, minPayment: 50,
    dueDay: 1, takenDate: todayISO,
  }]);

  // When user picks a debt type, prefill APR and recompute the suggested min payment.
  const applyDebtType = (i, typeKey) => {
    const t = DEBT_TYPES[typeKey];
    if (!t) return;
    setDebts((arr) => arr.map((x, j) => {
      if (j !== i) return x;
      const next = { ...x, type: typeKey };
      // Only prefill APR if it was at default/zero — don't clobber a user-entered rate
      if (!x.apr || x.apr === 0 || x.apr === DEBT_TYPES[x.type || "other"]?.apr) {
        next.apr = t.apr;
      }
      next.minPayment = estimateMinPayment(typeKey, x.balance, next.apr);
      return next;
    }));
  };
  const reEstimateMin = (i) => {
    setDebts((arr) => arr.map((x, j) => {
      if (j !== i) return x;
      return { ...x, minPayment: estimateMinPayment(x.type || "other", x.balance, x.apr) };
    }));
  };

  const totals = useMemoDebt(() => ({
    balance: debts.reduce((a, b) => a + b.balance, 0),
    min:     debts.reduce((a, b) => a + b.minPayment, 0),
  }), [debts]);

  const chosen   = useMemoDebt(() => simulatePayoffWithSavings(debts, extra, strategy, toSavings, savingsAPY, paymentFreq), [debts, extra, strategy, toSavings, savingsAPY, paymentFreq]);
  const allDebt  = useMemoDebt(() => simulatePayoffWithSavings(debts, spareCash, strategy, 0, savingsAPY, paymentFreq), [debts, spareCash, strategy, savingsAPY, paymentFreq]);
  const allSave  = useMemoDebt(() => simulatePayoffWithSavings(debts, 0, strategy, spareCash, savingsAPY, paymentFreq), [debts, spareCash, strategy, savingsAPY, paymentFreq]);
  const other  = useMemoDebt(() => simulatePayoff(debts, extra, strategy === "snowball" ? "avalanche" : "snowball"), [debts, extra, strategy]);
  const minOnly = useMemoDebt(() => simulatePayoff(debts, 0, strategy), [debts, strategy]);

  const monthsSaved = Math.max(0, minOnly.months - chosen.months);
  const interestSaved = Math.max(0, minOnly.totalInterest - chosen.totalInterest);

  return (
    <>
      <header className="page-head">
        <div><h1 className="page-title">Debt <em>payoff</em></h1></div>
        <div className="page-head-right">
          <div className="page-head-actions">
            {window.AutoSaveIndicator && <window.AutoSaveIndicator value={{ debts, spareCash, debtPct, savingsAPY, strategy, customDebtAmount, manualMode, constraints }} />}
            <ExportButton calculatorName="Debt payoff" />
          </div>
          <div className="page-sub">Snowball vs avalanche · find your fastest exit</div>
        </div>
      </header>

      <div className="layout">
        <aside className="col-inputs">
          <section className="card v1-enter v1-enter-0" id="split-card">
            <header className="card-head">
              <h2>Save vs pay down</h2>
              <span className="card-tag">
                {fmtUSD0(extra)}<span style={{ color: "var(--ink-3)" }}>/mo to debt</span>
              </span>
            </header>
            <div className="card-body stack">
              {/* The new "Auto-optimize" replaces the old "Spare cash" + slider + APY math.
                  Reads the Budget surplus, picks the best split based on debt APR vs savings APY,
                  then applies it. Single button — user just clicks to optimize. */}
              <div className="debt-optimize-box">
                <div className="debt-optimize-row">
                  <div className="debt-optimize-eyebrow">
                    {budgetLeftover != null && budgetLeftover > 0
                      ? "From your Budget surplus"
                      : (spareCash > 0 ? "Cash you'll commit" : "Pick an amount to commit")}
                  </div>
                  <div className="debt-optimize-val">
                    {budgetLeftover != null && budgetLeftover > 0
                      ? <>{fmtUSD0(budgetLeftover)}<span className="debt-optimize-val-sub">/mo</span></>
                      : (spareCash > 0
                          ? <>{fmtUSD0(spareCash)}<span className="debt-optimize-val-sub">/mo</span></>
                          : <Money value={spareCash} onChange={(v) => { setSpareCash(v); setAutoSpare(false); }} placeholder="500" />
                        )}
                  </div>
                </div>
                <button
                  className="btn-primary debt-optimize-btn"
                  disabled={manualMode}
                  title={manualMode ? "Manual mode is on — disable it to let the optimizer adjust your split." : ""}
                  onClick={() => {
                    if (manualMode) return;
                    // Pick cash source
                    const cash = (budgetLeftover != null && budgetLeftover > 0)
                      ? budgetLeftover
                      : (spareCash > 0 ? spareCash : Math.max(500, totals.min));
                    setSpareCash(cash);
                    setAutoSpare(budgetLeftover != null && budgetLeftover > 0);
                    // Run the pure optimizer with constraints
                    const result = optimizeAllocation({
                      debts, cash, savingsAPY, constraints, currentLiquid,
                    });
                    setDebtPct(result.pct);
                    setCustomDebtAmount(null);
                    // Only auto-estimate min payments for debts that have 0 — never override user values
                    setDebts((arr) => arr.map((d) => ({
                      ...d,
                      minPayment: d.minPayment > 0 ? d.minPayment : estimateMinPayment(d.type || "other", d.balance, d.apr),
                    })));
                  }}
                >
                  ✦ Optimize automatically
                </button>

                {/* Manual-mode toggle (off by default) */}
                <label className="track-toggle" style={{ marginTop: 10 }}>
                  <input type="checkbox" checked={manualMode}
                    onChange={(e) => setManualMode(e.target.checked)} />
                  <span className="track-toggle-pill"><span className="track-toggle-knob" /></span>
                  <span className="track-toggle-label">
                    {manualMode ? "🔒 Manual mode — I'll manage my debt myself" : "Manual mode (optimizer disabled)"}
                  </span>
                </label>

                {/* Rationale — always shown when not in manual mode */}
                {!manualMode && optimization && (
                  <div className="debt-rationale">
                    <div className="debt-rationale-head">
                      <span className={"debt-rationale-priority debt-rationale-priority-" + optimization.priority.toLowerCase()}>
                        Priority: {optimization.priority}
                      </span>
                      <span className="debt-rationale-split">
                        {Math.round(optimization.pct * 100)}% debt · {Math.round((1 - optimization.pct) * 100)}% save
                      </span>
                    </div>
                    <div className="debt-rationale-reason">{optimization.reason}</div>
                    {optimization.constraintHit && (
                      <div className="debt-rationale-constraint">
                        ⚙ rule applied: {
                          optimization.constraintHit === "emergency" ? "Build emergency fund first" :
                          optimization.constraintHit === "smallDebt"  ? "Clear small debts first (snowball)" :
                          optimization.constraintHit === "maxDebtShare" ? `Keeping ${Math.round((1-constraints.maxDebtPctForcedSavings)*100)}% liquid (rule)` : ""
                        }
                      </div>
                    )}
                  </div>
                )}

                {/* What-if forecast */}
                {!manualMode && whatIfScenarios.length > 0 && (
                  <details className="debt-whatif">
                    <summary>What if rates change?</summary>
                    <div className="debt-whatif-body">
                      {whatIfScenarios.map((s) => (
                        <div key={s.key} className={"debt-whatif-row" + (s.changed ? " is-changed" : "")}>
                          <span className="debt-whatif-label">{s.label}</span>
                          <span className="debt-whatif-result">
                            {Math.round(s.result.pct * 100)}/{Math.round((1 - s.result.pct) * 100)}
                            <span className="debt-whatif-tag">
                              {s.changed ? `→ ${s.result.priority.toLowerCase()}` : "no change"}
                            </span>
                          </span>
                        </div>
                      ))}
                    </div>
                  </details>
                )}

                {/* Rules expandable */}
                <details className="debt-rules" open={showRules} onToggle={(e) => setShowRules(e.target.open)}>
                  <summary>Optimizer rules</summary>
                  <div className="debt-rules-body">
                    <div className="debt-rule-row">
                      <label className="debt-rule-label">
                        Min emergency fund
                        <span className="debt-rule-hint">Don't push extras to debt until liquid cash reaches this much.</span>
                      </label>
                      <Money value={constraints.minEmergencyFund}
                        onChange={(v) => updConstraint("minEmergencyFund", Math.max(0, Number(v) || 0))}
                        placeholder="1000" />
                    </div>
                    <div className="debt-rule-row">
                      <label className="debt-rule-label">
                        Clear small debts first
                        <span className="debt-rule-hint">Snowball-style: blow through tiny balances for psychological wins.</span>
                      </label>
                      <label className="track-toggle">
                        <input type="checkbox" checked={constraints.clearSmallDebtsFirst}
                          onChange={(e) => updConstraint("clearSmallDebtsFirst", e.target.checked)} />
                        <span className="track-toggle-pill"><span className="track-toggle-knob" /></span>
                      </label>
                    </div>
                    {constraints.clearSmallDebtsFirst && (
                      <div className="debt-rule-row">
                        <label className="debt-rule-label">
                          Small-debt threshold
                          <span className="debt-rule-hint">Balances under this count as "small".</span>
                        </label>
                        <Money value={constraints.smallDebtThreshold}
                          onChange={(v) => updConstraint("smallDebtThreshold", Math.max(0, Number(v) || 0))}
                          placeholder="500" />
                      </div>
                    )}
                    <div className="debt-rule-row">
                      <label className="debt-rule-label">
                        Max debt share
                        <span className="debt-rule-hint">Never put more than this much of monthly cash to debt.</span>
                      </label>
                      <NumberInput
                        value={(constraints.maxDebtPctForcedSavings * 100).toFixed(0)}
                        onChange={(v) => updConstraint("maxDebtPctForcedSavings", Math.max(0.1, Math.min(1, (Number(v) || 95) / 100)))}
                        suffix="%"
                      />
                    </div>
                  </div>
                </details>

                {/* Sanity-check banner — only when overspent */}
                {sanityCheck?.overspent && (
                  <div className="debt-sanity-warn">
                    ⚠ Your commitments exceed take-home by <strong>{fmtUSD0(sanityCheck.gap)}/mo</strong>.
                    <div className="debt-sanity-detail">
                      Bills {fmtUSD0(sanityCheck.bills)} + debt minimums {fmtUSD0(sanityCheck.debtMins)}
                      {sanityCheck.extraToDebt > 0 && ` + extra debt ${fmtUSD0(sanityCheck.extraToDebt)}`}
                      {sanityCheck.savings > 0 && ` + savings ${fmtUSD0(sanityCheck.savings)}`}
                      {" = "}<strong>{fmtUSD0(sanityCheck.totalOut)}/mo</strong> vs take-home {fmtUSD0(sanityCheck.takeHome)}.
                    </div>
                  </div>
                )}

                <p className="debt-optimize-explain">
                  {manualMode
                    ? "Manual mode is on. The optimizer won't adjust your split. Your minimums are locked — only you can change them."
                    : "Picks the smartest split based on your debt APR vs savings APY, modified by your rules above."}
                </p>
              </div>

              <details className="debt-manual-details">
                <summary>Manual override</summary>
                <div className="stack" style={{ gap: 12, paddingTop: 12 }}>
                  <Field
                    label="Total going to debt each month"
                    hint={minTotal > 0
                      ? `includes ${fmtUSD0(minTotal)}/mo minimums + extra rolled to target debt`
                      : "leave blank to use the slider below"}
                  >
                    <Money
                      value={useCustom ? customDebtAmount : 0}
                      onChange={(v) => setCustomDebtAmount(v > 0 ? v : null)}
                      placeholder={`e.g. ${Math.round(minTotal + spareCash * 0.5)}`}
                    />
                    {useCustom && (
                      <div className="split-share-line" style={{ marginTop: 6 }}>
                        {customTotalTowardDebt >= minTotal ? (
                          <>
                            <strong>{fmtUSD0(minTotal)}/mo minimums</strong>
                            <span className="split-share-sep">+</span>
                            <strong>{fmtUSD0(extra)}/mo extra</strong>
                            <span className="split-share-sep">=</span>
                            <strong>{fmtUSD0(minTotal + extra)}/mo total</strong>
                            {toSavings > 0 && (
                              <>
                                <span className="split-share-sep">·</span>
                                <span style={{ color: "var(--positive)" }}>{fmtUSD0(toSavings)}/mo to savings</span>
                              </>
                            )}
                          </>
                        ) : (
                          <span style={{ color: "var(--negative)" }}>
                            Below minimums — at least <strong>{fmtUSD0(minTotal)}/mo</strong> must go to debt to avoid default.
                          </span>
                        )}
                      </div>
                    )}
                  </Field>
                  <Field label={`Or split: ${fmtUSD0(minTotal + extra)}/mo debt · ${fmtUSD0(toSavings)}/mo save`}>
                    <div className="split-slider-wrap">
                      <input
                        type="range" min={0} max={1} step={0.05}
                        value={useCustom ? effectivePct : debtPct}
                        onChange={(e) => { setDebtPct(Number(e.target.value)); setCustomDebtAmount(null); }}
                      />
                      <div className="split-slider-labels">
                        <span style={{ color: "var(--positive)" }}>{Math.round((1-(useCustom?effectivePct:debtPct))*100)}% save</span>
                        <span style={{ color: "var(--gold)" }}>{Math.round((useCustom?effectivePct:debtPct)*100)}% pay debt</span>
                      </div>
                    </div>
                  </Field>
                  <div className="split-bar">
                    <div className="split-bar-save" style={{ width: ((1-(useCustom?effectivePct:debtPct))*100) + "%" }} />
                    <div className="split-bar-debt" style={{ width: ((useCustom?effectivePct:debtPct)*100) + "%" }} />
                  </div>
                  <Field label="Savings APY" hint="high-yield savings, etc.">
                    <NumberInput value={(savingsAPY * 100).toFixed(2)} onChange={(v) => setSavingsAPY(v / 100)} suffix="%" min={0} />
                  </Field>
                  <Field label="Payment frequency" hint={paymentFreq === 1 ? "applied each month" : `lump sum every ${paymentFreq} months`}>
                    <Segment
                      value={paymentFreq}
                      onChange={setPaymentFreq}
                      options={[
                        { value: 1,  label: "Monthly" },
                        { value: 3,  label: "3 mo" },
                        { value: 6,  label: "6 mo" },
                        { value: 12, label: "Yearly" },
                      ]}
                    />
                  </Field>
                </div>
              </details>
            </div>
          </section>

          <section className="card v1-enter v1-enter-1">
            <header className="card-head"><h2>Strategy</h2></header>
            <div className="card-body stack">
              <Field label="Method" hint={strategy === "snowball" ? "smallest balance first" : "highest rate first"}>
                <Segment
                  value={strategy}
                  onChange={setStrategy}
                  options={[
                    { value: "avalanche", label: "Avalanche" },
                    { value: "snowball",  label: "Snowball" },
                  ]}
                />
              </Field>
            </div>
          </section>

          <section className="card v1-enter v1-enter-2">
            <header className="card-head">
              <h2>Totals</h2>
              <span className="card-tag">{debts.length} debts</span>
            </header>
            <div className="card-body">
              <div className="kpi" style={{ border: "none", background: "transparent", padding: 0, marginBottom: 12 }}>
                <div className="kpi-eyebrow">Total balance</div>
                <div className="kpi-num">{fmtUSD0(totals.balance)}</div>
              </div>
              <div className="kpi" style={{ border: "none", background: "transparent", padding: 0 }}>
                <div className="kpi-eyebrow">Minimums + extra</div>
                <div className="kpi-num">{fmtUSD0(totals.min + extra)}<span style={{ fontSize: 14, color: "var(--ink-3)" }}>/mo</span></div>
                <div className="kpi-sub">{fmtUSD0(totals.min)} min + {fmtUSD0(extra)} extra</div>
              </div>
            </div>
          </section>
        </aside>

        <section className="col-results">
          <section className="hero-card">
            <div className="hero-grid">
              <div className="hero-block">
                <div className="hero-eyebrow">Debt-free in</div>
                <div className="hero-num surplus">
                  {Math.floor(chosen.months / 12)}<span className="hero-num-sm">y</span>
                  {" "}{chosen.months % 12}<span className="hero-num-sm">m</span>
                </div>
                <div className="hero-sub">
                  vs {Math.floor(minOnly.months / 12)}y {minOnly.months % 12}m on minimums alone
                </div>
              </div>
              <div className="hero-divider" />
              <div className="hero-block">
                <div className="hero-eyebrow">Interest saved</div>
                <div className="hero-num surplus">{fmtUSD0(interestSaved)}</div>
                <div className="hero-sub">
                  {fmtUSD0(chosen.totalInterest)} paid vs {fmtUSD0(minOnly.totalInterest)} on minimums
                </div>
              </div>
            </div>
          </section>

          <div className="kpi-grid">
            <div className="kpi">
              <div className="kpi-eyebrow">Saved by debt-free date</div>
              <div className="kpi-num pos">{fmtUSD0(chosen.savingsBalance)}</div>
              <div className="kpi-sub">at {fmtPct(savingsAPY, 1)} APY</div>
            </div>
            <div className="kpi">
              <div className="kpi-eyebrow">Net position</div>

// ─── Per-debt allocation card ────────────────────────────────────────────
// Shows where each dollar of the user's monthly debt budget actually flows:
// each debt's minimum payment, plus the strategy-targeted debt receives the
// entire "extra" amount on top. Collapsible card with chevron header.
function DebtAllocationCard({ debts, extra, strategy }) {
  const [open, setOpen] = useStateDebt(true);
  // Pick the strategy-targeted debt: highest APR (avalanche) or smallest balance (snowball)
  const active = debts.filter((d) => (Number(d.balance) || 0) > 0);
  const sorted = [...active].sort((a, b) =>
    strategy === "snowball" ? (a.balance - b.balance) : (b.apr - a.apr)
  );
  const target = sorted[0]; // the one getting the extra
  const minTotal = active.reduce((a, d) => a + (Number(d.minPayment) || 0), 0);
  const totalMonthly = minTotal + (Number(extra) || 0);

  return (
    <section className="card">
      <header
        className="card-head"
        style={{ cursor: "pointer" }}
        onClick={() => setOpen((v) => !v)}
      >
        <h2 style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <span className={"debt-card-chevron" + (open ? " is-open" : "")} style={{ pointerEvents: "none" }} aria-hidden="true">▾</span>
          Where each dollar goes
        </h2>
        <span className="card-tag">
          {fmtUSD0(totalMonthly)}/mo · {active.length} debt{active.length !== 1 ? "s" : ""}
        </span>
      </header>
      {open && <div className="card-body">
        <p className="footnote" style={{ marginTop: 0 }}>
          Each debt receives its <strong>minimum payment</strong> every month.
          Your <strong>extra {fmtUSD0(extra)}/mo</strong> is rolled to the {strategy === "snowball" ? "smallest-balance" : "highest-APR"} debt
          {target ? <> — currently <strong>{target.name}</strong></> : ""}.
        </p>

        <table className="ptable" style={{ marginTop: 12 }}>
          <thead>
            <tr>
              <th>Debt</th>
              <th className="num">Balance</th>
              <th className="num">APR</th>
              <th className="num">Minimum</th>
              <th className="num">+ Extra</th>
              <th className="num">Total this month</th>
              <th className="num">% of budget</th>
            </tr>
          </thead>
          <tbody>
            {sorted.map((d) => {
              const min = Number(d.minPayment) || 0;
              const extraPart = (target && d === target) ? (Number(extra) || 0) : 0;
              const total = min + extraPart;
              const pctOfBudget = totalMonthly > 0 ? total / totalMonthly : 0;
              return (
                <tr key={d.name}>
                  <td>
                    {d.name}
                    {target && d === target && (
                      <span className="card-tag" style={{ marginLeft: 8, fontSize: 10 }}>
                        ⚡ target
                      </span>
                    )}
                  </td>
                  <td className="num">{fmtUSD0(d.balance)}</td>
                  <td className="num">{fmtPct(d.apr || 0, 1)}</td>
                  <td className="num">{fmtUSD0(min)}</td>
                  <td className="num pos">{extraPart > 0 ? `+ ${fmtUSD0(extraPart)}` : "—"}</td>
                  <td className="num"><strong>{fmtUSD0(total)}</strong></td>
                  <td className="num">{(pctOfBudget * 100).toFixed(1)}%</td>
                </tr>
              );
            })}
            <tr style={{ borderTop: "2px solid var(--border-2)", fontWeight: 500 }}>
              <td><strong>Total</strong></td>
              <td className="num">{fmtUSD0(active.reduce((a, d) => a + (Number(d.balance) || 0), 0))}</td>
              <td className="num">—</td>
              <td className="num"><strong>{fmtUSD0(minTotal)}</strong></td>
              <td className="num pos"><strong>+ {fmtUSD0(extra)}</strong></td>
              <td className="num"><strong>{fmtUSD0(totalMonthly)}</strong></td>
              <td className="num">100.0%</td>
            </tr>
          </tbody>
        </table>

        {/* Visual stacked bar — proportions of where the money goes */}
        <div style={{ marginTop: 16 }}>
          <div className="port-bar" style={{ height: 18 }}>
            {sorted.map((d, i) => {
              const min = Number(d.minPayment) || 0;
              const extraPart = (target && d === target) ? (Number(extra) || 0) : 0;
              const total = min + extraPart;
              const w = totalMonthly > 0 ? (total / totalMonthly) * 100 : 0;
              const isTarget = (target && d === target);
              const color = isTarget ? "var(--accent-2)" : ["#C9A96E", "#5A8FA3", "#9C7C4B", "#4FB5B0", "#A07ABE"][i % 5];
              return (
                <div key={d.name}
                  style={{ width: `${w}%`, background: color }}
                  title={`${d.name}: ${fmtUSD0(total)} (${w.toFixed(1)}%)`}
                />
              );
            })}
          </div>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 12, marginTop: 10, fontSize: 11, color: "var(--ink-3)" }}>
            {sorted.map((d, i) => {
              const isTarget = (target && d === target);
              const color = isTarget ? "var(--accent-2)" : ["#C9A96E", "#5A8FA3", "#9C7C4B", "#4FB5B0", "#A07ABE"][i % 5];
              return (
                <span key={d.name}>
                  <span style={{ display: "inline-block", width: 10, height: 10, background: color, marginRight: 4, verticalAlign: "middle" }} />
                  {d.name}
                </span>
              );
            })}
          </div>
        </div>
      </div>}
    </section>
  );
}

<script type="text/babel" data-presets="react">
// Record tab — dated expense transaction log.
//
// The ONLY data-entry surface for window.Transactions. Other tabs (the
// existing 9 calculator tabs) are untouched. The Current Summary inside
// this tab (read-only) lives below in Step 3.
//
// Architecture:
//   • Reads via the useTransactions React hook (exposed by calc-transactions.jsx).
//   • Mutates via window.Transactions.add/edit/remove.
//   • Never touches localStorage directly.
//   • Money math: dollars typed in the form → toCents on submit, stored as
//     amount_cents. Display via fmtUSD0(toDollars(cents)).
//
// UI patterns: matches the existing app — uses Field, NumberInput from
// shared.jsx, card / card-head / card-body / port-empty classes.

const { useState: useStateRec, useMemo: useMemoRec, useEffect: useEffectRec, useRef: useRefRec } = React;

// Common categories — quick-pick chips beneath the amount input.
const RECORD_CATEGORIES = [
  "Groceries", "Dining", "Gas", "Coffee", "Subscriptions",
  "Shopping", "Entertainment", "Transit", "Bills", "Health",
  "Travel", "Other",
];

function todayISO_() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

// Tiny pretty-print "May 24, 2026" / "Today" / "Yesterday" / "May 22 (Sun)"
function formatDayHeader(iso) {
  if (!iso) return "—";
  const [y, m, d] = iso.split("-").map(Number);
  const dt = new Date(y, m - 1, d);
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const yesterday = new Date(today); yesterday.setDate(today.getDate() - 1);
  const isToday = dt.getTime() === today.getTime();
  const isYesterday = dt.getTime() === yesterday.getTime();
  const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const stamp = `${MONTHS[dt.getMonth()]} ${dt.getDate()}` + (dt.getFullYear() !== today.getFullYear() ? `, ${dt.getFullYear()}` : "");
  if (isToday) return `Today — ${stamp}`;
  if (isYesterday) return `Yesterday — ${stamp}`;
  return `${stamp} (${DAYS[dt.getDay()]})`;
}

// ─── Entry form ──────────────────────────────────────────────────────────
function RecordEntryForm({ editing, onCancelEdit, executiveStyle }) {
  // Local string state for the amount field so we can validate before parsing.
  const [amountStr, setAmountStr] = useStateRec("");
  const [category, setCategory] = useStateRec("Groceries");
  const [date, setDate] = useStateRec(todayISO_);
  const [note, setNote] = useStateRec("");
  const [error, setError] = useStateRec("");
  const amountRef = useRefRec(null);

  // Hydrate the form when "editing" target changes
  useEffectRec(() => {
    if (editing) {
      setAmountStr(window.toDollars(editing.amount_cents).toFixed(2));
      setCategory(editing.category || "Groceries");
      setDate(editing.date || todayISO_());
      setNote(editing.note || "");
      setError("");
    }
  }, [editing && editing.id]);

  const reset = () => {
    setAmountStr("");
    setCategory("Groceries");
    setDate(todayISO_());
    setNote("");
    setError("");
  };

  const submit = (e) => {
    e?.preventDefault?.();
    // Validate amount: must be a positive number > 0
    const trimmed = String(amountStr).trim();
    if (trimmed === "") {
      setError("Amount is required.");
      amountRef.current?.focus();
      return;
    }
    // Strip any non-numeric (allow leading $, commas, decimal)
    const cleaned = trimmed.replace(/[^0-9.\-]/g, "");
    const n = Number(cleaned);
    if (!isFinite(n) || isNaN(n)) {
      setError("Amount must be a number.");
      amountRef.current?.focus();
      return;
    }
    if (n < 0) {
      setError("Amount can't be negative.");
      amountRef.current?.focus();
      return;
    }
    if (n === 0) {
      setError("Amount must be greater than $0.");
      amountRef.current?.focus();
      return;
    }
    const cents = window.toCents(n);
    if (cents <= 0 || !isFinite(cents)) {
      setError("Amount is invalid.");
      return;
    }

    if (editing) {
      window.Transactions.edit(editing.id, {
        amount_cents: cents,
        category: (category || "Other").trim(),
        date,
        note: note.trim(),
      });
      onCancelEdit && onCancelEdit();
    } else {
      window.Transactions.add({
        amount_cents: cents,
        category: (category || "Other").trim(),
        date,
        note: note.trim(),
      });
    }
    reset();
  };

  const showCancel = !!editing;

  // ── Executive vs traditional shell ────────────────────────────────────
  // In v2, the form is rendered without card chrome and with an eyebrow-style
  // section label matching the rest of the v2 aesthetic. In v1, the existing
  // card layout is preserved unchanged.
  if (executiveStyle) {
    return (
      <div style={{ padding: "16px 8px 24px", borderBottom: "1px solid var(--border)", marginBottom: 24 }}>
        <div style={{
          display: "flex", justifyContent: "space-between", alignItems: "baseline",
          marginBottom: 14,
        }}>
          <div style={{
            fontSize: 11, letterSpacing: "0.16em", textTransform: "uppercase",
            color: "var(--ink-4)", fontWeight: 500,
          }}>
            {editing ? "Edit entry" : "New entry"}
          </div>
          {window.AutoSaveIndicator && (
            <window.AutoSaveIndicator value={[amountStr, category, date, note]} />
          )}
        </div>
        <form onSubmit={submit} noValidate>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(140px, 1fr))", gap: 12 }}>
            <Field label="Amount" hint={error ? <span style={{color:"var(--negative)"}}>{error}</span> : "what did you spend?"}>
              <div className="money-input">
                <span className="money-prefix">$</span>
                <input
                  ref={amountRef}
                  type="text"
                  inputMode="decimal"
                  value={amountStr}
                  onChange={(e) => { setAmountStr(e.target.value); if (error) setError(""); }}
                  placeholder="0.00"
                  aria-invalid={!!error}
                />
              </div>
            </Field>
            <Field label="Category" hint="what was it for?">
              <input
                type="text"
                className="text-input"
                value={category}
                onChange={(e) => setCategory(e.target.value)}
                list="record-cat-list"
                placeholder="Groceries"
              />
              <datalist id="record-cat-list">

          <div className="port-presets" style={{ marginTop: 10, marginBottom: 14 }}>
