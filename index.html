    background: #f5f5f5 !important;
    border-bottom: 1pt solid #ccc !important;
    color: black !important;
  }
  .card-head h2 { color: black !important; }
  .card-tag,
  .card-tag-inline {
    color: #555 !important;
  }

  .hero-num { color: black !important; }
  .hero-num.surplus,
  .ptable .num.pos,
  .ltable-take .num {
    color: #1B4D3E !important;
  }
  .hero-num.deficit,
  .ptable .num.neg {
    color: #B2452A !important;
  }
  .hero-eyebrow,
  .hero-sub,
  .kpi-eyebrow,
  .kpi-sub {
    color: #555 !important;
  }
  .kpi-num { color: black !important; }
  .hero-divider { background: #ddd !important; }

  /* Tables */
  .ptable, .ltable, .amort-table {
    color: black !important;
  }
  .ptable th, .ltable th, .amort-table th {
    background: #f5f5f5 !important;
    color: #333 !important;
    border-bottom: 1pt solid #999 !important;
  }
  .ptable td, .ltable td, .amort-table td {
    border-bottom: 0.5pt solid #ddd !important;
    color: black !important;
  }
  .ptable .num, .ltable .num {
    color: black !important;
  }
  .ptable-year-start td {
    border-top: 1pt solid #999 !important;
  }
  .ptable-year-start td:first-child {
    color: #1B4D3E !important;
  }

  /* Stack bar */
  .stack-bar {
    border: 1pt solid #999 !important;
    background: white !important;
  }
  .legend-label { color: black !important; }
  .legend-val { color: black !important; }
  .legend-pct { color: #555 !important; }

  /* Formula box */
  .formula-box,
  .commute-summary,
  .route-result,
  .route-resolved {
    background: #fafafa !important;
    border-color: #ccc !important;
    color: black !important;
  }
  .formula-line { color: black !important; }
  .formula-hint { color: #555 !important; }
  .formula-total-step {
    background: #f0f7f3 !important;
    border-color: #1B4D3E !important;
  }
  .formula-line .num.formula-total { color: #1B4D3E !important; }

  /* Footnotes */
  .footnote {
    color: #555 !important;
    page-break-inside: avoid;
  }

  /* Add header */
  body.printing::before {
    content: "Ledger · Personal Finance Calculator";
    display: block;
    font-family: "Source Serif 4", Georgia, serif;
    font-size: 10pt;
    color: #999;
    padding-bottom: 8pt;
    margin-bottom: 12pt;
    border-bottom: 0.5pt solid #ddd;
  }
}

/* ===== Household calculator ===== */
.member-card {
  border-left: 3px solid var(--accent);
}
.member-name-input {
  background: transparent;
  border: none;
  outline: none;
  color: var(--ink);
  font-family: var(--display);
  font-size: 15px;
  font-weight: 500;
  padding: 2px 4px;
  border-bottom: 1px dashed transparent;
  transition: border-color 120ms;
  width: 100%;
}
.member-name-input:hover { border-bottom-color: var(--border-2); }
.member-name-input:focus { border-bottom-color: var(--accent); }
.member-dot {
  display: inline-block;
  width: 10px;
  height: 10px;
  border-radius: 2px;
  margin-right: 8px;
  vertical-align: 1px;
}
.member-card .card-head h2 {
  display: flex;
  align-items: center;
  gap: 0;
  flex: 1;
  min-width: 0;
}

.member-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 14px;
}
.member-summary {
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  border-radius: var(--r-lg);
  padding: 16px 18px;
}
.member-summary-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
}
.member-summary-name {
  font-family: var(--display);
  font-size: 15px;
  font-weight: 500;
  color: var(--ink);
}
.member-summary-takehome {
  font-family: var(--display);
  font-feature-settings: "tnum";
  font-size: 18px;
  color: var(--ink);
}
.member-summary-rows {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.member-summary-row {
  display: flex;
  justify-content: space-between;
  font-size: 12.5px;
  color: var(--ink-2);
  padding: 4px 0;
}
.member-summary-row .num {
  font-family: var(--display);
  font-feature-settings: "tnum";
  font-size: 13.5px;
}
.member-summary-row .num.pos { color: var(--positive); }
.member-summary-row .num.neg { color: var(--negative); }
.member-summary-total {
  border-top: 1px solid var(--border-2);
  margin-top: 4px;
  padding-top: 8px;
  color: var(--ink);
}
.member-summary-total .num {
  font-size: 17px;
}

/* ===== Split slider (debt vs savings) ===== */
.split-slider-wrap {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.split-slider-labels {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  font-family: var(--display);
  font-feature-settings: "tnum";
  margin-top: 2px;
}
.split-bar {
  height: 14px;
  border-radius: 4px;
  overflow: hidden;
  display: flex;
  background: var(--bg);
  border: 1px solid var(--border);
}
.split-bar-save { background: var(--positive); transition: width 200ms; }
.split-bar-debt { background: var(--gold); transition: width 200ms; }

/* ===== Data button & menu ===== */
.data-btn {
  margin-left: auto;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 10px;
  background: var(--surface);
  border: 1px solid var(--border-2);
  color: var(--ink-2);
  border-radius: var(--r);
  font-size: 11.5px;
  cursor: pointer;
  transition: all 140ms;
}
.data-btn:hover {
  border-color: var(--accent);
  color: var(--accent-2);
  background: var(--accent-bg);
}
.data-btn-icon {
  font-size: 13px;
  line-height: 1;
}

.data-menu {
  position: absolute;
  top: 62px;
  left: 16px;
  right: 16px;
  background: var(--surface-2);
  border: 1px solid var(--border-2);
  border-radius: var(--r-lg);
  box-shadow: 0 12px 32px rgba(0,0,0,0.5);
  z-index: 200;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.data-menu-head {
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}
.data-menu-title {
  font-family: var(--display);
  font-size: 15px;
  font-weight: 500;
  color: var(--ink);
}
.data-menu-sub {
  font-size: 11.5px;
  color: var(--ink-3);
  margin-top: 4px;
  line-height: 1.5;
}
.data-menu-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 10px 12px;
  text-align: left;
  cursor: pointer;
  transition: all 140ms;
  color: var(--ink);
}
.data-menu-item:hover {
  border-color: var(--accent);
  background: var(--accent-bg);
}
.data-menu-glyph {
  font-family: var(--display);
  font-size: 18px;
  font-weight: 500;
  color: var(--accent-2);
  width: 18px;
  text-align: center;
  flex-shrink: 0;
}
.data-menu-item-title {
  font-size: 13px;
  color: var(--ink);
}
.data-menu-item-sub {
  font-size: 11px;
  color: var(--ink-3);
  margin-top: 2px;
}
.data-menu-item-danger:hover {
  border-color: var(--negative);
  background: rgba(215, 118, 98, 0.08);
}
.data-menu-item-danger:hover .data-menu-glyph {
  color: var(--negative);
}
.data-status {
  padding: 8px 10px;
  font-size: 12px;
  border-radius: var(--r);
}
.data-status-ok {
  background: var(--accent-bg);
  border: 1px solid var(--accent-dim);
  color: var(--accent-2);
}
.data-status-err {
  background: rgba(215, 118, 98, 0.08);
  border: 1px solid rgba(215, 118, 98, 0.25);
  color: var(--negative);
}
.data-menu-foot {
  font-size: 10.5px;
  color: var(--ink-4);
  font-style: italic;
  font-family: var(--display);
  line-height: 1.5;
  padding-top: 4px;
  border-top: 1px solid var(--border);
}

.row-source {
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-3);
  font-family: var(--sans);
}

.health-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.health-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 12px;
  border-radius: var(--r);
  border: 1px solid var(--border);
  background: var(--bg);
}
.health-icon {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 600;
  flex-shrink: 0;
}
.health-ok   .health-icon { background: var(--accent-bg); color: var(--accent-2); border: 1px solid var(--accent-dim); }
.health-warn .health-icon { background: rgba(201,169,110,0.12); color: var(--gold); border: 1px solid var(--gold-dim); }
.health-bad  .health-icon { background: rgba(215,118,98,0.10); color: var(--negative); border: 1px solid rgba(215,118,98,0.30); }
.health-label {
  font-size: 13px;
  color: var(--ink);
  font-weight: 500;
}
.health-detail {
  font-size: 11.5px;
  color: var(--ink-3);
  margin-top: 2px;
  font-style: italic;
  font-family: var(--display);
}

.quick-stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.quick-stat {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 12px 14px;
}
.quick-stat-label {
  font-size: 10.5px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin-bottom: 6px;
}
.quick-stat-val {
  font-family: var(--display);
  font-size: 20px;
  color: var(--accent-2);
  font-feature-settings: "tnum";
}

/* ===== Maintenance editor ===== */
.maint-editor {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.maint-head {
  display: grid;
  grid-template-columns: 1fr 90px 130px 28px;
  gap: 6px;
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-3);
  padding: 0 0 4px 0;
}
.maint-row {
  display: grid;
  grid-template-columns: 1fr 90px 130px 28px;
  align-items: center;
  gap: 6px;
}
.maint-name {
  padding: 8px 10px;
  font-size: 13px;
}
.maint-freq {
  display: flex;
  align-items: center;
  gap: 6px;
}
.maint-freq-label {
  font-size: 10.5px;
  color: var(--ink-3);
  font-style: italic;
  font-family: var(--display);
  white-space: nowrap;
}
.maint-add {
  margin-top: 6px;
}

@media (max-width: 480px) {
  .maint-head { grid-template-columns: 1fr 70px 100px 24px; font-size: 9px; }
  .maint-row  { grid-template-columns: 1fr 70px 100px 24px; }
  .maint-freq-label { display: none; }
}

/* ===== Vehicle intro flow ===== */
.vehicle-intro {
  max-width: 720px;
  margin: 0 auto;
  animation: slideUp 280ms cubic-bezier(.2,.7,.2,1);
}
@keyframes slideUp {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}
.vehicle-intro-card { padding: 0; }
.vehicle-type-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 6px;
}
.vehicle-type-tile {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 20px 12px;
  background: var(--bg);
  border: 1px solid var(--border-2);
  border-radius: var(--r-lg);
  color: var(--ink);
  cursor: pointer;
  transition: all 160ms;
}
.vehicle-type-tile:hover {
  border-color: var(--accent);
  background: var(--surface-2);
}
.vehicle-type-tile.is-active {
  border-color: var(--accent);
  background: var(--accent-bg);
  box-shadow: 0 0 0 1px var(--accent);
}
.vehicle-type-glyph {
  font-size: 32px;
  line-height: 1;
}
.vehicle-type-label {
  font-family: var(--display);
  font-size: 14px;
  color: var(--ink);
}

.vehicle-meta-grid {
  display: grid;
  grid-template-columns: 100px 1fr 1fr;
  gap: 12px;
}

.vehicle-intro-summary {
  margin: 22px 0 18px;
  padding: 14px 16px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--r);
}
.vehicle-intro-summary-name {
  font-family: var(--display);
  font-size: 18px;
  color: var(--ink);
  margin-bottom: 4px;
}
.vehicle-intro-summary-defaults {
  font-size: 12.5px;
  color: var(--ink-3);
  line-height: 1.5;
}
.vehicle-intro-summary-defaults strong {
  color: var(--accent-2);
  font-family: var(--display);
  font-weight: 500;
}
.vehicle-intro-cta {
  width: 100%;
  padding: 14px;
  font-size: 14px;
}

@media (max-width: 480px) {
  .vehicle-type-grid { grid-template-columns: 1fr 1fr; }
  .vehicle-meta-grid { grid-template-columns: 1fr; }
}

/* ===== Combo input (type + dropdown) ===== */
.combo-wrap {
  position: relative;
}
.combo-input {
  padding-right: 32px;
}
.combo-toggle {
  position: absolute;
  top: 50%;
  right: 4px;
  transform: translateY(-50%);
  background: transparent;
  border: none;
  color: var(--ink-3);
  width: 26px;
  height: 26px;
  border-radius: 4px;
  font-size: 12px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: color 120ms;
}
.combo-toggle:hover { color: var(--accent-2); background: var(--accent-bg); }
.combo-toggle:disabled { opacity: 0.3; cursor: not-allowed; }
.combo-list {
  max-height: 280px;
  overflow-y: auto;
}
.combo-list .ac-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.combo-list .ac-item.is-current {
  color: var(--accent-2);
}

/* ===== Collapsible maintenance ===== */
.maint-collapse {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--r);
  overflow: hidden;
}
.maint-toggle {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  background: transparent;
  border: none;
  text-align: left;
  cursor: pointer;
  transition: background 120ms;
}
.maint-toggle:hover { background: var(--surface); }
.maint-toggle.is-open { background: var(--surface); border-bottom: 1px solid var(--border); }
.maint-toggle-text { flex: 1; min-width: 0; }
.maint-toggle-summary {
  margin-top: 6px;
  display: flex;
  align-items: baseline;
  gap: 8px;
}
.maint-toggle-mo {
  font-family: var(--display);
  font-feature-settings: "tnum";
  font-size: 18px;
  color: var(--accent-2);
}
.maint-toggle-yr {
  font-family: var(--display);
  font-feature-settings: "tnum";
  font-size: 13px;
  color: var(--ink-3);
  font-style: italic;
}
.maint-toggle-chevron {
  color: var(--ink-3);
  font-size: 14px;
  transition: transform 200ms;
}
.maint-toggle-chevron.is-open { transform: rotate(180deg); color: var(--accent-2); }
.maint-collapse-body {
  padding: 14px;
  animation: slideUp 200ms cubic-bezier(.2,.7,.2,1);
}

/* ===== Car hero (motion flow) ===== */
.car-hero {
  position: relative;
  height: 180px;
  background: linear-gradient(180deg, var(--surface-2) 0%, var(--surface) 100%);
  border: 1px solid var(--border-2);
  border-radius: var(--r-lg);
  margin-bottom: 18px;
  overflow: hidden;
  display: flex;
  align-items: center;
  padding: 0 28px;
}
.car-hero-bg {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
}
.car-hero-road {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 28px;
  height: 2px;
  background: var(--border-2);
  opacity: 0.6;
}
.car-hero-road::before,
.car-hero-road::after {
  content: "";
  position: absolute;
  bottom: -10px;
  height: 20px;
  background: linear-gradient(180deg, transparent 0%, var(--accent-bg) 60%);
  opacity: 0.4;
  left: 0; right: 0;
}
.car-hero-cloud {
  position: absolute;
  background: var(--accent-bg);
  border-radius: 100px;
  opacity: 0.25;
  animation: cloudDrift 25s linear infinite;
}
.car-hero-cloud-1 { top: 24px; left: -120px; width: 100px; height: 18px; animation-duration: 30s; }
.car-hero-cloud-2 { top: 52px; left: -200px; width: 140px; height: 22px; animation-duration: 38s; animation-delay: 6s; }
.car-hero-cloud-3 { top: 14px; left: -160px; width: 80px;  height: 14px; animation-duration: 24s; animation-delay: 14s; }
@keyframes cloudDrift {
  from { transform: translateX(0); }
  to   { transform: translateX(calc(100vw + 240px)); }
}

.car-hero-art {
  width: 280px;
  height: 130px;
  flex-shrink: 0;
  position: relative;
  z-index: 2;
  /* Transform is driven by Framer Motion (motion.div). Do not set a CSS
     transform animation here — it would fight FM's inline transform. */
}
.car-hero-svg-inner {
  width: 100%;
  height: 100%;
  display: block;
}
.car-hero-art svg {
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 8px 16px rgba(0,0,0,0.4));
  animation: carBob 4s ease-in-out infinite, carShine 1100ms ease-out both;
}
@keyframes carBob {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-2px); }
}
@keyframes carShine {
  0%   { filter: drop-shadow(0 8px 16px rgba(0,0,0,0.4)) brightness(1)    saturate(1); }
  35%  { filter: drop-shadow(0 8px 22px rgba(107,194,149,0.65)) brightness(1.30) saturate(1.2); }
  100% { filter: drop-shadow(0 8px 16px rgba(0,0,0,0.4)) brightness(1)    saturate(1); }
}

/* Speed lines that streak across the hero when the car enters */
.car-hero-speedlines {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 1;
  overflow: hidden;
}
.car-hero-speedlines span {
  position: absolute;
  height: 2px;
  border-radius: 2px;
  background: linear-gradient(90deg, transparent, var(--accent, #6BC295), transparent);
  opacity: 0;
  animation: speedDash 850ms cubic-bezier(.25,.7,.35,1) both;
}
.car-hero-speedlines span:nth-child(1) { top: 36%; width:  80px; left:  60px; animation-delay:   0ms; }
.car-hero-speedlines span:nth-child(2) { top: 50%; width: 130px; left:  40px; animation-delay:  60ms; }
.car-hero-speedlines span:nth-child(3) { top: 62%; width:  60px; left:  80px; animation-delay: 140ms; }
.car-hero-speedlines span:nth-child(4) { top: 44%; width: 100px; left:  50px; animation-delay: 220ms; }
.car-hero-speedlines span:nth-child(5) { top: 56%; width:  90px; left:  70px; animation-delay: 300ms; }
@keyframes speedDash {
  0%   { opacity: 0; transform: translateX(0);     }
  20%  { opacity: 1; }
  100% { opacity: 0; transform: translateX(640px); }
}

/* Soft green glow flash behind the car on entrance */
.car-hero-flash {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(ellipse 60% 80% at 22% 55%, rgba(107,194,149,0.22), transparent 65%);
  opacity: 0;
  animation: heroFlash 1000ms ease-out both;
  z-index: 1;
}
@keyframes heroFlash {
  0%   { opacity: 0; }
  30%  { opacity: 1; }
  100% { opacity: 0; }
}

/* Staggered fade-up of name and tags after the car settles */
.car-hero-meta { z-index: 2; position: relative; }
.car-hero-name {
  animation: heroFadeUp 600ms cubic-bezier(.2,.7,.2,1) 280ms both;
}
.car-hero-tags .car-hero-tag {
  animation: heroFadeUp 500ms cubic-bezier(.2,.7,.2,1) both;
}
.car-hero-tags .car-hero-tag:nth-child(1) { animation-delay: 420ms; }
.car-hero-tags .car-hero-tag:nth-child(2) { animation-delay: 500ms; }
.car-hero-tags .car-hero-tag:nth-child(3) { animation-delay: 580ms; }
@keyframes heroFadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* Respect users who prefer reduced motion */
@media (prefers-reduced-motion: reduce) {
  .car-hero-art,
  .car-hero-art svg,
  .car-hero-speedlines span,
  .car-hero-flash,
  .car-hero-name,
  .car-hero-tags .car-hero-tag { animation: none !important; }
}

  padding-left: 32px;
  min-width: 0;

.amort-table {

  border-collapse: collapse;
  font-size: 12.5px;
}
.amort-table th {
  text-align: left;

/* ===== Debt list ===== */
.debt-row {
  display: grid;
  grid-template-columns: 1.4fr 1fr 1fr 1fr 32px;

  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  line-height: 1;
  transition: all 120ms;
}
.icon-btn:hover {
  color: var(--negative);
  border-color: var(--negative);
}
.btn-ghost {

  border-radius: var(--r);
  padding: 8px 14px;
  font-size: 12.5px;

  transition: all 120ms;

.btn-ghost:hover {

  color: var(--accent);
  border-style: solid;
}

<script type="text/babel" data-presets="react">
// Local account system — accounts + data are stored in this browser only.
// No backend, no server. Each account gets its own namespaced localStorage so
// multiple people can use the same browser without seeing each other's numbers.
//
// Authentication: SHA-256 password hash stored in localStorage. Same browser only
// (passwords never leave the device). For a single personal-finance tool this is
// fine; do NOT use this pattern for anything that handles real money.

const { useState: useStateAuth, useEffect: useEffectAuth } = React;

const AUTH_USER_KEY    = "ledger:auth:currentUser";   // email of logged-in user (NOT namespaced)
const AUTH_ACCOUNTS_KEY = "ledger:auth:accounts";     // map { email: { name, passHash } } (NOT namespaced)

// ─── localStorage namespace shim ─────────────────────────────────────────
// Patches localStorage.{get,set,remove}Item so any key starting with "ledger:"
// (except the AUTH_* keys above) gets transparently rewritten to include the
// current user's namespace. All existing app code keeps using
// localStorage.setItem("ledger:budget", …) and it Just Works per-account.
(function installNamespaceShim() {
  if (window.__ledgerNamespaceShim) return;
  window.__ledgerNamespaceShim = true;

  const _get = localStorage.getItem.bind(localStorage);
  const _set = localStorage.setItem.bind(localStorage);
  const _del = localStorage.removeItem.bind(localStorage);
  // Don't namespace these — they're auth/session-level
  const PASSTHROUGH = new Set([AUTH_USER_KEY, AUTH_ACCOUNTS_KEY, "ledger:colorMode", "ledger:sidebarHidden"]);

  function nsKey(k) {
    if (typeof k !== "string") return k;
    if (!k.startsWith("ledger:")) return k;
    if (PASSTHROUGH.has(k)) return k;
    const user = _get(AUTH_USER_KEY) || "_guest";
    return `ledger:u:${user}:${k.slice(7)}`;
  }

  localStorage.getItem    = (k) => _get(nsKey(k));
  localStorage.setItem    = (k, v) => _set(nsKey(k), v);
  localStorage.removeItem = (k) => _del(nsKey(k));
  // Provide raw access for the auth code itself
  window.__rawStorage = { get: _get, set: _set, del: _del };
})();

// ─── Password hashing (SHA-256 via Web Crypto) ───────────────────────────
async function hashPassword(password) {
  const enc = new TextEncoder().encode(password);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");
}

function loadAccounts() {
  try { return JSON.parse(window.__rawStorage.get(AUTH_ACCOUNTS_KEY) || "{}"); }
  catch { return {}; }
}
function saveAccounts(map) {
  window.__rawStorage.set(AUTH_ACCOUNTS_KEY, JSON.stringify(map));
}
function getCurrentUser() {
  return window.__rawStorage.get(AUTH_USER_KEY);
}
function setCurrentUser(email) {
  if (email) window.__rawStorage.set(AUTH_USER_KEY, email);
  else window.__rawStorage.del(AUTH_USER_KEY);
}

// ─── Login screen ────────────────────────────────────────────────────────
function LoginScreen({ onLoggedIn }) {
  const [mode, setMode] = useStateAuth("signin"); // signin | signup
  const [email, setEmail] = useStateAuth("");
  const [firstName, setFirstName] = useStateAuth("");
  const [lastName, setLastName] = useStateAuth("");
  const [password, setPassword] = useStateAuth("");
  const [error, setError] = useStateAuth("");
  const [busy, setBusy] = useStateAuth(false);
  const [accounts, setAccounts] = useStateAuth(() => loadAccounts());

  const existingEmails = Object.keys(accounts);

  const submit = async (e) => {
    e?.preventDefault();
    setError("");
    const cleanEmail = email.trim().toLowerCase();
    if (!cleanEmail || !cleanEmail.includes("@")) {
      setError("Enter a valid email."); return;
    }
    setBusy(true);
    try {
      const map = loadAccounts();
      const hash = await hashPassword(password || "");

      if (mode === "signup") {
        if (map[cleanEmail]) { setError("That email already has an account on this browser. Sign in instead."); setBusy(false); return; }
        const cleanFirst = firstName.trim();
        const cleanLast = lastName.trim();
        const displayName = (cleanFirst + " " + cleanLast).trim() || cleanEmail.split("@")[0];
        map[cleanEmail] = {
          firstName: cleanFirst,
          lastName: cleanLast,
          name: displayName,
          passHash: hash,
          createdAt: new Date().toISOString(),
          lastSignIn: new Date().toISOString(),
        };
        saveAccounts(map);
        setCurrentUser(cleanEmail);
        onLoggedIn(cleanEmail, map[cleanEmail]);
      } else {
        const account = map[cleanEmail];
        if (!account) { setError("No account with that email on this browser. Sign up instead."); setBusy(false); return; }
        // Password is OPTIONAL — if the user typed one AND the stored account has a hash,
        // we still validate. Empty password = email-only sign in (the default).
        if (password && account.passHash && account.passHash !== hash) {
          setError("Wrong password. (Or leave it blank — email alone is enough on this browser.)"); setBusy(false); return;
        }
        // Update last sign-in timestamp so we can show "last seen X" later
        account.lastSignIn = new Date().toISOString();
        map[cleanEmail] = account;
        saveAccounts(map);
        setCurrentUser(cleanEmail);
        onLoggedIn(cleanEmail, account);
      }
    } catch (err) {
      setError("Login failed: " + (err.message || "unknown error"));
    }
    setBusy(false);
  };

  const continueAsGuest = () => {
    setCurrentUser("_guest");
    onLoggedIn("_guest", { name: "Guest" });
  };

  const quickSignIn = (em) => {
    setEmail(em);
    setMode("signin");
    setPassword("");
    setTimeout(() => document.querySelector("input[type=password]")?.focus(), 50);
  };

  return (
    <div className="login-overlay">
      <div className="login-bg" aria-hidden="true">
        {["💰","📊","🚗","🏠","💳","📈","✦","💵","🎯","💼","🪙","🏦"].map((g, i) => (
          <span key={i} className="login-bg-icon" style={{
            left: `${(i * 73) % 100}%`, top: `${(i * 41) % 100}%`,
            animationDelay: `${i * 0.4}s`, fontSize: `${20 + (i % 4) * 8}px`,
          }}>{g}</span>
        ))}
      </div>
      <div className="login-card">
        <div className="login-logo">
          <span className="login-logo-mark">$</span>
          <span className="login-logo-name">Ledger</span>
        </div>
        <h1 className="login-title">{mode === "signin" ? "Welcome back" : "Create your account"}</h1>
        <p className="login-sub">
          {mode === "signin"
            ? "Sign in to load your saved finances."
            : "All data is stored only in this browser — nothing is sent anywhere."}
        </p>

        {/* Quick sign-in chips for accounts that exist on this browser */}
        {mode === "signin" && existingEmails.length > 0 && (
          <div className="login-quick">
            <div className="login-quick-label">Accounts on this browser:</div>
            <div className="login-quick-chips">
              {existingEmails.map((em) => (
                <button key={em} type="button" className="login-quick-chip" onClick={() => quickSignIn(em)}>
                  {accounts[em]?.name || em}
                </button>
              ))}
            </div>
          </div>
        )}

        <form className="login-form" onSubmit={submit}>
          {mode === "signup" && (
            <div className="login-name-row">
              <label className="login-field">
                <span>First name</span>
                <input type="text" className="text-input" value={firstName}
                  onChange={(e) => setFirstName(e.target.value)} placeholder="Nischal" autoComplete="given-name" />
              </label>
              <label className="login-field">
                <span>Last name</span>
                <input type="text" className="text-input" value={lastName}
                  onChange={(e) => setLastName(e.target.value)} placeholder="Sunar" autoComplete="family-name" />
              </label>
            </div>
          )}
          <label className="login-field">
            <span>Email</span>
            <input type="email" className="text-input" value={email}
              onChange={(e) => setEmail(e.target.value)} placeholder="you@example.com" required />
          </label>
          <label className="login-field">
            <span>
              Password <em>{mode === "signup" ? "(optional — local only)" : "(optional — leave blank to sign in with email only)"}</em>
            </span>
            <input type="password" className="text-input" value={password}
              onChange={(e) => setPassword(e.target.value)} placeholder="optional" />
          </label>

          {error && <div className="login-error">{error}</div>}

          <button type="submit" className="btn-primary login-btn" disabled={busy}>
            {busy ? "..." : (mode === "signin" ? "Sign in →" : "Create account →")}
          </button>
        </form>

        <div className="login-toggle">
          {mode === "signin" ? (
            <>New here? <button type="button" className="btn-link" onClick={() => { setMode("signup"); setError(""); }}>Create an account</button></>
          ) : (
            <>Already have an account? <button type="button" className="btn-link" onClick={() => { setMode("signin"); setError(""); }}>Sign in</button></>
          )}
        </div>

        <div className="login-divider">or</div>
        <button type="button" className="btn-ghost login-guest" onClick={continueAsGuest}>
          Continue as guest
        </button>
        <p className="login-disclaimer">
          ⚠ Accounts are local to this browser only. Clearing browser data deletes them.
          For backup, use the "My data" → "Download backup" feature once signed in.
        </p>
      </div>
    </div>
  );
}

// ─── Top-level Auth wrapper ──────────────────────────────────────────────
function AuthGate({ children }) {
  const [user, setUser] = useStateAuth(() => {
    const em = getCurrentUser();
    if (!em) return null;
    const map = loadAccounts();
    return em === "_guest" ? { email: "_guest", name: "Guest" } : (map[em] ? { email: em, ...map[em] } : null);
  });

  useEffectAuth(() => {
    // Expose globally so the sidebar can read it + sign-out works
    window.__currentUser = user;
    window.__signOut = () => {
      setCurrentUser(null);
      window.__currentUser = null;
      // Force full reload so all components re-init under no namespace
      window.location.reload();
    };
    window.__switchAccount = () => {
      setCurrentUser(null);
      window.location.reload();
    };
  }, [user]);

  if (!user) {
    // Brand new visitor (no auth + never onboarded) → let the wizard run as the
    // entry experience. The wizard's AccountPhase handles sign-in/sign-up itself
    // and writes the currentUser key, so on completion the gate flips automatically.
    const onboarded = window.__rawStorage?.get?.("ledger:onboarded");
    if (!onboarded && window.OnboardingWizard) {
      return <window.OnboardingWizard onClose={() => {
        // After the wizard saves the account + clicks "Open my dashboard"
        const em = getCurrentUser();
        if (em) {
          const map = loadAccounts();
          setUser(em === "_guest" ? { email: "_guest", name: "Guest" } : { email: em, ...map[em] });
          setTimeout(() => window.location.reload(), 100);
        }
      }} />;
    }
    // Returning visitor who signed out → traditional login screen
    return <LoginScreen onLoggedIn={(email, account) => {
      setUser({ email, ...account });
      setTimeout(() => window.location.reload(), 100);
    }} />;
  }
  return children;
}

window.AuthGate = AuthGate;
window.LoginScreen = LoginScreen;

</script>

<script type="text/babel" data-presets="react">
// 2025 US tax data — simplified but accurate enough for a personal calculator.

const FEDERAL_BRACKETS_2025 = {
  single: [
    [11925,   0.10],
    [48475,   0.12],
    [103350,  0.22],
    [197300,  0.24],
    [250525,  0.32],
    [626350,  0.35],
    [Infinity,0.37],
  ],
  married: [
    [23850,   0.10],
    [96950,   0.12],
    [206700,  0.22],
    [394600,  0.24],
    [501050,  0.32],
    [751600,  0.35],
    [Infinity,0.37],
  ],
};

const STANDARD_DEDUCTION_2025 = { single: 15000, married: 30000 };

// FICA: Social Security 6.2% up to wage base; Medicare 1.45% + 0.9% over threshold.
const SS_RATE = 0.062;
const SS_WAGE_BASE_2025 = 176100;
const MEDICARE_RATE = 0.0145;
const ADDL_MEDICARE_RATE = 0.009;
const ADDL_MEDICARE_THRESHOLD = { single: 200000, married: 250000 };

// State effective tax rates (approximate, applied to gross income).
// Sourced from 2024–2025 state schedules; flat where applicable, averaged effective for graduated.
const STATE_TAX = {
  AL:0.045, AK:0,    AZ:0.025, AR:0.039, CA:0.080, CO:0.044, CT:0.055, DE:0.058,
  DC:0.075, FL:0,    GA:0.055, HI:0.072, ID:0.058, IL:0.0495, IN:0.0305, IA:0.038,
  KS:0.057, KY:0.04, LA:0.034, ME:0.063, MD:0.054, MA:0.05,  MI:0.0425, MN:0.068,
  MS:0.044, MO:0.047, MT:0.058, NE:0.052, NV:0,    NH:0,    NJ:0.061, NM:0.046,
  NY:0.065, NC:0.0425, ND:0.019, OH:0.034, OK:0.0475, OR:0.085, PA:0.0307, RI:0.045,
  SC:0.063, SD:0,    TN:0,    TX:0,    UT:0.0455, VT:0.066, VA:0.0537, WA:0,
  WV:0.052, WI:0.0565, WY:0,
};

const STATE_NAMES = {
  AL:"Alabama", AK:"Alaska", AZ:"Arizona", AR:"Arkansas", CA:"California",
  CO:"Colorado", CT:"Connecticut", DE:"Delaware", DC:"District of Columbia",
  FL:"Florida", GA:"Georgia", HI:"Hawaii", ID:"Idaho", IL:"Illinois",
  IN:"Indiana", IA:"Iowa", KS:"Kansas", KY:"Kentucky", LA:"Louisiana",
  ME:"Maine", MD:"Maryland", MA:"Massachusetts", MI:"Michigan", MN:"Minnesota",
  MS:"Mississippi", MO:"Missouri", MT:"Montana", NE:"Nebraska", NV:"Nevada",
  NH:"New Hampshire", NJ:"New Jersey", NM:"New Mexico", NY:"New York",
  NC:"North Carolina", ND:"North Dakota", OH:"Ohio", OK:"Oklahoma", OR:"Oregon",
  PA:"Pennsylvania", RI:"Rhode Island", SC:"South Carolina", SD:"South Dakota",
  TN:"Tennessee", TX:"Texas", UT:"Utah", VT:"Vermont", VA:"Virginia",
  WA:"Washington", WV:"West Virginia", WI:"Wisconsin", WY:"Wyoming",
};

// Cities with notable local income tax. Empty array = no local tax recognized.
const CITY_LOCAL_TAX = {
  "new york city":  { rate: 0.038,  label: "NYC local" },
  "nyc":            { rate: 0.038,  label: "NYC local" },
  "yonkers":        { rate: 0.0165, label: "Yonkers local" },
  "philadelphia":   { rate: 0.0375, label: "Philadelphia wage" },
  "pittsburgh":     { rate: 0.030,  label: "Pittsburgh wage" },
  "detroit":        { rate: 0.024,  label: "Detroit local" },
  "san francisco":  { rate: 0,      label: "(no personal city tax)" },
  "washington":     { rate: 0,      label: "(DC tax in state field)" },
};

function progressiveTax(taxable, brackets) {
  let tax = 0;
  let prev = 0;
  for (const [cap, rate] of brackets) {
    if (taxable <= prev) break;
    const slice = Math.min(taxable, cap) - prev;
    tax += slice * rate;
    prev = cap;
    if (taxable <= cap) break;
  }
  return tax;
}

function computeTaxes({ salary, bonus, additionalIncome, state, city, filing, ficaExempt }) {
  const baseSalary = Math.max(0, salary);
  const bonusAmount = Math.max(0, bonus || 0);
  const extraIncome = Math.max(0, additionalIncome || 0);
  const gross = baseSalary + bonusAmount + extraIncome;
  const std = STANDARD_DEDUCTION_2025[filing];
  const taxable = Math.max(0, gross - std);

  // Federal: regular brackets apply to full taxable income (salary + bonus combined).
  const federal = progressiveTax(taxable, FEDERAL_BRACKETS_2025[filing]);

  const stateRate = STATE_TAX[state] ?? 0;
  const stateTax = gross * stateRate;

  const cityKey = (city || "").trim().toLowerCase();
  const cityInfo = CITY_LOCAL_TAX[cityKey];
  const cityRate = cityInfo?.rate ?? 0;
  const cityTax = gross * cityRate;

  // FICA — exempt for non-resident F-1/J-1/M-1/Q-1 status (IRC §3121(b)(19)).
  let ss = 0, medicare = 0, addlMedicare = 0;
  if (!ficaExempt) {
    ss = Math.min(gross, SS_WAGE_BASE_2025) * SS_RATE;
    medicare = gross * MEDICARE_RATE;
    addlMedicare = Math.max(0, gross - ADDL_MEDICARE_THRESHOLD[filing]) * ADDL_MEDICARE_RATE;
  }
  const fica = ss + medicare + addlMedicare;

  const totalTax = federal + stateTax + cityTax + fica;
  const takeHome = gross - totalTax;
  const effectiveRate = gross > 0 ? totalTax / gross : 0;

  return {
    gross, salary: baseSalary, bonus: bonusAmount, additionalIncome: extraIncome,
    taxable, standardDeduction: std,
    federal, stateTax, stateRate, cityTax, cityRate, cityLabel: cityInfo?.label,
    fica, ss, medicare, addlMedicare, ficaExempt: !!ficaExempt,
    totalTax, takeHome, effectiveRate,
  };
}

Object.assign(window, {
  FEDERAL_BRACKETS_2025, STATE_TAX, STATE_NAMES, CITY_LOCAL_TAX,
  computeTaxes, progressiveTax,
});

</script>

<script type="text/babel" data-presets="react">
// Shared UI atoms (depend on React being loaded globally).
const { useState: useStateShared } = React;

const fmtUSD0 = (n) => {
  if (!isFinite(n)) return "—";
  const s = n < 0 ? "-" : "";
  return s + "$" + Math.abs(Math.round(n)).toLocaleString();
};
const fmtUSD2 = (n) => {
  if (!isFinite(n)) return "—";
  const s = n < 0 ? "-" : "";
  return s + "$" + Math.abs(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
};
const fmtPct = (n, d = 1) => (n * 100).toFixed(d) + "%";

const Field = ({ label, hint, children }) => (
  <label className="field">
    <div className="field-label">
      <span>{label}</span>
      {hint && <span className="field-hint">{hint}</span>}
    </div>
    {children}
  </label>
);

const Money = ({ value, onChange, placeholder, prefix = "$" }) => {
  const [focused, setFocused] = useStateShared(false);
  // While focused, keep the raw text the user is typing so partial values
  // like "5." or "5.0" don't get rewritten by Number() round-trips.
  const [localText, setLocalText] = useStateShared("");
  const display = focused
    ? localText
    : (value ? Number(value).toLocaleString() : "");
  return (
    <div className={"money-input" + (focused ? " is-focused" : "")}>
      <span className="money-prefix">{prefix}</span>
      <input
        type="text"
        inputMode="decimal"
        value={display}
        placeholder={placeholder}
        onFocus={() => { setFocused(true); setLocalText(value === 0 || value == null ? "" : String(value)); }}
        onBlur={() => setFocused(false)}
        onChange={(e) => {
          const raw = e.target.value.replace(/[^0-9.]/g, "");
          setLocalText(raw);
          // Only commit when the string is a parseable number; allow trailing "." while typing
          if (raw === "" || raw === ".") {
            onChange(0);
          } else {
            const n = Number(raw);
            if (isFinite(n)) onChange(n);
          }
        }}
      />
    </div>
  );
};

// CountUp — animates a number from its previous value to the new value over ~duration seconds.
// Uses framer-motion's animate() to drive smooth easing. Falls back to the static value
// if FM hasn't loaded yet.
const CountUp = ({ value, duration = 1, format = fmtUSD0, className, style }) => {
  const fm = (typeof window !== "undefined") && window.FramerMotion;
  const [display, setDisplay] = useStateShared(value || 0);
  const prevRef = React.useRef(0);
  React.useEffect(() => {
    if (!fm || !fm.animate) { setDisplay(value); prevRef.current = value; return; }
    const from = prevRef.current;
    const to = Number(value) || 0;
    if (from === to) { setDisplay(to); return; }
    const controls = fm.animate(from, to, {
      duration,
      ease: "easeOut",
      onUpdate: (v) => setDisplay(v),
    });
    return () => { controls.stop(); prevRef.current = to; };
  }, [value, duration]);
  return <span className={className} style={style}>{format(display)}</span>;
};

const NumberInput = ({ value, onChange, suffix, placeholder, step = 0.1 }) => {
  const [focused, setFocused] = useStateShared(false);
  const [localText, setLocalText] = useStateShared("");
  // Strip floating-point noise (e.g. 0.07 * 100 = 7.000000000000001 → "7")
  const cleanNum = (n) => {
    if (n === null || n === undefined || n === "" || !isFinite(n)) return "";
    const rounded = Math.round(Number(n) * 1e10) / 1e10;
    return String(rounded);
  };
  const display = focused
    ? localText
    : (value || value === 0 ? cleanNum(value) : "");
  return (
    <div className={"money-input" + (focused ? " is-focused" : "")}>
      <input
        type="text"
        inputMode="decimal"
        value={display}
        placeholder={placeholder}
        onFocus={() => { setFocused(true); setLocalText(value === 0 || value == null ? "" : cleanNum(value)); }}
        onBlur={() => setFocused(false)}
        onChange={(e) => {
          const raw = e.target.value.replace(/[^0-9.\-]/g, "");
          setLocalText(raw);
          // Allow partial values like "5.", ".", "-" while typing without losing the decimal
          if (raw === "" || raw === "." || raw === "-" || raw === "-.") {
            onChange(0);
          } else {
            const n = Number(raw);
            if (isFinite(n)) onChange(n);
          }
        }}
      />
      {suffix && <span className="money-prefix" style={{marginRight: 0, marginLeft: 6}}>{suffix}</span>}
    </div>
  );
};

const Segment = ({ value, onChange, options }) => (
  <div className="segment">
    {options.map((o) => (
      <button
        key={o.value}
        className={"segment-btn" + (value === o.value ? " is-active" : "")}
        onClick={() => onChange(o.value)}
        type="button"
      >
        {o.label}
      </button>
    ))}
  </div>
);

// City autocomplete — typing filters US_CITIES, selecting fills city + state.
const CityAutocomplete = ({ city, state, onChange }) => {
  const [open, setOpen] = useStateShared(false);
  const [active, setActive] = useStateShared(0);
  const matches = React.useMemo(() => {
    const q = (city || "").trim().toLowerCase();
    if (!q) return [];
    const list = (typeof US_CITIES !== "undefined" ? US_CITIES : []);
    // Prefer prefix matches over substring matches
    const prefix = [], substr = [];
    for (const [name, st] of list) {
      const lc = name.toLowerCase();
      if (lc.startsWith(q))      prefix.push([name, st]);
      else if (lc.includes(q))   substr.push([name, st]);
      if (prefix.length >= 8) break;
    }
    return prefix.concat(substr).slice(0, 8);
  }, [city]);

  const pick = (name, st) => {
    onChange({ city: name, state: st });
    setOpen(false);
  };

  return (
    <div style={{ position: "relative" }}>
      <input
        type="text"
        className="text-input"
        placeholder="e.g. New York City"
        value={city}
        onChange={(e) => { onChange({ city: e.target.value }); setOpen(true); setActive(0); }}
        onFocus={() => setOpen(true)}
        onBlur={() => setTimeout(() => setOpen(false), 120)}
        onKeyDown={(e) => {
          if (!open || matches.length === 0) return;
          if (e.key === "ArrowDown") { e.preventDefault(); setActive((a) => Math.min(a + 1, matches.length - 1)); }
          else if (e.key === "ArrowUp")   { e.preventDefault(); setActive((a) => Math.max(a - 1, 0)); }
          else if (e.key === "Enter")     { e.preventDefault(); const m = matches[active]; if (m) pick(m[0], m[1]); }
          else if (e.key === "Escape")    { setOpen(false); }
        }}
        autoComplete="off"
      />
      {open && matches.length > 0 && (
        <ul className="ac-list">
          {matches.map(([name, st], i) => (
            <li
              key={name + st}
              className={"ac-item" + (i === active ? " is-active" : "")}
              onMouseDown={(e) => { e.preventDefault(); pick(name, st); }}
              onMouseEnter={() => setActive(i)}
            >
              <span className="ac-name">{name}</span>
              <span className="ac-state">{st}</span>
            </li>
          ))}
        </ul>
      )}
    </div>
  );
};

const Toggle = ({ value, onChange, label, hint }) => (
  <button
    type="button"
    className={"toggle-row" + (value ? " is-on" : "")}
    onClick={() => onChange(!value)}
  >
    <div className="toggle-text">
      <div className="toggle-label">{label}</div>
      {hint && <div className="toggle-hint">{hint}</div>}
    </div>
    <div className={"toggle-switch" + (value ? " is-on" : "")}>
      <div className="toggle-knob" />
    </div>
  </button>
);

// Address autocomplete — debounced Nominatim search. US-only by default.
// onChange receives (value, coords?) — coords is { lat, lon, display } when picked from list.
// biasCoords optionally biases results toward a location (e.g. home for work field).
const AddressAutocomplete = ({ value, onChange, placeholder, biasCoords }) => {
  const [matches, setMatches] = useStateShared([]);
  const [open, setOpen] = useStateShared(false);
  const [active, setActive] = useStateShared(0);
  const [loading, setLoading] = useStateShared(false);
  const abortRef = React.useRef(null);
  const timerRef = React.useRef(null);
  const lastQueryRef = React.useRef("");

  const fetchSuggestions = (q) => {
    if (abortRef.current) abortRef.current.abort();
    if (!q || q.trim().length < 3) {
      setMatches([]);
      setLoading(false);
      return;
    }
    const ctrl = new AbortController();
    abortRef.current = ctrl;
    lastQueryRef.current = q;
    setLoading(true);
    // Updated to pull more results, include extra tags, and prefer importance ranking.
    let url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=8&countrycodes=us&addressdetails=1&extratags=1&namedetails=1&dedupe=1`;
    if (biasCoords && Number.isFinite(biasCoords.lat)) {
      const r = 0.75; // roughly ~50 mi in latitude degrees
      const bb = `${biasCoords.lon - r},${biasCoords.lat + r},${biasCoords.lon + r},${biasCoords.lat - r}`;
      url += `&viewbox=${bb}&bounded=0`;
    }
    fetch(url, { signal: ctrl.signal, headers: { "Accept-Language": "en" } })
      .then((r) => r.json())
      .then((data) => {
        if (lastQueryRef.current !== q) return; // stale
        // Rank: prefer addresses with house number, then named places, then admin areas
        const ranked = (data || []).slice().sort((a, b) => {
          const ax = (a.address?.house_number ? 3 : 0) + (a.address?.road ? 1 : 0) + Number(a.importance || 0);
          const bx = (b.address?.house_number ? 3 : 0) + (b.address?.road ? 1 : 0) + Number(b.importance || 0);
          return bx - ax;
        });
        setMatches(ranked.slice(0, 6));
        setLoading(false);
      })
      .catch((e) => {
        if (e.name !== "AbortError") setLoading(false);
      });
  };

  const onInput = (val) => {
    onChange(val, null); // clear coords when user types
    setOpen(true);
    setActive(0);
    clearTimeout(timerRef.current);
    // Snappier search — was 420ms, now 250ms
    timerRef.current = setTimeout(() => fetchSuggestions(val), 250);
  };

  const pick = (m) => {
    onChange(m.display_name, {
      lat: parseFloat(m.lat),
      lon: parseFloat(m.lon),
      display: m.display_name,
    });
    setMatches([]);
    setOpen(false);
  };

  const fmtMatch = (m) => {
    const a = m.address || {};
    const place = a.city || a.town || a.village || a.hamlet || a.county || "";
    const st    = a.state || "";
    const label = m.display_name;
    // First two segments are the most specific (name + street), last two are city/state.
    const parts = label.split(",").map((s) => s.trim());
    const primary = parts.slice(0, 2).join(", ");
    return { primary, place, st, parts };
  };

  // Show a horizontal-scrolling preview of the full selected address below the input
  // (so long lines like "University at Buffalo, 12, Town of Amherst, Erie County..." stay readable).
  const hasFull = value && value.length > 0;
  return (
    <div style={{ position: "relative" }}>
      <input
        type="text"
        className="text-input addr-input"
        placeholder={placeholder}
        value={value || ""}
        onChange={(e) => onInput(e.target.value)}
        onFocus={() => { if (matches.length > 0) setOpen(true); }}
        onBlur={() => setTimeout(() => setOpen(false), 150)}
        onKeyDown={(e) => {
          if (!open || matches.length === 0) return;
          if (e.key === "ArrowDown")      { e.preventDefault(); setActive((a) => Math.min(a + 1, matches.length - 1)); }
          else if (e.key === "ArrowUp")   { e.preventDefault(); setActive((a) => Math.max(a - 1, 0)); }
          else if (e.key === "Enter")     { e.preventDefault(); if (matches[active]) pick(matches[active]); }
          else if (e.key === "Escape")    { setOpen(false); }
        }}
        autoComplete="off"
        title={value || ""}
      />
      {hasFull && value.length > 32 && (
        <div className="addr-full" title={value}>
          <span className="addr-full-label">Selected:</span>
          <span className="addr-full-text">{value}</span>
        </div>
      )}
      {open && (matches.length > 0 || loading) && (
        <ul className="ac-list ac-list-addr">
          {loading && matches.length === 0 && (
            <li className="ac-item" style={{ color: "var(--ink-3)", fontStyle: "italic" }}>Searching…</li>
          )}
          {matches.map((m, i) => {
            const f = fmtMatch(m);
            return (
              <li
                key={m.place_id}
                className={"ac-item ac-item-addr" + (i === active ? " is-active" : "")}
                onMouseDown={(e) => { e.preventDefault(); pick(m); }}
                onMouseEnter={() => setActive(i)}
                title={m.display_name}
              >
                <div className="ac-primary">{f.primary}</div>
                {(f.place || f.st) && (
                  <div className="ac-secondary">{[f.place, f.st].filter(Boolean).join(", ")}</div>
                )}
              </li>
            );
          })}
        </ul>
      )}
    </div>
  );
};

Object.assign(window, {
  fmtUSD0, fmtUSD2, fmtPct,
  Field, Money, NumberInput, Segment, CityAutocomplete, Toggle, AddressAutocomplete,
  CountUp,
});

</script>

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

</script>

    },
